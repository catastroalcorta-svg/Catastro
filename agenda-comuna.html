<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda · Comuna de Alcorta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F7F9FB;
    --ink:#16202E; --muted:#5E6B7A; --faint:#8A97A6;
    --line:#DDE3EA; --line-strong:#C7D0DA;
    --brand:#0E5A6E; --brand-ink:#093f4d;
    --over:#C0392B; --over-bg:#FBECEA;
    --today:#D97706; --today-bg:#FDF3E7;
    --week:#B08900; --week-bg:#FBF6E3;
    --soon:#0E7C5A; --soon-bg:#E9F5EF;
    --done:#7A8696; --done-bg:#F1F3F6;
    --radius:14px; --shadow:0 1px 2px rgba(20,32,46,.06),0 6px 20px rgba(20,32,46,.07);
    --sans:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --display:"Bricolage Grotesque",var(--sans);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans); background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.45; font-size:15px}
  .wrap{max-width:1040px; margin:0 auto; padding:20px 18px 80px}

  header.app{display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:14px}
  .brand{display:flex; align-items:center; gap:12px}
  .brand .mark{width:46px; height:46px; border-radius:12px; flex:none; background:linear-gradient(150deg,var(--brand),var(--brand-ink)); display:grid; place-items:center; color:#fff; box-shadow:var(--shadow)}
  .brand .mark svg{width:24px; height:24px}
  .brand h1{font-family:var(--display); font-weight:800; font-size:21px; margin:0; letter-spacing:-.01em}
  .brand p{margin:2px 0 0; color:var(--muted); font-size:13px}
  .header-actions{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; align-items:center}

  .btn{font-family:var(--sans); font-weight:600; font-size:14px; cursor:pointer; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); padding:9px 14px; border-radius:10px; display:inline-flex; align-items:center; gap:7px; transition:background .15s, border-color .15s, transform .05s}
  .btn svg{width:16px; height:16px}
  .btn:hover{background:var(--surface-2)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--brand); border-color:var(--brand); color:#fff}
  .btn.primary:hover{background:var(--brand-ink)}
  .btn.ghost{border-color:transparent; background:transparent; color:var(--muted)}
  .btn.ghost:hover{background:var(--surface-2); color:var(--ink)}
  .btn.small{padding:6px 10px; font-size:13px}
  .btn:focus-visible{outline:3px solid rgba(14,90,110,.35); outline-offset:2px}

  .who{display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); background:var(--surface); border:1px solid var(--line-strong); padding:7px 12px; border-radius:999px; cursor:pointer}
  .who .av{width:22px; height:22px; border-radius:50%; background:var(--brand); color:#fff; display:grid; place-items:center; font-size:11px; font-weight:700}
  .who strong{color:var(--ink); font-weight:600}

  .menu-wrap{position:relative}
  .menu-pop{position:absolute; right:0; top:calc(100% + 6px); background:var(--surface); border:1px solid var(--line-strong); border-radius:12px; box-shadow:0 10px 30px rgba(20,32,46,.18); padding:6px; z-index:40; width:248px}
  .menu-pop[hidden]{display:none}
  .menu-pop button{display:flex; align-items:center; gap:9px; width:100%; text-align:left; border:none; background:transparent; padding:9px 10px; border-radius:8px; font-family:var(--sans); font-size:13.5px; font-weight:500; cursor:pointer; color:var(--ink)}
  .menu-pop button:hover{background:var(--surface-2)}
  .menu-pop svg{width:16px; height:16px; color:var(--muted)}

  .banner{background:#FFF7E8; border:1px solid #F0DFAE; border-radius:12px; padding:11px 15px; font-size:13px; color:#6b5618; margin-bottom:16px}
  .banner b{color:#5a4710}
  .banner.bad{background:var(--over-bg); border-color:#E8B4AE; color:#7a2018}
  .banner.bad b{color:#5a160f}

  .summary{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px; text-align:left; cursor:pointer; position:relative; overflow:hidden; transition:border-color .15s, box-shadow .15s}
  .stat:hover{box-shadow:var(--shadow)}
  .stat.active{border-color:var(--brand); box-shadow:0 0 0 1px var(--brand)}
  .stat .rail{position:absolute; left:0; top:0; bottom:0; width:4px}
  .stat .num{font-family:var(--display); font-weight:800; font-size:28px; line-height:1; letter-spacing:-.02em}
  .stat .lbl{font-size:12.5px; color:var(--muted); margin-top:5px; font-weight:500}
  .stat.s-over .rail{background:var(--over)} .stat.s-over .num{color:var(--over)}
  .stat.s-today .rail{background:var(--today)} .stat.s-today .num{color:var(--today)}
  .stat.s-week .rail{background:var(--week)} .stat.s-week .num{color:var(--week)}
  .stat.s-soon .rail{background:var(--soon)} .stat.s-soon .num{color:var(--soon)}

  .toolbar{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:16px}
  .search{position:relative; flex:1 1 180px; min-width:150px}
  .search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--faint)}
  .search input{width:100%; padding:9px 12px 9px 34px; border:1px solid var(--line-strong); border-radius:10px; font-family:var(--sans); font-size:14px; background:var(--surface); color:var(--ink)}
  select.filter{padding:9px 12px; border:1px solid var(--line-strong); border-radius:10px; font-family:var(--sans); font-size:14px; background:var(--surface); color:var(--ink); cursor:pointer}
  input:focus-visible, select:focus-visible, textarea:focus-visible{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(14,90,110,.18)}
  .toggle{display:inline-flex; align-items:center; gap:7px; font-size:13.5px; color:var(--muted); cursor:pointer; user-select:none}
  .toggle input{accent-color:var(--brand); width:16px; height:16px}
  .viewtoggle{display:inline-flex; background:var(--surface); border:1px solid var(--line-strong); border-radius:10px; overflow:hidden; margin-left:auto}
  .viewtoggle button{border:none; background:transparent; padding:8px 14px; font-family:var(--sans); font-size:13.5px; font-weight:600; color:var(--muted); cursor:pointer}
  .viewtoggle button+button{border-left:1px solid var(--line)}
  .viewtoggle button.active{background:var(--brand); color:#fff}

  .calbar{display:flex; align-items:center; gap:12px; margin-bottom:14px}
  .calbar:empty{display:none}
  .calbar .cal-label{font-family:var(--display); font-weight:700; font-size:19px; letter-spacing:-.01em}
  .calbar .nav{display:inline-flex; gap:6px}

  .section{margin-bottom:24px}
  .section-head{display:flex; align-items:center; gap:10px; margin:0 2px 11px}
  .section-head .tag{font-family:var(--display); font-weight:700; font-size:15px}
  .section-head .count{font-size:12px; font-weight:600; color:var(--muted); background:var(--surface); border:1px solid var(--line); padding:2px 9px; border-radius:999px}
  .section.over .tag{color:var(--over)} .section.today .tag{color:var(--today)}
  .section.week .tag{color:var(--week)} .section.soon .tag{color:var(--soon)}
  .section.done .tag{color:var(--done)}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); display:flex; align-items:stretch; margin-bottom:10px; overflow:hidden; position:relative; transition:box-shadow .15s, border-color .15s}
  .card:hover{box-shadow:var(--shadow)}
  .card .rail{width:5px; flex:none}
  .card.u-over .rail{background:var(--over)} .card.u-today .rail{background:var(--today)}
  .card.u-week .rail{background:var(--week)} .card.u-soon .rail{background:var(--soon)}
  .card.u-done .rail{background:var(--done)}
  .card-body{flex:1; padding:13px 15px; min-width:0}
  .card-top{display:flex; align-items:flex-start; gap:10px}
  .card-check{width:22px; height:22px; border-radius:7px; border:2px solid var(--line-strong); background:var(--surface); cursor:pointer; flex:none; margin-top:1px; display:grid; place-items:center; transition:background .15s, border-color .15s}
  .card-check svg{width:14px; height:14px; color:#fff; opacity:0}
  .card.is-done .card-check{background:var(--soon); border-color:var(--soon)}
  .card.is-done .card-check svg{opacity:1}
  .card.is-rep .card-check{border-radius:50%}
  .card-main{flex:1; min-width:0}
  .card-title{font-weight:600; font-size:15.5px; word-wrap:break-word}
  .card.is-done .card-title{text-decoration:line-through; color:var(--muted)}
  .card-meta{display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; margin-top:6px; font-size:13px; color:var(--muted)}
  .card-meta .m{display:inline-flex; align-items:center; gap:5px}
  .card-meta svg{width:14px; height:14px; opacity:.8}
  .card-meta .from{color:var(--brand); font-weight:600}
  .cat-dot{width:9px; height:9px; border-radius:50%; flex:none}
  .card-note{margin-top:8px; font-size:13.5px; color:#41505f; white-space:pre-wrap; word-wrap:break-word}
  .countdown{font-size:12.5px; font-weight:700; padding:3px 10px; border-radius:999px; white-space:nowrap; flex:none}
  .countdown.u-over{color:var(--over); background:var(--over-bg)}
  .countdown.u-today{color:var(--today); background:var(--today-bg)}
  .countdown.u-week{color:var(--week); background:var(--week-bg)}
  .countdown.u-soon{color:var(--soon); background:var(--soon-bg)}
  .countdown.u-done{color:var(--done); background:var(--done-bg)}
  .card-actions{display:flex; gap:2px; margin-left:auto; padding:9px 9px 0 4px; align-items:flex-start}
  .icon-btn{width:32px; height:32px; border-radius:8px; border:none; background:transparent; cursor:pointer; display:grid; place-items:center; color:var(--faint); transition:background .15s, color .15s}
  .icon-btn svg{width:17px; height:17px}
  .icon-btn:hover{background:var(--surface-2); color:var(--ink)}
  .icon-btn.danger:hover{background:var(--over-bg); color:var(--over)}

  .cal-month{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
  .cal-weekday{font-size:11.5px; font-weight:700; color:var(--faint); text-transform:uppercase; letter-spacing:.04em; text-align:center; padding:2px 0 4px}
  .cal-cell{background:var(--surface); border:1px solid var(--line); border-radius:10px; min-height:104px; padding:6px; cursor:pointer; display:flex; flex-direction:column; gap:3px; transition:border-color .15s, box-shadow .15s; overflow:hidden}
  .cal-cell:hover{box-shadow:var(--shadow)}
  .cal-cell.other{background:var(--surface-2); opacity:.55}
  .cal-cell.today{border-color:var(--brand); box-shadow:0 0 0 1px var(--brand)}
  .cal-daynum{font-size:13px; font-weight:700; color:var(--ink); align-self:flex-start; min-width:22px; height:22px; padding:0 4px; display:grid; place-items:center; border-radius:6px}
  .cal-cell.today .cal-daynum{background:var(--brand); color:#fff}
  .cal-chip{font-size:11.5px; font-weight:600; padding:2px 6px 2px 5px; border-radius:6px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-left:3px solid var(--line-strong); background:var(--surface-2); color:var(--ink); display:flex; align-items:center; gap:4px; text-align:left; width:100%; font-family:var(--sans)}
  .cal-chip .cat-dot{width:7px; height:7px}
  .cal-chip .rep{font-weight:800; color:var(--muted)}
  .cal-chip.cu-over{border-left-color:var(--over)} .cal-chip.cu-today{border-left-color:var(--today)}
  .cal-chip.cu-week{border-left-color:var(--week)} .cal-chip.cu-soon{border-left-color:var(--soon)}
  .cal-chip.done{opacity:.5; text-decoration:line-through}
  .cal-more{font-size:11px; font-weight:600; color:var(--muted); padding:0 4px; cursor:pointer}

  .cal-year{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
  .mini{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:11px 11px 9px}
  .mini-head{font-family:var(--display); font-weight:700; font-size:14px; margin-bottom:7px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; color:var(--ink)}
  .mini-head:hover{color:var(--brand)}
  .mini-head .cnt{font-family:var(--sans); font-size:11px; font-weight:600; color:var(--muted); background:var(--surface-2); border-radius:999px; padding:1px 7px}
  .mini-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:1px}
  .mini-wd{font-size:8.5px; color:var(--faint); text-align:center; font-weight:700; padding-bottom:2px}
  .mini-day{font-size:10.5px; text-align:center; padding:3px 0 5px; border-radius:5px; position:relative; color:var(--muted)}
  .mini-day.other{color:transparent}
  .mini-day.today{background:var(--brand); color:#fff; font-weight:700}
  .mini-day .dot{position:absolute; left:50%; bottom:1px; transform:translateX(-50%); width:5px; height:5px; border-radius:50%}
  .mini-day.today .dot{bottom:0}
  .dot.over{background:var(--over)} .dot.today{background:#fff} .dot.week{background:var(--week)} .dot.soon{background:var(--soon)} .dot.done{background:var(--done)}

  .empty{text-align:center; padding:54px 20px; color:var(--muted)}
  .empty .ill{width:60px; height:60px; margin:0 auto 14px; color:var(--line-strong)}
  .empty h3{font-family:var(--display); font-size:18px; color:var(--ink); margin:0 0 6px}
  .empty p{margin:0 0 18px; font-size:14px}

  .overlay{position:fixed; inset:0; background:rgba(20,32,46,.45); backdrop-filter:blur(2px); display:none; align-items:flex-start; justify-content:center; padding:30px 16px; z-index:50; overflow-y:auto}
  .overlay.open{display:flex}
  .modal{background:var(--surface); border-radius:18px; width:100%; max-width:520px; box-shadow:0 20px 60px rgba(20,32,46,.3); animation:pop .18s ease}
  .modal.sm{max-width:420px}
  @keyframes pop{from{transform:translateY(8px) scale(.99); opacity:0}to{transform:none; opacity:1}}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--line)}
  .modal-head h2{font-family:var(--display); font-weight:700; font-size:18px; margin:0}
  .modal-body{padding:18px 20px}
  .tpl-block{margin-bottom:16px}
  .tpl-block .tpl-lbl{font-size:12px; font-weight:600; color:var(--faint); margin-bottom:7px}
  .chip-row{display:flex; flex-wrap:wrap; gap:6px}
  .chip{font-family:var(--sans); font-size:12.5px; font-weight:600; border:1px solid var(--line-strong); background:var(--surface); color:var(--brand-ink); padding:6px 12px; border-radius:999px; cursor:pointer; transition:background .15s, border-color .15s}
  .chip:hover{background:var(--surface-2); border-color:var(--brand)}
  .chip.active{background:var(--brand); border-color:var(--brand); color:#fff}
  .field{margin-bottom:15px}
  .field label{display:block; font-size:13px; font-weight:600; color:var(--ink); margin-bottom:6px}
  .field .hint{font-weight:400; color:var(--faint); font-size:12px}
  .field input[type=text], .field input[type=date], .field input[type=time], .field input[type=number], .field textarea, .field select{width:100%; padding:10px 12px; border:1px solid var(--line-strong); border-radius:10px; font-family:var(--sans); font-size:14.5px; background:var(--surface); color:var(--ink)}
  .field textarea{resize:vertical; min-height:64px}
  .row{display:flex; gap:12px}
  .row .field{flex:1}
  .anticip{display:flex; gap:8px}
  .anticip input{flex:1}
  .anticip select{flex:1.2}
  .modal-foot{display:flex; gap:10px; justify-content:flex-end; padding:16px 20px; border-top:1px solid var(--line)}
  .modal-foot .spacer{margin-right:auto}
  .emp-item{display:flex; align-items:center; justify-content:space-between; padding:9px 4px; border-bottom:1px solid var(--line)}
  .emp-item:last-child{border-bottom:none}
  .add-row{display:flex; gap:8px; margin-top:12px}
  .add-row input{flex:1}
  .login-grid{display:flex; flex-wrap:wrap; gap:8px}
  .login-grid .chip{font-size:14px; padding:9px 15px}

  .toast-wrap{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:90; display:flex; flex-direction:column; gap:8px; align-items:center}
  .toast{background:var(--ink); color:#fff; padding:11px 18px; border-radius:999px; font-size:13.5px; font-weight:500; box-shadow:0 8px 24px rgba(20,32,46,.3); animation:slideup .25s ease; max-width:90vw; text-align:center}
  @keyframes slideup{from{transform:translateY(14px); opacity:0}to{transform:none; opacity:1}}

  @media (max-width:760px){ .cal-year{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:640px){
    .summary{grid-template-columns:repeat(2,1fr)}
    .header-actions{width:100%; margin-left:0}
    .brand h1{font-size:19px}
    .row{flex-direction:column; gap:0}
    .card-actions{flex-direction:column}
    .viewtoggle{margin-left:0}
    .cal-month{gap:3px}
    .cal-cell{min-height:62px; padding:3px}
    .cal-weekday{font-size:10px}
    .cal-chip{font-size:0; gap:0; padding:0; height:5px; border-radius:3px; border-left-width:0}
    .cal-chip.cu-over{background:var(--over)} .cal-chip.cu-today{background:var(--today)}
    .cal-chip.cu-week{background:var(--week)} .cal-chip.cu-soon{background:var(--soon)}
    .cal-chip .cat-dot, .cal-chip .rep{display:none}
    .cal-more{font-size:9px}
    .cal-year{grid-template-columns:repeat(2,1fr); gap:10px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M9 16l2 2 4-4"/></svg>
      </div>
      <div>
        <h1>Agenda Comuna</h1>
        <p>Recordatorios entre el equipo · Alcorta</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="who" id="whoBtn" title="Cambiar de usuario"><span class="av" id="whoAv">–</span><span>Sos <strong id="whoName">—</strong></span></button>
      <button class="btn small" id="notifyBtn" title="Activar avisos del navegador">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span id="notifyLabel">Avisos</span>
      </button>
      <div class="menu-wrap">
        <button class="btn small ghost" id="menuBtn" title="Más opciones" aria-haspopup="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        </button>
        <div class="menu-pop" id="menuPop" hidden>
          <button data-menu="emps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Administrar nombres</button>
          <button data-menu="ics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Exportar mi agenda (.ics)</button>
          <button data-menu="export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>Descargar copia (.json)</button>
          <button data-menu="import"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 9l5-5 5 5M12 4v12"/></svg>Importar copia (.json)</button>
        </div>
      </div>
      <button class="btn primary" id="newBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Nuevo
      </button>
    </div>
  </header>

  <div id="connBanner"></div>

  <div class="summary" id="summary">
    <button class="stat s-over" data-bucket="over"><span class="rail"></span><div class="num" id="cOver">0</div><div class="lbl">Vencidos</div></button>

  function FirebaseStore(cfg){ firebase.initializeApp(cfg); this.db=firebase.database(); this._rem={}; this._emp={}; }

  /* ---------- fechas ---------- */
  function pad(n){ return String(n).padStart(2,"0"); }
  function dateKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function parseDue(r){ if(!r.fecha) return null; var dt=new Date(r.fecha+"T"+(r.hora||"09:00")+":00"); return isNaN(dt.getTime())?null:dt; }
  function antMs(r){ var n=Number(r.antNum)||0; if(r.antUnit==="hours") return n*3600e3; if(r.antUnit==="weeks") return n*7*86400e3; return n*86400e3; }
  function startOfDay(d){ var x=new Date(d); x.setHours(0,0,0,0); return x; }
  function sameDay(a,b){ return startOfDay(a).getTime()===startOfDay(b).getTime(); }
  function isRep(r){ return (r.repeat||"none")!=="none"; }

  function bucketOf(r, now){
    if(r.done && !isRep(r)) return "done";
    var due=parseDue(r); if(!due) return "soon";
    if(due.getTime()<now.getTime()) return "over";
    if(sameDay(due,now)) return "today";
    var dd=(startOfDay(due)-startOfDay(now))/86400e3;
    return dd<=7?"week":"soon";
  }
  function humanGap(ms){
    var s=Math.abs(ms)/1000, d=Math.floor(s/86400); s-=d*86400;
    var h=Math.floor(s/3600); s-=h*3600; var m=Math.floor(s/60);
    if(d>=1){ var t=d+(d===1?" día":" días"); if(d<7&&h>=1) t+=" y "+h+(h===1?" hora":" horas"); return t; }
    if(h>=1) return h+(h===1?" hora":" horas")+(m>0?" y "+m+" min":"");
    if(m>=1) return m+(m===1?" minuto":" minutos");
    return "menos de un minuto";
  }
  function countdownText(r, now){
    if(r.done && !isRep(r)) return {cls:"u-done", txt:"Listo"};
    var due=parseDue(r); if(!due) return {cls:"u-soon", txt:"Sin fecha"};
    var diff=due.getTime()-now.getTime();
    if(diff<0) return {cls:"u-over", txt:"Vencido hace "+humanGap(diff)};
    if(sameDay(due,now)) return r.hora?{cls:"u-today",txt:"Hoy · falta "+humanGap(diff)}:{cls:"u-today",txt:"Es hoy"};
    var bk=bucketOf(r,now);

  }
  function fmtDate(r){ var due=parseDue(r); if(!due) return "—"; var s=due.toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"short"}); s=s.charAt(0).toUpperCase()+s.slice(1); if(r.hora) s+=" · "+r.hora; return s; }
  function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
  function initials(n){ n=(n||"").trim(); if(!n) return "–"; var p=n.split(/\s+/); return (p[0][0]+(p[1]?p[1][0]:"")).toUpperCase(); }

  /* recurrencia */
  function nextOccurrenceDate(base, rep){
    var d=new Date(base.getFullYear(),base.getMonth(),base.getDate());
    if(rep==="weekly"){ d.setDate(d.getDate()+7); return d; }
    if(rep==="yearly"){ var day=d.getDate(),mon=d.getMonth(),y=d.getFullYear()+1,t; while(true){ t=new Date(y,mon,day); if(t.getMonth()===mon) return t; y++; } }
    if(rep==="monthly"){ var dd=d.getDate(),yy=d.getFullYear(),mm=d.getMonth(),tt; while(true){ mm++; if(mm>11){mm=0;yy++;} tt=new Date(yy,mm,dd); if(tt.getDate()===dd) return tt; } }
    return d;
  }
  function occursOn(r, dateObj){
    if(!r.fecha) return false;
    var b=new Date(r.fecha+"T00:00:00"); if(isNaN(b.getTime())) return false;
    var d=startOfDay(dateObj), bb=startOfDay(b);
    var days=Math.round((d.getTime()-bb.getTime())/86400e3); if(days<0) return false;
    var rep=r.repeat||"none";
    if(rep==="none") return days===0;
    if(rep==="weekly") return days%7===0;
    if(rep==="monthly") return d.getDate()===bb.getDate();
    if(rep==="yearly") return d.getDate()===bb.getDate() && d.getMonth()===bb.getMonth();
    return false;
  }
  function urgencyOfOcc(r, dateObj, now){
    if(r.done && !isRep(r)) return "done";
    var due=new Date(dateKey(dateObj)+"T"+(r.hora||"09:00")+":00");
    if(due.getTime()<now.getTime()) return "over";
    if(sameDay(due,now)) return "today";
    var diff=(startOfDay(due)-startOfDay(now))/86400e3;
    return diff<=7?"week":"soon";
  }
  var URG_RANK={over:0,today:1,week:2,soon:3,done:4};

  /* ---------- scope / filtros ---------- */
  function mine(r){ return r.para===me; }
  function inScope(r){
    if(!me) return false;
    if(mostrar==="enviados") return r.de===me && r.para!==me;
    return r.para===me;
  }
  function matchesFilters(r){
    if(filters.cat && r.cat!==filters.cat) return false;
    if(filters.text){ var t=filters.text.toLowerCase(); if(((r.titulo||"")+" "+(r.nota||"")+" "+(r.para||"")+" "+(r.de||"")).toLowerCase().indexOf(t)<0) return false; }
    return true;
  }
  function occurrencesOn(dateObj){
    var out=[];
    reminders.forEach(function(r){
      if(!inScope(r) || !matchesFilters(r)) return;
      if(r.done && !isRep(r) && !filters.showDone) return;
      if(occursOn(r, dateObj)) out.push(r);
    });
    return out;
  }
  function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

  var SVG = {

  /* ================= RENDER ================= */
  function onData(rems, emps){
    reminders = rems || [];

  function render(){
    var now=new Date();
    var counts={over:0,today:0,week:0,soon:0};
    reminders.forEach(function(r){ if(!mine(r)) return; var bk=bucketOf(r,now); if(bk!=="done") counts[bk]++; });
    document.getElementById("cOver").textContent=counts.over;
    document.getElementById("cToday").textContent=counts.today;
    document.getElementById("cWeek").textContent=counts.week;
    document.getElementById("cSoon").textContent=counts.soon;
    document.title=((counts.over+counts.today)>0?"("+(counts.over+counts.today)+") ":"")+BASE_TITLE;

    var tg=document.querySelectorAll("#viewToggle button");
    for(var i=0;i<tg.length;i++) tg[i].classList.toggle("active", tg[i].getAttribute("data-view")===view);

    renderCalbar();
    var list=document.getElementById("list");
    if(view==="month"){ list.innerHTML=monthHTML(now); return; }
    if(view==="year"){ list.innerHTML=yearHTML(now); return; }
    renderListBody(list, now);
  }

  function renderListBody(list, now){
    var buckets={over:[],today:[],week:[],soon:[],done:[]};
    reminders.forEach(function(r){
      if(!inScope(r) || !matchesFilters(r)) return;
      var bk=bucketOf(r,now);
      if(bk==="done" && !filters.showDone) return;
      buckets[bk].push(r);
    });
    function sorter(a,b){ var da=parseDue(a),db=parseDue(b); if(!da)return 1; if(!db)return -1; return da.getTime()-db.getTime(); }
    Object.keys(buckets).forEach(function(k){ buckets[k].sort(sorter); });
    buckets.over.reverse();

    list.innerHTML="";
    var any=SECTIONS.some(function(s){ return buckets[s.key].length>0; });
    if(!any){ list.innerHTML=emptyState(); return; }
    SECTIONS.forEach(function(s){
      var arr=buckets[s.key];
      if(s.key==="done" && !filters.showDone) return;
      if(arr.length===0) return;
      if(filters.bucket && filters.bucket!==s.key) return;
      var sec=document.createElement("div"); sec.className="section "+s.cls;

      arr.forEach(function(r){ sec.appendChild(cardEl(r,now)); });
      list.appendChild(sec);
    });

  function monthHTML(now){
    var first=new Date(calY,calM,1), offset=(first.getDay()+6)%7, dim=new Date(calY,calM+1,0).getDate();
    var cells=Math.ceil((offset+dim)/7)*7, html='<div class="cal-month">';
    WD.forEach(function(w){ html+='<div class="cal-weekday">'+w+'</div>'; });
    for(var i=0;i<cells;i++){
      var d=new Date(calY,calM,1-offset+i), key=dateKey(d), other=d.getMonth()!==calM, isToday=sameDay(d,now);
      var rems=occurrencesOn(d).sort(function(a,b){ return URG_RANK[urgencyOfOcc(a,d,now)]-URG_RANK[urgencyOfOcc(b,d,now)]; });
      html+='<div class="cal-cell'+(other?" other":"")+(isToday?" today":"")+'" data-day="'+key+'"><span class="cal-daynum">'+d.getDate()+'</span>';
      var shown=Math.min(rems.length,3);
      for(var j=0;j<shown;j++){ var r=rems[j], u=urgencyOfOcc(r,d,now), cat=catById(r.cat);
        html+='<button class="cal-chip cu-'+u+((r.done&&!isRep(r))?' done':'')+'" data-chip="'+r.id+'"><span class="cat-dot" style="background:'+cat.color+'"></span>'+(isRep(r)?'<span class="rep">↻</span>':'')+(r.hora?escapeHtml(r.hora)+' ':'')+escapeHtml(r.titulo||"(sin título)")+'</button>';
      }
      if(rems.length>shown) html+='<span class="cal-more" data-day="'+key+'">+'+(rems.length-shown)+' más</span>';
      html+='</div>';
    }
    return html+'</div>';
  }
  function yearHTML(now){ var html='<div class="cal-year">'; for(var m=0;m<12;m++) html+=miniMonth(calY,m,now); return html+'</div>'; }
  function miniMonth(y,m,now){
    var first=new Date(y,m,1), offset=(first.getDay()+6)%7, dim=new Date(y,m+1,0).getDate();
    var cells=Math.ceil((offset+dim)/7)*7, name=cap(first.toLocaleDateString("es-AR",{month:"long"})), monthCount=0, grid='';
    for(var i=0;i<cells;i++){
      var d=new Date(y,m,1-offset+i), other=d.getMonth()!==m, isToday=sameDay(d,now), dot='';
      if(!other){ var rems=occurrencesOn(d); if(rems.length){ monthCount+=rems.length; var best="done"; rems.forEach(function(r){ var u=urgencyOfOcc(r,d,now); if(URG_RANK[u]<URG_RANK[best]) best=u; }); dot='<span class="dot '+best+'"></span>'; } }
      grid+='<div class="mini-day'+(other?" other":"")+(isToday?" today":"")+'">'+(other?"":d.getDate())+dot+'</div>';
    }
    var wd=''; WD_MINI.forEach(function(w){ wd+='<div class="mini-wd">'+w+'</div>'; });
    return '<div class="mini"><div class="mini-head" data-jump="'+m+'">'+name+(monthCount?'<span class="cnt">'+monthCount+'</span>':'')+'</div><div class="mini-grid">'+wd+grid+'</div></div>';
  }

  /* ================= CRUD ================= */
  function byId(id){ return reminders.filter(function(x){return x.id===id;})[0]; }
  function toggleDone(id){
    var r=byId(id); if(!r) return;
    if(isRep(r) && !r.done){
      var base=new Date(r.fecha+"T00:00:00"), nd=nextOccurrenceDate(base,r.repeat), t0=startOfDay(new Date()), guard=0;
      while(startOfDay(nd).getTime()<t0.getTime() && guard<800){ nd=nextOccurrenceDate(nd,r.repeat); guard++; }
      delete notified[id];
      store.saveReminder({fecha:dateKey(nd), vueltas:(r.vueltas||0)+1}, id);
      toast("¡Hecho! Próxima vez: "+nd.toLocaleDateString("es-AR",{day:"numeric",month:"short",year:"numeric"}));
      return;
    }
    store.saveReminder({done:!r.done}, id);
  }
  function del(id){
    var r=byId(id); if(!r) return;
    if(!confirm('¿Eliminar "'+(r.titulo||"este recordatorio")+'"'+(isRep(r)?' y su repetición':'')+'?')) return;
    delete notified[id]; store.deleteReminder(id); toast("Eliminado");
  }

  var overlay=document.getElementById("overlay");
  function renderRecips(mode, current){
    var box=document.getElementById("recipBox"); box.innerHTML="";
    document.getElementById("paraHint").textContent = mode==="multi" ? "— podés elegir varios" : "— a quién pasa";
    if(employees.length===0){
      box.innerHTML='<span style="color:var(--faint);font-size:13px">No hay nombres cargados. Agregalos en ⋯ → Administrar nombres.</span>';
      return;
    }
    employees.forEach(function(e){
      var b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent=e.nombre; b.setAttribute("data-name", e.nombre);
      if(modalRecips.indexOf(e.nombre)>=0) b.classList.add("active");
      b.addEventListener("click", function(){
        if(mode==="single"){ modalRecips=[e.nombre]; }
        else { var i=modalRecips.indexOf(e.nombre); if(i>=0) modalRecips.splice(i,1); else modalRecips.push(e.nombre); }

      });

    });

  function openModal(id, presetDate){
    editingId=id||null;
    populateCatSelect(); buildTemplates();
    var r=id?byId(id):null;
    document.getElementById("tplBlock").style.display=r?"none":"block";
    document.getElementById("modalTitle").textContent=r?"Editar recordatorio":"Nuevo recordatorio";
    document.getElementById("deleteFromModal").style.display=r?"inline-flex":"none";
    document.getElementById("fTitulo").value=r?(r.titulo||""):"";
    document.getElementById("fFecha").value=r?(r.fecha||""):(presetDate||todayISO());
    document.getElementById("fHora").value=r?(r.hora||""):"";
    document.getElementById("fAntNum").value=r?(r.antNum!=null?r.antNum:1):1;
    document.getElementById("fAntUnit").value=r?(r.antUnit||"days"):"days";
    document.getElementById("fCat").value=r?(r.cat||"otro"):"vencimiento";
    document.getElementById("fRepeat").value=r?(r.repeat||"none"):"none";
    document.getElementById("fNota").value=r?(r.nota||""):"";
    modalRecips = r ? [r.para] : (me?[me]:[]);
    renderRecips(r?"single":"multi", r?r.para:null);
    overlay.classList.add("open");
    setTimeout(function(){ document.getElementById("fTitulo").focus(); }, 50);
  }
  function closeModal(){ overlay.classList.remove("open"); editingId=null; }
  function saveFromModal(){
    var titulo=document.getElementById("fTitulo").value.trim();
    var fecha=document.getElementById("fFecha").value;
    if(!titulo){ toast("Ponele un título", true); document.getElementById("fTitulo").focus(); return; }
    if(!fecha){ toast("Elegí una fecha", true); document.getElementById("fFecha").focus(); return; }
    if(modalRecips.length===0){ toast("Elegí para quién es", true); return; }
    var common={
      titulo:titulo, fecha:fecha,
      hora:document.getElementById("fHora").value||"",
      antNum:Math.max(0,Number(document.getElementById("fAntNum").value)||0),
      antUnit:document.getElementById("fAntUnit").value,
      cat:document.getElementById("fCat").value,
      repeat:document.getElementById("fRepeat").value,
      nota:document.getElementById("fNota").value.trim()
    };
    if(editingId){
      var r=byId(editingId); var fields={}; for(var k in common) fields[k]=common[k]; fields.para=modalRecips[0]; fields.editadoEn=Date.now();
      delete notified[editingId]; store.saveReminder(fields, editingId);
      toast("Cambios guardados");
    }else{
      var n=0;
      modalRecips.forEach(function(name){
        var o={}; for(var k in common) o[k]=common[k];
        o.para=name; o.de=me; o.done=false; o.creadoEn=Date.now();
        store.addReminder(o); n++;
      });
      var others=modalRecips.filter(function(x){return x!==me;}).length;
      toast(others>0 ? ("Enviado a "+n+(n===1?" persona":" personas")) : "Recordatorio creado");
    }
    closeModal();
  }

  /* ================= Avisos ================= */
  function updateNotifyBtn(){ var label=document.getElementById("notifyLabel"); if(!("Notification" in window)){ label.textContent="Sin avisos"; return; } if(Notification.permission==="granted") label.textContent="Avisos ✓"; else if(Notification.permission==="denied") label.textContent="Bloqueados"; else label.textContent="Activar avisos"; }
  function requestNotify(){ if(!("Notification" in window)){ toast("Sin soporte de avisos", true); return; } if(Notification.permission==="granted"){ toast("Ya están activados"); checkNotifications(); return; } if(Notification.permission==="denied"){ toast("Avisos bloqueados en el navegador", true); return; } Notification.requestPermission().then(function(p){ updateNotifyBtn(); if(p==="granted"){ toast("Avisos activados ✓"); checkNotifications(); } }); }
  function checkNotifications(){
    if(!("Notification" in window) || Notification.permission!=="granted" || !me) return;
    var now=Date.now(), changed=false;
    reminders.forEach(function(r){
      if(!mine(r)) return;
      if(r.done && !isRep(r)) return;
      var due=parseDue(r); if(!due) return;
      var alertAt=due.getTime()-antMs(r);
      if(now>=alertAt && now<=due.getTime()+86400e3 && notified[r.id]!==r.fecha){
        try{ new Notification("📌 "+r.titulo, {body:countdownText(r,new Date(now)).txt+(r.de&&r.de!==me?" · de "+r.de:""), tag:r.id+r.fecha}); notified[r.id]=r.fecha; changed=true; }catch(e){}
      }
    });
    if(changed){ try{ localStorage.setItem(LS_NOTIFIED, JSON.stringify(notified)); }catch(e){} }
  }

  /* ================= Export ================= */
  function downloadBlob(text,type,name){ var b=new Blob([text],{type:type}); var u=URL.createObjectURL(b); var a=document.createElement("a"); a.href=u; a.download=name; a.click(); setTimeout(function(){ URL.revokeObjectURL(u); },1000); }
  function exportData(){ var mias=reminders.filter(mine); downloadBlob(JSON.stringify({app:"agendaComuna",version:2,usuario:me,exportadoEn:new Date().toISOString(),recordatorios:mias},null,2),"application/json","mi-agenda-"+todayISO()+".json"); toast("Copia descargada"); }
  function importData(file){
    if(!me){ showLogin(); return; }
    var reader=new FileReader();
    reader.onload=function(){
      try{
        var data=JSON.parse(reader.result);
        var arr=Array.isArray(data)?data:data.recordatorios;
        if(!Array.isArray(arr)) throw new Error("formato");
        if(!confirm("Esto AGREGA "+arr.length+" recordatorio(s) a tu agenda ("+me+"). No borra lo que ya tenés ni toca la agenda de otros. ¿Continuar?")) return;
        var n=0;
        arr.forEach(function(r){
          if(!r || !r.titulo || !r.fecha) return;
          store.addReminder({
            titulo:r.titulo, fecha:r.fecha, hora:r.hora||"",
            antNum:(r.antNum!=null?r.antNum:1), antUnit:r.antUnit||"days",
            cat:r.cat||"otro", repeat:r.repeat||"none", nota:r.nota||"",
            done:!!r.done, para:me, de:(r.de||me), creadoEn:Date.now()
          });
          n++;
        });
        toast("Importados "+n+" recordatorios a tu agenda");
      }catch(e){ toast("El archivo no es válido", true); }
    };
    reader.readAsText(file);
  }
  function icsDate(d){ return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate()); }
  function icsLocal(d){ return icsDate(d)+"T"+pad(d.getHours())+pad(d.getMinutes())+"00"; }
  function icsStamp(){ var d=new Date(); return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+"Z"; }
  function icsEsc(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"); }
  function fold(line){ if(line.length<=73) return line; var out=""; while(line.length>73){ out+=line.slice(0,73)+"\r\n "; line=line.slice(73); } return out+line; }
  function exportICS(){
    var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Comuna Alcorta//Agenda//ES","CALSCALE:GREGORIAN","METHOD:PUBLISH"], count=0;
    reminders.forEach(function(r){
      if(!mine(r)) return; if(r.done && !isRep(r)) return;
      var due=parseDue(r); if(!due) return; count++;
      var allDay=!r.hora;
      L.push("BEGIN:VEVENT","UID:"+(r.id||uid())+"@agenda-alcorta","DTSTAMP:"+icsStamp());
      if(allDay){ L.push("DTSTART;VALUE=DATE:"+icsDate(due)); L.push("DTEND;VALUE=DATE:"+icsDate(new Date(due.getTime()+86400e3))); }
      else { L.push("DTSTART:"+icsLocal(due)); L.push("DTEND:"+icsLocal(new Date(due.getTime()+3600e3))); }
      var rep=r.repeat||"none";
      if(rep==="weekly") L.push("RRULE:FREQ=WEEKLY"); else if(rep==="monthly") L.push("RRULE:FREQ=MONTHLY"); else if(rep==="yearly") L.push("RRULE:FREQ=YEARLY");
      L.push(fold("SUMMARY:"+icsEsc(r.titulo||"Recordatorio")));
      if(r.nota) L.push(fold("DESCRIPTION:"+icsEsc(r.nota)));
      var mins=Math.max(0,Math.round(antMs(r)/60000));
      L.push("BEGIN:VALARM","ACTION:DISPLAY",fold("DESCRIPTION:"+icsEsc(r.titulo||"Recordatorio")),"TRIGGER:-PT"+mins+"M","END:VALARM","END:VEVENT");
    });
    L.push("END:VCALENDAR");
    if(count===0){ toast("No hay nada para exportar", true); return; }
    downloadBlob(L.join("\r\n"),"text/calendar;charset=utf-8","mi-agenda-alcorta.ics");
    toast("Archivo .ics descargado");
  }

  function toast(msg,isErr){ var w=document.getElementById("toastWrap"); var t=document.createElement("div"); t.className="toast"; t.style.background=isErr?"#C0392B":"#16202E"; t.textContent=msg; w.appendChild(t); setTimeout(function(){ t.style.transition="opacity .3s"; t.style.opacity="0"; setTimeout(function(){ t.remove(); },300); },2800); }

    document.getElementById("calbar").addEventListener("click", function(e){ var b=e.target.closest("[data-nav]"); if(!b) return; var a=b.getAttribute("data-nav");

    document.getElementById("list").addEventListener("click", function(e){
      var chip=e.target.closest("[data-chip]"); if(chip){ openModal(chip.getAttribute("data-chip")); return; }
      var jump=e.target.closest("[data-jump]"); if(jump){ calM=+jump.getAttribute("data-jump"); setView("month"); return; }
      var day=e.target.closest("[data-day]"); if(day && view==="month"){ if(!me){ showLogin(); return; } openModal(null, day.getAttribute("data-day")); }
    });

    var stats=document.querySelectorAll(".stat");
    stats.forEach(function(s){ s.addEventListener("click", function(){ var b=s.getAttribute("data-bucket"); if(view!=="list"){ view="list"; } if(mostrar!=="mios"){ mostrar="mios"; document.getElementById("filterScope").value="mios"; }
      if(filters.bucket===b){ filters.bucket=""; s.classList.remove("active"); } else { filters.bucket=b; stats.forEach(function(x){x.classList.remove("active");}); s.classList.add("active"); } render();
    }); });
  }

  /* ================= Init ================= */
  function start(){
    try{ notified=JSON.parse(localStorage.getItem(LS_NOTIFIED)||"{}"); }catch(e){ notified={}; }
    me = localStorage.getItem(LS_ME) || "";

    var useFb = FIREBASE_CONFIG.databaseURL && typeof firebase!=="undefined";
    if(useFb){
      try{ store=new FirebaseStore(FIREBASE_CONFIG); setBanner("",false); }
      catch(err){ store=new LocalStore(); setBanner("No se pudo conectar a Firebase; funcionando en modo local (solo esta PC).", true); }
    }else{
      store=new LocalStore();
      setBanner("<b>Modo local (solo esta PC).</b> Para compartir entre computadoras, pegá la config de Firebase en el archivo (arriba de todo del script).", false);
    }

    buildFilterMenus(); populateCatSelect(); updateNotifyBtn(); bind();
    if(me){ document.getElementById("whoName").textContent=me; document.getElementById("whoAv").textContent=initials(me); }
    store.init(onData);
    if(!me) setTimeout(showLogin, 300);
    setInterval(function(){ render(); checkNotifications(); }, 60000);
  }
  start();

})();
</script>
</body>
</html>
