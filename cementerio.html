function vConfig(){const C=db.config;return `<h2>Configuración</h2>
<div class="card"><h3 style="margin-top:0">Datos generales</h3><div class="f">${campo('cf_n','Nombre del cementerio',C.nombre)}${campo('cf_c','Comuna',C.comuna)}${campo('cf_d','Dirección (para recibos)',C.direccion)}${campo('cf_cuit','CUIT',C.cuit)}${campo('cf_h','Horario de atención',C.horario)}${campo('cf_w','WhatsApp de la comuna (trámites online)',C.whatsapp,'tel')}${campo('cf_a','Avisar vencimientos con (días)',C.alertaDias,'number')}${campo('cf_r','Próximo N° de recibo',C.reciboNro,'number')}${campo('cf_fl','Filas por lote del plano (por defecto)',C.filasLote||4,'number')}</div>
<h3>Tarifas vigentes</h3><div class="f">${campo('tf_i','Derecho de inhumación',C.tarifas.inhumacion,'number')}${campo('tf_m','Mantenimiento anual (por ubicación)',C.tarifas.mantenimiento,'number')}${campo('tf_rn','Renovación nicho',C.tarifas.renovacionNicho,'number')}${campo('tf_rt','Renovación tierra',C.tarifas.renovacionTierra,'number')}${campo('tf_t','Traslado / reducción',C.tarifas.traslado,'number')}</div>
<h3>Plazos de concesión (años)</h3><div class="f">${Object.keys(TIPOS).map(t=>campo('pl_'+t,TIPOS[t],C.plazos[t],'number')).join('')}</div><p class="muted">Cargá los valores según la ordenanza tarifaria y el reglamento del cementerio.</p><button class="p" onclick="guardarConfig()">Guardar configuración</button></div>
<div class="card"><h3 style="margin-top:0">Sectores</h3><div class="bar"><span class="muted">Cada sector es una grilla de filas × números.</span><span class="sp"></span><button class="p" onclick="formSector()">＋ Nuevo sector</button></div>${db.sectores.length?`<table><tr><th>Nombre</th><th>Tipo</th><th>Filas × N°</th><th>Ocupación</th><th></th></tr>${db.sectores.map(s=>{const o=db.difuntos.filter(d=>d.estado==='inhumado'&&(d.ubic||'').startsWith(s.id+'|')).length;return `<tr><td><b>${esc(s.nombre)}</b></td><td>${TIPOS[s.tipo]}</td><td>${s.filas} × ${s.columnas} = ${s.filas*s.columnas}${s.planoId?'<br><span class="muted">en el plano</span>':''}</td><td>${o} personas</td><td><button class="sm" onclick="formSector('${s.id}')">✎</button></td></tr>`;}).join('')}</table>`:'<p class="muted">No hay sectores.</p>'}</div>
<div class="card"><h3 style="margin-top:0">Usuarios</h3><table><tr><th>Usuario</th><th>Rol</th><th></th></tr>${C.usuarios.map((u,i)=>`<tr><td>${esc(u.usuario)}</td><td>${ROLES[u.rol]}</td><td><button class="sm" onclick="formUsuario(${i})">✎</button></td></tr>`).join('')}</table><div style="margin-top:8px"><button onclick="formUsuario()">＋ Nuevo usuario</button></div><p class="muted">Administrador: todo · Administrativo: todo menos configuración · Encargado: mapa, registro, movimientos y mantenimiento · Solo consulta: ver sin modificar.</p></div>
<div class="card"><h3 style="margin-top:0">Sincronización con Google Drive</h3><p class="muted">Pegá la URL de la aplicación web de Apps Script. Se sincronizan todos los datos del sistema.</p><div class="f">${campo('sy_u','URL de Apps Script (/exec)',C.syncUrl,'url','class="full"')}<label class="chk full"><input type="checkbox" id="sy_a" ${C.autoSync?'checked':''}> Subir a Drive automáticamente después de cada cambio</label></div><div class="bar" style="margin-top:10px"><button class="p" onclick="guardarSync()">Guardar</button><button onclick="syncSubir()">⬆️ Subir a Drive</button><button onclick="syncBajar()">⬇️ Traer de Drive</button><button onclick="verScript()">Ver código Apps Script</button></div>${db.ultimaSync?`<p class="muted">Última subida: ${new Date(db.ultimaSync).toLocaleString('es-AR')}</p>`:''}</div>
<div class="card"><h3 style="margin-top:0">Copias de seguridad</h3><div class="bar"><button class="p" onclick="backup()">Descargar copia de seguridad</button><label class="btn">Restaurar copia… <input type="file" accept=".json" style="display:none" onchange="restaurar(this.files[0])"></label></div><p class="muted">Recomendado: descargar una copia cada semana y guardarla en Drive o en un pendrive.</p><div class="bar"><button onclick="cargarEjemplo()">Cargar datos de ejemplo</button><button class="d" onclick="borrarTodo()">Borrar todos los datos</button></div></div>`;}
function guardarConfig(){const C=db.config;const nf=Math.max(1,Math.min(20,Number(val('cf_fl'))||4));
 if(nf!==Number(C.filasLote||4)){const mal=PL.filter(l=>l.t!=='g'&&!l.f&&filaMaxUsada(l)>nf);if(mal.length)return alert('No se puede bajar a '+nf+' filas: hay lotes que ya usan más ('+mal.slice(0,10).map(lotLabel).join(', ')+').');C.filasLote=nf;}
Object.assign(C,{nombre:val('cf_n')||C.nombre,comuna:val('cf_c'),direccion:val('cf_d'),cuit:val('cf_cuit'),horario:val('cf_h'),whatsapp:val('cf_w'),alertaDias:Number(val('cf_a'))||60,reciboNro:Number(val('cf_r'))||1});
 C.tarifas={inhumacion:Number(val('tf_i'))||0,mantenimiento:Number(val('tf_m'))||0,renovacionNicho:Number(val('tf_rn'))||0,renovacionTierra:Number(val('tf_rt'))||0,traslado:Number(val('tf_t'))||0};
 Object.keys(TIPOS).forEach(t=>C.plazos[t]=Number(val('pl_'+t))||1);save();render();toast('Configuración guardada');}
function formSector(id,pre){const s=id?sector(id):Object.assign({tipo:'nicho',filas:4,columnas:20},pre||{});
 modal(id?'Editar sector':'Nuevo sector',`<div class="f">${campo('se_n','Nombre *',s.nombre)}<div><label>Tipo</label><select id="se_t">${Object.entries(TIPOS).map(([k,x])=>`<option value="${k}" ${s.tipo===k?'selected':''}>${x}</option>`).join('')}</select></div>${campo('se_f','Filas (alturas)',s.filas,'number')}${campo('se_c','Números por fila',s.columnas,'number')}<input type="hidden" id="se_pid" value="${esc(s.planoId||'')}"></div>${s.planoId?`<p class="muted">Vinculada a la galería del plano <b>${esc((PLI[s.planoId]||{}).nm||s.planoId)}</b>. El largo sugerido sale del plano: revisalo contando los nichos reales.</p>`:''}<p class="muted">Ej.: una galería de nichos de 4 alturas y 20 nichos de largo = 4 filas × 20 números. Si la galería tiene nichos de los dos lados, podés cargar el doble de filas (ej. filas 1-4 un lado, 5-8 el otro).</p>`,
 `${id?`<button class="d" onclick="borrarSector('${id}')">Eliminar</button>`:''}<button onclick="cerrar()">Cancelar</button><button class="p" onclick="guardarSector('${id||''}')">Guardar</button>`);}
function guardarSector(id){const n=val('se_n');if(!n)return toast('Falta el nombre');const f=Math.max(1,Math.min(60,Number(val('se_f'))||1)),c=Math.max(1,Math.min(150,Number(val('se_c'))||1));
 if(id){const fuera=db.difuntos.some(d=>d.estado==='inhumado'&&(d.ubic||'').startsWith(id+'|')&&(Number(d.ubic.split('|')[1])>f||Number(d.ubic.split('|')[2])>c));if(fuera)return alert('Hay personas en posiciones que quedarían fuera del sector. Trasladalas antes de achicarlo.');Object.assign(sector(id),{nombre:n,tipo:val('se_t'),filas:f,columnas:c});}
 else{const ns={id:uid(),nombre:n,tipo:val('se_t'),filas:f,columnas:c};if(val('se_pid'))ns.planoId=val('se_pid');db.sectores.push(ns);if(ns.planoId){view='mapa';mapSector=ns.id;}}
 save();cerrar();render();toast('Guardado');}
function borrarSector(id){if(db.difuntos.some(d=>(d.ubic||'').startsWith(id+'|'))||db.concesiones.some(c=>c.ubic.startsWith(id+'|')&&c.estado!=='finalizada'))return alert('El sector tiene registros o concesiones activas. No se puede eliminar.');if(!confirm('¿Eliminar sector?'))return;db.sectores=db.sectores.filter(s=>s.id!==id);save();cerrar();render();}
function formUsuario(i){const ed=i!==undefined;const u=ed?db.config.usuarios[i]:{rol:'administrativo'};
 modal(ed?'Editar usuario':'Nuevo usuario',`<div class="f">${campo('us_u','Usuario *',u.usuario)}${campo('us_p','PIN *',u.pin,'password')}<div><label>Rol</label><select id="us_r">${Object.entries(ROLES).map(([k,x])=>`<option value="${k}" ${u.rol===k?'selected':''}>${x}</option>`).join('')}</select></div></div>`,`${ed?`<button class="d" onclick="borrarUsuario(${i})">Eliminar</button>`:''}<button onclick="cerrar()">Cancelar</button><button class="p" onclick="guardarUsuario(${ed?i:-1})">Guardar</button>`);}
function guardarUsuario(i){const u={usuario:val('us_u'),pin:val('us_p'),rol:val('us_r')};if(!u.usuario||!u.pin)return toast('Completá usuario y PIN');const L=[...db.config.usuarios];if(L.some((x,j)=>j!==i&&x.usuario.toLowerCase()===u.usuario.toLowerCase()))return toast('Ese usuario ya existe');if(i>=0)L[i]=u;else L.push(u);if(!L.some(x=>x.rol==='admin'))return toast('Debe quedar al menos un administrador');db.config.usuarios=L;save();cerrar();render();toast('Usuario guardado');}
function borrarUsuario(i){const L=db.config.usuarios.filter((x,j)=>j!==i);if(!L.some(x=>x.rol==='admin'))return toast('Debe quedar al menos un administrador');if(!confirm('¿Eliminar usuario?'))return;db.config.usuarios=L;save();cerrar();render();}

function guardarSync(){db.config.syncUrl=val('sy_u');db.config.autoSync=val('sy_a');save();render();toast('Guardado');}
function verScript(){modal('Código para Apps Script',`<textarea id="gas" style="min-height:330px;font-family:monospace;font-size:12px" readonly>${esc(GAS)}</textarea>`,`<button onclick="navigator.clipboard.writeText(GAS).then(()=>toast('Código copiado'))">Copiar</button><button class="p" onclick="cerrar()">Cerrar</button>`);}
async function syncSubir(silencioso){const u=db.config.syncUrl;if(!u)return toast('Configurá la URL de Apps Script');
 try{db.ultimaSync=new Date().toISOString();localStorage.setItem(LS,JSON.stringify(db));const r=await fetch(u,{method:'POST',body:JSON.stringify(db)});const j=await r.json().catch(()=>({}));if(j.ok===false)throw new Error(j.error||'error del servidor');if(!silencioso)toast('☁️ Datos subidos a Drive');}
 catch(e){console.error(e);toast('No se pudo sincronizar: '+e.message);}}
async function syncBajar(){const u=db.config.syncUrl;if(!u)return toast('Configurá la URL de Apps Script');if(!confirm('Esto reemplaza los datos de este equipo por los guardados en Drive. ¿Continuar?'))return;
 try{const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now());const d=await r.json();if(!d||!d.config)throw new Error('el archivo de Drive está vacío');const url=db.config.syncUrl,auto=db.config.autoSync;db=normalizar(d);db.config.syncUrl=url;db.config.autoSync=auto;localStorage.setItem(LS,JSON.stringify(db));render();toast('Datos traídos de Drive');}
 catch(e){toast('Error: '+e.message);}}
function backup(){const o={app:'cementerio-alcorta',version:2,fecha:new Date().toISOString(),db};descargar('cementerio-backup-'+hoy()+'.json',JSON.stringify(o),'application/json');}
async function restaurar(f){if(!f)return;try{const o=JSON.parse(await f.text());const d=o.db||o;if(!d.config)throw new Error('archivo inválido');if(!confirm('Se reemplazarán todos los datos de este equipo. ¿Continuar?'))return;db=normalizar(d);localStorage.setItem(LS,JSON.stringify(db));render();toast('Copia restaurada');}catch(e){alert('No se pudo restaurar: '+e.message);}}
function borrarTodo(){if(!confirm('¿Borrar TODOS los datos de este equipo? Descargá antes una copia de seguridad.'))return;if(prompt('Escribí BORRAR para confirmar')!=='BORRAR')return;const us=db.config.usuarios;db=nuevaDB();db.config.usuarios=us;localStorage.setItem(LS,JSON.stringify(db));render();toast('Datos borrados');}

/* ===================== DATOS DE EJEMPLO ===================== */
function cargarEjemplo(){if(db.difuntos.length&&!confirm('Ya hay datos cargados. ¿Agregar datos de ejemplo igualmente?'))return;
 const S=[];[['B-G1',4,24],['F-G1',4,26]].forEach(([pid,f,c],i)=>{if(!galSector(pid))S.push({id:uid()+'g'+i,nombre:PLI[pid].nm,tipo:'nicho',filas:f,columnas:c,planoId:pid});});
 if(!db.sectores.some(s=>s.tipo==='osario'))S.push({id:uid()+'e',nombre:'Osario',tipo:'osario',filas:5,columnas:15});db.sectores.push(...S);
 const lotesP=PL.filter(l=>l.t!=='g');
 const ap=['GÓMEZ','RODRÍGUEZ','FERNÁNDEZ','LÓPEZ','MARTÍNEZ','GARCÍA','PÉREZ','SÁNCHEZ','ROMERO','SOSA','ÁLVAREZ','TORRES','RUIZ','RAMÍREZ','FLORES','BENÍTEZ','ACOSTA','MEDINA','HERRERA','SUÁREZ','AGUIRRE','GIMÉNEZ','MOLINA','CASTRO','ROJAS'];
 const no=['José','María','Juan','Ana','Carlos','Rosa','Luis','Elena','Antonio','Marta','Hugo','Teresa','Raúl','Norma','Oscar','Beatriz','Rubén','Graciela','Héctor','Nélida'];
 const r=a=>a[Math.floor(Math.random()*a.length)];const rn=(a,b)=>a+Math.floor(Math.random()*(b-a+1));const h=hoy();const T=[];
 for(let i=0;i<14;i++)T.push({id:uid()+'t'+i,nombre:r(ap)+', '+r(no),dni:String(rn(18000000,40000000)),tel:'3465'+rn(400000,499999),dom:'Calle '+rn(1,30)+' N° '+rn(100,999),email:'',obs:''});db.titulares.push(...T);
 const usadas=new Set();
 const gals=db.sectores.filter(s=>s.planoId);
 for(let i=0;i<140;i++){let k;if(gals.length&&Math.random()<.3){const s=r(gals);k=kUb(s.id,rn(1,s.filas),rn(1,s.columnas));}else{const lt=r(lotesP);k=kL(lt.id,rn(1,filasDe(lt)));}if(usadas.has(k)||ocupantes(k).length)continue;usadas.add(k);
  const ya=rn(1990,2026);const fall=ya+'-'+p2(rn(1,12))+'-'+p2(rn(1,28));if(fall>h)continue;const nac=(ya-rn(45,95))+fall.slice(4);const t=r(T);
  const d={id:uid()+'d'+i,nombre:r(ap)+', '+r(no)+' '+r(no),dni:'',nac,fall,inhum:addDays(fall,1),cocheria:r(['Cochería Alcorta','Sepelios del Sur','Cochería San José']),acta:'Acta '+(100+i),obs:'',resena:'',publico:true,titularId:t.id,ubic:k,estado:'inhumado',creado:h};db.difuntos.push(d);
  db.movimientos.push({id:uid()+'m'+i,difuntoId:d.id,tipo:'inhumacion',fecha:d.inhum,desde:'',hacia:k,autoriza:'admin',obs:''});
  const pl=db.config.plazos[tipoUbic(k)]||5;let ven=addYears(d.inhum,pl);while(ven<h&&Math.random()<.85)ven=addYears(ven,pl);
  db.concesiones.push({id:uid()+'c'+i,ubic:k,titularId:t.id,inicio:d.inhum,vence:ven,estado:'vigente',renovaciones:[],obs:''});}
 const cs=db.concesiones.slice(-8);cs.forEach((c,i)=>{c.vence=addDays(h,i<4?-(15+i*45):(10+i*8));});
 const tf=db.config.tarifas;if(!tf.inhumacion)Object.assign(tf,{inhumacion:45000,mantenimiento:18000,renovacionNicho:60000,renovacionTierra:40000,traslado:30000});
 const y=String(new Date().getFullYear());db.concesiones.slice(0,25).forEach((c,i)=>{const k=nuevoCobro(c.titularId,'Mantenimiento anual',tf.mantenimiento,c.ubic,ubLabel(c.ubic),y);if(i%3===0){Object.assign(k,{estado:'pagado',pago:addDays(h,-rn(1,200)),medio:'Efectivo',recibo:db.config.reciboNro++});}db.cobros.push(k);});
 const libre=lotesP.flatMap(filasKeys).find(k=>!usadas.has(k));if(libre)db.ubic[libre]={estado:'reservado',nota:'Reserva familia Gómez'};
 db.tareas.push({id:uid()+'x1',desc:'Corte de pasto sector tierra',fecha:h,sector:'',resp:'Equipo de servicios',estado:'pendiente',notas:''},{id:uid()+'x2',desc:'Reparar revoque nichos fila 4',fecha:addDays(h,3),sector:(gals[0]||{}).id||'',resp:'Albañil',estado:'en curso',notas:''},{id:uid()+'x3',desc:'Pintura de portón de ingreso',fecha:addDays(h,-10),sector:'',resp:'Equipo de servicios',estado:'hecha',notas:''});
 db.stock.push({id:uid()+'s1',item:'Placas de mármol',unidad:'unidades',cantidad:6,minimo:5},{id:uid()+'s2',item:'Ladrillos',unidad:'unidades',cantidad:120,minimo:200},{id:uid()+'s3',item:'Cal',unidad:'bolsas',cantidad:8,minimo:4},{id:uid()+'s4',item:'Cemento',unidad:'bolsas',cantidad:3,minimo:5});
 save();render();toast('Datos de ejemplo cargados');}

/* ===================== CONSULTA PÚBLICA ===================== */
let _P=null;
async function publico(){rebuildPL();document.title='Consulta · Cementerio';const app=$('#app');app.innerHTML='<div class="pub"><p class="muted">Cargando…</p></div>';
 try{const r=await fetch('cementerio-publico.json?t='+Date.now());if(r.ok)_P=await r.json();}catch(e){}
 if(!_P&&db.difuntos.length)_P=armarPadron();
 if(!_P||!_P.personas){app.innerHTML='<div class="pub"><div class="card empty">La consulta pública todavía no está disponible.</div></div>';return;}
 app.innerHTML=`<header><div class="t">🕊️ ${esc(_P.nombre)}<small>${esc(_P.comuna)} · Consulta pública</small></div></header><div class="pub"><div class="card"><label>Buscá por apellido o nombre</label><input id="pq" placeholder="Ej: Gómez" oninput="buscarPub()" autocomplete="off"></div><div id="pres"><p class="muted">Ingresá al menos 3 letras.</p></div>
 <div class="card"><h3 style="margin-top:0">Trámites</h3>${_P.whatsapp?`<p class="muted">Hacé tu consulta o iniciá un trámite: se envía por WhatsApp a la Comuna.</p><div class="f"><div><label>Trámite</label><select id="tr_t"><option>Consulta de ubicación</option><option>Renovación de concesión</option><option>Consulta de deuda</option><option>Solicitud de nicho / parcela</option><option>Traslado o reducción</option><option>Otro</option></select></div>${campo('tr_n','Tu nombre y apellido')}${campo('tr_dni','DNI')}<div class="full"><label>Detalle</label><textarea id="tr_d" placeholder="Nombre del familiar, ubicación, consulta…"></textarea></div><div><button class="p" onclick="enviarTramite()">Enviar por WhatsApp</button></div></div>`:'<p>Acercate a la Comuna para realizar trámites.</p>'}${_P.horario?`<p class="muted">Horario de atención: ${esc(_P.horario)}</p>`:''}</div><p class="muted" style="text-align:center">Padrón actualizado al ${fF(_P.generado)}</p></div>`;}
function buscarPub(){const q=norm(val('pq'));const el=$('#pres');if(q.length<3){el.innerHTML='<p class="muted">Ingresá al menos 3 letras.</p>';return;}const R=_P.personas.filter(p=>norm(p.n).includes(q)).slice(0,50);
 el.innerHTML=R.length?R.map(p=>`<div class="res"><b>${esc(p.n)}</b>${p.fa?` <span class="muted">· ${fF(p.fa)}</span>`:''}<div style="margin-top:4px">📍 <b>${esc(p.u||(p.s+' — Fila '+p.f+', N° '+p.c))}</b>${p.l&&PLI[p.l]?` <button class="sm" onclick="planoPub('${esc(p.l)}')">Ver en el plano</button>`:''}</div>${p.r?`<p class="muted" style="margin:6px 0 0">${esc(p.r)}</p>`:''}</div>`).join(''):'<div class="card empty">No se encontraron resultados. Consultá en la Comuna.</div>';}
function planoPub(id){const l=PLI[id];if(!l)return;const pad=160;let W=l.w+pad*2,H=l.h+pad*2;if(W/H>1.2)H=W/1.2;else W=H*1.2;
 modal('📍 '+esc(l.t==='g'?l.nm:lotLabel(l)),`<div class="plano-wrap" style="height:60vh;min-height:300px"><svg viewBox="${[l.x+l.w/2-W/2,l.y+l.h/2-H/2,W,H].join(' ')}" style="width:100%;height:100%;display:block">${planoSVG(true,id)}</svg></div><p class="muted">La ubicación está resaltada. El ingreso principal está abajo a la izquierda del plano.</p>`,'<button class="p" onclick="cerrar()">Cerrar</button>');}
function enviarTramite(){if(!val('tr_n'))return toast('Ingresá tu nombre');window.open(waLink(_P.whatsapp,`Trámite cementerio: ${val('tr_t')}\nNombre: ${val('tr_n')}\nDNI: ${val('tr_dni')}\nDetalle: ${val('tr_d')}`),'_blank');}

/* ===================== INICIO ===================== */
const VISTAS={inicio:vInicio,mapa:vMapa,difuntos:vDifuntos,titulares:vTitulares,concesiones:vConcesiones,cobros:vCobros,movimientos:vMovimientos,archivo:vArchivo,mantenimiento:vMant,reportes:vReportes,config:vConfig};
if(new URLSearchParams(location.search).has('consulta'))publico();else render();
</script>
