<title>Cementerio Comunal · Alcorta</title>

<style>
:root{--pri:#2f4858;--acc:#5f8a6a;--bg:#f4f5f2;--card:#fff;--txt:#1f2a30;--mut:#6b7780;--bor:#dde2e0;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
header{background:var(--pri);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:20}
header .t{font-weight:700;font-size:17px;flex:1}
header .t small{display:block;font-weight:400;opacity:.75;font-size:12px}
header .u{font-size:13px;opacity:.95;text-align:right}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;margin-top:3px}
.layout{display:flex;min-height:calc(100vh - 58px)}
nav.side{width:215px;background:#fff;border-right:1px solid var(--bor);padding:10px 8px;flex-shrink:0}
nav.side a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--txt);text-decoration:none;cursor:pointer;margin-bottom:2px}
nav.side a:hover{background:#eef1ef}
nav.side a.on{background:var(--pri);color:#fff}
main{flex:1;padding:18px;min-width:0}
h2{margin:0 0 14px;font-size:21px}
h3{margin:18px 0 8px;font-size:16px}
.card{background:var(--card);border:1px solid var(--bor);border-radius:12px;padding:14px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--bor);border-radius:12px;padding:12px;cursor:pointer}
.kpi b{display:block;font-size:23px;margin-top:4px}
.kpi span{font-size:12.5px;color:var(--mut)}
.kpi.bad b{color:var(--bad)}.kpi.warn b{color:#b45309}.kpi.ok b{color:#047857}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .sp{flex:1}
button,.btn{font:inherit;padding:8px 13px;border-radius:8px;border:1px solid var(--bor);background:#fff;color:var(--txt);cursor:pointer;white-space:nowrap}
a.btn{text-decoration:none;display:inline-block}
label.btn{display:inline-block;font-size:15px;color:var(--txt);margin:0}
button:hover,.btn:hover{filter:brightness(.95)}
button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
button.g{background:var(--acc);color:#fff;border-color:var(--acc)}
button.d{color:var(--bad);border-color:#f3c4c4}
button.sm,.btn.sm{padding:4px 9px;font-size:13px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--bor);border-radius:8px;background:#fff;width:100%;color:var(--txt)}
textarea{min-height:80px;resize:vertical}
label{font-size:12.5px;color:var(--mut);display:block;margin-bottom:3px}
.f{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.f .full{grid-column:1/-1}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--txt);flex-wrap:wrap}
.chk input{width:auto}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:8px 9px;border-bottom:1px solid var(--bor);text-align:left;font-size:14px;vertical-align:top}
th{background:#f0f2f1;font-size:12.5px;color:var(--mut);font-weight:600}
tr.cl{cursor:pointer}tr.cl:hover td{background:#f7f9f8}
.tw{overflow-x:auto;border:1px solid var(--bor);border-radius:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600}
.t-libre,.t-pagado,.t-hecha{background:#d1fae5;color:#065f46}.t-ocupado,.t-curso{background:#dbeafe;color:#1e40af}.t-reservado,.t-pendiente{background:#fef3c7;color:#92400e}.t-vencido{background:#fee2e2;color:#991b1b}.t-inhabilitado,.t-gris{background:#e5e7eb;color:#374151}
.mapa{display:grid;gap:4px;overflow-x:auto;padding-bottom:6px}
.cel{min-width:34px;height:40px;border-radius:6px;border:2px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;cursor:pointer;line-height:1.1;user-select:none}
.cel small{font-size:9px;opacity:.85;max-width:100%;overflow:hidden;white-space:nowrap}
.c-libre{background:#ecfdf5;border-color:#6ee7b7}.c-ocupado{background:#dbeafe;border-color:#60a5fa}.c-reservado{background:#fef3c7;border-color:#fbbf24}.c-vencido{background:#fee2e2;border-color:#f87171}.c-inhabilitado{background:#e5e7eb;border-color:#9ca3af;color:#6b7280}

.rl{font-size:11px;color:var(--mut);display:flex;align-items:center;justify-content:flex-end;padding-right:4px}
.plano-wrap{position:relative;border:1px solid var(--bor);border-radius:12px;background:#fbfbf8;overflow:hidden;height:calc(100vh - 250px);min-height:430px;touch-action:none}
#plano{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
#plano.drag{cursor:grabbing}
.pz{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.pz button{width:38px;height:38px;padding:0;font-size:18px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.lt{fill:transparent;stroke-width:.8;cursor:pointer;vector-effect:non-scaling-stroke}
rect.fb{stroke:#fff;stroke-width:.35;pointer-events:none}
.o-libre{stroke:#34d399}.o-parcial{stroke:#0ea5e9}.o-ocupado{stroke:#3b82f6}.o-reservado{stroke:#f59e0b}.o-vencido{stroke:#ef4444}.o-inhabilitado{stroke:#9ca3af}.o-pub{stroke:#94a3b8;cursor:default}

.lt.sel,.gal.sel{stroke:#ea580c;stroke-width:3;stroke-dasharray:none}
.c-parcial{background:linear-gradient(#bfdbfe 50%,#ecfdf5 50%);border-color:#0ea5e9}
.edbar{background:#fff7ed;border:1px solid #fdba74;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.lt:hover{stroke:#111;stroke-width:2}
.e-libre{fill:#ecfdf5;stroke:#34d399}.e-ocupado{fill:#bfdbfe;stroke:#3b82f6}.e-reservado{fill:#fde68a;stroke:#f59e0b}.e-vencido{fill:#fecaca;stroke:#ef4444}.e-inhabilitado{fill:#e5e7eb;stroke:#9ca3af}

.gal{fill:#f5f3ff;stroke:#8b5cf6;stroke-dasharray:5 3;cursor:pointer;vector-effect:non-scaling-stroke;stroke-width:1}
.gal.on{fill:#ddd6fe;stroke-dasharray:none}.gal:hover{stroke:#4c1d95;stroke-width:2}
.lt.hl,.gal.hl{stroke:#111;stroke-width:3.5;animation:pul 1.1s ease-in-out infinite}
@keyframes pul{50%{stroke-opacity:.25}}
.tl{fill:#1f2a30;pointer-events:none;text-anchor:middle;dominant-baseline:central;font-family:system-ui,sans-serif}
.tl.sn{fill:#94a3b8}.tg{fill:#5b21b6;font-weight:600}
.dc{fill:none;stroke:#94a3b8;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}.dcol{fill:#f1f5f9}.dh{fill:#cbd5e1;stroke:none;pointer-events:none}
.dt{fill:#64748b;font-family:system-ui,sans-serif;pointer-events:none;dominant-baseline:central}.dtt{fill:#2f4858;font-weight:700}
.sl{fill:#2f4858;font-weight:700;font-size:15px;text-anchor:end;pointer-events:none;font-family:system-ui,sans-serif}

const titular=id=>db.titulares.find(t=>t.id===id);
const difunto=id=>db.difuntos.find(d=>d.id===id);
const kUb=(s,f,c)=>s+'|'+f+'|'+c;
function ubLabel(k){if(!k)return '—';if(!k.includes('|'))return k;if(esL(k)){const l=lotOf(k);return (l?lotLabel(l):'Lote eliminado')+(l&&filasDe(l)===1&&filaOf(k)===1?'':' · Fila '+filaOf(k));}const [s,f,c]=k.split('|');const S=sector(s);return (S?S.nombre:'Sector eliminado')+' · Fila '+f+' · N° '+c;}
function tipoUbic(k){if(esL(k)){const l=lotOf(k);return l&&l.t==='p'?'tierra':l&&l.t==='n'?'nicho':'panteon';}const S=sector(String(k||'').split('|')[0]);return S?S.tipo:'nicho';}
function ubicsSector(s){const r=[];for(let f=1;f<=s.filas;f++)for(let c=1;c<=s.columnas;c++)r.push(kUb(s.id,f,c));return r;}
function todasUbic(){const r=PL.filter(l=>l.t!=='g').flatMap(filasKeys);db.sectores.forEach(s=>r.push(...ubicsSector(s)));return r;}
function estadoLote(l){const es=filasKeys(l).map(estadoUbic);const oc=es.filter(e=>e==='ocupado'||e==='vencido').length;
 if(es.includes('vencido'))return 'vencido';if(es.every(e=>e==='inhabilitado'))return 'inhabilitado';
 if(oc&&es.some(e=>e==='libre'||e==='reservado'))return 'parcial';if(oc)return 'ocupado';if(es.includes('reservado'))return 'reservado';return 'libre';}
const LEYL={libre:'Libre',parcial:'Con lugar',ocupado:'Completo',reservado:'Reservado',vencido:'Vencido',inhabilitado:'Inhabilitado'};
const galSector=pid=>db.sectores.find(s=>s.planoId===pid);
const ocupantes=k=>db.difuntos.filter(d=>d.ubic===k&&d.estado==='inhumado');
function concDe(k){return db.concesiones.filter(c=>c.ubic===k&&c.estado!=='finalizada').sort((a,b)=>(b.vence||'').localeCompare(a.vence||''))[0]||null;}
function estadoConc(c){if(c.estado==='finalizada')return 'finalizada';if(!c.vence)return 'vigente';const h=hoy();if(c.vence<h)return 'vencida';if(c.vence<=addDays(h,Number(db.config.alertaDias)||60))return 'por vencer';return 'vigente';}
function tagConc(c){const e=estadoConc(c);const m={'vigente':'t-libre','por vencer':'t-reservado','vencida':'t-vencido','finalizada':'t-gris'};return `<span class="tag ${m[e]}">${e}</span>`;}
function estadoUbic(k){const u=db.ubic[k]||{};if(u.estado==='inhabilitado')return 'inhabilitado';
 if(ocupantes(k).length){const c=concDe(k);return c&&estadoConc(c)==='vencida'?'vencido':'ocupado';}
 if(u.estado==='reservado')return 'reservado';return 'libre';}
const deudaTit=id=>db.cobros.filter(c=>c.titularId===id&&c.estado==='pendiente').reduce((a,c)=>a+Number(c.monto||0),0);
function nuevoCobro(titularId,concepto,monto,ubic,detalle,periodo=''){return {id:uid(),titularId:titularId||'',concepto,monto:Number(monto)||0,ubic:ubic||'',detalle:detalle||'',periodo:String(periodo||''),emision:hoy(),vence:addDays(hoy(),30),estado:'pendiente',pago:'',medio:'',recibo:''};}

 ${puedeVer('cobros')?K('Deuda pendiente',f$(deuda),deuda?'warn':'',"fCob='pendiente';ir('cobros')"):''}
 ${puedeVer('mantenimiento')?K('Tareas pendientes',tarP,'',"ir('mantenimiento')"):''}
 ${stockB&&puedeVer('mantenimiento')?K('Materiales a reponer',stockB,'bad',"ir('mantenimiento')"):''}
 ${puedeVer('archivo')&&db.archivo.length?K('Páginas de archivo sin cargar',archP,'',"ir('archivo')"):''}
 </div><div class="grid2">${vc?`<div class="card"><h3 style="margin-top:0">Próximos vencimientos</h3>${prox.length?`<table>${prox.map(c=>{const t=titular(c.titularId);return `<tr class="cl" onclick="fichaConc('${c.id}')"><td>${esc(ubLabel(c.ubic))}<br><span class="muted">${esc(t?t.nombre:'Sin titular')}</span></td><td>${tagConc(c)}<br><span class="muted">${fF(c.vence)}</span></td></tr>`;}).join('')}</table>`:'<p class="muted">No hay vencimientos próximos.</p>'}</div>`:''}<div class="card"><h3 style="margin-top:0">Últimos movimientos</h3>${ult.length?`<table>${ult.map(m=>{const d=difunto(m.difuntoId);return `<tr class="cl" onclick="${d?`fichaDif('${d.id}')`:''}"><td>${fF(m.fecha)}</td><td><b>${MOVS[m.tipo]||m.tipo}</b><br><span class="muted">${esc(d?d.nombre:'—')}</span></td></tr>`;}).join('')}</table>`:'<p class="muted">Sin movimientos registrados.</p>'}</div></div>`;}

/* ===================== MAPA ===================== */
let pv=null,plHL='',plDrag=null,plMoved=false,plEdit=false,plSel='',plMove=null;
function vMapa(){
 if(mapSector!=='plano'&&!sector(mapSector))mapSector='plano';
 const sel=`<select style="width:auto;max-width:100%" onchange="mapSector=this.value;mapQ='';render()"><option value="plano" ${mapSector==='plano'?'selected':''}>🗺️ Plano general</option>${db.sectores.length?`<optgroup label="Galerías y sectores">${db.sectores.map(x=>`<option value="${x.id}" ${x.id===mapSector?'selected':''}>${esc(x.nombre)}</option>`).join('')}</optgroup>`:''}</select>`;
 if(mapSector==='plano')return vPlano(sel);
 const s=sector(mapSector);const cnt={libre:0,ocupado:0,reservado:0,vencido:0,inhabilitado:0};
 ubicsSector(s).forEach(k=>cnt[estadoUbic(k)]++);
 return `<h2>Mapa del cementerio</h2><div class="bar">${s.planoId?`<button onclick="mapSector='plano';render()">← Plano</button>`:''}${sel}<input style="max-width:280px" placeholder="🔍 Buscar persona en esta galería" value="${esc(mapQ)}" oninput="mapQ=this.value;$('#grilla').innerHTML=grilla()">${user.rol==='admin'?`<span class="sp"></span><button onclick="formSector('${s.id}')">✎ Filas y números</button>`:''}</div><div class="ley">${Object.keys(cnt).map(e=>`<span><i class="c-${e}"></i>${cap(e)}: <b>${cnt[e]}</b></span>`).join('')}</div><div class="card"><div id="grilla">${grilla()}</div></div><p class="muted">Tocá un nicho para ver quién está, la concesión y las acciones disponibles. Las filas se muestran de F1 (arriba) hacia abajo; usá la misma numeración que tengan en el cementerio.</p>`;}
function vPlano(sel){
 const cnt={libre:0,parcial:0,ocupado:0,reservado:0,vencido:0,inhabilitado:0};PL.forEach(l=>{if(l.t!=='g')cnt[estadoLote(l)]++;});
 if(!pv)pv=PLANO.vb.slice();
 return `<h2>Mapa del cementerio</h2><div class="bar">${sel}<select style="width:auto" onchange="if(this.value)irSeccion(this.value)"><option value="">Ir a sección…</option>${SECS.map(x=>`<option value="${x}">${secNom(x)}</option>`).join('')}</select><input style="max-width:260px" placeholder="🔍 Buscar persona" value="${esc(mapQ)}" oninput="mapQ=this.value;buscarPlano()"><span class="sp"></span>${puedeImportar()?'<button onclick="abrirImportador()">📥 Importar Excel</button>':''}${user.rol==='admin'?`<button class="${plEdit?'g':''}" onclick="plEdit=!plEdit;plSel='';render()">${plEdit?'✓ Terminar edición':'✏️ Editar plano'}</button>`:''}</div>
 ${plEdit?`<div class="edbar"><b>Modo edición del plano.</b> <span class="muted">Arrastrá un lote para moverlo. Tocalo para cambiar número, tipo, filas, tamaño o borrarlo. Los cambios se guardan solos.</span><div class="bar" style="margin:8px 0 0"><button onclick="agregarLote('l')">＋ Lote</button><button onclick="agregarLote('p')">＋ Sepultura en piso</button><button onclick="agregarLote('n')">＋ Nicho</button><button onclick="agregarLote('g')">＋ Galería</button><button onclick="formFilasSeccion()">Filas de una sección</button><span class="sp"></span><button class="d" onclick="restaurarPlano()">Volver al plano original</button></div></div>`:''}
 <div class="ley"><span class="muted">Lotes:</span>${Object.keys(cnt).map(e=>`<span><i class="c-${e}"></i>${LEYL[e]}: <b>${cnt[e]}</b></span>`).join('')}<span><i style="background:#ddd6fe;border-color:#8b5cf6"></i>Galería de nichos</span></div>
 <div class="plano-wrap"><svg id="plano" class="${plEdit?'editando':''}" viewBox="${pv.join(' ')}" preserveAspectRatio="xMidYMid meet">${planoSVG()}</svg><div class="pz"><button onclick="zoomP(1.5)" title="Acercar">＋</button><button onclick="zoomP(1/1.5)" title="Alejar">－</button><button onclick="pv=PLANO.vb.slice();aplicarPV()" title="Ver todo">⤢</button></div><div class="pl-info" id="plinfo">Arrastrá para moverte · rueda o ＋/－ para zoom</div></div>
 <p class="muted">Cada lote se ve dividido en sus filas (por defecto ${db.config.filasLote||4}), pintadas según estén libres u ocupadas. Tocá un lote para ver sus filas, quién está en cada una e inhumar. Tocá una galería (violeta) para ver sus nichos. Los lotes sin número en el plano figuran como S1, S2… y las sepulturas en piso sin número como P1, P2….</p>`;}
function planoSVG(pub,hlId){const q=pub?'':norm(mapQ);let h=PLANO.decor||'';
 for(const l of PL){
  if(l.t==='g'){const g=pub?null:galSector(l.id);let lab=l.nm.replace('Galería ','Gal. ');
   if(g){const u=ubicsSector(g);const o=u.filter(k=>ocupantes(k).length).length;lab+=' · '+o+'/'+u.length;}
   const hl=(hlId===l.id)||(q.length>1&&g&&db.difuntos.some(d=>d.estado==='inhumado'&&(d.ubic||'').startsWith(g.id+'|')&&norm(d.nombre).includes(q)));
   const vert=l.h>l.w*1.5;const fs=Math.max(6,Math.min(12,(vert?l.w:l.h)*.32));
   h+=`<g data-id="${l.id}"><rect class="gal${g?' on':''}${hl?' hl':''}${plSel===l.id?' sel':''}" x="${l.x}" y="${l.y}" width="${l.w}" height="${l.h}" ${pub?'':`data-g="${l.id}"`}><title>${esc(l.nm)}${g?'':' — sin configurar'}</title></rect><text class="tl tg" font-size="${fs}" x="${l.x+l.w/2}" y="${l.y+l.h/2}" ${vert?`transform="rotate(-90 ${l.x+l.w/2} ${l.y+l.h/2})"`:''}>${esc(lab)}</text></g>`;continue;}
  const ks=filasKeys(l);const n=ks.length;const e=pub?'pub':estadoLote(l);const oc=pub?[]:ks.flatMap(ocupantes);
  const hl=(hlId===l.id)||(plHL===l.id)||(q.length>1&&oc.some(d=>norm(d.nombre).includes(q)));
  h+=`<g data-id="${l.id}">`;
  if(pub)h+=`<rect class="fb e-pub" x="${l.x}" y="${l.y}" width="${l.w}" height="${l.h}"/>`;
  else{const bh=l.h/n;ks.forEach((k,i)=>{h+=`<rect class="fb e-${estadoUbic(k)}" x="${l.x}" y="${(l.y+i*bh).toFixed(2)}" width="${l.w}" height="${bh.toFixed(2)}"/>`;});}
  const no=pub?0:ks.filter(k=>ocupantes(k).length).length;
  h+=`<rect class="lt o-${e}${hl?' hl':''}${plSel===l.id?' sel':''}" x="${l.x}" y="${l.y}" width="${l.w}" height="${l.h}" rx="${l.t==='p'?2:0.5}" ${pub?'':`data-l="${l.id}"`}><title>${esc(lotLabel(l))}${pub?'':' — '+no+'/'+n+' filas ocupadas'}${oc.length?': '+esc(oc.map(d=>d.nombre).join(', ')):''}</title></rect>`;
  const sn=!/^\d/.test(l.c)||l.s==='Cosmopolita';const txt=l.c;const fs=Math.max(3.5,Math.min(11,l.w/(txt.length*.62+.4),l.h*.42));
  h+=`<text class="tl${sn?' sn':''}" font-size="${fs.toFixed(1)}" x="${l.x+l.w/2}" y="${l.y+l.h/2}">${esc(txt)}</text></g>`;}
 for(const [x,[a,b]] of Object.entries(PLANO.sec))h+=`<text class="sl" x="${a}" y="${b}">Sección ${x}</text>`;
 h+=`<text class="sl" x="25" y="1500" transform="rotate(-90 25 1500)" style="text-anchor:middle;font-size:12px">Soc. Cosmopolita</text><text class="sl" x="520" y="2200" style="text-anchor:middle;font-size:20px">⬆ Ingreso principal</text><text class="sl" x="1000" y="45" style="text-anchor:middle;font-size:18px;fill:#94a3b8">↑ 2° parte (nueva)</text>`;
 return h;}
function aplicarPV(){const s=document.getElementById('plano');if(s)s.setAttribute('viewBox',pv.join(' '));}
function zoomP(f,cx,cy){if(!pv)pv=PLANO.vb.slice();const [x,y,w,h]=pv;const nw=Math.min(PLANO.vb[2]*1.3,Math.max(90,w/f));const nh=nw*h/w;
 if(cx===undefined){cx=x+w/2;cy=y+h/2;}pv=[cx-(cx-x)*nw/w,cy-(cy-y)*nh/h,nw,nh];aplicarPV();}
function enfocar(x,y,w,h,pad){pad=pad||40;const el=document.getElementById('plano');const r=el?el.getBoundingClientRect():{width:4,height:3};const ar=(r.width||4)/(r.height||3);
 let W=w+pad*2,H=h+pad*2;if(W/H>ar)H=W/ar;else W=H*ar;pv=[x+w/2-W/2,y+h/2-H/2,W,H];aplicarPV();}
function irSeccion(s){const L=PL.filter(l=>l.s===s);const x0=Math.min(...L.map(l=>l.x)),y0=Math.min(...L.map(l=>l.y)),x1=Math.max(...L.map(l=>l.x+l.w)),y1=Math.max(...L.map(l=>l.y+l.h));enfocar(x0,y0,x1-x0,y1-y0,25);}
function buscarPlano(){const s=document.getElementById('plano');if(!s)return;s.innerHTML=planoSVG();const q=norm(mapQ);if(q.length<2)return;
 const hit=s.querySelector('.hl');const info=document.getElementById('plinfo');const n=s.querySelectorAll('.hl').length;if(info)info.textContent=n?n+' coincidencia(s) resaltada(s)':'Sin coincidencias en el plano';
 if(hit&&n===1){const b=hit.getBBox();enfocar(b.x,b.y,b.width,b.height,120);}}
function svgPt(svg,cx,cy){const r=svg.getBoundingClientRect();const sc=Math.max(pv[2]/r.width,pv[3]/r.height);const ox=(r.width*sc-pv[2])/2,oy=(r.height*sc-pv[3])/2;return [pv[0]+(cx-r.left)*sc-ox,pv[1]+(cy-r.top)*sc-oy,sc];}
function initPlano(){const svg=document.getElementById('plano');if(!svg)return;const pts=new Map();let pinch=null;
 svg.addEventListener('wheel',e=>{e.preventDefault();const [x,y]=svgPt(svg,e.clientX,e.clientY);zoomP(e.deltaY<0?1.25:0.8,x,y);},{passive:false});
 svg.addEventListener('pointerdown',e=>{pts.set(e.pointerId,[e.clientX,e.clientY]);const gEl=e.target.closest&&e.target.closest('[data-id]');
  if(plEdit&&gEl&&pts.size===1){const l=PLI[gEl.dataset.id];plMove={id:l.id,g:gEl,sx:e.clientX,sy:e.clientY,ox:l.x,oy:l.y,dx:0,dy:0};plMoved=false;plDrag=null;return;}
  if(pts.size===1){plDrag=[e.clientX,e.clientY,pv.slice()];plMoved=false;}else if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),pv:pv.slice()};plDrag=null;plMoved=true;}});
 svg.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinch&&pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);pv=pinch.pv.slice();const [cx,cy]=svgPt(svg,(a[0]+b[0])/2,(a[1]+b[1])/2);zoomP(d/pinch.d,cx,cy);return;}
  if(plMove){const ddx=e.clientX-plMove.sx,ddy=e.clientY-plMove.sy;if(!plMoved&&Math.hypot(ddx,ddy)<4)return;if(!plMoved){plMoved=true;try{svg.setPointerCapture(e.pointerId);}catch(_){}}
   const sc=svgPt(svg,0,0)[2];plMove.dx=Math.round(ddx*sc*2)/2;plMove.dy=Math.round(ddy*sc*2)/2;plMove.g.setAttribute('transform',`translate(${plMove.dx} ${plMove.dy})`);return;}
  if(!plDrag)return;const dx=e.clientX-plDrag[0],dy=e.clientY-plDrag[1];if(!plMoved&&Math.hypot(dx,dy)<5)return;
  if(!plMoved){plMoved=true;svg.classList.add('drag');try{svg.setPointerCapture(e.pointerId);}catch(_){}}
  pv=plDrag[2].slice();const sc=svgPt(svg,0,0)[2];pv[0]-=dx*sc;pv[1]-=dy*sc;aplicarPV();});
 const fin=e=>{if(plMove&&e.type==='pointerup'&&plMoved){const m=plMove;setLote(m.id,{x:+(m.ox+m.dx).toFixed(1),y:+(m.oy+m.dy).toFixed(1)});plSel=m.id;save();rebuildPL();svg.innerHTML=planoSVG();}if(plMove&&e.type==='pointercancel')plMove.g.removeAttribute('transform');plMove=null;
  pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size){svg.classList.remove('drag');plDrag=null;}};
 svg.addEventListener('pointerup',fin);svg.addEventListener('pointercancel',fin);
 svg.addEventListener('click',e=>{if(plMoved){plMoved=false;return;}const t=e.target;const id=t.dataset.l||t.dataset.g;if(!id)return;if(plEdit){plSel=id;svg.innerHTML=planoSVG();editarLote(id);return;}if(t.dataset.l){plHL='';fichaLote(t.dataset.l);}else abrirGaleria(id);});}
function fichaLote(id){const l=PLI[id];if(!l)return;const ks=filasKeys(l);const vc=puedeVer('concesiones');
 const rows=ks.map((k,i)=>{const e=estadoUbic(k),oc=ocupantes(k),c=concDe(k),t=c?titular(c.titularId):null;const u=db.ubic[k]||{};
  return `<tr class="cl" onclick="celda('${k}')"><td style="width:62px"><b>Fila ${i+1}</b></td><td><span class="tag t-${e}">${cap(e)}</span>${u.nota?` <span class="muted">${esc(u.nota)}</span>`:''}${oc.map(d=>`<br><b>${esc(d.nombre)}</b> <span class="muted">${fF(d.fall)}</span>`).join('')}${vc&&t?`<br><span class="muted">Titular: ${esc(t.nombre)} · vence ${fF(c.vence)}</span>`:''}</td><td style="text-align:right;white-space:nowrap">${edita()&&e!=='inhabilitado'?`<button class="sm ${oc.length?'':'p'}" onclick="event.stopPropagation();formDif(null,'${k}')">＋ Inhumar</button>`:''}</td></tr>`;}).join('');
 const occ=ks.filter(k=>ocupantes(k).length).length;
 modal('📍 '+esc(lotLabel(l)),`<p class="muted">${ks.length===1?(occ?'Ocupado.':'Libre.'):occ+' de '+ks.length+' filas ocupadas.'} Tocá una fila para ver el detalle, reservarla, inhabilitarla o registrar su concesión.</p><table>${rows}</table>`,`${user.rol==='admin'?`<button onclick="editarLote('${id}')">✏️ Editar lote</button>`:''}<button onclick="cerrar()">Cerrar</button>`);}
function setLote(id,props){const P=db.plano;P.mod[id]=Object.assign(P.mod[id]||{},props);}
function ocupLote(l){return filasKeys(l).filter(k=>ocupantes(k).length||concDe(k)||db.ubic[k]);}
function filaMaxUsada(l){let m=0;const pre='L|'+l.id+'|';const use=k=>{if(String(k||'').startsWith(pre))m=Math.max(m,Number(k.split('|')[2])||1);};
 db.difuntos.forEach(d=>{if(d.estado==='inhumado')use(d.ubic);});db.concesiones.forEach(c=>{if(c.estado!=='finalizada')use(c.ubic);});Object.keys(db.ubic).forEach(use);return m;}
function editarLote(id){const l=PLI[id];if(!l)return;const g=l.t==='g';
 const b=`<div class="f"><div><label>Sección</label><input id="le_s" list="le_secs" value="${esc(l.s)}"><datalist id="le_secs">${SECS.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div>${campo('le_c','Número / código',l.c)}
 <div><label>Tipo</label><select id="le_t" onchange="document.getElementById('le_fw').style.display=this.value==='g'?'none':'';document.getElementById('le_nw').style.display=this.value==='g'?'':'none'"><option value="l" ${l.t==='l'?'selected':''}>Lote / panteón</option><option value="p" ${l.t==='p'?'selected':''}>Sepultura en piso</option><option value="n" ${l.t==='n'?'selected':''}>Nicho</option><option value="g" ${g?'selected':''}>Galería de nichos</option></select></div>
 <div id="le_fw" style="${g?'display:none':''}"><label>Filas para ubicar cuerpos</label><input id="le_f" type="number" min="1" max="20" value="${g?(db.config.filasLote||4):filasDe(l)}"></div>
 <div id="le_nw" class="full" style="${g?'':'display:none'}"><label>Nombre de la galería</label><input id="le_n" value="${esc(l.nm||'')}"></div>
 ${campo('le_x','Posición X',l.x,'number')}${campo('le_y','Posición Y',l.y,'number')}${campo('le_w','Ancho',l.w,'number')}${campo('le_h','Alto',l.h,'number')}</div>
 <p class="muted">Tamaño de referencia: un lote común mide unos 20 × 45. Para moverlo también podés arrastrarlo en el plano (con "Editar plano" activado).</p>`;
 modal('✏️ Editar '+esc(g?l.nm:lotLabel(l)),b,`<button class="d" onclick="borrarLote('${id}')">Eliminar</button><button onclick="duplicarLote('${id}')">Duplicar al lado</button><button onclick="cerrar()">Cancelar</button><button class="p" onclick="guardarLote('${id}')">Guardar</button>`);}
function guardarLote(id){const l=PLI[id];const t=val('le_t'),c=val('le_c'),sec=val('le_s');if(!c)return toast('Falta el número o código');if(!sec)return toast('Falta la sección');
 const w=Number(val('le_w')),h=Number(val('le_h'));if(!(w>=2&&h>=2))return toast('Revisá el ancho y el alto');
 const usada=filaMaxUsada(l);
 if(t==='g'&&usada)return alert('Este lote tiene personas, reservas o concesiones cargadas. No se puede convertir en galería.');
 if(l.t==='g'&&t!=='g'&&galSector(id))return alert('Esta galería ya tiene nichos configurados. No se puede convertir en lote.');
 const f=Math.max(1,Math.min(20,Number(val('le_f'))||1));
 if(t!=='g'&&f<usada)return alert('La fila '+usada+' está en uso. No se pueden dejar menos de '+usada+' filas.');
 if(PL.some(x=>x.id!==id&&x.s===sec&&norm(x.c)===norm(c))&&!confirm('Ya existe '+c+' en '+secNom(sec)+'. ¿Guardar igual?'))return;
 const props={s:sec,c,t,x:Number(val('le_x'))||0,y:Number(val('le_y'))||0,w,h};if(t==='g')props.nm=val('le_n')||('Galería '+secNom(sec));else props.f=f;
 setLote(id,props);save();plSel=id;cerrar();render();toast('Lote guardado');}
function borrarLote(id){const l=PLI[id];if(filaMaxUsada(l))return alert('No se puede eliminar: tiene personas, reservas o concesiones cargadas. Trasladalas o finalizalas primero.');
 if(galSector(id))return alert('Esta galería tiene nichos configurados. Eliminá primero la galería desde Configuración → Sectores.');
 if(!confirm('¿Eliminar '+(l.t==='g'?l.nm:lotLabel(l))+' del plano?'))return;const P=db.plano;
 if(P.add.some(a=>a.id===id))P.add=P.add.filter(a=>a.id!==id);else P.del.push(id);delete P.mod[id];plSel='';save();cerrar();render();toast('Eliminado del plano');}
function sigCodigo(sec,t){if(t==='p'){let m=0;PL.forEach(l=>{if(l.s===sec&&/^P\d+$/.test(l.c))m=Math.max(m,Number(l.c.slice(1)));});return 'P'+(m+1);}
 let m=0;PL.forEach(l=>{if(l.s===sec&&/^\d+$/.test(l.c))m=Math.max(m,Number(l.c));});return String(m+1);}
function nuevoLote(o){const l=Object.assign({id:'N'+uid(),nm:''},o);db.plano.add.push(l);save();rebuildPL();plSel=l.id;render();editarLote(l.id);}
function duplicarLote(id){const l=PLI[id];const o={s:l.s,t:l.t,x:+(l.x+l.w+2).toFixed(1),y:l.y,w:l.w,h:l.h};if(l.t==='g')o.nm=l.nm+' (copia)';else{o.c=sigCodigo(l.s,l.t);if(l.f)o.f=l.f;}if(!o.c)o.c='G'+uid().slice(-3);cerrar();nuevoLote(o);}
function agregarLote(t){if(!pv)pv=PLANO.vb.slice();const cx=pv[0]+pv[2]/2,cy=pv[1]+pv[3]/2;let best=null,bd=1e9;PL.forEach(l=>{if(l.t==='g')return;const d=Math.hypot(l.x+l.w/2-cx,l.y+l.h/2-cy);if(d<bd){bd=d;best=l;}});
 const sec=best?best.s:SECS[0];const dim=t==='g'?[45,200]:t==='p'?[19,38]:t==='n'?[14,11]:[22,46];
 nuevoLote({s:sec,t,c:t==='g'?'G'+uid().slice(-3):sigCodigo(sec,t),x:+(cx-dim[0]/2).toFixed(1),y:+(cy-dim[1]/2).toFixed(1),w:dim[0],h:dim[1],nm:t==='g'?'Galería nueva':''});}
function formFilasSeccion(){modal('Filas por lote',`<p class="muted">Cambia cuántas filas tiene cada lote (y sepultura en piso) de una sección. Si algún lote ya usa más filas, se deja como está y te aviso.</p><div class="f"><div><label>Sección</label><select id="fs_s"><option value="*">Todas las secciones</option>${SECS.map(x=>`<option value="${esc(x)}">${secNom(x)}</option>`).join('')}</select></div><div><label>Tipo</label><select id="fs_t"><option value="lp">Lotes y pisos</option><option value="l">Solo lotes</option><option value="p">Solo sepulturas en piso</option></select></div>${campo('fs_n','Filas',db.config.filasLote||4,'number')}</div>`,'<button onclick="cerrar()">Cancelar</button><button class="p" onclick="aplicarFilasSeccion()">Aplicar</button>');}
function aplicarFilasSeccion(){const sec=val('fs_s'),tt=val('fs_t'),n=Math.max(1,Math.min(20,Number(val('fs_n'))||1));let ok=0;const skip=[];
 PL.forEach(l=>{if(l.t==='g'||!tt.includes(l.t)||(sec!=='*'&&l.s!==sec))return;if(filaMaxUsada(l)>n){skip.push(lotLabel(l));return;}setLote(l.id,{f:n});ok++;});
 save();cerrar();render();if(skip.length)alert(ok+' lote(s) actualizados. No se cambiaron (usan más filas): '+skip.slice(0,15).join(', ')+(skip.length>15?'…':''));else toast(ok+' lote(s) actualizados');}
function restaurarPlano(){const P=db.plano;const enUso=P.add.filter(a=>filaMaxUsada(a)||galSector(a.id));
 const def=Number(db.config.filasLote)||4;const altas=PL.filter(l=>!P.add.some(a=>a.id===l.id)&&l.t!=='g'&&filaMaxUsada(l)>def);if(altas.length)return alert('Algunos lotes usan más de '+def+' filas ('+altas.slice(0,10).map(lotLabel).join(', ')+'). No se puede volver al original sin perder esas ubicaciones.');
 if(enUso.length)return alert('Hay lotes agregados a mano que ya tienen datos cargados ('+enUso.map(a=>a.c||a.nm).join(', ')+'). Eliminá esos datos antes de volver al plano original.');
 if(!confirm('Se descartan todos los cambios hechos al dibujo del plano (posiciones, números, filas, lotes agregados o borrados). Los datos de personas no se tocan. ¿Continuar?'))return;
 db.plano={mod:{},del:[],add:[]};save();plSel='';render();toast('Plano original restaurado');}
function abrirGaleria(pid){const g=galSector(pid);if(g){mapSector=g.id;mapQ='';render();window.scrollTo(0,0);return;}
 const l=PLI[pid];if(user.rol!=='admin')return toast('Esta galería todavía no está configurada. Pedile al administrador que cargue sus filas y nichos.');
 formSector(null,{nombre:l.nm,tipo:'nicho',filas:4,columnas:Math.max(4,Math.round(Math.max(l.w,l.h)/12.7)),planoId:pid});}
function grilla(){const s=sector(mapSector);const q=norm(mapQ);let h=`<div class="mapa" style="grid-template-columns:44px repeat(${s.columnas},minmax(34px,1fr))">`;
 for(let f=1;f<=s.filas;f++){h+=`<div class="rl">F${f}</div>`;for(let c=1;c<=s.columnas;c++){const k=kUb(s.id,f,c),e=estadoUbic(k),oc=ocupantes(k);const hl=q.length>1&&oc.some(d=>norm(d.nombre).includes(q));const tt=oc.map(d=>d.nombre).join(', ');
  h+=`<div class="cel c-${e}${hl?' hl':''}" title="Fila ${f} N° ${c}${tt?' — '+esc(tt):''}" onclick="celda('${k}')">${c}${oc.length?`<small>${esc(iniciales(oc[0].nombre))}${oc.length>1?'+':''}</small>`:''}</div>`;}}
 return h+'</div>';}
function celda(k){const e=estadoUbic(k),oc=ocupantes(k),c=concDe(k),u=db.ubic[k]||{};const t=c?titular(c.titularId):null;
 const ant=db.difuntos.filter(d=>d.ubic!==k&&db.movimientos.some(m=>m.difuntoId===d.id&&m.desde===k));
 let b=`<p><span class="tag t-${e}">${cap(e)}</span>${u.nota?` <span class="muted">${esc(u.nota)}</span>`:''}</p><h3>Ocupantes</h3>`;
 b+=oc.length?`<table>${oc.map(d=>`<tr class="cl" onclick="fichaDif('${d.id}')"><td><b>${esc(d.nombre)}</b><br><span class="muted">Fallec. ${fF(d.fall)} · Inhum. ${fF(d.inhum)}</span></td></tr>`).join('')}</table>`:'<p class="muted">Sin ocupantes.</p>';
 if(puedeVer('concesiones'))b+=`<h3>Concesión</h3>`+(c?`<p>${tagConc(c)} ${fF(c.inicio)} → <b>${fF(c.vence)}</b><br>Titular: <b>${esc(t?t.nombre:'—')}</b>${t&&t.tel?' · '+esc(t.tel):''}</p>`:'<p class="muted">Sin concesión registrada.</p>');
 if(ant.length)b+=`<h3>Ocupantes anteriores</h3><p class="muted">${ant.map(d=>esc(d.nombre)).join(', ')}</p>`;
 let f='';
 if(edita()){
  if(e!=='inhabilitado')f+=`<button class="p" onclick="formDif(null,'${k}')">＋ Inhumar aquí</button>`;
  if(puedeVer('concesiones'))f+=c?`<button onclick="fichaConc('${c.id}')">Ver concesión</button>`:`<button onclick="formConc(null,'${k}')">Nueva concesión</button>`;
  if(!oc.length&&e!=='inhabilitado')f+=`<button onclick="marcarUbic('${k}','${u.estado==='reservado'?'':'reservado'}')">${u.estado==='reservado'?'Quitar reserva':'Reservar'}</button>`;
  if(!oc.length)f+=`<button onclick="marcarUbic('${k}','${e==='inhabilitado'?'':'inhabilitado'}')">${e==='inhabilitado'?'Habilitar':'Inhabilitar'}</button>`;}
 if(esL(k)&&lotOf(k))f=`<button onclick="fichaLote('${lotOf(k).id}')">← Ver lote</button>`+f;
 modal('📍 '+esc(ubLabel(k)),b,f+'<button onclick="cerrar()">Cerrar</button>');}
function marcarUbic(k,est){if(est){const nota=prompt(est==='reservado'?'¿Para quién es la reserva? (opcional)':'Motivo (opcional)');if(nota===null)return;db.ubic[k]={estado:est,nota};}else delete db.ubic[k];save();cerrar();render();toast('Ubicación actualizada');}
function verEnMapa(k){if(!k||!k.includes('|'))return;cerrar();mapQ='';view='mapa';
 if(esL(k)){const l=lotOf(k);mapSector='plano';plHL=l?l.id:'';render();if(l)enfocar(l.x,l.y,l.w,l.h,140);}else{mapSector=k.split('|')[0];render();}
 setTimeout(()=>celda(k),80);}

/* ===================== SELECTORES ===================== */
function pickerUbic(pre,id){const sid=esL(pre)?'SEC:'+((lotOf(pre)||{}).s||''):(pre||'').split('|')[0]||'';
 return `<div><label>Sector</label><select id="${id}_s" onchange="document.getElementById('${id}_p').innerHTML=opcPos(this.value,'')"><option value="">— Sin ubicación —</option><optgroup label="Plano (lotes y pisos)">${SECS.map(x=>`<option value="SEC:${x}" ${'SEC:'+x===sid?'selected':''}>${secNom(x)}</option>`).join('')}</optgroup>${db.sectores.length?`<optgroup label="Galerías y sectores">${db.sectores.map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>${esc(s.nombre)}</option>`).join('')}</optgroup>`:''}</select></div><div><label>Posición</label><select id="${id}_p">${opcPos(sid,pre)}</select></div>`;}
function opcPos(sid,sel){const L=[],O=[];
 if(String(sid).startsWith('SEC:')){const sec=sid.slice(4);PL.filter(l=>l.s===sec&&l.t!=='g').sort(natCmp).forEach(l=>filasKeys(l).forEach((k,i)=>{const e=estadoUbic(k);const o=`<option value="${k}" ${k===sel?'selected':''}>${codNom(l)}${filasDe(l)>1?' · Fila '+(i+1):''} — ${e}</option>`;(e==='libre'||e==='reservado'?L:O).push(o);}));}
 else{const s=sector(sid);if(!s)return '<option value="">—</option>';
 for(let f=1;f<=s.filas;f++)for(let c=1;c<=s.columnas;c++){const k=kUb(s.id,f,c),e=estadoUbic(k);const o=`<option value="${k}" ${k===sel?'selected':''}>Fila ${f} · N° ${c} — ${e}</option>`;(e==='libre'||e==='reservado'?L:O).push(o);}}
 if(!L.length&&!O.length)return '<option value="">—</option>';
 return (L.length?`<optgroup label="Libres / reservadas">${L.join('')}</optgroup>`:'')+(O.length?`<optgroup label="Ocupadas / otras">${O.join('')}</optgroup>`:'');}
const ubicVal=id=>val(id+'_s')?val(id+'_p'):'';
function selTit(sel,id){return `<div><label>Titular / responsable</label><select id="${id}" onchange="document.getElementById('${id}_n').style.display=this.value==='__n'?'':'none'"><option value="">— Sin titular —</option><option value="__n">＋ Nuevo titular…</option>${[...db.titulares].sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(t=>`<option value="${t.id}" ${t.id===sel?'selected':''}>${esc(t.nombre)}${t.dni?' · '+esc(t.dni):''}</option>`).join('')}</select></div><div id="${id}_n" class="full" style="display:none"><div class="f">${campo(id+'_nom','Nombre del nuevo titular')}${campo(id+'_dni','DNI')}${campo(id+'_tel','Teléfono (sin 0 ni 15)','','tel')}${campo(id+'_dom','Domicilio')}</div></div>`;}
function titVal(id){const x=val(id);if(x!=='__n')return x;const n=val(id+'_nom');if(!n)return '';const t={id:uid(),nombre:n,dni:val(id+'_dni'),tel:val(id+'_tel'),dom:val(id+'_dom'),email:'',obs:''};db.titulares.push(t);return t.id;}

/* ===================== REGISTRO DE DIFUNTOS ===================== */
function vDifuntos(){return `<h2>Registro de inhumaciones</h2><div class="bar"><input style="max-width:320px" placeholder="🔍 Nombre, DNI o acta" value="${esc(qDif)}" oninput="qDif=this.value;$('#lista').innerHTML=listaDif()"><select style="width:auto" onchange="fDif=this.value;$('#lista').innerHTML=listaDif()"><option value="">Todos los estados</option>${Object.entries(ESTADOS_D).map(([k,x])=>`<option value="${k}" ${fDif===k?'selected':''}>${x}</option>`).join('')}</select><span class="sp"></span>${puedeImportar()?'<button onclick="abrirImportador()">📥 Importar Excel</button>':''}${edita()?'<button class="p" onclick="formDif()">＋ Nueva inhumación</button>':''}</div><div id="lista">${listaDif()}</div>`;}
function listaDif(){const q=norm(qDif);const L=db.difuntos.filter(d=>(!fDif||d.estado===fDif)&&(!q||norm(d.nombre+' '+d.dni+' '+d.acta).includes(q))).sort((a,b)=>(b.inhum||b.fall||'').localeCompare(a.inhum||a.fall||''));
 if(!L.length)return '<div class="card empty">No hay registros que coincidan.</div>';
 return `<div class="tw"><table><tr><th>Nombre</th><th>DNI</th><th>Fallecimiento</th><th>Ubicación</th><th>Estado</th></tr>${L.slice(0,300).map(d=>`<tr class="cl" onclick="fichaDif('${d.id}')"><td><b>${esc(d.nombre)}</b></td><td>${esc(d.dni)}</td><td>${fF(d.fall)}</td><td>${esc(ubLabel(d.ubic))}</td><td><span class="tag ${d.estado==='inhumado'?'t-ocupado':'t-gris'}">${ESTADOS_D[d.estado]}</span></td></tr>`).join('')}</table></div><p class="muted">${L.length>300?'Mostrando 300 de '+L.length+'. Afiná la búsqueda.':L.length+' registro(s)'}</p>`;}
function formDif(id,preUbic){const nuevo=!id;const d=id?difunto(id):{estado:'inhumado',publico:true,inhum:hoy()};const c=preUbic?concDe(preUbic):null;
 const b=`<div class="f">${campo('d_nom','Apellido y nombre *',d.nombre,'text','class="full"')}${campo('d_dni','DNI',d.dni)}${campo('d_nac','Fecha de nacimiento',d.nac,'date')}${campo('d_fall','Fecha de fallecimiento',d.fall,'date')}${campo('d_inh','Fecha de inhumación',d.inhum,'date')}${campo('d_coch','Cochería / empresa',d.cocheria)}${campo('d_acta','Acta de defunción (N° / libro / folio)',d.acta)}
 ${nuevo?pickerUbic(preUbic||'','du'):`<div class="full muted">Ubicación: <b>${esc(ubLabel(d.ubic))}</b> — para cambiarla registrá un movimiento.</div>`}
 ${selTit(d.titularId||(c?c.titularId:''),'dt')}
 <div class="full"><label>Observaciones</label><textarea id="d_obs">${esc(d.obs)}</textarea></div>
 <div class="full"><label>Reseña para la consulta pública (opcional, con permiso de la familia)</label><textarea id="d_res" style="min-height:50px">${esc(d.resena)}</textarea></div>
 <label class="chk full"><input type="checkbox" id="d_pub" ${d.publico!==false?'checked':''}> Mostrar en la consulta pública (solo nombre, fecha y ubicación)</label>
 ${nuevo?`<div class="full card" style="background:#f7f9f8;margin:0"><label class="chk"><input type="checkbox" id="d_cc" ${c?'':'checked'}> Crear concesión de la ubicación por <input id="d_anios" type="number" min="1" style="width:75px" placeholder="auto"> años ${c?'<span class="muted">(la ubicación ya tiene concesión)</span>':''}</label><label class="chk" style="margin-top:8px"><input type="checkbox" id="d_cob" ${db.config.tarifas.inhumacion>0?'checked':''}> Generar cobro de derecho de inhumación (${f$(db.config.tarifas.inhumacion)})</label></div>`:''}</div>`;
 modal(nuevo?'Nueva inhumación':'Editar registro',b,`<button onclick="cerrar()">Cancelar</button><button class="p" onclick="guardarDif('${id||''}')">Guardar</button>`);}
function guardarDif(id){const nom=val('d_nom');if(!nom)return toast('Falta el nombre');const nuevo=!id;
 const d=nuevo?{id:uid(),estado:'inhumado',creado:hoy()}:difunto(id);
 Object.assign(d,{nombre:nom,dni:val('d_dni'),nac:val('d_nac'),fall:val('d_fall'),inhum:val('d_inh'),cocheria:val('d_coch'),acta:val('d_acta'),obs:val('d_obs'),resena:val('d_res'),publico:val('d_pub'),titularId:titVal('dt')});
 if(nuevo){d.ubic=ubicVal('du');db.difuntos.push(d);
  db.movimientos.push({id:uid(),difuntoId:d.id,tipo:'inhumacion',fecha:d.inhum||hoy(),desde:'',hacia:d.ubic,autoriza:user.usuario,obs:''});
  if(d.ubic&&db.ubic[d.ubic]&&db.ubic[d.ubic].estado==='reservado')delete db.ubic[d.ubic];

function vCobros(){return `<h2>Cobros y tasas</h2><div class="bar"><select style="width:auto" onchange="fCob=this.value;$('#lista').innerHTML=listaCob()">${[['pendiente','Pendientes'],['pagado','Pagados'],['','Todos']].map(([k,x])=>`<option value="${k}" ${fCob===k?'selected':''}>${x}</option>`).join('')}</select><input style="max-width:260px" placeholder="🔍 Titular o concepto" value="${esc(qCob)}" oninput="qCob=this.value;$('#lista').innerHTML=listaCob()"><span class="sp"></span><button onclick="formMant()">Generar tasa anual</button><button class="p" onclick="formCob()">＋ Nuevo cobro</button></div><div id="lista">${listaCob()}</div>`;}
function listaCob(){const q=norm(qCob);const L=db.cobros.filter(c=>(!fCob||c.estado===fCob)&&(!q||norm(((titular(c.titularId)||{}).nombre||'')+' '+c.concepto+' '+c.detalle).includes(q))).sort((a,b)=>(b.emision||'').localeCompare(a.emision||''));
 if(!L.length)return '<div class="card empty">No hay cobros.</div>';const tot=L.reduce((a,c)=>a+Number(c.monto||0),0);const h=hoy();
 return `<div class="tw"><table><tr><th>Emisión</th><th>Titular</th><th>Concepto</th><th>Monto</th><th>Estado</th><th></th></tr>${L.slice(0,400).map(c=>{const t=titular(c.titularId);const vd=c.estado==='pendiente'&&c.vence&&c.vence<h;return `<tr><td>${fF(c.emision)}</td><td>${t?`<a href="#" onclick="fichaTit('${t.id}');return false">${esc(t.nombre)}</a>`:'—'}</td><td>${esc(c.concepto)} ${esc(c.periodo)}<br><span class="muted">${esc(c.detalle||ubLabel(c.ubic))}</span></td><td><b>${f$(c.monto)}</b></td><td><span class="tag t-${c.estado}">${c.estado}</span>${vd?'<br><span class="tag t-vencido">vencido</span>':''}${c.recibo?`<br><span class="muted">Rec. N° ${c.recibo}</span>`:''}</td><td style="white-space:nowrap">${c.estado==='pendiente'?`<button class="sm g" onclick="formPago('${c.id}')">Cobrar</button> <button class="sm d" title="Anular" onclick="borrarCob('${c.id}')">✕</button>`:`<button class="sm" onclick="recibo('${c.id}')">🖨️ Recibo</button>`}</td></tr>`;}).join('')}</table></div><p class="muted">${L.length} cobro(s) · Total: <b>${f$(tot)}</b></p>`;}
function formCob(){modal('Nuevo cobro',`<div class="f">${selTit('','kt')}<div><label>Concepto</label><select id="k_c" onchange="sugMonto()">${CONCEPTOS.map(x=>`<option>${x}</option>`).join('')}</select></div>${campo('k_m','Monto *',db.config.tarifas.inhumacion||'','number')}${campo('k_p','Período (ej. '+new Date().getFullYear()+')')}${campo('k_v','Vencimiento',addDays(hoy(),30),'date')}${campo('k_d','Detalle','','text','class="full"')}</div>`,'<button onclick="cerrar()">Cancelar</button><button class="p" onclick="guardarCob()">Generar</button>');}
function sugMonto(){const m={'Derecho de inhumación':'inhumacion','Mantenimiento anual':'mantenimiento','Renovación de concesión':'renovacionNicho','Traslado':'traslado','Reducción':'traslado'}[val('k_c')];document.getElementById('k_m').value=m?(db.config.tarifas[m]||''):'';}
function guardarCob(){const m=Number(val('k_m'));if(!(m>0))return toast('Ingresá el monto');const c=nuevoCobro(titVal('kt'),val('k_c'),m,'',val('k_d'),val('k_p'));c.vence=val('k_v')||c.vence;db.cobros.push(c);save();cerrar();render();toast('Cobro generado');}
function formPago(id){const c=db.cobros.find(x=>x.id===id);modal('Registrar pago',`<p><b>${esc(c.concepto)} ${esc(c.periodo)}</b> — ${f$(c.monto)}<br><span class="muted">${esc((titular(c.titularId)||{}).nombre||'')}</span></p><div class="f">${campo('p_f','Fecha de pago',hoy(),'date')}<div><label>Medio de pago</label><select id="p_m"><option>Efectivo</option><option>Transferencia</option><option>Débito</option><option>Cheque</option></select></div>${campo('p_r','N° de recibo',db.config.reciboNro,'number')}</div>`,`<button onclick="cerrar()">Cancelar</button><button class="g" onclick="pagar('${id}',true)">Cobrar e imprimir</button><button class="p" onclick="pagar('${id}')">Cobrar</button>`);}
function pagar(id,imp){const c=db.cobros.find(x=>x.id===id);const r=Number(val('p_r'))||db.config.reciboNro;Object.assign(c,{estado:'pagado',pago:val('p_f')||hoy(),medio:val('p_m'),recibo:r,cobradoPor:user.usuario});db.config.reciboNro=Math.max(Number(db.config.reciboNro)||1,r+1);save();cerrar();render();toast('Pago registrado');if(imp)recibo(id);}
function borrarCob(id){if(!confirm('¿Anular este cobro pendiente?'))return;db.cobros=db.cobros.filter(c=>c.id!==id);save();render();}
function formMant(){const y=new Date().getFullYear();const n=db.concesiones.filter(c=>c.estado!=='finalizada').length;modal('Generar tasa anual de mantenimiento',`<p class="muted">Crea un cobro pendiente por cada ubicación con concesión activa (${n}). No duplica las que ya tengan el cobro del mismo año.</p><div class="f">${campo('g_y','Año',y,'number')}${campo('g_m','Monto por ubicación',db.config.tarifas.mantenimiento||'','number')}${campo('g_v','Vencimiento',y+'-12-31','date')}</div>`,'<button onclick="cerrar()">Cancelar</button><button class="p" onclick="generarMant()">Generar</button>');}
function generarMant(){const y=val('g_y'),m=Number(val('g_m'));if(!(m>0))return toast('Ingresá el monto');let n=0;
 db.concesiones.filter(c=>c.estado!=='finalizada').forEach(c=>{if(db.cobros.some(x=>x.concepto==='Mantenimiento anual'&&x.periodo===y&&x.ubic===c.ubic))return;const k=nuevoCobro(c.titularId,'Mantenimiento anual',m,c.ubic,ubLabel(c.ubic),y);k.vence=val('g_v')||k.vence;db.cobros.push(k);n++;});
 save();cerrar();render();toast(n+' cobro(s) generados');}

/* ===================== IMPRESIÓN ===================== */
function imprimir(titulo,html){const w=window.open('','_blank');if(!w)return alert('Permití las ventanas emergentes para imprimir.');
 w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(titulo)}</title><style>body{font-family:Arial,sans-serif;padding:30px;color:#111;max-width:780px;margin:auto}h1{font-size:20px;margin:0 0 4px}h2{font-size:14px;font-weight:normal;margin:0 0 18px;color:#444}table{width:100%;border-collapse:collapse;margin:14px 0}td,th{border:1px solid #bbb;padding:7px;text-align:left;font-size:13px}.tot{font-size:18px;text-align:right}.firma{margin-top:70px;display:flex;justify-content:space-between}.firma div{border-top:1px solid #333;width:40%;text-align:center;padding-top:5px;font-size:12px}.cab{display:flex;justify-content:space-between;border-bottom:2px solid #333;padding-bottom:10px;margin-bottom:16px;font-size:13px}</style></head><body>${html}<script>setTimeout(function(){print()},400)<\/script></body></html>`);w.document.close();}
function cab(){return `<div class="cab"><div><b style="font-size:17px">${esc(db.config.comuna)}</b><br>${esc(db.config.nombre)}</div><div style="text-align:right">${esc(db.config.direccion)}<br>${db.config.cuit?'CUIT '+esc(db.config.cuit):''}</div></div>`;}
function recibo(id){const c=db.cobros.find(x=>x.id===id);const t=titular(c.titularId)||{};
 imprimir('Recibo '+c.recibo,`${cab()}<h1>RECIBO N° ${String(c.recibo).padStart(6,'0')}</h1><h2>Fecha: ${fF(c.pago)}</h2><p>Recibimos de <b>${esc(t.nombre||'—')}</b>${t.dni?' (DNI/CUIT '+esc(t.dni)+')':''} la suma de <b>${f$(c.monto)}</b> en concepto de:</p><table><tr><th>Concepto</th><th>Detalle</th><th>Importe</th></tr><tr><td>${esc(c.concepto)} ${esc(c.periodo)}</td><td>${esc(c.detalle||ubLabel(c.ubic))}</td><td>${f$(c.monto)}</td></tr></table><p class="tot">TOTAL: <b>${f$(c.monto)}</b></p><p>Medio de pago: ${esc(c.medio||'—')}</p><div class="firma"><div>Firma y sello</div><div>Aclaración</div></div>`);}
function estadoCuenta(id){const t=titular(id);const P=db.cobros.filter(c=>c.titularId===id&&c.estado==='pendiente');const tot=P.reduce((a,c)=>a+Number(c.monto||0),0);
 imprimir('Estado de cuenta',`${cab()}<h1>Estado de cuenta — Cementerio</h1><h2>${esc(t.nombre)}${t.dni?' · '+esc(t.dni):''} — al ${fF(hoy())}</h2><table><tr><th>Emisión</th><th>Concepto</th><th>Detalle</th><th>Vence</th><th>Importe</th></tr>${P.map(c=>`<tr><td>${fF(c.emision)}</td><td>${esc(c.concepto)} ${esc(c.periodo)}</td><td>${esc(c.detalle||ubLabel(c.ubic))}</td><td>${fF(c.vence)}</td><td>${f$(c.monto)}</td></tr>`).join('')||'<tr><td colspan="5">Sin deuda pendiente</td></tr>'}</table><p class="tot">Total adeudado: <b>${f$(tot)}</b></p>`);}

/* ===================== ARCHIVO HISTÓRICO ===================== */
function vArchivo(){const L=db.archivo.filter(a=>!fArch||a.estado===fArch).sort((a,b)=>(a.libro+String(a.folio).padStart(5,'0')).localeCompare(b.libro+String(b.folio).padStart(5,'0')));const c={pendiente:0,transcripto:0,cargado:0};db.archivo.forEach(a=>c[a.estado]=(c[a.estado]||0)+1);const tot=db.archivo.length;
 return `<h2>Archivo histórico</h2><p class="muted">Control del pase de los libros de registro en papel al sistema, folio por folio. Registrá los folios de cada libro, transcribí su contenido y marcalos como cargados cuando las personas ya estén en el registro.</p><div class="kpis"><div class="kpi"><span>Folios</span><b>${tot}</b></div><div class="kpi warn"><span>Sin transcribir</span><b>${c.pendiente}</b></div><div class="kpi"><span>Transcriptos</span><b>${c.transcripto}</b></div><div class="kpi ok"><span>Cargados al registro${tot?' · '+Math.round(c.cargado/tot*100)+'%':''}</span><b>${c.cargado}</b></div></div>
 <div class="card"><div class="f"><div><label>Libro / tomo</label><input id="a_l" placeholder="Ej: Libro 3 (1960-1975)"></div><div><label>Desde folio</label><input id="a_f" type="number" value="1"></div><div><label>Hasta folio</label><input id="a_h" type="number" value="1"></div><div style="display:flex;align-items:end"><button class="p" onclick="agregarFolios()">Agregar folios</button></div></div></div>
 <div class="bar"><select style="width:auto" onchange="fArch=this.value;render()">${[['','Todos'],['pendiente','Sin transcribir'],['transcripto','Transcriptos'],['cargado','Cargados']].map(([k,x])=>`<option value="${k}" ${fArch===k?'selected':''}>${x}</option>`).join('')}</select></div>${L.length?`<div class="tw"><table><tr><th>Libro</th><th>Folio</th><th>Transcripción</th><th>Estado</th></tr>${L.slice(0,500).map(a=>`<tr class="cl" onclick="verArch('${a.id}')"><td>${esc(a.libro)}</td><td>${esc(a.folio)}</td><td class="muted">${esc((a.transcripcion||'').split('\n')[0].slice(0,80))||'—'}</td><td><span class="tag ${a.estado==='cargado'?'t-pagado':a.estado==='transcripto'?'t-curso':'t-pendiente'}">${a.estado}</span></td></tr>`).join('')}</table></div>`:'<div class="card empty">Todavía no hay folios registrados.</div>'}`;}
function agregarFolios(){const lib=val('a_l');if(!lib)return toast('Indicá el libro');const d=Number(val('a_f'))||1,h=Math.max(d,Number(val('a_h'))||d);if(h-d>999)return toast('Máximo 1000 folios por vez');let n=0;
 for(let fo=d;fo<=h;fo++){if(db.archivo.some(a=>a.libro===lib&&Number(a.folio)===fo))continue;db.archivo.push({id:uid(),libro:lib,folio:fo,estado:'pendiente',transcripcion:'',creado:hoy()});n++;}
 save();render();toast(n+' folio(s) agregados');}
function verArch(id){const a=db.archivo.find(x=>x.id===id);
 modal(`🗂️ ${esc(a.libro)} · Folio ${esc(a.folio)}`,`<div class="f"><div class="full"><label>Transcripción (una línea por registro: nombre; fecha; ubicación; observaciones)</label><textarea id="a_t" style="min-height:180px">${esc(a.transcripcion)}</textarea></div><div><label>Estado</label><select id="a_e">${['pendiente','transcripto','cargado'].map(e=>`<option ${a.estado===e?'selected':''}>${e}</option>`).join('')}</select></div></div>`,
 `${user.rol==='admin'?`<button class="d" onclick="borrarArch('${id}')">Eliminar</button>`:''}<button onclick="guardarArch('${id}');difDesdeArch('${id}')">＋ Crear registro desde este folio</button><button class="p" onclick="guardarArch('${id}');cerrar();render()">Guardar</button>`);}
function guardarArch(id){const a=db.archivo.find(x=>x.id===id);a.transcripcion=val('a_t');a.estado=val('a_e');if(a.transcripcion&&a.estado==='pendiente')a.estado='transcripto';save();}
function difDesdeArch(id){const a=db.archivo.find(x=>x.id===id);formDif();document.getElementById('d_acta').value=a.libro+' · Folio '+a.folio;document.getElementById('d_inh').value='';document.getElementById('d_cob').checked=false;document.getElementById('d_cc').checked=false;}
function borrarArch(id){if(!confirm('¿Eliminar este folio?'))return;db.archivo=db.archivo.filter(a=>a.id!==id);save();cerrar();render();}

/* ===================== MANTENIMIENTO ===================== */
function vMant(){const T=db.tareas.filter(t=>fTar==='pendientes'?t.estado!=='hecha':fTar==='hechas'?t.estado==='hecha':true).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
 return `<h2>Mantenimiento</h2><div class="bar"><select style="width:auto" onchange="fTar=this.value;render()">${[['pendientes','Pendientes'],['hechas','Realizadas'],['todas','Todas']].map(([k,x])=>`<option value="${k}" ${fTar===k?'selected':''}>${x}</option>`).join('')}</select><span class="sp"></span><button class="p" onclick="formTar()">＋ Nueva tarea</button></div>${T.length?`<div class="tw"><table><tr><th>Fecha</th><th>Tarea</th><th>Sector</th><th>Responsable</th><th>Estado</th></tr>${T.map(t=>`<tr class="cl" onclick="formTar('${t.id}')"><td>${fF(t.fecha)}</td><td><b>${esc(t.desc)}</b></td><td>${esc((sector(t.sector)||{}).nombre||'General')}</td><td>${esc(t.resp)}</td><td><span class="tag ${t.estado==='hecha'?'t-hecha':t.estado==='en curso'?'t-curso':'t-pendiente'}">${t.estado}</span></td></tr>`).join('')}</table></div>`:'<div class="card empty">No hay tareas.</div>'}
 <h3>Materiales e insumos</h3><div class="bar"><span class="muted">Placas, ladrillos, cal, cemento, pintura…</span><span class="sp"></span><button onclick="formStock()">＋ Agregar material</button></div>${db.stock.length?`<div class="tw"><table><tr><th>Material</th><th>Cantidad</th><th>Mínimo</th><th></th></tr>${db.stock.map(s=>{const b=Number(s.cantidad)<=Number(s.minimo);return `<tr><td><b>${esc(s.item)}</b> <span class="muted">${esc(s.unidad)}</span></td><td><b style="color:${b?'var(--bad)':'inherit'}">${s.cantidad}</b>${b?' <span class="tag t-vencido">reponer</span>':''}</td><td>${s.minimo}</td><td style="white-space:nowrap"><button class="sm" onclick="moverStock('${s.id}',-1)">−</button> <button class="sm" onclick="moverStock('${s.id}',1)">＋</button> <button class="sm" onclick="formStock('${s.id}')">✎</button></td></tr>`;}).join('')}</table></div>`:'<div class="card empty">Sin materiales cargados.</div>'}`;}
function formTar(id){const t=id?db.tareas.find(x=>x.id===id):{fecha:hoy(),estado:'pendiente'};
 modal(id?'Tarea':'Nueva tarea',`<div class="f">${campo('ta_d','Descripción *',t.desc,'text','class="full"')}${campo('ta_f','Fecha',t.fecha,'date')}<div><label>Sector</label><select id="ta_s"><option value="">General</option>${db.sectores.map(s=>`<option value="${s.id}" ${s.id===t.sector?'selected':''}>${esc(s.nombre)}</option>`).join('')}</select></div>${campo('ta_r','Responsable',t.resp)}<div><label>Estado</label><select id="ta_e">${['pendiente','en curso','hecha'].map(e=>`<option ${t.estado===e?'selected':''}>${e}</option>`).join('')}</select></div><div class="full"><label>Notas</label><textarea id="ta_n">${esc(t.notas)}</textarea></div></div>`,
 `${id?`<button class="d" onclick="borrarTar('${id}')">Eliminar</button>`:''}<button onclick="cerrar()">Cancelar</button><button class="p" onclick="guardarTar('${id||''}')">Guardar</button>`);}
function guardarTar(id){const d=val('ta_d');if(!d)return toast('Falta la descripción');const t=id?db.tareas.find(x=>x.id===id):{id:uid()};Object.assign(t,{desc:d,fecha:val('ta_f'),sector:val('ta_s'),resp:val('ta_r'),estado:val('ta_e'),notas:val('ta_n')});if(t.estado==='hecha'&&!t.hecha)t.hecha=hoy();
 if(!id)db.tareas.push(t);save();cerrar();render();toast('Tarea guardada');}
function borrarTar(id){if(!confirm('¿Eliminar tarea?'))return;db.tareas=db.tareas.filter(t=>t.id!==id);save();cerrar();render();}
function formStock(id){const s=id?db.stock.find(x=>x.id===id):{cantidad:0,minimo:0};modal(id?'Editar material':'Nuevo material',`<div class="f">${campo('s_i','Material *',s.item)}${campo('s_u','Unidad (bolsas, unidades…)',s.unidad)}${campo('s_c','Cantidad',s.cantidad,'number')}${campo('s_m','Stock mínimo',s.minimo,'number')}</div>`,`${id?`<button class="d" onclick="borrarStock('${id}')">Eliminar</button>`:''}<button onclick="cerrar()">Cancelar</button><button class="p" onclick="guardarStock('${id||''}')">Guardar</button>`);}
function guardarStock(id){const i=val('s_i');if(!i)return toast('Falta el material');const s=id?db.stock.find(x=>x.id===id):{id:uid()};Object.assign(s,{item:i,unidad:val('s_u'),cantidad:Number(val('s_c'))||0,minimo:Number(val('s_m'))||0});if(!id)db.stock.push(s);save();cerrar();render();}
function borrarStock(id){if(!confirm('¿Eliminar material?'))return;db.stock=db.stock.filter(s=>s.id!==id);save();cerrar();render();}
function moverStock(id,n){const s=db.stock.find(x=>x.id===id);s.cantidad=Math.max(0,Number(s.cantidad)+n);save();render();}

/* ===================== REPORTES ===================== */
const urlPublica=()=>location.href.split(/[?#]/)[0]+'?consulta';
function hb(l,p,x){return `<div class="hb"><span class="l">${esc(l)}</span><span class="b"><i style="width:${Math.max(0,Math.min(100,p||0)).toFixed(1)}%"></i></span><span class="v">${x}</span></div>`;}
function vReportes(){
 const occF=(n,ks)=>({n,t:ks.length,o:ks.filter(k=>{const e=estadoUbic(k);return e==='ocupado'||e==='vencido';}).length});
 const occ=[...SECS.map(x=>occF(secNom(x),PL.filter(l=>l.s===x&&l.t!=='g').flatMap(filasKeys))),...db.sectores.map(s=>occF(s.nombre,ubicsSector(s)))];
 const porA={};db.difuntos.forEach(d=>{const y=(d.inhum||d.fall||'').slice(0,4);if(y)porA[y]=(porA[y]||0)+1;});const anios=Object.keys(porA).sort().slice(-12);const maxA=Math.max(1,...anios.map(y=>porA[y]));
 const meses=[];const d0=new Date();for(let i=11;i>=0;i--){const d=new Date(d0.getFullYear(),d0.getMonth()-i,1);meses.push(d.getFullYear()+'-'+p2(d.getMonth()+1));}
 const rec={};db.cobros.filter(c=>c.estado==='pagado').forEach(c=>{const m=(c.pago||'').slice(0,7);rec[m]=(rec[m]||0)+Number(c.monto||0);});const maxR=Math.max(1,...meses.map(m=>rec[m]||0));
 return `<h2>Reportes y herramientas</h2><div class="grid2"><div class="card"><h3 style="margin-top:0">Ocupación por sector</h3>${occ.map(x=>hb(x.n,x.o/x.t*100,x.o+' / '+x.t)).join('')||'<p class="muted">Sin sectores.</p>'}</div><div class="card"><h3 style="margin-top:0">Inhumaciones por año</h3>${anios.map(y=>hb(y,porA[y]/maxA*100,porA[y])).join('')||'<p class="muted">Sin datos.</p>'}</div></div>
 <div class="card"><h3 style="margin-top:0">Recaudación de los últimos 12 meses</h3>${meses.map(m=>hb(m.split('-').reverse().join('/'),(rec[m]||0)/maxR*100,f$(rec[m]||0))).join('')}</div>

function parseFecha(s){s=String(s||'').trim();const m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);if(m){let y=m[3];if(y.length===2)y=(Number(y)>30?'19':'20')+y;return y+'-'+p2(m[2])+'-'+p2(m[1]);}if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;if(/^\d{4}$/.test(s))return s+'-01-01';return '';}
function parseCSV(txt){const l0=txt.split('\n')[0];const sep=(l0.match(/;/g)||[]).length>=(l0.match(/,/g)||[]).length?';':',';const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<txt.length;i++){const ch=txt[i];if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur='';}else if(ch==='\n'){row.push(cur.replace(/\r$/,''));rows.push(row);row=[];cur='';}else cur+=ch;}
 if(cur||row.length){row.push(cur.replace(/\r$/,''));rows.push(row);}return rows.filter(r=>r.some(x=>x.trim()));}

  let tid='';const tn=g(r,'titular');if(tn){let T=db.titulares.find(t=>norm(t.nombre)===norm(tn));if(!T){T={id:uid(),nombre:tn,dni:'',tel:g(r,'telefono'),dom:'',email:'',obs:''};db.titulares.push(T);}tid=T.id;}

function autoMapa(hdr){const H=hdr.map(nH);const T=H.map(h=>h.split(' ').filter(Boolean));const m={};const usado=new Set();
 const esTit=ix=>T[ix].some(t=>IMPW.titular.includes(t));
 const ok=(k,ix)=>!usado.has(ix)&&H[ix]&&!((k==='nombre'||k==='apellido')&&esTit(ix));
 const tok=(k,ix)=>T[ix].some(t=>IMPW[k].some(w=>t===w||(w.length>=5&&t.startsWith(w))));
 for(const pas of [0,1,2])for(const [k,,sin] of IMPF){if(m[k]!==undefined)continue;
  const i=H.findIndex((h,ix)=>ok(k,ix)&&(pas===0?sin.includes(h):pas===1?sin.some(x=>x.length>=5&&(h.startsWith(x)||h.includes(x))):tok(k,ix)));
  if(i>=0){m[k]=i;usado.add(i);}}

async function leerPlanilla(f){if(!f)return;const body=document.getElementById('imp_body');body.innerHTML='<p class="muted">Leyendo planilla…</p>';
 let hojas={};const esCSV=/\.csv$/i.test(f.name);
 try{const X=await cargarXLSX();const wb=X.read(await f.arrayBuffer(),{type:'array',raw:esCSV?false:undefined});wb.SheetNames.forEach(n=>{hojas[n]=X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});});}
 catch(e){if(esCSV){hojas={CSV:parseCSV((await f.text()).replace(/^﻿/,''))};}else{body.innerHTML='<p class="st-err">No se pudo abrir la planilla: '+esc(e.message)+'. Revisá la conexión a internet (el lector de Excel se descarga la primera vez) o guardá la planilla como CSV y probá de nuevo.</p>';return;}}

function elegirHoja(n){IMP.hoja=n;const R=IMP.hojas[n].map(r=>r.map(c=>typeof c==='string'?c.trim():c));
 let best=0,bi=0;for(let i=0;i<Math.min(15,R.length);i++){const k=Object.keys(autoMapa(R[i].map(String))).length;if(k>best){best=k;bi=i;}}
 IMP.R=R;IMP.hdr=bi;IMP.map=autoMapa(R[bi].map(String));IMP.opts=IMP.opts||{probl:false,conc:false};mostrarImport();}
function cabeceras(){const H=IMP.R[IMP.hdr]||[];const n=Math.max(...IMP.R.slice(IMP.hdr,IMP.hdr+50).map(r=>r.length),H.length);const out=[];for(let i=0;i<n;i++)out.push(String(H[i]??'').trim()||('Columna '+String.fromCharCode(65+(i%26))+(i>=26?Math.floor(i/26):'')));return out;}
function resolverSeccion(v){const raw=String(v??'').trim();if(!raw)return null;const q=norm(raw).replace(/[.]/g,' ').replace(/^(seccion|secc|sec|sector)\s*/,'').replace(/\s+/g,' ').trim();
 const ql=q.replace(/[^a-z0-9]/g,'');const sp=SECS.find(x=>norm(x)===q)||SECS.find(x=>norm(x).replace(/[^a-z0-9]/g,'')===ql)||(q.includes('cosmopolita')?'Cosmopolita':null);if(sp)return {plano:sp};
 const S=db.sectores.find(s=>norm(s.nombre)===norm(raw))||db.sectores.find(s=>s.planoId&&PLI[s.planoId]&&norm(PLI[s.planoId].nm)===norm(raw));if(S)return {sector:S};

function resolverFilas(){const m=IMP.map;const g=(r,k)=>m[k]===undefined?'':r[m[k]];const usadas=new Set();const out=[];

  if(!it.nombre){it.st='skip';it.msg='Sin nombre';out.push(it);return;}

    if(ya){it.st='dup';it.msg='Ya está cargada en '+ubLabel(ya);it.ubic=ya;}
    else if(fv&&!(fi>=1)){it.st='err';it.msg='Fila inválida: '+fv;}
    else if(fi>n){it.st='err';it.msg=lotLabel(l)+' tiene '+n+' filas';}
    else{let k='';if(fi){k=kL(l.id,fi);}else{for(let f=1;f<=n;f++){const kk=kL(l.id,f);if(!ocupantes(kk).length&&!usadas.has(kk)&&estadoUbic(kk)!=='inhabilitado'){k=kk;break;}}if(!k){it.st='err';it.msg=lotLabel(l)+(n===1?' ya está ocupado':' está completo');}}
     if(k){const dupl=ocupantes(k).find(d=>norm(d.nombre)===norm(it.nombre));
      if(dupl){it.st='dup';it.msg='Ya está cargada en esa ubicación';it.ubic=k;}

function mostrarImport(){const H=cabeceras();const m=IMP.map;const L=resolverFilas();IMP.L=L;
 const c={ok:0,err:0,dup:0,skip:0};L.forEach(x=>c[x.st]++);const aImp=c.ok+(IMP.opts.probl?c.err:0);
 const selCol=k=>`<select onchange="IMP.map['${k}']=this.value===''?undefined:Number(this.value);mostrarImport()"><option value="">— no está —</option>${H.map((h,i)=>`<option value="${i}" ${m[k]===i?'selected':''}>${esc(h)}</option>`).join('')}</select>`;
 const g=(r,k)=>m[k]===undefined?'':r[m[k]];
 document.getElementById('imp_body').innerHTML=`<h3>1. Columnas de la planilla <span class="muted" style="font-weight:400">— ${esc(IMP.archivo)}</span></h3>
 ${IMP.nombres.length>1?`<div class="bar"><label style="margin:0">Hoja:</label><select style="width:auto" onchange="elegirHoja(this.value)">${IMP.nombres.map(n=>`<option ${n===IMP.hoja?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`:''}
 <p class="muted">Las reconocí automáticamente; corregí las que no coincidan. Títulos en la fila <input type="number" min="1" value="${IMP.hdr+1}" style="width:70px;padding:3px 6px" onchange="IMP.hdr=Math.max(0,Number(this.value)-1);IMP.map=autoMapa((IMP.R[IMP.hdr]||[]).map(String));mostrarImport()"> de la planilla.</p>
 <div class="imp-map">${IMPF.map(([k,lab])=>`<div><label>${lab}${['nombre','seccion','numero'].includes(k)?' *':''}</label>${selCol(k)}</div>`).join('')}</div>
 <h3>2. Vista previa</h3><div class="bar" style="margin-bottom:6px"><span class="st-ok">✔ ${c.ok} para ubicar</span><span class="st-err">⚠ ${c.err} con problemas</span>${c.dup?`<span class="st-dup">＝ ${c.dup} ya cargadas</span>`:''}${c.skip?`<span class="muted">${c.skip} sin nombre (se ignoran)</span>`:''}</div>
 <div class="imp-prev"><table><tr><th>Fila Excel</th><th>Persona</th><th>Sección</th><th>N°</th><th>Fila</th><th>Fallec.</th><th>Titular</th><th>Resultado</th></tr>${L.filter(x=>x.st!=='skip').slice(0,500).map(x=>`<tr><td class="muted">${x.n}</td><td><b>${esc(x.nombre)}</b></td><td>${esc(g(x.r,'seccion'))}</td><td>${esc(g(x.r,'numero'))}</td><td>${esc(g(x.r,'fila'))}</td><td>${fF(fechaX(g(x.r,'fall')))}</td><td>${esc(g(x.r,'titular'))}</td><td>${x.st==='ok'?`<span class="st-ok">✔ ${esc(ubLabel(x.ubic))}</span>`:x.st==='dup'?`<span class="st-dup">＝ ${esc(x.msg)}</span>`:`<span class="st-err">⚠ ${esc(x.msg)}</span>`}</td></tr>`).join('')}</table></div>
 <h3>3. Opciones</h3><label class="chk"><input type="checkbox" ${IMP.opts.probl?'checked':''} onchange="IMP.opts.probl=this.checked;mostrarImport()"> Importar también las filas con problemas (quedan en el registro <b>sin ubicación</b>, para ubicarlas después)</label>
 <label class="chk" style="margin-top:6px"><input type="checkbox" ${IMP.opts.conc?'checked':''} onchange="IMP.opts.conc=this.checked"> Crear la concesión de cada ubicación con su titular (plazo según Configuración, desde la fecha de inhumación)</label>
 <div class="bar" style="margin-top:14px"><span class="sp"></span><button class="p" ${aImp?'':'disabled'} onclick="ejecutarImport()">Importar ${aImp} persona(s)</button></div>`;}
function ejecutarImport(){const L=IMP.L.filter(x=>x.st==='ok'||(x.st==='err'&&IMP.opts.probl));if(!L.length)return;
 if(!confirm('Se van a cargar '+L.length+' persona(s). ¿Continuar?'))return;
 const m=IMP.map;const g=(r,k)=>m[k]===undefined?'':r[m[k]];const reg={id:uid(),fecha:hoy(),archivo:IMP.archivo,usuario:user.usuario,difuntos:[],titulares:[],concesiones:[],movimientos:[]};
 const titCache={};let ub=0,sin=0;
 L.forEach(x=>{const r=x.r;const ubic=x.st==='ok'?x.ubic:'';
  let tid='';const tn=String(g(r,'titular')??'').trim();
  if(tn){const kk=norm(tn);let T=titCache[kk]||db.titulares.find(t=>norm(t.nombre)===kk);if(!T){T={id:uid(),nombre:tn,dni:'',tel:String(g(r,'tel')??'').trim(),dom:'',email:'',obs:'Creado por importación'};db.titulares.push(T);reg.titulares.push(T.id);}else if(!T.tel&&g(r,'tel'))T.tel=String(g(r,'tel')).trim();titCache[kk]=T;tid=T.id;}
  const fall=fechaX(g(r,'fall')),inh=fechaX(g(r,'inhum'))||'';
  const obs=[String(g(r,'obs')??'').trim(),x.st==='err'?'Importado sin ubicación: '+x.msg+' (sección '+g(r,'seccion')+', N° '+g(r,'numero')+(g(r,'fila')!==''?', fila '+g(r,'fila'):'')+')':''].filter(Boolean).join(' · ');
  const d={id:uid(),nombre:x.nombre,dni:String(g(r,'dni')??'').trim(),nac:fechaX(g(r,'nac')),fall,inhum:inh,cocheria:String(g(r,'cocheria')??'').trim(),acta:String(g(r,'acta')??'').trim(),obs,resena:'',publico:true,titularId:tid,ubic,estado:'inhumado',creado:hoy(),importado:reg.id};
  db.difuntos.push(d);reg.difuntos.push(d.id);if(ubic)ub++;else sin++;
  if(ubic){if(db.ubic[ubic]&&db.ubic[ubic].estado==='reservado')delete db.ubic[ubic];
   const mv={id:uid(),difuntoId:d.id,tipo:'inhumacion',fecha:inh||fall||hoy(),desde:'',hacia:ubic,autoriza:user.usuario,obs:'Importado de '+IMP.archivo};db.movimientos.push(mv);reg.movimientos.push(mv.id);
   if(IMP.opts.conc&&tid&&!concDe(ubic)){const ini=inh||fall||hoy();const an=db.config.plazos[tipoUbic(ubic)]||5;const c={id:uid(),ubic,titularId:tid,inicio:ini,vence:addYears(ini,an),estado:'vigente',renovaciones:[],obs:'Creada por importación'};db.concesiones.push(c);reg.concesiones.push(c.id);}}});
 (db.importaciones=db.importaciones||[]).push(reg);save();render();
 modal('✅ Importación terminada',`<p><b>${ub}</b> persona(s) ubicadas en el plano${sin?` y <b>${sin}</b> cargadas sin ubicación (figuran en el Registro con la observación del problema)`:''}.${reg.titulares.length?` Se crearon ${reg.titulares.length} titular(es).`:''}${reg.concesiones.length?` Se crearon ${reg.concesiones.length} concesión(es).`:''}</p><p class="muted">Si algo salió mal, el administrador puede deshacer esta importación desde el mismo importador.</p>`,`<button onclick="cerrar();ir('difuntos')">Ver registro</button><button class="p" onclick="cerrar();mapSector='plano';ir('mapa')">Ver en el mapa</button>`);IMP=null;}
function deshacerImport(id){const reg=(db.importaciones||[]).find(h=>h.id===id);if(!reg)return;
 const movs=db.movimientos.filter(mv=>reg.difuntos.includes(mv.difuntoId)&&!reg.movimientos.includes(mv.id));
 if(!confirm('Se van a borrar las '+reg.difuntos.length+' persona(s) cargadas por "'+reg.archivo+'"'+(movs.length?' (incluidos '+movs.length+' movimiento(s) registrados después)':'')+', sus concesiones y los titulares creados que no se usen en otro lado. ¿Continuar?'))return;
 const D=new Set(reg.difuntos);db.difuntos=db.difuntos.filter(d=>!D.has(d.id));db.movimientos=db.movimientos.filter(mv=>!D.has(mv.difuntoId));
 const C=new Set(reg.concesiones);db.concesiones=db.concesiones.filter(c=>!C.has(c.id));
 db.titulares=db.titulares.filter(t=>!reg.titulares.includes(t.id)||db.difuntos.some(d=>d.titularId===t.id)||db.concesiones.some(c=>c.titularId===t.id)||db.cobros.some(c=>c.titularId===t.id));
 db.importaciones=db.importaciones.filter(h=>h.id!==id);save();render();abrirImportador();toast('Importación deshecha');}
async function plantillaXLSX(){const filas=[['Apellido y nombre','DNI','Fecha de fallecimiento','Fecha de inhumación','Sección','Número','Fila','Titular','Teléfono','Observaciones'],
 ['PÉREZ, Juan Carlos','12345678','15/03/1998','16/03/1998','B','13','1','PÉREZ, María','3465123456',''],
 ['PÉREZ, Rosa','','02/07/2004','03/07/2004','B','13','','PÉREZ, María','','Sin fila: va a la primera libre'],
 ['GÓMEZ, Ana','','02/05/2005','','K','P4','2','GÓMEZ, Luis','','Sepultura en piso sin número'],
 ['LÓPEZ, Hugo','','1987','','Cosmopolita','5','1','','','Solo el año de fallecimiento']];
 const gs=db.sectores.find(s=>s.planoId);if(gs)filas.push(['MARTÍNEZ, Elena','','10/08/2012','',gs.nombre,'7','2','','','Nicho de galería']);
 const F=filas.map(r=>r.map(c=>String(c)));
 try{const X=await cargarXLSX();const ws=X.utils.aoa_to_sheet(F);ws['!cols']=[28,12,20,20,22,9,6,22,14,34].map(w=>({wch:w}));const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'Inhumados');X.writeFile(wb,'planilla-cementerio.xlsx');}
 catch(e){descargar('planilla-cementerio.csv',csv(F));toast('Se descargó en CSV (se abre con Excel)');}}
function armarPadron(){return {nombre:db.config.nombre,comuna:db.config.comuna,whatsapp:db.config.whatsapp,horario:db.config.horario,generado:hoy(),
 personas:db.difuntos.filter(d=>d.estado==='inhumado'&&d.publico!==false&&d.ubic).map(d=>{const S=esL(d.ubic)?null:sector(d.ubic.split('|')[0]);return {n:d.nombre,fa:d.fall||'',u:ubLabel(d.ubic),l:esL(d.ubic)?d.ubic.split('|')[1]:(S&&S.planoId)||'',r:d.resena||''};}).sort((a,b)=>a.n.localeCompare(b.n))};}
function padronPublico(){const P=armarPadron();descargar('cementerio-publico.json',JSON.stringify(P),'application/json');toast(P.personas.length+' personas en el padrón público');}
