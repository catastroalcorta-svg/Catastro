async function confirmarCambioClavePropia(){
  const actual=(document.getElementById('cc-actual')||{}).value||'';
  const nueva=(document.getElementById('cc-nueva')||{}).value||'';
  const confirm=(document.getElementById('cc-confirm')||{}).value||'';
  const err=document.getElementById('cc-error');
  err.style.color='#f87171';
  if(!actual){err.textContent='❌ Ingresá tu contraseña actual.';return;}
  if(nueva.length<4){err.textContent='❌ La nueva contraseña debe tener al menos 4 caracteres.';return;}
  if(nueva!==confirm){err.textContent='❌ Las contraseñas no coinciden.';return;}
  if(!currentUser||!currentUser.usuario){err.textContent='❌ No hay sesión activa.';return;}
  err.style.color='var(--text3)';
  err.textContent='⏳ Guardando...';
  try{
    // Cambia SOLO tu propio usuario, del lado del servidor, verificando la clave actual.
    // No reconstruye ni pisa la lista completa de usuarios.
    const resp = await _driveCall({
      accion: 'cambiarClavePropia',
      usuario: currentUser.usuario,
      passActual: actual,
      nuevaPass: nueva
    });
    if(resp && resp.ok){
      document.getElementById('modal-clave').remove();
      const toast=document.createElement('div');
      toast.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;z-index:99999;box-shadow:0 4px 20px rgba(0,0,0,0.3)';
      toast.textContent='✅ Contraseña actualizada correctamente';
      document.body.appendChild(toast);
      setTimeout(()=>toast.remove(),3000);
    } else {
      err.style.color='#f87171';
      err.textContent='❌ '+((resp&&resp.error)||'No se pudo actualizar.');
    }
  }catch(e){
    err.style.color='#f87171';
    err.textContent='❌ Error de conexión: '+e;
  }
}

async function agregarUsuario(){
  const nombre=document.getElementById('nu-nombre').value.trim();
  const usuario=document.getElementById('nu-usuario').value.trim().toLowerCase();
  const pass=document.getElementById('nu-pass').value;
  const rol=document.getElementById('nu-rol').value;
  const st=document.getElementById('nu-status');
  if(!nombre||!usuario||!pass){st.textContent='❌ Completá todos los campos.';return;}
  if(pass.length<4){st.textContent='❌ La contraseña debe tener al menos 4 caracteres.';return;}
  const usuarios=getUsuarios();
  if(usuarios.find(u=>u.usuario===usuario)){st.textContent='❌ Ese nombre de usuario ya existe.';return;}
  const permisosDefault=JSON.parse(JSON.stringify(PERM_DEFAULT[rol]||PERM_DEFAULT.consulta));

  // Construir lista nueva: usuarios actuales (sin pass) + el nuevo con passPlano
  const nuevoList = usuarios.map(u=>({
    usuario: u.usuario, nombre: u.nombre, rol: u.rol
    // sin passPlano → el backend preserva el hash existente
  }));
  nuevoList.push({ usuario, nombre, rol, passPlano: pass });

  st.textContent='⏳ Guardando en el servidor...';
  try{
    const resp = await _driveCall({
      accion: 'guardarUsuariosV2',
      usuarios: JSON.stringify(nuevoList),
      usuario: currentUser?currentUser.nombre:'?'
    });
    if(resp && resp.ok){
      // Refrescar lista desde el backend y guardar permisos locales del nuevo
      const refreshed = await refreshUsuariosFromDrive();
      const final = refreshed || getUsuarios();
      const idx = final.findIndex(u=>u.usuario===usuario);
      if(idx>=0){
        final[idx].permisos = permisosDefault;
        saveUsuariosMeta(final);
      }
      st.textContent='✅ Usuario '+nombre+' agregado correctamente.';
      ['nu-nombre','nu-usuario','nu-pass'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
      render();
    } else {
      st.textContent='❌ Error: '+((resp&&resp.error)||'no se pudo guardar');
    }
  }catch(e){
    st.textContent='❌ Error de conexión: '+e;
  }
}

async function eliminarUsuario(idx){
  const usuarios=getUsuarios();
  if(!usuarios[idx]) return;
  if(usuarios[idx].usuario===currentUser.usuario){
    alert('No te podés eliminar a vos mismo.');
    return;
  }
  if(!confirm('¿Eliminar al usuario '+usuarios[idx].nombre+'?'))return;
  const eliminado = usuarios[idx].usuario;
  // Lista nueva sin el usuario a eliminar (sin passPlano → backend preserva hashes existentes para los demás)
  const nuevoList = usuarios.filter((_,i)=>i!==idx).map(u=>({
    usuario: u.usuario, nombre: u.nombre, rol: u.rol
  }));
  try{
    const resp = await _driveCall({
      accion: 'guardarUsuariosV2',
      usuarios: JSON.stringify(nuevoList),
      usuario: currentUser?currentUser.nombre:'?'
    });
    if(resp && resp.ok){
      await refreshUsuariosFromDrive();
      render();
    } else {
      alert('Error al eliminar: '+((resp&&resp.error)||'no se pudo guardar'));
    }
  }catch(e){
    alert('Error de conexión: '+e);
  }
}

let _cloacaEditorPendiente = null, _cloacaSelFeat = null, _cloacaModoEdicion=false, _cloacaMoviendo=null, _cloacaSyncTO=null;

function cloacaSetModo(modo){
  cloacaEditorMode=modo; cloacaEditorPuntos=[];  _cloacaEditorPendiente=null;
  _cloacaModoEdicion=false; _cloacaMoviendo=null;
  if(cloacaEditorTempLine&&cloacaEditorMap){cloacaEditorMap.removeLayer(cloacaEditorTempLine);cloacaEditorTempLine=null;}
  const form=document.getElementById('cloaca-editor-form'); if(form)form.style.display='none';
  const sel=document.getElementById('cloaca-editor-seleccionado'); if(sel)sel.style.display='none';
  const hint=document.getElementById('cloaca-editor-hint');
  const btnN=document.getElementById('btn-modo-ninguno');
  // El doble-click cierra el tramo (no hace zoom) y no molesta en modo rápido
  if(cloacaEditorMap){ try{ modo?cloacaEditorMap.doubleClickZoom.disable():cloacaEditorMap.doubleClickZoom.enable(); }catch(e){} }
  if(!modo){ if(hint)hint.style.display='none'; if(btnN)btnN.style.display='none'; if(cloacaEditorMap)cloacaEditorMap.getContainer().style.cursor=''; return; }
  if(btnN)btnN.style.display='inline-block';
  if(cloacaEditorMap)cloacaEditorMap.getContainer().style.cursor='crosshair';
  const msgs={tramo:'🟩 TRAMO — Click para agregar puntos. <b>Doble click</b> para terminar.',camara:'🔵 CÁMARA — Click en el mapa para colocar la cámara.',conexion:'🟠 CONEXIÓN — Click en el mapa para marcar la conexión.','conexion-rapida':'⚡ RÁPIDO — Click tras click para agregar conexiones (se numeran solas). No hace falta guardar cada una.'};
  if(hint){hint.innerHTML=msgs[modo];hint.style.display='block';}
}

function initCloacaEditorMap(){
  if(typeof L==='undefined'){setTimeout(initCloacaEditorMap,150);return;}
  const el=document.getElementById('cloaca-editor-map'); if(!el)return;
  if(cloacaEditorMap){try{cloacaEditorMap.remove();}catch(e){}cloacaEditorMap=null;}
  const streets=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:20});
  const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:20});
  cloacaEditorMap=L.map(el,{layers:[streets]});
  L.control.layers({'🗺 Calles':streets,'🛰 Satélite':sat}).addTo(cloacaEditorMap);
  setTimeout(()=>{if(cloacaEditorMap)cloacaEditorMap.invalidateSize();},100);
  if(geoData)L.geoJSON(geoData,{style:{color:'#aaa',weight:0.5,fillColor:'#f5f5f5',fillOpacity:0.3}}).addTo(cloacaEditorMap);
  cloacaEditorRedibujarRed();
  try{
    if(geoCloacas&&geoCloacas.features&&geoCloacas.features.length>0){cloacaEditorMap.fitBounds(L.geoJSON(geoCloacas).getBounds(),{padding:[20,20]});}
    else if(geoData){cloacaEditorMap.fitBounds(L.geoJSON(geoData).getBounds(),{padding:[20,20]});}
    else{cloacaEditorMap.setView([-33.5403,-61.1221],15);}
  }catch(e){cloacaEditorMap.setView([-33.5403,-61.1221],15);}
  cloacaEditorMap.on('click',cloacaEditorOnClick);
  cloacaEditorMap.on('dblclick',cloacaEditorOnDblClick);
  cloacaEditorMap.on('mousemove',cloacaEditorOnMouseMove);
}

function cloacaEditorRedibujarRed(){
  if(!cloacaEditorMap)return;
  if(cloacaEditorLayers.tramos){cloacaEditorMap.removeLayer(cloacaEditorLayers.tramos);cloacaEditorLayers.tramos=null;}
  if(cloacaEditorLayers.camaras){cloacaEditorMap.removeLayer(cloacaEditorLayers.camaras);cloacaEditorLayers.camaras=null;}
  if(!geoCloacas)return;
  cloacaEditorLayers.tramos=L.geoJSON(geoCloacas,{
    filter:f=>f.geometry&&(f.geometry.type==='LineString'||f.geometry.type==='MultiLineString'),
    style:feat=>{const s=feat.properties&&feat.properties.subtipo;const c={colector:'#1a7a4a',ramal:'#2d9b5a',domiciliario:'#6fcf97'};return{color:c[s]||'#1a7a4a',weight:s==='colector'?4:2,opacity:.85};},
    onEachFeature:(feat,layer)=>{
      const p=feat.properties||{};
      layer.bindTooltip([p.subtipo||'colector',p.diametro,p.material].filter(Boolean).join(' · '),{sticky:true});
      layer.on('click',e=>{L.DomEvent.stopPropagation(e);if(cloacaEditorMode)return;cloacaMostrarSeleccionado(feat,'tramo');});
    }
  }).addTo(cloacaEditorMap);
  cloacaEditorLayers.camaras=L.geoJSON(geoCloacas,{
    filter:f=>f.geometry&&f.geometry.type==='Point'&&f.properties&&f.properties.tipo!=='etiqueta',
    pointToLayer:(feat,latlng)=>{const t=feat.properties.tipo;const color=t==='boca_inspeccion'||t==='boca_registro'?'#2d5fa8':'#e05c00';return L.circleMarker(latlng,{radius:t==='boca_inspeccion'?6:4,color,fillColor:color,fillOpacity:.85,weight:2});},
    onEachFeature:(feat,layer)=>{
      const p=feat.properties||{};
      const tipo={boca_inspeccion:'Boca inspec.',boca_registro:'Boca reg.',sifon:'Sifón',conexion_domiciliaria:'Conex. dom.'}[p.tipo]||p.tipo||'Punto';
      layer.bindTooltip([tipo,p.nro||p.handle].filter(Boolean).join(' '),{sticky:true});
      layer.on('click',e=>{L.DomEvent.stopPropagation(e);if(cloacaEditorMode)return;cloacaMostrarSeleccionado(feat,p.tipo==='conexion_domiciliaria'?'conexion':'camara');});
    }
  }).addTo(cloacaEditorMap);
}

function cloacaEditorOnClick(e){
  // Modo MOVER: reubicar el punto seleccionado
  if(_cloacaMoviendo){
    L.DomEvent.stopPropagation(e);
    _cloacaMoviendo.geometry.coordinates=[e.latlng.lng,e.latlng.lat];
    _cloacaMoviendo.properties.fechaMod=new Date().toISOString().slice(0,10);
    _cloacaGuardarYSync(false);
    cloacaEditorRedibujarRed();
    const mv=_cloacaMoviendo; _cloacaMoviendo=null;
    if(cloacaEditorMap)cloacaEditorMap.getContainer().style.cursor='';
    const hint=document.getElementById('cloaca-editor-hint'); if(hint)hint.style.display='none';
    cloacaMostrarSeleccionado(mv, mv.properties&&mv.properties.tipo==='conexion_domiciliaria'?'conexion':'camara');
    return;
  }
  if(!cloacaEditorMode)return;
  L.DomEvent.stopPropagation(e);
  // Modo RÁPIDO: agrega una conexión numerada sola, sin formulario
  if(cloacaEditorMode==='conexion-rapida'){
    const nro=_proximoNroConexion();
    const feat={type:'Feature',geometry:{type:'Point',coordinates:[e.latlng.lng,e.latlng.lat]},properties:{tipo:'conexion_domiciliaria',nro:String(nro),handle:_generarHandle(),fechaMod:new Date().toISOString().slice(0,10),usuario:currentUser||'operador'}};
    if(!geoCloacas)geoCloacas={type:'FeatureCollection',name:'cloacas_alcorta',features:[]};
    geoCloacas.features.push(feat);
    _cloacaGuardarYSync(true);
    cloacaEditorUndoStack.push({tipo:'conexion',id:feat.properties.handle,label:'Conexión '+nro,fecha:new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}),feat});
    const btnU=document.getElementById('btn-undo-cloaca'); if(btnU){btnU.disabled=false;btnU.style.opacity='1';}
    if(cloacaEditorLayers.camaras){ try{cloacaEditorLayers.camaras.addData(feat);}catch(err){cloacaEditorRedibujarRed();} } else cloacaEditorRedibujarRed();
    _cloacaActualizarHistorial();
    let _vmsg='';
    try{ const cerca=_parcelaMasCercana(e.latlng.lat,e.latlng.lng); if(cerca&&cerca.rec){ _vincularConexionAPadron(feat.properties.handle,cerca.rec); _vmsg=' → Padrón <b>'+cerca.padron+'</b>'+(cerca.rec.titular?' ('+esc(cerca.rec.titular)+')':''); } }catch(err){}
    const hint=document.getElementById('cloaca-editor-hint'); if(hint)hint.innerHTML='⚡ Conexión <b>'+nro+'</b>'+(_vmsg||' agregada')+'. Seguí clickeando para más.';
    return;
  }
  if(cloacaEditorMode==='camara'||cloacaEditorMode==='conexion'){
    _cloacaEditorPendiente={type:'Feature',geometry:{type:'Point',coordinates:[e.latlng.lng,e.latlng.lat]},properties:{tipo:cloacaEditorMode==='camara'?'boca_inspeccion':'conexion_domiciliaria',handle:_generarHandle(),fechaMod:new Date().toISOString().slice(0,10),usuario:currentUser||'operador'}};
    cloacaMostrarForm(cloacaEditorMode); return;
  }
  if(cloacaEditorMode==='tramo'){
    cloacaEditorPuntos.push([e.latlng.lat,e.latlng.lng]);
    L.circleMarker(e.latlng,{radius:4,color:'#1a7a4a',fillColor:'#fff',fillOpacity:1,weight:2}).addTo(cloacaEditorMap);
    const hint=document.getElementById('cloaca-editor-hint');
    if(hint)hint.innerHTML=`🟩 TRAMO — ${cloacaEditorPuntos.length} punto(s). <b>Doble click</b> para terminar.`;
  }
}

function cloacaEditorOnDblClick(e){
  if(cloacaEditorMode!=='tramo')return;
  L.DomEvent.stopPropagation(e);
  if(cloacaEditorPuntos.length<2){alert('Un tramo necesita al menos 2 puntos.');return;}
  _cloacaEditorPendiente={type:'Feature',geometry:{type:'LineString',coordinates:cloacaEditorPuntos.map(p=>[p[1],p[0]])},properties:{tipo:'colector',subtipo:'colector',handle:_generarHandle(),fechaMod:new Date().toISOString().slice(0,10),usuario:currentUser||'operador'}};
  if(cloacaEditorTempLine&&cloacaEditorMap){cloacaEditorMap.removeLayer(cloacaEditorTempLine);cloacaEditorTempLine=null;}
  cloacaMostrarForm('tramo');
}

function cloacaEditorOnMouseMove(e){
  if(cloacaEditorMode!=='tramo'||cloacaEditorPuntos.length===0)return;
  const pts=[...cloacaEditorPuntos.map(p=>L.latLng(p[0],p[1])),e.latlng];
  if(cloacaEditorTempLine)cloacaEditorMap.removeLayer(cloacaEditorTempLine);
  cloacaEditorTempLine=L.polyline(pts,{color:'#1a7a4a',weight:2,dashArray:'6,4',opacity:.7}).addTo(cloacaEditorMap);
}

function cloacaMostrarForm(tipo){
  const f=document.getElementById('cloaca-editor-form'); if(!f)return;
  f.style.display='block';
  document.getElementById('cloaca-editor-seleccionado').style.display='none';
  document.getElementById('cloaca-form-titulo').textContent={tramo:'🟩 Nuevo tramo colector',camara:'🔵 Nueva cámara',conexion:'🟠 Nueva conexión domiciliaria'}[tipo]||'Nuevo elemento';
  document.getElementById('cloaca-form-tramo-campos').style.display=tipo==='tramo'?'':'none';
  document.getElementById('cloaca-form-camara-campos').style.display=tipo==='camara'?'':'none';
  document.getElementById('cloaca-form-conexion-campos').style.display=tipo==='conexion'?'':'none';
  document.getElementById('cf-obs').value='';
}

function cloacaGuardarElemento(){
  if(!_cloacaEditorPendiente){alert('No hay elemento pendiente.');return;}
  const feat=_cloacaEditorPendiente, p=feat.properties;
  const obs=document.getElementById('cf-obs').value.trim(); if(obs)p.obs=obs;
  if(cloacaEditorMode==='tramo'){
    p.subtipo=document.getElementById('cf-subtipo').value;
    p.tipo=p.subtipo==='colector'?'colector':'ramal';
    const d=document.getElementById('cf-diametro').value; if(d)p.diametro=d;
    const m=document.getElementById('cf-material').value; if(m)p.material=m;
  } else if(cloacaEditorMode==='camara'){
    p.tipo=document.getElementById('cf-tipo-camara').value;
    const n=document.getElementById('cf-nro-camara').value.trim(); if(n)p.nro=n;
  } else if(cloacaEditorMode==='conexion'){
    const n=document.getElementById('cf-nro-conexion').value.trim(); if(n)p.nro=n;
    const f2=document.getElementById('cf-fecha-conexion').value; if(f2)p.fechaInstalacion=f2;
    if(!_cloacaModoEdicion){
      try{
        const c=feat.geometry&&feat.geometry.coordinates;
        if(c){ const cerca=_parcelaMasCercana(c[1],c[0]);
          if(cerca&&cerca.rec&&confirm('¿Vincular esta conexión al padrón '+cerca.padron+(cerca.rec.titular?' — '+cerca.rec.titular:'')+'?')){ _vincularConexionAPadron(p.handle,cerca.rec); }
        }
      }catch(err){}
    }
  }
  // EDICIÓN: el elemento ya existe en geoCloacas (mismo objeto), solo actualizamos y guardamos
  if(_cloacaModoEdicion){
    p.fechaMod=new Date().toISOString().slice(0,10);
    _cloacaGuardarYSync(false);
    cloacaEditorRedibujarRed();
    _cloacaModoEdicion=false; _cloacaEditorPendiente=null;
    document.getElementById('cloaca-editor-form').style.display='none';
    cloacaSetModo(null);
    _cloacaActualizarHistorial();
    return;
  }
  if(!geoCloacas)geoCloacas={type:'FeatureCollection',name:'cloacas_alcorta',features:[]};
  geoCloacas.features.push(feat);
  try{localStorage.setItem('catastro_geo_cloacas',JSON.stringify(geoCloacas));}catch(e){}
  subirGeoJSON('catastro_geo_cloacas',geoCloacas,'catastro_cloacas.geojson').then(()=>{});

// Busca la parcela del catastro (con padrón vinculado) más cercana al punto clickeado
function _parcelaMasCercana(lat,lng){
  if(!geoData||!geoData.features||!geoLinks) return null;
  const h2p={}; Object.keys(geoLinks).forEach(pad=>{ h2p[geoLinks[pad]]=pad; });
  let best=null,bestD=Infinity;
  geoData.features.forEach(f=>{
    const h=f.properties&&f.properties.handle;
    if(!h||!(h in h2p)) return;
    let min=Infinity;
    const scan=cs=>{ for(const c of cs){ if(typeof c[0]==='number'){const dx=c[0]-lng,dy=c[1]-lat,d=dx*dx+dy*dy; if(d<min)min=d;} else scan(c); } };
    if(f.geometry&&f.geometry.coordinates) scan(f.geometry.coordinates);
    if(min<bestD){ bestD=min; best={handle:h,padron:h2p[h]}; }
  });
  if(!best) return null;
  best.rec=records.find(r=>String(r.padron)===String(best.padron))||null;
  return best;
}

// Vincula una conexión (por su handle) a un padrón/parcela
function _vincularConexionAPadron(connHandle, rec){
  if(!rec||!connHandle) return;

}

function _generarHandle(){return 'cl_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6);}

// Centro aproximado de una parcela (promedio de sus vértices) → [lng,lat]
function _centroideFeature(f){
  let sx=0,sy=0,n=0;
  const scan=cs=>{ for(const c of cs){ if(typeof c[0]==='number'){ sx+=c[0]; sy+=c[1]; n++; } else scan(c); } };
  if(f&&f.geometry&&f.geometry.coordinates) scan(f.geometry.coordinates);
  return n?[sx/n,sy/n]:null;
}

// Importa el detalle de cloacas (JSON) y coloca+vincula cada conexión automáticamente
async function importarConexionesArchivo(input){
  const file=input.files&&input.files[0]; if(!file)return;
  let data;
  try{ data=JSON.parse(await file.text()); }catch(e){ alert('No pude leer el archivo. Tiene que ser el JSON de importación de conexiones.'); input.value=''; return; }
  if(!Array.isArray(data)){ alert('El archivo no tiene el formato esperado (debe ser una lista de conexiones).'); input.value=''; return; }
  if(!geoData||!geoData.features){ alert('Primero tiene que estar cargado el plano del catastro (parcelas).'); input.value=''; return; }
  if(!confirm('Se van a importar hasta '+data.length+' conexiones. Se colocan en el centro de cada parcela vinculada y se enlazan al padrón.\n\n¿Continuar?')){ input.value=''; return; }

  const p2h={}; Object.keys(geoLinks).forEach(pad=>{ p2h[String(pad)]=geoLinks[pad]; });
  const recByPadron={}; records.forEach(r=>{ recByPadron[String(r.padron)]=r; });
  const feaByHandle={}; geoData.features.forEach(f=>{ if(f.properties&&f.properties.handle) feaByHandle[f.properties.handle]=f; });
  const yaConectados=new Set();
  Object.keys(cloacaGeoLinks).forEach(h=>{ const v=cloacaGeoLinks[h]; if(v&&v.padron) yaConectados.add(String(v.padron)); });

  let creadas=0, sinMatch=0, sinGeo=0, yaTenia=0;
  if(!geoCloacas)geoCloacas={type:'FeatureCollection',name:'cloacas_alcorta',features:[]};
  data.forEach(row=>{
    const padron=String(row.padron||'').trim(); if(!padron){sinMatch++;return;}
    const rec=recByPadron[padron];
    if(!rec){ sinMatch++; return; }
    if(yaConectados.has(padron)){ yaTenia++; return; }
    const handle=p2h[padron];
    if(!handle||!feaByHandle[handle]){ sinGeo++; return; }
    const cen=_centroideFeature(feaByHandle[handle]); if(!cen){ sinGeo++; return; }
    const connHandle=_generarHandle();
    const feat={type:'Feature',geometry:{type:'Point',coordinates:[cen[0],cen[1]]},properties:{tipo:'conexion_domiciliaria',nro:String(row.cuenta||''),cuentaCloaca:String(row.cuenta||''),estado:row.estado||'',obs:row.obs||'',handle:connHandle,importado:true,fechaMod:new Date().toISOString().slice(0,10),usuario:currentUser||'importacion'}};
    geoCloacas.features.push(feat);
    cloacaGeoLinks[connHandle]={parcelaId:rec.id,ctaTasa:rec.ctaTasa,titular:rec.titular,padron:rec.padron,cuentaCloaca:String(row.cuenta||''),fecha:new Date().toISOString()};
    yaConectados.add(padron);
    creadas++;
  });
  input.value='';
  if(creadas>0){
    try{localStorage.setItem('catastro_geo_cloacas',JSON.stringify(geoCloacas));}catch(e){}
    try{saveCloacaGeoLinks();}catch(e){}
    try{subirGeoJSON('catastro_geo_cloacas',geoCloacas,'catastro_cloacas.geojson').then(()=>{});}catch(e){}
    try{cloacaEditorRedibujarRed();}catch(e){}
    try{pushToDrive(true);}catch(e){} // para sincronizar los vínculos (cloacaGeoLinks van en el backup)
  }
  alert('📥 Importación terminada:\n\n'+
    '✅ Conexiones creadas y vinculadas: '+creadas+'\n'+
    'ℹ️ Padrones que ya tenían conexión (omitidos): '+yaTenia+'\n'+
    '⚠️ Parcela sin vincular al mapa (no se pudo ubicar): '+sinGeo+'\n'+
    '❌ Padrón no encontrado en el catastro: '+sinMatch+'\n\n'+
    (sinGeo>0?'Las "sin vincular al mapa" necesitan que primero vincules esa parcela al plano; después reimportás y se agregan (no se duplican las ya hechas).':''));
}

function initCloacaVincMap(){
  if(typeof L==='undefined'){setTimeout(initCloacaVincMap,150);return;}
  if(cloacaMap){try{cloacaMap.remove();}catch(e){}cloacaMap=null;}
  const el=document.getElementById('cloaca-vinc-map');
  if(!el)return;
  const streets=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:20});
  cloacaMap=L.map(el,{layers:[streets]});
  setTimeout(()=>{if(cloacaMap)cloacaMap.invalidateSize();},100);

  // Dibujar parcelas de fondo
  if(geoData) L.geoJSON(geoData,{style:{color:'#ccc',weight:0.5,fillColor:'#f0f0f0',fillOpacity:0.2}}).addTo(cloacaMap);

  // Dibujar líneas de la red (colectores)
  L.geoJSON(geoCloacas,{
    filter:f=>f.geometry.type==='LineString'||f.geometry.type==='MultiLineString',
    style:{color:'#1a7a4a',weight:1.5,opacity:0.6}
  }).addTo(cloacaMap);

  // Dibujar bocas/conexiones clickeables
  cloacaVincLayer=L.geoJSON(geoCloacas,{
    filter:f=>f.geometry.type==='Point'&&f.properties&&f.properties.tipo!=='etiqueta',
    pointToLayer:(feat,latlng)=>{
      const h=feat.properties.handle;
      const vinc=cloacaGeoLinks[h];
      const sel=h===cloacaSelHandle;
      const color=sel?'#e05c00':vinc?'#1a7a4a':'#2d5fa8';
      const size=sel?8:vinc?6:5;
      return L.circleMarker(latlng,{radius:size,color:color,fillColor:color,fillOpacity:0.85,weight:2});
    },
    onEachFeature:(feat,layer)=>{
      layer.on('click',()=>seleccionarCloacaBoca(feat));
    }
  }).addTo(cloacaMap);

  // Centrar
  try{cloacaMap.fitBounds(cloacaVincLayer.getBounds(),{padding:[20,20]});}
  catch(e){if(geoData){try{cloacaMap.fitBounds(L.geoJSON(geoData).getBounds(),{padding:[20,20]});}catch(e2){cloacaMap.setView([-33.5403,-61.1221],15);}}}
}

  // Redibujar capa con nueva selección
  if(cloacaVincLayer&&cloacaMap){
    cloacaMap.removeLayer(cloacaVincLayer);
    cloacaVincLayer=L.geoJSON(geoCloacas,{
      filter:f=>f.geometry.type==='Point'&&f.properties&&f.properties.tipo!=='etiqueta',

        const h=f.properties.handle;
        const v=cloacaGeoLinks[h];const s=h===cloacaSelHandle;
        const color=s?'#e05c00':v?'#1a7a4a':'#2d5fa8';
        const size=s?8:v?6:5;
        return L.circleMarker(latlng,{radius:size,color:color,fillColor:color,fillOpacity:0.85,weight:2});
      },
      onEachFeature:(f,layer)=>layer.on('click',()=>seleccionarCloacaBoca(f))
    }).addTo(cloacaMap);
  }

  const panel=document.getElementById('cloaca-vinc-panel');

      ✓ Vinculada a: <b>${esc(recVinc.titular||recVinc.ctaTasa)}</b><br>
      <span style="font-size:10px">Cta: ${esc(recVinc.ctaTasa)} · Padrón: ${esc(recVinc.padron)}</span>
    </div>`:''}

function filtrarParcelasCloacaPanel(q){
  const sel=document.getElementById('cloaca-sel-parcela');
  if(!sel)return;
  const ql=q.toLowerCase();
  const filtradas=q?records.filter(r=>(r.titular||'').toLowerCase().includes(ql)||(r.ctaTasa||'').includes(q)||(r.padron||'').includes(q)).slice(0,80):records.slice(0,50);
  sel.innerHTML=filtradas.map(r=>`<option value="${r.id}">${esc(r.titular||r.ctaTasa)} (Cta:${esc(r.ctaTasa)} · Mz:${esc(r.manzana)} L:${esc(r.lote)})</option>`).join('');
}

function guardarCloacaVinculo(){
  const sel=document.getElementById('cloaca-sel-parcela');
  const st=document.getElementById('cloaca-vinc-status');
  if(!sel||!sel.value){if(st)st.textContent='❌ Seleccioná una parcela.';return;}
  if(!cloacaSelHandle){if(st)st.textContent='❌ No hay boca seleccionada.';return;}
  const rec=records.find(r=>r.id===sel.value);
  if(!rec){if(st)st.textContent='❌ Parcela no encontrada.';return;}

  // Si el handle no existe en geoCloacas, crear el punto automáticamente desde el centroide de la parcela
  const yaExiste=geoCloacas&&geoCloacas.features&&geoCloacas.features.some(f=>f.properties&&f.properties.handle===cloacaSelHandle);
  if(!yaExiste){
    const coords=_centroideParcelaRec(rec);
    if(!coords){
      if(st)st.textContent='❌ Esta parcela no tiene polígono en el mapa. Vinculala primero desde el módulo de Vinculación catastral.';
      return;
    }
    const nuevaFeature={
      type:'Feature',
      properties:{tipo:'conexion_domiciliaria',handle:cloacaSelHandle,layer:'Cloacas',radio_cad:0.3,generado:'sistema',titular:rec.titular,padron:rec.padron,fecha:new Date().toISOString()},
      geometry:{type:'Point',coordinates:[coords[1],coords[0]]}
    };
    if(!geoCloacas){geoCloacas={type:'FeatureCollection',name:'cloacas_alcorta',features:[]};}
    geoCloacas.features.push(nuevaFeature);
    // Persistir el GeoCloacas actualizado
    try{localStorage.setItem('catastro_geo_cloacas',JSON.stringify(geoCloacas));}catch(e){}
    subirGeoJSON('catastro_geo_cloacas',geoCloacas,'catastro_cloacas.geojson').then(()=>{});
  }

  cloacaGeoLinks[cloacaSelHandle]={parcelaId:rec.id,ctaTasa:rec.ctaTasa,titular:rec.titular,padron:rec.padron,fecha:new Date().toISOString()};
  // También actualizar el registro de la parcela — marcar tieneCloaca y guardar nroCloaca si hay handle
  if(!rec.tieneCloaca){
    const idx=records.findIndex(r=>r.id===rec.id);
    if(idx>=0){records[idx].tieneCloaca=true;if(!records[idx].nroCloaca)records[idx].nroCloaca=cloacaSelHandle;}
    saveData();
  }
  saveCloacaGeoLinks();
  if(st)st.textContent=`✅ ${yaExiste?'Vinculada':'Conexión creada y vinculada'} a ${esc(rec.titular||rec.ctaTasa)}`;
  // Redibujar mapa con el geoCloacas actualizado
  if(cloacaVincLayer&&cloacaMap){
    cloacaMap.removeLayer(cloacaVincLayer);
    cloacaVincLayer=L.geoJSON(geoCloacas,{
      filter:f=>f.geometry.type==='Point'&&f.properties&&f.properties.tipo!=='etiqueta',
      pointToLayer:(f,latlng)=>{
        const h=f.properties.handle;const v=cloacaGeoLinks[h];const s=h===cloacaSelHandle;
        const color=s?'#e05c00':v?'#1a7a4a':'#2d5fa8';const size=s?8:v?6:5;
        return L.circleMarker(latlng,{radius:size,color:color,fillColor:color,fillOpacity:0.85,weight:2});
      },
      onEachFeature:(f,layer)=>layer.on('click',()=>seleccionarCloacaBoca(f))
    }).addTo(cloacaMap);
  }
  // Actualizar panel lista derecha
  setTimeout(()=>rCloacaVincular(document.getElementById('app')),800);
}

// Crear conexión desde el botón del panel de vinculación (sin seleccionar punto en el mapa)
function crearConexionDesdePanelVinc(){
  const sel=document.getElementById('cloaca-sel-parcela');
  const st=document.getElementById('cloaca-vinc-status');
  if(!sel||!sel.value){if(st)st.textContent='❌ Primero seleccioná una parcela de la lista.';return;}
  nuevaConexionDesdeParcela(sel.value);
}

// Calcula [lat, lng] del centroide de la parcela a partir de geoLinks + geoData
function _centroideParcelaRec(rec){
  if(!rec||!geoData||!geoData.features) return null;
  const handle=geoLinks[rec.padron];
  if(!handle) return null;
  const feat=geoData.features.find(f=>f.properties&&f.properties.handle===handle);
  if(!feat) return null;
  try{
    const coords=feat.geometry.coordinates[0];
    const lats=coords.map(c=>c[1]),lons=coords.map(c=>c[0]);
    const lat=(Math.min(...lats)+Math.max(...lats))/2;
    const lon=(Math.min(...lons)+Math.max(...lons))/2;
    return [lat,lon];
  }catch(e){return null;}
}

// Crear nueva conexión domiciliaria desde la ficha sin necesidad de un punto previo en el plano
function nuevaConexionDesdeParcela(rid){
  const rec=records.find(r=>r.id===rid);
  if(!rec){alert('Parcela no encontrada.');return;}
  const coords=_centroideParcelaRec(rec);
  if(!coords){alert('Esta parcela no tiene polígono vinculado en el mapa catastral.\nPrimero vinculala en el módulo de Vinculación catastral.');return;}

  // Generar handle único para la nueva conexión
  const handle='CDN_'+Date.now().toString(36).toUpperCase();

  const nuevaFeature={
    type:'Feature',
    properties:{tipo:'conexion_domiciliaria',handle,layer:'Cloacas',radio_cad:0.3,generado:'sistema',titular:rec.titular,padron:rec.padron,fecha:new Date().toISOString()},
    geometry:{type:'Point',coordinates:[coords[1],coords[0]]}
  };
  if(!geoCloacas){geoCloacas={type:'FeatureCollection',name:'cloacas_alcorta',features:[]};}
  geoCloacas.features.push(nuevaFeature);
  try{localStorage.setItem('catastro_geo_cloacas',JSON.stringify(geoCloacas));}catch(e){}

  // Vincular automáticamente
  cloacaGeoLinks[handle]={parcelaId:rec.id,ctaTasa:rec.ctaTasa,titular:rec.titular,padron:rec.padron,fecha:new Date().toISOString()};
  saveCloacaGeoLinks();

  // Marcar tieneCloaca en el registro
  const idx=records.findIndex(r=>r.id===rid);
  if(idx>=0){
    records[idx].tieneCloaca=true;
    if(!records[idx].nroCloaca)records[idx].nroCloaca=handle;
    saveData();
    pushParcelaToDrive(records[idx],null);
  }

  // Subir geoCloacas actualizado a Drive en segundo plano
  subirGeoJSON('catastro_geo_cloacas',geoCloacas,'catastro_cloacas.geojson').then(()=>{});

  // Refrescar mapa si está abierto
  if(cloacaMap){
    if(cloacaVincLayer){try{cloacaMap.removeLayer(cloacaVincLayer);}catch(e){}}
    cloacaSelHandle=handle;
    cloacaVincLayer=L.geoJSON(geoCloacas,{
      filter:f=>f.geometry.type==='Point'&&f.properties&&f.properties.tipo!=='etiqueta',
      pointToLayer:(f,latlng)=>{
        const h=f.properties.handle;const v=cloacaGeoLinks[h];const s=h===cloacaSelHandle;
        const color=s?'#e05c00':v?'#1a7a4a':'#2d5fa8';const size=s?8:v?6:5;
        return L.circleMarker(latlng,{radius:size,color:color,fillColor:color,fillOpacity:0.85,weight:2});
      },
      onEachFeature:(f,layer)=>layer.on('click',()=>seleccionarCloacaBoca(f))
    }).addTo(cloacaMap);
    // Centrar en el nuevo punto
    cloacaMap.setView(coords,18);
  }

  // Refrescar capa parcelas en el mapa principal
  if(dashMap){
    if(dashLayers&&dashLayers.parcelas){try{dashMap.removeLayer(dashLayers.parcelas);}catch(e){}dashLayers.parcelas=null;}
    if(dashLayerVisible&&dashLayerVisible.parcelas) dashRenderParcelas();
  }

  const toast=document.createElement('div');
  toast.style.cssText='position:fixed;bottom:24px;right:24px;background:#1a6b3a;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2)';
  toast.textContent='✅ Conexión creada y dibujada en el mapa';
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(),3000);

  // Si estamos en la vista del módulo de vinculación, refrescar el panel
  setTimeout(()=>{const app=document.getElementById('app');if(app&&view==='cloaca-vincular')rCloacaVincular(app);},900);
}

function desvincularCloaca(handle){
  delete cloacaGeoLinks[handle];
  saveCloacaGeoLinks();
  cloacaSelHandle=null;
  rCloacaVincular(document.getElementById('app'));
  setTimeout(initCloacaVincMap,150);
}

  const blob=new Blob([JSON.stringify(cloacaGeoLinks,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='cloaca_vinculos_'+new Date().toISOString().slice(0,10)+'.json';a.click();
}

function dStat(num,label,color){
  return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center;border-top:3px solid ${color}">
    <div style="font-size:22px;font-weight:700;color:${color}">${num}</div>
    <div style="font-size:11px;color:var(--text3);margin-top:2px">${label}</div>

}
function dStatSmall(num,label,color){
  return `<div style="background:var(--surface2);border-radius:6px;padding:10px;text-align:center">

    <div style="font-size:10px;color:var(--text3);margin-top:2px">${label}</div>

}
function dBarra(label,val,total,color){
  const pct=total>0?Math.round(val/total*100):0;
  return `<div style="margin-bottom:6px">
    <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px">
      <span style="color:var(--text2)">${label}</span>
      <span style="color:var(--text3)">${val.toLocaleString('es')} (${pct}%)</span>
    </div>
    <div style="background:var(--border);border-radius:4px;height:10px;overflow:hidden">
      <div style="width:${pct}%;height:100%;background:${color};border-radius:4px"></div>
    </div>
  </div>`;
}

function drawCroquisDetail(r){
  const cv = document.getElementById('dcv');
  if(!cv) return;
  const ctx = cv.getContext('2d');

  // PRIORIDAD 1: GeoJSON vinculado → siempre usa la forma real del plano
  const handle = r.padron ? geoLinks[String(r.padron)] : null;
  const geoPoly = handle && geoData ? geoData.features.find(f=>f.properties.handle===handle) : null;
  if(geoPoly && geoPoly.geometry.type === 'Polygon'){
    const conv = geoPolyToCanvas(geoPoly.geometry.coordinates[0]);
    const prevLados = cLados; const prevArea = cArea;
    cLados = conv.lados; cArea = conv.area;
    // Usar calles del croquis guardado si las tiene, sino del registro
    const calles = (r.croquis && r.croquis.calles &&
      (r.croquis.calles.N||r.croquis.calles.S||r.croquis.calles.E||r.croquis.calles.O||r.croquis.calles.NE||r.croquis.calles.NO||r.croquis.calles.SE||r.croquis.calles.SO))
      ? {N:'',S:'',E:'',O:'',NE:'',NO:'',SE:'',SO:'',...r.croquis.calles} : {N:'',S:'',E:r.calle||'',O:'',NE:'',NO:'',SE:'',SO:''};
    drawCroquis(ctx, conv.pts, calles, cv.width, cv.height, r);
    cLados = prevLados; cArea = prevArea;
    return;
  }

  // PRIORIDAD 2: croquis guardado manualmente (sin GeoJSON)
  if(r.croquis && r.croquis.points && r.croquis.points.length >= 3){
    const lados = r.croquis.lados || [];
    const prevLados = cLados; const prevArea = cArea;
    cLados = lados; cArea = r.croquis.area || null;
    drawCroquis(ctx, r.croquis.points, r.croquis.calles||{}, cv.width, cv.height, r);
    cLados = prevLados; cArea = prevArea;
    return;
  }

  // Sin datos
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#aaa';
  ctx.font='12px Inter,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('Vinculá la parcela al plano catastral para ver el croquis', cv.width/2, cv.height/2);
}

      cCalles={N:'',S:'',E:'',O:'',NE:'',NO:'',SE:'',SO:'',...callesGuardadas};

      // Intentar armar calles desde campos del registro
      const calleP=r.calle||''; const entre=r.entreCalles||'';

// Convierte coords GPS [lon,lat] → canvas, calculando medidas reales de cada lado
function geoPolyToCanvas(coords_lonlat){
  if(!coords_lonlat||coords_lonlat.length<3) return {pts:iPts(), lados:[]};
  let pts=[...coords_lonlat];
  if(pts.length>1&&pts[0][0]===pts[pts.length-1][0]&&pts[0][1]===pts[pts.length-1][1]) pts.pop();

  // Calcular medidas reales de cada lado en metros
  const latMid=pts.reduce((s,p)=>s+p[1],0)/pts.length;
  const mPerLat=111000;
  const mPerLon=111000*Math.cos(Math.PI*latMid/180);
  const lados=pts.map((_,i)=>{
    const a=pts[i], b=pts[(i+1)%pts.length];
    const dx=(b[0]-a[0])*mPerLon, dy=(b[1]-a[1])*mPerLat;
    return Math.round(Math.sqrt(dx*dx+dy*dy)*100)/100;
  });

  // Calcular área real (Shoelace)
  let area=0;
  for(let i=0;i<pts.length;i++){
    const j=(i+1)%pts.length;
    area+=(pts[i][0]*mPerLon)*(pts[j][1]*mPerLat)-(pts[j][0]*mPerLon)*(pts[i][1]*mPerLat);
  }
  area=Math.round(Math.abs(area)/2*10)/10;

  // Bounding box
  const lons=pts.map(p=>p[0]), lats=pts.map(p=>p[1]);
  const minLon=Math.min(...lons), maxLon=Math.max(...lons);
  const minLat=Math.min(...lats), maxLat=Math.max(...lats);
  const dLon=maxLon-minLon||0.00001, dLat=maxLat-minLat||0.00001;

  // Canvas 340x280 margen 35px
  const CW=340, CH=280, M=35;
  const W=CW-M*2, H=CH-M*2;
  const latRad=Math.cos(Math.PI*latMid/180);
  const aspGeo=(dLon*latRad)/dLat;
  const aspCv=W/H;
  let scaleX,scaleY,offX=M,offY=M;
  if(aspGeo>aspCv){
    scaleX=W/dLon; scaleY=(W/aspGeo)/dLat; offY=M+(H-dLat*scaleY)/2;
  }else{
    scaleY=H/dLat; scaleX=(H*aspGeo)/dLon; offX=M+(W-dLon*scaleX)/2;
  }

  const canvasPts=pts.map(p=>({
    x:Math.round(offX+(p[0]-minLon)*scaleX),
    y:Math.round(offY+(maxLat-p[1])*scaleY)
  }));

  return {pts:canvasPts, lados, area};
}

// ── CROQUIS MEJORADO ─────────────────────────────────────────────────────────
let cvTool = 'move'; // move | add | del
let selPtIdx = -1;

function setTool(t){
  cvTool = t;
  ['move','add','del'].forEach(id=>{
    const btn=document.getElementById('tb-'+id);
    if(btn) btn.className='tool-btn'+(t===id?' active':'');
  });
  const hints={move:'✥ Mover: arrastrá los puntos azules',add:'＋ Agregar: hacé click donde querés el nuevo punto',del:'✕ Borrar: hacé click en el punto a eliminar'};
  const h=document.getElementById('croquis-hint');if(h)h.textContent=hints[t]||''
  if(cvEl) cvEl.className = t==='move'?'mode-move':'';
}

function setShape(shape){
  const W=cvEl?cvEl.width:340, H=cvEl?cvEl.height:280;
  const m=30, hw=(W-m*2)/2, hh=(H-m*2)/2;
  if(shape==='rect'){
    cPts=[{x:m,y:m},{x:W-m,y:m},{x:W-m,y:H-m},{x:m,y:H-m}];
  } else if(shape==='l'){
    cPts=[{x:m,y:m},{x:m+hw,y:m},{x:m+hw,y:m+hh},{x:W-m,y:m+hh},{x:W-m,y:H-m},{x:m,y:H-m}];
  } else if(shape==='t'){
    const tw=hw*0.6;
    cPts=[{x:m+hw-tw,y:m},{x:m+hw+tw,y:m},{x:m+hw+tw,y:m+hh},{x:W-m,y:m+hh},{x:W-m,y:H-m},{x:m,y:H-m},{x:m,y:m+hh},{x:m+hw-tw,y:m+hh}];
  }
  selPtIdx=-1; redraw(); updatePtList();
}

function initCv(){
  cvEl=document.getElementById('cv'); if(!cvEl)return;
  cvCtx=cvEl.getContext('2d');
  // Si los puntos vienen del GeoJSON y no hay calles cargadas, intentar detectarlas
  if(cLados.length>0 && editId){
    const r=records.find(x=>x.id===editId);
    if(r&&r.croquis&&r.croquis.calles){
      cCalles={...r.croquis.calles};
      // Actualizar inputs si están visibles
      ['N','S','E','O'].forEach(d=>{const el=document.getElementById('c'+d);if(el)el.value=cCalles[d]||''});
    }
  }
  redraw(); updatePtList();

  // MOUSE
  cvEl.addEventListener('mousedown', e=>{
    e.preventDefault();
    const p=cpos(e);
    if(cvTool==='move'||cvTool==='del'||cvTool==='add'){
      // Buscar punto cercano
      const idx=cPts.findIndex(q=>Math.hypot(q.x-p.x,q.y-p.y)<14);
      if(cvTool==='move'){
        drag = idx>=0 ? idx : -1;
        if(drag>=0){selPtIdx=drag; redraw();}
      } else if(cvTool==='del'){
        if(idx>=0 && cPts.length>3){delPt(idx);}
      } else if(cvTool==='add'){
        // Insertar punto en el segmento más cercano al click
        let best=-1, bestD=Infinity;
        for(let i=0;i<cPts.length;i++){
          const a=cPts[i], b=cPts[(i+1)%cPts.length];
          const d=ptSegDist(p,a,b);
          if(d<bestD){bestD=d; best=i;}
        }
        if(best>=0){
          cPts.splice(best+1,0,{x:Math.round(p.x),y:Math.round(p.y)});
          selPtIdx=best+1; redraw(); updatePtList();
        }
      }
    }
  });

  cvEl.addEventListener('mousemove', e=>{
    if(drag<0||cvTool!=='move') return;
    const p=cpos(e);
    cPts[drag]={x:cl(p.x,8,cvEl.width-8), y:cl(p.y,8,cvEl.height-8)};
    redraw(); updatePtList();
  });

  cvEl.addEventListener('mouseup', ()=>{drag=-1;});
  cvEl.addEventListener('mouseleave', ()=>{drag=-1;});

  // TOUCH
  cvEl.addEventListener('touchstart', e=>{
    e.preventDefault();
    const p=tpos(e.touches[0]);
    const idx=cPts.findIndex(q=>Math.hypot(q.x-p.x,q.y-p.y)<20);
    if(cvTool==='move'){ drag=idx>=0?idx:-1; if(drag>=0){selPtIdx=drag;redraw();} }
    else if(cvTool==='del'){ if(idx>=0&&cPts.length>3) delPt(idx); }
    else if(cvTool==='add'){
      let best=-1,bestD=Infinity;
      for(let i=0;i<cPts.length;i++){
        const a=cPts[i],b=cPts[(i+1)%cPts.length];
        const d=ptSegDist(p,a,b);
        if(d<bestD){bestD=d;best=i;}
      }
      if(best>=0){cPts.splice(best+1,0,{x:Math.round(p.x),y:Math.round(p.y)});selPtIdx=best+1;redraw();updatePtList();}
    }
  },{passive:false});

  cvEl.addEventListener('touchmove', e=>{
    e.preventDefault();
    if(drag<0||cvTool!=='move') return;
    const p=tpos(e.touches[0]);
    cPts[drag]={x:cl(p.x,8,cvEl.width-8), y:cl(p.y,8,cvEl.height-8)};
    redraw(); updatePtList();
  },{passive:false});

  cvEl.addEventListener('touchend', ()=>{drag=-1;});
  setTool('move');
}

function ptSegDist(p,a,b){
  const dx=b.x-a.x, dy=b.y-a.y;
  const t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1)));
  return Math.hypot(p.x-a.x-t*dx, p.y-a.y-t*dy);
}

function selPt(i){
  selPtIdx=i; redraw();
  document.querySelectorAll('.pt-item').forEach((el,j)=>el.classList.toggle('selected',j===i));
}

function delPt(i){
  if(cPts.length<=3){alert('Mínimo 3 puntos.');return;}
  cPts.splice(i,1);
  if(selPtIdx>=cPts.length) selPtIdx=cPts.length-1;
  redraw(); updatePtList();
}

function updatePtList(){
  const el=document.getElementById('pt-list');
  if(!el)return;
  el.innerHTML=cPts.map((p,i)=>`<div class="pt-item${i===selPtIdx?' selected':''}" id="pti-${i}" onclick="selPt(${i})"><span>P${i+1} (${Math.round(p.x)}, ${Math.round(p.y)})</span><button class="pt-del" onclick="delPt(${i});event.stopPropagation()">×</button></div>`).join('');
}

function cpos(e){const r=cvEl.getBoundingClientRect();const sx=cvEl.width/r.width;const sy=cvEl.height/r.height;return{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy};}
function tpos(t){const r=cvEl.getBoundingClientRect();const sx=cvEl.width/r.width;const sy=cvEl.height/r.height;return{x:(t.clientX-r.left)*sx,y:(t.clientY-r.top)*sy};}
function cl(v,a,b){return Math.max(a,Math.min(b,v));}

function redraw(){
  if(!cvEl||!cvCtx)return;
  const rec={medNorte:g2('f-medNorte'),medSur:g2('f-medSur'),medEste:g2('f-medEste'),medOeste:g2('f-medOeste'),superficie:g2('f-superficie')};
  drawCroquis(cvCtx,cPts,cCalles,cvEl.width,cvEl.height,rec,selPtIdx);
}

function g2(id){const el=document.getElementById(id);return el?el.value:'';}

function drawCroquis(ctx,pts,cls,w,h,rec,selIdx){
  ctx.clearRect(0,0,w,h);
  if(!pts||pts.length<3)return;
  // Relleno
  ctx.fillStyle='rgba(45,95,168,0.08)';
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
  ctx.closePath();ctx.fill();
  // Borde
  ctx.strokeStyle='#2d5fa8';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
  ctx.closePath();ctx.stroke();
  // Medidas reales en los lados (usa cLados si están disponibles, sino calcula desde GeoJSON o en metros reales)
  const useLados = typeof cLados !== 'undefined' && cLados && cLados.length === pts.length;
  // Si no hay cLados pero hay GeoJSON vinculado, calcular medidas reales automáticamente
  let ladosCalculados = [];
  if(!useLados && rec && rec.padron){
    const handle = typeof geoLinks!=='undefined' ? geoLinks[String(rec.padron)] : null;
    const feat = handle && typeof geoData!=='undefined' && geoData ? geoData.features.find(f=>f.properties.handle===handle) : null;
    if(feat && feat.geometry.type==='Polygon'){
      const coords = feat.geometry.coordinates[0];
      const latMid = coords.reduce((s,c)=>s+c[1],0)/coords.length;
      const mPerLat=111000, mPerLon=111000*Math.cos(Math.PI*latMid/180);
      const ptsGeo = coords.slice(0,-1);
      for(let i=0;i<ptsGeo.length;i++){
        const a=ptsGeo[i], b=ptsGeo[(i+1)%ptsGeo.length];
        const dx=(b[0]-a[0])*mPerLon, dy=(b[1]-a[1])*mPerLat;
        ladosCalculados.push(Math.round(Math.sqrt(dx*dx+dy*dy)*100)/100);
      }
    }
  }
  const lados = useLados ? cLados : (ladosCalculados.length===pts.length ? ladosCalculados : null);

  for(let i=0;i<pts.length;i++){
    const a=pts[i], b=pts[(i+1)%pts.length];
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const lenPx=Math.hypot(b.x-a.x,b.y-a.y);
    if(lenPx<20) continue;
    const ang=Math.atan2(b.y-a.y,b.x-a.x);
    const label = lados ? lados[i].toFixed(2)+' m' : null;
    if(!label) continue; // No mostrar nada si no hay medidas reales
    const nx=Math.sin(ang)*-10, ny=Math.cos(ang)*10;
    ctx.save();
    ctx.translate(mx+nx, my-ny);
    ctx.rotate(ang > Math.PI/2 || ang < -Math.PI/2 ? ang+Math.PI : ang);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='bold 9px IBM Plex Mono,monospace';
    const tw=ctx.measureText(label).width+4;
    ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.fillRect(-tw/2,-7,tw,14);
    ctx.fillStyle='#1a5c8a'; ctx.fillText(label,0,0);
    ctx.restore();
  }
  // Calles en los 8 puntos cardinales
  const cx=pts.reduce((s,p)=>s+p.x,0)/pts.length;
  const cy=pts.reduce((s,p)=>s+p.y,0)/pts.length;
  if(cls){
    const top=pts.reduce((a,b)=>a.y<b.y?a:b);
    const bot=pts.reduce((a,b)=>a.y>b.y?a:b);
    const left=pts.reduce((a,b)=>a.x<b.x?a:b);
    const right=pts.reduce((a,b)=>a.x>b.x?a:b);
    // Cardinales principales
    if(cls.N) lbl(ctx,(top.x+cx)/2, Math.max(14,top.y-18), cls.N, rec.medNorte);
    if(cls.S) lbl(ctx,(bot.x+cx)/2, Math.min(h-4,bot.y+20), cls.S, rec.medSur);
    if(cls.O) lbl(ctx, Math.max(40,left.x-12), (left.y+cy)/2, cls.O, rec.medOeste);
    if(cls.E) lbl(ctx, Math.min(w-40,right.x+12), (right.y+cy)/2, cls.E, rec.medEste);
    // Cardinales intermedios — esquinas del polígono
    const topLeft  = pts.reduce((a,b)=>(a.x+a.y)<(b.x+b.y)?a:b);
    const topRight = pts.reduce((a,b)=>(-a.x+a.y)<(-b.x+b.y)?a:b);
    const botLeft  = pts.reduce((a,b)=>(a.x-a.y)<(b.x-b.y)?a:b);
    const botRight = pts.reduce((a,b)=>(a.x+a.y)>(b.x+b.y)?a:b);
    if(cls.NO) lbl(ctx, Math.max(44,topLeft.x-10),  Math.max(14,topLeft.y-14),  cls.NO, null);
    if(cls.NE) lbl(ctx, Math.min(w-44,topRight.x+10), Math.max(14,topRight.y-14), cls.NE, null);
    if(cls.SO) lbl(ctx, Math.max(44,botLeft.x-10),  Math.min(h-4,botLeft.y+16),  cls.SO, null);
    if(cls.SE) lbl(ctx, Math.min(w-44,botRight.x+10), Math.min(h-4,botRight.y+16), cls.SE, null);
  }
  // Área real (desde cArea si existe, sino desde rec.superficie)
  const areaLabel = (typeof cArea !== 'undefined' && cArea) ? cArea.toLocaleString('es')+' m²' 
                    : (rec&&rec.superficie ? rec.superficie+' m²' : null);
  if(areaLabel){
    ctx.save();
    ctx.fillStyle='rgba(255,255,255,0.85)';
    const tw2=ctx.measureText(areaLabel).width+8;
    ctx.fillRect(cx-tw2/2,cy-9,tw2,18);
    ctx.fillStyle='#1a1916';ctx.font='bold 11px IBM Plex Mono,monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(areaLabel,cx,cy);
    ctx.restore();
  }
  // Puntos
  pts.forEach((p,i)=>{
    const isSel=i===selIdx;
    ctx.beginPath();ctx.arc(p.x,p.y,isSel?8:6,0,Math.PI*2);
    ctx.fillStyle=isSel?'#e05c00':'#2d5fa8';ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    // Número
    ctx.fillStyle='#fff';ctx.font='bold 8px sans-serif';ctx.textAlign='center';
    ctx.fillText(i+1,p.x,p.y+3);
  });
}

function lbl(ctx,x,y,calle,med){
  ctx.fillStyle='#2d5fa8';ctx.font='bold 10px IBM Plex Sans,sans-serif';ctx.textAlign='center';
  ctx.fillText(calle.toUpperCase(),x,y);
  if(med){ctx.fillStyle='#6b6860';ctx.font='9px IBM Plex Mono,monospace';ctx.fillText(med+'m',x,y+12);}
}

  if(!data.features||!data.features.length){alert('El GeoJSON no tiene features.');st.textContent='';return;}
  try{

function forzarDescargaGeoCloacas(){

    if(st) st.textContent='⚠️ Drive no configurado. Configurá la URL del Apps Script en la sección de arriba primero.';
    return;
  }
  if(st) st.textContent='⏳ Descargando plano de cloacas desde Drive...';

  localStorage.removeItem('catastro_geo_version_catastro_geo_cloacas');
  bajarGeoJSON('catastro_cloacas.geojson','catastro_geo_cloacas',(ok,data)=>{
    if(ok&&data){
      geoCloacas=data;
      // Destruir mapa para que se redibuje con los datos nuevos
      if(cloacaMap){try{cloacaMap.remove();}catch(e){}cloacaMap=null;}

function addCloacasLayer(){
  if(!leafMap||!geoCloacas)return;
  if(cloacasLayer){leafMap.removeLayer(cloacasLayer);cloacasLayer=null;}
  cloacasLayer=L.geoJSON(geoCloacas,{
    onEachFeature:(f,layer)=>{
      layer.on('click',e=>{L.DomEvent.stopPropagation(e);if(isAdmin)abrirAsignadorCloacaDesdeGeo(f);});
      const p=f.properties||{};
      const nro=p.nro||p.label||p.nombre||p.handle||'';
      if(nro)layer.bindTooltip(String(nro),{permanent:false,className:'leaflet-tooltip',direction:'top'});
    },
    style:feat=>{
      const t=feat.properties.tipo;
      if(t==='colector') return {color:'#1a7a4a',weight:3,opacity:0.9};
      return {color:'#1a7a4a',weight:1};
    },
    pointToLayer:(feat,latlng)=>{
      const t=feat.properties.tipo;
      if(t==='etiqueta'){
        return L.marker(latlng,{
          icon:L.divIcon({
            className:'',
            html:'<div style="font-size:9px;color:#1a7a4a;font-weight:600;white-space:nowrap;background:rgba(255,255,255,0.8);padding:1px 3px;border-radius:2px">'+feat.properties.texto+'</div>',
            iconAnchor:[0,0]
          })
        });
      }
      const color=t==='boca_inspeccion'?'#1a7a4a':'#e05c00';
      const size=t==='boca_inspeccion'?10:7;
      return L.circleMarker(latlng,{radius:size/2,color:color,fillColor:color,fillOpacity:0.8,weight:2});
    },
    onEachFeature:(feat,layer)=>{
      const t=feat.properties.tipo;
      if(t==='etiqueta')return;
      const label=t==='boca_inspeccion'?'Boca de inspección':t==='conexion_domiciliaria'?'Conexión domiciliaria':'Colector';
      layer.bindPopup('<b>'+label+'</b><br>Handle: '+feat.properties.handle);
    }
  }).addTo(leafMap);
}

// ── DIAGNÓSTICO DEL MAPA ──────────────────────────────────────────────────────
function diagnosticarMapa(){
  const lineas=[];

  const geo_ok=!!(geoData&&geoData.features&&geoData.features.length>0);
  lineas.push('GeoJSON: '+(geo_ok?'✅ '+geoData.features.length+' parcelas':'❌ NO cargado'));
  lineas.push('Vínculos: '+Object.keys(geoLinks).length);
  lineas.push('Leaflet: '+(leafMap?'✅':'❌'));
  lineas.push('parcelLayer: '+(parcelLayer?'✅':'❌ null — las parcelas no se agregan al mapa'));

  if(geo_ok){
    const f0=geoData.features[0];
    const coords=f0.geometry&&f0.geometry.coordinates&&f0.geometry.coordinates[0];
    if(coords&&coords.length>0){
      const s=coords[0];
      const esGPS=Math.abs(s[0])<=180&&Math.abs(s[1])<=90;
      lineas.push('Coord[0]: '+s[0].toFixed(3)+', '+s[1].toFixed(3));
      lineas.push(esGPS?'Sistema: ✅ GPS válido':'Sistema: ❌ CAD (no GPS)');
      lineas.push('Handle[0]: '+f0.properties.handle);
    }
  }

  if(curRec&&curRec.padron){
    const handle=geoLinks[String(curRec.padron)];
    lineas.push('Padrón: '+curRec.padron+' → handle: '+(handle||'sin vínculo'));
    if(handle&&geoData){
      const feat=geoData.features.find(f=>f.properties.handle===handle);
      lineas.push('Feature handle '+handle+': '+(feat?'✅ encontrada':'❌ NO encontrada en GeoJSON'));
    }
  }

  if(parcelLayer){
    try{
      const b=parcelLayer.getBounds();
      if(b.isValid()){
        const c=b.getCenter();
        lineas.push('Centro GeoJSON: '+c.lat.toFixed(5)+', '+c.lng.toFixed(5));
        lineas.push('BBox: '+b.toBBoxString());
      } else { lineas.push('Bounds: inválidos'); }
    }catch(e){lineas.push('Bounds: error — '+e.message);}
  }

  // Panel flotante DENTRO del contenedor del mapa — no depende de map-status
  const mapEl=document.getElementById('parcel-map');
  if(mapEl){
    // Eliminar panel anterior si existe
    const prev=document.getElementById('diag-panel');
    if(prev) prev.remove();

    const panel=document.createElement('div');
    panel.id='diag-panel';
    panel.style.cssText='position:absolute;top:10px;right:10px;z-index:9999;background:rgba(255,251,235,0.97);border:2px solid #f59e0b;border-radius:8px;padding:12px 14px;font-size:11px;font-family:monospace;line-height:1.8;color:#1a1a1a;max-width:320px;box-shadow:0 4px 16px rgba(0,0,0,0.25);white-space:pre;cursor:pointer';
    panel.title='Click para cerrar';
    panel.textContent=lineas.join('\n');
    panel.onclick=()=>panel.remove();
    // El contenedor del mapa necesita position:relative para que absolute funcione
    mapEl.style.position='relative';
    mapEl.appendChild(panel);
  }

  console.log(lineas.join('\n'));
}

// ── MAPA ─────────────────────────────────────────────────────────────────────
const ESTILO_NORMAL={color:'#2d5fa8',weight:1,fillColor:'#e8eef8',fillOpacity:0.35};
const ESTILO_VINCULADO={color:'#e05c00',weight:3,fillColor:'#fdf3e3',fillOpacity:0.75};

function maybeInitMap(){
  // Si el mapa ya está inicializado, no reiniciar
  if(leafMap) return;
  if(typeof L==='undefined'){setTimeout(maybeInitMap,200);return;}
  const el=document.getElementById('parcel-map');
  if(!el){setTimeout(maybeInitMap,200);return;}
  if(view==='detail'&&curRec&&geoData){
    const handle=curRec.padron?String(geoLinks[String(curRec.padron)]||''):'';
    initMap(curRec, handle);
  }
}

function _forzarInvalidateSize(intentos){
  if(!leafMap)return;
  try{leafMap.invalidateSize({animate:false,pan:false});}catch(e){}
  if(intentos>0) setTimeout(()=>_forzarInvalidateSize(intentos-1),300);
}

function initMap(rec, handleExplicito){
  if(typeof L==='undefined'){
    if(!document.getElementById('leaflet-js')){
      const s=document.createElement('script');
      s.id='leaflet-js';
      s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      s.onload=()=>setTimeout(()=>initMap(rec,handleExplicito),300);
      document.head.appendChild(s);
    } else {
      setTimeout(()=>initMap(rec,handleExplicito),300);
    }
    return;
  }
  if(leafMap){ try{leafMap.off();leafMap.remove();}catch(e){} leafMap=null;parcelLayer=null;curParcelLayer=null;satelliteLayer=null;streetsLayer=null; }

  const el=document.getElementById('parcel-map');
  if(!el) return;
  el.style.height='360px'; el.style.width='100%'; el.style.display='block';

  const handle=String(handleExplicito||'');
  let lat=-33.540298, lon=-61.122064, zoom=17;
  let featVinculada=null;

  if(handle&&geoData&&geoData.features){
    featVinculada=geoData.features.find(f=>String(f.properties.handle)===handle);
    if(featVinculada){
      const coords=featVinculada.geometry.coordinates[0];
      const lons=coords.map(c=>c[0]),lats=coords.map(c=>c[1]);
      lat=(Math.min(...lats)+Math.max(...lats))/2;
      lon=(Math.min(...lons)+Math.max(...lons))/2;
      zoom=19;
      console.log('[initMap] handle='+handle+' lat='+lat.toFixed(5)+' lon='+lon.toFixed(5));
    } else { console.warn('[initMap] handle "'+handle+'" no encontrado'); }
  } else { console.log('[initMap] sin handle, Alcorta zoom 17'); }

  streetsLayer=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:20});
  satelliteLayer=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:20});

  leafMap=L.map(el,{center:[lat,lon],zoom:zoom,layers:[useSat?satelliteLayer:streetsLayer],preferCanvas:true,fadeAnimation:false,zoomAnimation:false,markerZoomAnimation:false});

  // Mostrar debug en pantalla
  const dbg=document.getElementById('map-debug');
  if(dbg){
    dbg.style.display='block';
    dbg.textContent='handle='+handle+' | lat='+lat.toFixed(4)+' lon='+lon.toFixed(4)+' zoom='+zoom+' | features='+(geoData&&geoData.features?geoData.features.length:0)+' | leafMap='+(leafMap?'ok':'null')+' | embebido='+(typeof GEOJSON_EMBEBIDO!=='undefined'?GEOJSON_EMBEBIDO.features.length:0);
  }

  try{_inyectarParcelasDibujadas();}catch(e){}
  if(geoData&&geoData.features&&geoData.features.length>0){
    parcelLayer=L.geoJSON(geoData,{
      style:()=>({color:'#1d4ed8',weight:1.5,fillColor:'#bfdbfe',fillOpacity:0.3,opacity:0.9}),
      onEachFeature:(feat,layer)=>{
        layer.on('click',e=>{
          if(drawModo){ onDrawClick(e); return; } // en modo dibujo, click sobre la parcela = vértice
          if(polySearchActive){ return; } // dejar que el evento llegue al mapa para polySearch
          L.DomEvent.stopPropagation(e);
          if(vincModo)confirmarVinculacion(feat.properties.handle,layer);
          else{const s=document.getElementById('map-status');if(s)s.textContent='Handle: '+feat.properties.handle;}
        });
        layer.on('mouseover',()=>{if(vincModo)layer.setStyle({fillColor:'#fef3c7',fillOpacity:0.9,color:'#ea580c',weight:2});});
        layer.on('mouseout',()=>{if(!vincModo)return;layer.setStyle({color:'#1d4ed8',weight:1.5,fillColor:'#bfdbfe',fillOpacity:0.3});});
      }
    }).addTo(leafMap);
    console.log('[initMap] parcelLayer ok: '+geoData.features.length+' features');
    if(dbg) dbg.textContent += ' | parcel=ok('+geoData.features.length+')';
  }

  if(featVinculada){
    curParcelLayer=L.geoJSON(featVinculada,{style:{color:'#ea580c',weight:3,fillColor:'#fde047',fillOpacity:0.9},interactive:false}).addTo(leafMap);
    console.log('[initMap] parcela vinculada pintada en amarillo');
  }

  actualizarInfoBar(rec);
  if(showCloacas&&geoCloacas) addCloacasLayer();
  if(drawnItems) try{leafMap.removeLayer(drawnItems);}catch(e){}
  drawnItems=new L.FeatureGroup().addTo(leafMap);
  parcelasNuevas.forEach(p=>{L.polygon(p.latlngs,{color:'#ea580c',fillColor:'#fde047',fillOpacity:0.5,weight:2}).bindPopup('<b>Nueva parcela</b><br>'+p.nota).addTo(drawnItems);});
}

function resaltarHandle(handle,doZoom){
  if(!leafMap||!geoData)return;
  if(curParcelLayer){try{leafMap.removeLayer(curParcelLayer);}catch(e){}curParcelLayer=null;}
  const feat=geoData.features.find(f=>String(f.properties.handle)===String(handle));
  if(!feat)return;
  curParcelLayer=L.geoJSON(feat,{style:{color:'#e05c00',weight:3,fillColor:'#ffd166',fillOpacity:0.9},interactive:false}).addTo(leafMap);
  if(doZoom){
    const coords=feat.geometry.coordinates[0];

  }

// ── DIBUJO DE NUEVAS PARCELAS ────────────────────────────────────────────────
let drawHandler=null;
let drawModo=false;
let drawPuntos=[];
let drawPolyline=null;
let drawPolygonTemp=null;
let drawMarkers=[];

function onDrawClick(e){
  if(!drawModo) return;
  L.DomEvent.stopPropagation(e);
  drawPuntos.push([e.latlng.lat, e.latlng.lng]);
  // Marcador en el vértice
  const mk=L.circleMarker(e.latlng,{radius:5,color:'#e05c00',fillColor:'#fff',fillOpacity:1,weight:2,interactive:false}).addTo(leafMap);
  drawMarkers.push(mk);
  // Actualizar línea
  if(drawPolyline) leafMap.removeLayer(drawPolyline);
  if(drawPuntos.length>1){
    drawPolyline=L.polyline(drawPuntos,{color:'#e05c00',weight:2,dashArray:'6,4',interactive:false}).addTo(leafMap);
  }
  const st=document.getElementById('map-status');
  if(st) st.textContent='✏️ '+drawPuntos.length+' vértice'+( drawPuntos.length===1?'':'s')+' — Doble click para cerrar el polígono';
}

function onDrawDblClick(e){
  if(!drawModo) return;
  L.DomEvent.stopPropagation(e);
  try{L.DomEvent.preventDefault(e);}catch(_){}
  // El doble-click dispara 2 clicks previos que agregan vértices repetidos: los quitamos.
  _dedupeUltimosVertices();
  finalizarDraw();
}

// Quita del final los vértices repetidos/casi idénticos (los que mete el doble-click)
function _dedupeUltimosVertices(){
  const cerca=(a,b)=>Math.abs(a[0]-b[0])<1e-6 && Math.abs(a[1]-b[1])<1e-6;
  while(drawPuntos.length>=2 && cerca(drawPuntos[drawPuntos.length-1],drawPuntos[drawPuntos.length-2])){
    drawPuntos.pop();
    const mk=drawMarkers.pop(); if(mk){try{leafMap.removeLayer(mk);}catch(e){}}
  }
}

// Cierra el polígono (lo usa el botón "Cerrar polígono" y el doble-click)
function finalizarDraw(){
  if(!drawModo) return;
  if(drawPuntos.length<3){
    alert('Necesitás al menos 3 vértices para cerrar el polígono. Marcá más puntos en el mapa.');
    return;
  }
  const latlngs=[...drawPuntos];
  const padron=curRec?String(curRec.padron):'';
  const handle='DIV_'+Date.now();
  // Guardar el dibujo (persiste local y se sincroniza dentro del backup como parcelasNuevas)
  const np={id:'np_'+Date.now(), handle, padron, latlngs, nota:'División de padrón '+padron, fecha:new Date().toISOString(), padronOrigen:padron};
  parcelasNuevas.push(np);
  try{localStorage.setItem('catastro_parcelas_nuevas',JSON.stringify(parcelasNuevas));}catch(e){}
  // Convertir el dibujo en una PARCELA REAL del mapa (feature con handle) para poder vincularla
  const feature=_dibujoAFeature(np);
  if(geoData&&geoData.features) geoData.features.push(feature);
  if(parcelLayer){ try{parcelLayer.addData(feature);}catch(e){} }
  // Vincular automáticamente el padrón activo a ESTA parcela dibujada (no al terreno entero)
  let msg='✅ Parcela dibujada ('+latlngs.length+' vértices).';
  if(padron){
    geoLinks[padron]=handle;
    saveGeoLinks();
    if(DRIVE_API_URL&&DRIVE_TOKEN) pushGeoLinkToDrive(padron, handle);
    msg='✅ Dibujada y vinculada al padrón '+padron+' (solo el pedazo dibujado, no el terreno entero).';
    try{ if(_agregarLoteAManzana(handle, curRec?curRec.manzana:'')) msg+=' Agregada a la Mz '+String(curRec.manzana||'').trim()+'.'; }catch(e){}
  }
  cancelarDraw();
  if(handle) try{resaltarHandle(handle,true);}catch(e){}
  const st=document.getElementById('map-status');
  if(st) st.textContent=msg;
}

// Convierte un dibujo (con latlngs [lat,lng]) en un Feature GeoJSON con handle
function _dibujoAFeature(np){
  const ring=(np.latlngs||[]).map(p=>[p[1],p[0]]); // GeoJSON usa [lng,lat]
  if(ring.length && (ring[0][0]!==ring[ring.length-1][0]||ring[0][1]!==ring[ring.length-1][1])) ring.push(ring[0]);
  return {type:'Feature',properties:{handle:np.handle,dibujada:true,padron:np.padron||''},geometry:{type:'Polygon',coordinates:[ring]}};
}

// Inyecta las parcelas dibujadas en geoData para que sigan vinculables tras recargar
function _inyectarParcelasDibujadas(){
  if(!geoData||!geoData.features||!Array.isArray(parcelasNuevas)) return;
  const existentes=new Set(geoData.features.map(f=>f&&f.properties&&f.properties.handle));
  parcelasNuevas.forEach(np=>{
    if(np&&np.handle&&np.latlngs&&np.latlngs.length>=3&&!existentes.has(np.handle)){
      geoData.features.push(_dibujoAFeature(np));
      existentes.add(np.handle);
    }
  });
}

// Agrega el handle de una parcela dibujada a su manzana (por número de manzana)
function _agregarLoteAManzana(handle, mzNumRaw){
  const mzNum=String(mzNumRaw||'').trim();
  if(!mzNum||!Array.isArray(mzData)) return false;
  const mz=mzData.find(m=>String(mzLinks[m.handle]||'').trim()===mzNum);
  if(!mz) return false;
  if(!Array.isArray(mz.lotes)) mz.lotes=[];
  if(!mz.lotes.includes(handle)){
    mz.lotes.push(handle);
    try{localStorage.setItem(MZ_DATA_KEY,JSON.stringify(mzData));}catch(e){}
  }
  return true;
}

// Borra el dibujo de la parcela del padrón activo (para rehacer si te equivocaste)
function borrarDibujoActual(){
  if(drawModo) cancelarDraw();
  if(!curRec||!curRec.padron){alert('Abrí primero el padrón cuyo dibujo querés borrar.');return;}
  const padron=String(curRec.padron);
  const handle=geoLinks[padron];
  let idx=parcelasNuevas.findIndex(np=>np&&(np.handle===handle||(np.padron&&String(np.padron)===padron)));
  const h=handle||(idx>=0?parcelasNuevas[idx].handle:'');
  if(!h && idx<0){alert('Esta parcela no tiene un dibujo para borrar.');return;}
  if(!confirm('¿Borrar el dibujo de la parcela del padrón '+padron+'?\nSe quita el polígono, su vínculo y su lugar en la manzana.'))return;
  // 1) parcelasNuevas
  if(idx>=0) parcelasNuevas.splice(idx,1);
  if(h) parcelasNuevas=parcelasNuevas.filter(np=>!(np&&np.handle===h));
  try{localStorage.setItem('catastro_parcelas_nuevas',JSON.stringify(parcelasNuevas));}catch(e){}
  // 2) feature del plano
  if(h&&geoData&&geoData.features){ geoData.features=geoData.features.filter(f=>!(f.properties&&f.properties.handle===h)); }
  // 3) capa del mapa
  if(h&&parcelLayer){ try{parcelLayer.eachLayer(l=>{ if(l.feature&&l.feature.properties&&l.feature.properties.handle===h) parcelLayer.removeLayer(l); });}catch(e){} }
  if(curParcelLayer){try{leafMap.removeLayer(curParcelLayer);}catch(e){}curParcelLayer=null;}
  // 4) manzana
  if(h&&Array.isArray(mzData)){ let toc=false; mzData.forEach(mz=>{ if(Array.isArray(mz.lotes)&&mz.lotes.includes(h)){ mz.lotes=mz.lotes.filter(x=>x!==h); toc=true; } }); if(toc){try{localStorage.setItem(MZ_DATA_KEY,JSON.stringify(mzData));}catch(e){}} }
  // 5) vínculo
  if(geoLinks[padron]===h){ delete geoLinks[padron]; saveGeoLinks(); if(DRIVE_API_URL&&DRIVE_TOKEN) pushGeoLinkToDrive(padron,''); }
  if(leafMap) try{leafMap.setView([-33.5403,-61.1221],16);}catch(e){}
  const st=document.getElementById('map-status'); if(st) st.textContent='🗑 Dibujo borrado del padrón '+padron+'. Podés volver a dibujarlo.';
  alert('✅ Dibujo borrado. Ya podés dibujarlo de nuevo.');
}

function toggleDraw(){
  if(!leafMap){alert('El mapa no cargó todavía.');return;}
  if(drawModo){cancelarDraw();return;}
  drawModo=true;
  drawPuntos=[];
  drawPolyline=null;
  const btn=document.getElementById('btn-draw');
  if(btn){btn.textContent='✏️ Cancelar dibujo';btn.style.background='#c0392b';btn.style.borderColor='#c0392b';}
  const hint=document.getElementById('draw-hint');if(hint)hint.style.display='block';
  leafMap.getContainer().style.cursor='crosshair';
  try{leafMap.doubleClickZoom.disable();}catch(e){} // el doble-click cierra el polígono, no hace zoom
  // Escuchar clicks en el mapa para agregar vértices (cerrar solo con el botón "Cerrar polígono")
  leafMap.on('click', onDrawClick);
}

function cancelarDraw(){
  drawModo=false;
  drawPuntos=[];
  if(drawPolyline){try{leafMap.removeLayer(drawPolyline);}catch(e){}drawPolyline=null;}
  if(drawPolygonTemp){try{leafMap.removeLayer(drawPolygonTemp);}catch(e){}drawPolygonTemp=null;}
  drawMarkers.forEach(m=>{try{leafMap.removeLayer(m);}catch(e){}});
  drawMarkers=[];
  leafMap.off('click', onDrawClick);
  leafMap.off('dblclick', onDrawDblClick);
  try{leafMap.doubleClickZoom.enable();}catch(e){}
  if(leafMap) leafMap.getContainer().style.cursor='';
  const btn=document.getElementById('btn-draw');
  if(btn){btn.textContent='✏️ Dibujar división';btn.style.background='#8e44ad';btn.style.borderColor='#8e44ad';}
  const hint=document.getElementById('draw-hint');if(hint)hint.style.display='none';
}

function eliminarParcelaNueva(id){
  if(!confirm('¿Eliminar esta nueva parcela del mapa?'))return;
  parcelasNuevas=parcelasNuevas.filter(p=>p.id!==id);
  try{localStorage.setItem('catastro_parcelas_nuevas',JSON.stringify(parcelasNuevas));}catch(e){}
  // Refrescar mapa
  if(drawnItems&&leafMap){
    leafMap.removeLayer(drawnItems);
    drawnItems=new L.FeatureGroup().addTo(leafMap);
    parcelasNuevas.forEach(p=>{
      const layer=L.polygon(p.latlngs,{color:'#e05c00',fillColor:'#ffd166',fillOpacity:0.5,weight:2});
      layer.bindPopup('<b>Nueva parcela</b><br>'+p.nota+'<br><button onclick="eliminarParcelaNueva(\''+p.id+'\')">🗑 Eliminar</button>');
      drawnItems.addLayer(layer);
    });
  }
}

function exportarParcelasNuevas(){
  if(!parcelasNuevas.length){alert('No hay nuevas parcelas dibujadas.');return;}
  // Convertir a GeoJSON
  const features=parcelasNuevas.map(p=>({
    type:'Feature',
    properties:{id:p.id,nota:p.nota,fecha:p.fecha,padronOrigen:p.padronOrigen},
    geometry:{type:'Polygon',coordinates:[p.latlngs.map(ll=>[ll[1],ll[0]])]}
  }));
  const geojson={type:'FeatureCollection',features};
  const blob=new Blob([JSON.stringify(geojson,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='nuevas_parcelas_alcorta.geojson';a.click();
}

let mapSearchTimeout=null;
let mapSearchLayer=null;

function mapSearch(q){
  const resDiv=document.getElementById('map-search-results');
  if(!resDiv)return;
  clearTimeout(mapSearchTimeout);
  if(mapSearchLayer&&leafMap){leafMap.removeLayer(mapSearchLayer);mapSearchLayer=null;}
  if(!q||q.trim().length<2){resDiv.style.display='none';return;}
  mapSearchTimeout=setTimeout(()=>{
    const qn=q.toLowerCase().trim();
    const hits=records.filter(r=>{
      return (r.titular||'').toLowerCase().includes(qn)||
             String(r.padron||'').includes(qn)||
             (r.manzana||'').toLowerCase().includes(qn)||
             (r.lote||'').toLowerCase().includes(qn)||
             (r.calle||'').toLowerCase().includes(qn)||
             (r.ctaTasa||'').includes(qn)||
             (r.cuim||'').includes(qn);
    }).slice(0,8);
    if(hits.length===0){
      resDiv.style.display='block';
      resDiv.innerHTML='<div style="padding:10px;color:var(--text3);text-align:center">Sin resultados</div>';
      return;
    }
    resDiv.style.display='block';
    resDiv.innerHTML=hits.map(r=>{
      const handle=r.padron?geoLinks[String(r.padron)]:null;
      const hasGeo=!!(handle&&geoData);
      return `<div onclick="mapSearchSelect('${r.padron||''}','${handle||''}')"
        style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center"
        onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background=''">
        <div>
          <div style="font-weight:600;font-size:12px">${esc(r.titular)||'Sin titular'}</div>
          <div style="font-size:11px;color:var(--text3)">Padrón ${r.padron||'—'} · Mz ${r.manzana||'—'} · Lote ${r.lote||'—'}</div>
        </div>
        <div style="font-size:10px;color:${hasGeo?'#2d9b5a':'var(--text3)'}">
          ${hasGeo?'📍 en mapa':'sin vincular'}
        </div>
      </div>`;
    }).join('');
  },300);
}

function mapSearchSelect(padron,handle){
  const resDiv=document.getElementById('map-search-results');
  if(resDiv) resDiv.style.display='none';
  const inp=document.getElementById('map-search-input');
  if(inp) inp.value='';
  if(!leafMap||!geoData) return;
  if(mapSearchLayer){leafMap.removeLayer(mapSearchLayer);mapSearchLayer=null;}
  if(!handle){
    const st=document.getElementById('map-status');
    if(st) st.textContent='⚠️ Esta parcela no está vinculada al plano — vinculala primero';
    return;
  }
  const feat=geoData.features.find(f=>f.properties.handle===handle);
  if(!feat) return;
  mapSearchLayer=L.geoJSON(feat,{
    style:{color:'#f39c12',weight:3,fillColor:'#fef9e7',fillOpacity:0.8}
  }).addTo(leafMap);
  leafMap.fitBounds(mapSearchLayer.getBounds(),{padding:[60,60],maxZoom:19});
  const st=document.getElementById('map-status');
  if(st) st.textContent='🔍 Padrón '+padron+' encontrado en el mapa';
}
