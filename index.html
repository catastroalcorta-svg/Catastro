function initMzMap(mzTGIU){
  if(typeof L==='undefined'){setTimeout(()=>initMzMap(mzTGIU),150);return;}
  if(mzMap){try{mzMap.remove();}catch(e){}mzMap=null;}
  const el=document.getElementById('mz-map');
  if(!el)return;

  const streets=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap',
    maxZoom:20,
    errorTileUrl:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='
  });
  mzMap=L.map(el,{layers:[streets]});
  setTimeout(()=>{if(mzMap)mzMap.invalidateSize();},100);

  // Dibujar parcelas en gris claro
  L.geoJSON(geoData,{style:{color:'#ccc',weight:0.5,fillColor:'#f0f0f0',fillOpacity:0.3}}).addTo(mzMap);

  // Dibujar manzanas con color según estado de vinculación
  mzLayer=L.layerGroup().addTo(mzMap);
  renderMzLayer(mzTGIU);

  // Centrar
  mzMap.setView([-33.5403,-61.1221],15);
}

function getMzColor(handle){
  if(mzLinks[handle]) return {color:'#2d9b5a',fill:'#d4f5e2',opacity:0.6};
  if(handle===mzSelHandle) return {color:'#e05c00',fill:'#fdf3e3',opacity:0.7};
  return {color:'#8e44ad',fill:'#f0e6f8',opacity:0.35};
}

function renderMzLayer(mzTGIU){
  if(!mzLayer||!mzMap)return;
  mzLayer.clearLayers();
  mzData.forEach(mz=>{
    if(!mz.lotes||!mz.lotes.length)return;
    const col=getMzColor(mz.handle);
    // Dibujar bounding box de la manzana usando los lotes
    const mzFeats=geoData.features.filter(f=>mz.lotes.includes(f.properties.handle));
    if(!mzFeats.length)return;
    // Calcular bbox
    const allCoords=mzFeats.flatMap(f=>f.geometry.coordinates[0]);
    const lons=allCoords.map(c=>c[0]); const lats=allCoords.map(c=>c[1]);
    const minLon=Math.min(...lons),maxLon=Math.max(...lons);
    const minLat=Math.min(...lats),maxLat=Math.max(...lats);
    const rect=L.rectangle([[minLat,minLon],[maxLat,maxLon]],{
      color:col.color,weight:2,fillColor:col.fill,fillOpacity:col.opacity
    });
    const mzNum=mzLinks[mz.handle]||'';
    if(mzNum){
      const lbl=L.divIcon({
        className:'',
        html:`<div style="font-size:10px;font-weight:700;color:${col.color};text-shadow:0 0 3px #fff;pointer-events:none">Mz${mzNum}</div>`,
        iconAnchor:[0,0]
      });
      L.marker([(minLat+maxLat)/2,(minLon+maxLon)/2],{icon:lbl}).addTo(mzLayer);
    }
    rect.on('click',()=>seleccionarManzana(mz,mzTGIU));
    rect.addTo(mzLayer);
  });
}

function guardarMzLink(handle){
  const sel=document.getElementById('mz-select');
  if(!sel)return;
  const val=sel.value.trim();
  if(!val){desvincularManzana(handle);return;}
  mzLinks[handle]=val;
  saveMzLinks();
  const mzTGIU=[...new Set(records.map(r=>String(r.manzana||'').trim()).filter(Boolean))].sort((a,b)=>parseInt(a)-parseInt(b)||a.localeCompare(b));
  renderMzLayer(mzTGIU);
  // Actualizar panel
  const mz=mzData.find(m=>m.handle===handle);

  goManzanas();
}

function desvincularManzana(handle){
  delete mzLinks[handle];
  saveMzLinks();
  goManzanas();
}

// Desvincular todos los geoLinks de los lotes de una manzana TGIU
// Útil cuando el cruce automático quedó mal y se quiere rehacer a mano
function desvincularlotesmanzana(mzNum, mzHandle){
  const lotesEnMz = records.filter(r=>String(r.manzana||'').trim()===mzNum);
  const conVinculo = lotesEnMz.filter(r=>geoLinks[String(r.padron)]);
  if(conVinculo.length===0){
    alert('Esta manzana no tiene lotes vinculados al plano.');
    return;
  }
  if(!confirm(
    `¿Desvincular los ${conVinculo.length} lotes de Manzana ${mzNum} del plano catastral?\n\n` +
    `Esto borra la asociación lote↔polígono del GeoJSON para toda la manzana.\n` +
    `El vínculo manzana↔número TGIU se mantiene.\n\n` +
    `Después podés usar el cruce automático o vincular cada lote a mano desde Vinculación.`
  )) return;

  // Borrar geoLinks de todos los lotes de esta manzana
  conVinculo.forEach(r=>{ delete geoLinks[String(r.padron)]; });

  // Guardar
  try{localStorage.setItem(GEO_LINKS_KEY,JSON.stringify(geoLinks));}catch(e){}
  // Subir a Drive
  if(DRIVE_API_URL&&DRIVE_TOKEN) pushToDrive(true);

  const toast=document.createElement('div');
  toast.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#dc2626;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;z-index:99999;box-shadow:0 4px 20px rgba(0,0,0,.3)';
  toast.textContent=`✅ ${conVinculo.length} lotes de Mz ${mzNum} desvinculados del plano`;
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(),3500);

  // Actualizar vista
  goManzanas();
}

function exportarMzLinks(){

  a.download='vinculos_manzanas_alcorta.json';a.click();
}

let _cruceGeoLayer=null, _cruceSelHandle=null, _crucePendientesPadron={};

function initCruceMap(lotesGeo, mzNum){
  const el=document.getElementById('cruce-map');
  if(!el) return;
  if(_cruceMap){try{_cruceMap.remove();}catch(e){} _cruceMap=null;}

  const streets=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM',maxZoom:20});
  _cruceMap=L.map(el,{layers:[streets]});
  setTimeout(()=>{if(_cruceMap)_cruceMap.invalidateSize();},150);

  // Dibujar todos los lotes de la manzana en el GeoJSON
  _cruceSelHandle=null;
  _cruceGeoLayer=L.geoJSON({type:'FeatureCollection',features:lotesGeo},{
    style: f=>cruceEstiloFeature(f.properties.handle),
    onEachFeature:(f,layer)=>{
      // Número del lote ya vinculado (si existe)
      layer.on('click',e=>{
        L.DomEvent.stopPropagation(e);
        cruceClickGeo(f.properties.handle);
      });
      // Label en el centro del polígono
      const coords=f.geometry.coordinates[0];
      const clat=coords.reduce((s,c)=>s+c[1],0)/coords.length;
      const clon=coords.reduce((s,c)=>s+c[0],0)/coords.length;
      const padronVinc=Object.keys(_crucePendientesPadron).find(p=>_crucePendientesPadron[p]===f.properties.handle);
      const loteLabel=padronVinc?'L'+(records.find(r=>String(r.padron)===padronVinc)||{}).lote:'?';
      L.marker([clat,clon],{icon:L.divIcon({
        html:`<div id="geo-label-${f.properties.handle}" style="background:#1d4ed8;color:#fff;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.5)">${loteLabel}</div>`,
        className:'',iconAnchor:[20,10]
      })}).addTo(_cruceMap);
    }
  }).addTo(_cruceMap);

  // Centrar en la manzana
  try{_cruceMap.fitBounds(_cruceGeoLayer.getBounds(),{padding:[30,30]});}catch(e){}
}

function cruceEstiloFeature(handle){
  const padronVinc=Object.keys(_crucePendientesPadron).find(p=>_crucePendientesPadron[p]===handle);
  if(handle===_cruceSelHandle) return {fillColor:'#fbbf24',color:'#f59e0b',weight:3,fillOpacity:0.6,opacity:1};
  if(padronVinc) return {fillColor:'#22c55e',color:'#15803d',weight:2,fillOpacity:0.4,opacity:0.9};
  return {fillColor:'#3b82f6',color:'#1d4ed8',weight:1.5,fillOpacity:0.2,opacity:0.7};
}

let cruceMzSelTGIU=null; // padrón TGIU seleccionado esperando click en mapa

function cruceSeleccionarTGIU(padron){

    tr.style.background=tr.id==='fila-tgiu-'+padron?'#1e3a5f':'';
  });

  const instr=document.getElementById('cruce-instruccion');

function cruceClickGeo(handle){
  if(!cruceMzSelTGIU){
    // Si no hay TGIU seleccionado, mostrar qué padrón está vinculado a este handle
    const padronActual=Object.keys(_crucePendientesPadron).find(p=>_crucePendientesPadron[p]===handle);
    const instr=document.getElementById('cruce-instruccion');
    if(padronActual){
      const r=records.find(x=>String(x.padron)===padronActual);
      if(instr) instr.textContent=`Este polígono ya está vinculado a Lote ${r&&r.lote||''} — ${r&&r.titular||''}. Seleccioná primero un lote de la lista.`;
    } else {
      if(instr) instr.textContent='Primero seleccioná un lote de la lista de la derecha.';
    }
    return;
  }

  // Vincular: padronSeleccionado → handle del polígono clickeado
  // Si este handle ya estaba asignado a otro padrón, desasignarlo
  Object.keys(_crucePendientesPadron).forEach(p=>{
    if(_crucePendientesPadron[p]===handle && p!==cruceMzSelTGIU) _crucePendientesPadron[p]=null;
  });
  _crucePendientesPadron[cruceMzSelTGIU]=handle;

  // Actualizar estilos del mapa
  _cruceGeoLayer.eachLayer(layer=>{
    if(layer.feature) layer.setStyle(cruceEstiloFeature(layer.feature.properties.handle));
  });

  // Actualizar labels en el mapa
  cruceActualizarLabels();

  // Actualizar tabla
  cruceActualizarTabla();

  // Limpiar selección TGIU
  cruceMzSelTGIU=null;
  document.querySelectorAll('#cruce-tabla-tgiu tr').forEach(tr=>tr.style.background='');

function cruceActualizarLabels(){

    if(!layer.feature) return;
    const handle=layer.feature.properties.handle;
    const el=document.getElementById('geo-label-'+handle);
    if(!el) return;
    const padronVinc=Object.keys(_crucePendientesPadron).find(p=>_crucePendientesPadron[p]===handle);

}

function cruceActualizarTabla(){

    .sort((a,b)=>parseInt(String(a.lote||'').replace(/\D/g,''))||0-(parseInt(String(b.lote||'').replace(/\D/g,''))||0));

function cruceDesvincularLote(padron){
  _crucePendientesPadron[padron]=null;

function cruceManualGuardar(){

// ── CRUCE AUTOMÁTICO DE LOTES ────────────────────────────────────────────────

// Detectar campos de manzana/lote disponibles en el GeoJSON
function detectarCamposGeoJSON(){
  if(!geoData||!geoData.features||!geoData.features.length) return null;
  // Revisar las primeras 5 features para encontrar los campos
  const muestras = geoData.features.slice(0,5);
  const resultado = {campsMz:[], campsLote:[], campsEjemplo:{}};
  muestras.forEach(f=>{
    const p = f.properties||{};
    Object.entries(p).forEach(([k,v])=>{
      const kl = k.toLowerCase();
      if(kl.includes('manz')||kl==='mz'||kl==='block') resultado.campsMz.push(k);
      if(kl.includes('lote')||kl.includes('lot')||kl==='parcel'||kl==='parcela') resultado.campsLote.push(k);
      resultado.campsEjemplo[k]=v;
    });
  });
  // Deduplicar
  resultado.campsMz=[...new Set(resultado.campsMz)];
  resultado.campsLote=[...new Set(resultado.campsLote)];
  return resultado;
}

function aplicarCruceAutomatico(){
  if(!geoData||!geoData.features||!geoData.features.length){
    alert('No hay plano catastral cargado.');return;
  }

  // Detectar campos disponibles
  const campos = detectarCamposGeoJSON();
  const todosLosCampos = Object.keys(geoData.features[0].properties||{});
  const ejemplo = geoData.features[0].properties||{};

  // Si el GeoJSON tiene campos de lote → cruce exacto disponible
  const tieneLote = campos&&campos.campsLote.length>0;
  const tieneMz = campos&&campos.campsMz.length>0;

  const campoInfo = todosLosCampos.map(k=>`  ${k}: ${JSON.stringify(ejemplo[k])}`).join('\n');

  if(tieneLote){
    // CRUCE EXACTO: usar número de lote del GeoJSON
    const campLote = campos.campsLote[0];
    const campMz = tieneMz ? campos.campsMz[0] : null;

    if(!confirm(
      `✅ El GeoJSON tiene campo de lote: "${campLote}"${campMz?' y manzana: "'+campMz+'"':''}.\n\n`+
      `Ejemplo: ${JSON.stringify(ejemplo)}\n\n`+
      `¿Aplicar cruce EXACTO por número de lote?\n`+
      `Las parcelas ya vinculadas manualmente NO se modifican.`
    )) return;

    cruceExacto(campLote, campMz);
  } else {
    // Sin campos de lote: mostrar herramienta interactiva
    abrirCruceInteractivo(todosLosCampos, ejemplo);
  }
}

// CRUCE EXACTO: GeoJSON tiene número de lote explícito
function cruceExacto(campLote, campMz){
  let vinculados=0, noMatch=0, yaVinculados=0;

  Object.entries(mzLinks).forEach(([mzHandle, mzNum])=>{
    const mz=mzData.find(m=>m.handle===mzHandle);
    if(!mz||!mz.lotes||!mz.lotes.length) return;

    // Lotes del GeoJSON en esta manzana con su número de lote
    const lotesGeo = geoData.features
      .filter(f=>mz.lotes.includes(f.properties.handle))
      .map(f=>({
        handle: f.properties.handle,
        nroLote: String(f.properties[campLote]||'').trim(),
        nroMz: campMz ? String(f.properties[campMz]||'').trim() : mzNum
      }));

    // Parcelas TGIU de esta manzana sin vincular
    const lotesTGIU = records.filter(r=>
      String(r.manzana||'').trim()===mzNum && !geoLinks[String(r.padron)]
    );

    lotesTGIU.forEach(r=>{
      const nroLoteTGIU = String(r.lote||'').trim().replace(/^0+/,'');
      // Buscar feature con mismo número de lote (normalizado sin ceros a la izquierda)
      const geo = lotesGeo.find(g=>
        g.nroLote.replace(/^0+/,'')=== nroLoteTGIU ||
        g.nroLote === String(r.lote||'').trim()
      );
      if(geo){ geoLinks[String(r.padron)]=geo.handle; vinculados++; }
      else noMatch++;
    });

    // Contar los que ya estaban vinculados
    yaVinculados += records.filter(r=>
      String(r.manzana||'').trim()===mzNum && geoLinks[String(r.padron)]
    ).length;
  });

  try{localStorage.setItem(GEO_LINKS_KEY,JSON.stringify(geoLinks));}catch(e){}
  if(DRIVE_API_URL&&DRIVE_TOKEN) pushToDrive(true);

  alert(
    `✅ Cruce exacto completado:\n`+
    `• ${vinculados} nuevas parcelas vinculadas\n`+
    `• ${yaVinculados} ya estaban vinculadas (no se tocaron)\n`+
    `• ${noMatch} sin coincidencia de número de lote\n\n`+
    `${noMatch>0?'Las parcelas sin coincidencia se pueden vincular a mano desde el módulo Vinculación.':''}`
  );
  goManzanas();
}

function confirmarCruceInteractivo(){
  const campLote=(document.getElementById('ci-campo-lote')||{}).value||'';
  const campMz=(document.getElementById('ci-campo-mz')||{}).value||'';
  document.getElementById('modal-cruce-interactivo')?.remove();

  if(campLote){
    cruceExacto(campLote, campMz||null);
  } else {
    crucePorPosicion();
  }
}

// CRUCE POR POSICIÓN ESPACIAL (fallback cuando no hay número de lote)
function crucePorPosicion(){
  if(!confirm(
    '⚠️ Cruce por posición espacial (N→S, O→E).\n\n'+
    'Este método puede NO coincidir si los lotes no están numerados en ese orden.\n\n'+
    'Solo se cruzan manzanas donde la cantidad de lotes GeoJSON = cantidad TGIU.\n\n'+
    '¿Continuar de todas formas?'
  )) return;

  let vinculados=0, noMatch=0;
  Object.entries(mzLinks).forEach(([mzHandle, mzNum])=>{
    const mz=mzData.find(m=>m.handle===mzHandle);
    if(!mz||!mz.lotes||!mz.lotes.length) return;

    const lotesGeo=geoData.features
      .filter(f=>mz.lotes.includes(f.properties.handle))
      .map(f=>{
        const coords=f.geometry.coordinates[0];
        const clat=coords.reduce((s,c)=>s+c[1],0)/coords.length;
        const clon=coords.reduce((s,c)=>s+c[0],0)/coords.length;
        return {handle:f.properties.handle,clat,clon};
      })
      .sort((a,b)=>b.clat-a.clat||a.clon-b.clon);

    const lotesTGIU=records
      .filter(r=>String(r.manzana||'').trim()===mzNum&&!geoLinks[String(r.padron)])
      .sort((a,b)=>{
        const la=String(a.lote||'').replace(/\D/g,'');
        const lb=String(b.lote||'').replace(/\D/g,'');
        return (parseInt(la)||0)-(parseInt(lb)||0);
      });

    if(lotesGeo.length===lotesTGIU.length){
      lotesTGIU.forEach((r,i)=>{ geoLinks[String(r.padron)]=lotesGeo[i].handle; vinculados++; });
    } else { noMatch++; }
  });

  try{localStorage.setItem(GEO_LINKS_KEY,JSON.stringify(geoLinks));}catch(e){}
  if(DRIVE_API_URL&&DRIVE_TOKEN) pushToDrive(true);
  alert(`Cruce por posición completado:\n• ${vinculados} vinculados\n• ${noMatch} manzanas sin cruzar (cantidad diferente)`);
  goManzanas();
}

function renderVinculacion(){
  const wrap=document.getElementById('vinc-results');
  if(!wrap){render();return;}
  const q=vincSq.toLowerCase().trim();
  const filtrarRec=(arr)=>!q?arr:arr.filter(r=>
    (r.titular||'').toLowerCase().includes(q)||
    (r.padron||'').toString().includes(q)||
    (r.manzana||'').toLowerCase().includes(q)||
    (r.lote||'').toLowerCase().includes(q)||
    (r.calle||'').toLowerCase().includes(q)||
    (r.ctaTasa||'').includes(q)
  );
  const vinculadas=records.filter(r=>geoLinks[String(r.padron)]);
  const sinVincular=records.filter(r=>!geoLinks[String(r.padron)]);
  const lista=vincTab==='con'?filtrarRec(vinculadas):filtrarRec(sinVincular);
  const shown=lista.slice(0,(vincPage+1)*VINC_PG);

  // Actualizar contadores en los botones de tab
  const tabSin=document.querySelector('[onclick="vincTab=\'sin\';vincPage=0;renderVinculacion()"]');
  const tabCon=document.querySelector('[onclick="vincTab=\'con\';vincPage=0;renderVinculacion()"]');
  if(tabSin) tabSin.textContent='⬜ Sin vincular ('+sinVincular.length.toLocaleString('es')+')';

  wrap.innerHTML=renderVincCards(shown,lista,more);

// ── FOTOS POR PARCELA ─────────────────────────────────────────────────────────
let _fotosTemp = null; // fotos en edición (array)

function agregarFoto(input, idx){
  if(!input.files||!input.files[0]) return;
  const file=input.files[0];
  if(file.size > 1.5*1024*1024){ alert('La foto supera 1.5 MB. Comprimila antes de subir.'); return; }
  const reader=new FileReader();
  reader.onload=function(e){
    // Obtener registro actual en edición
    const r=editId?records.find(x=>x.id===editId):null;
    if(!_fotosTemp) _fotosTemp=(r&&r.fotos)?[...r.fotos]:[];
    while(_fotosTemp.length<=idx) _fotosTemp.push(null);
    _fotosTemp[idx]={data:e.target.result, nombre:file.name, fecha:new Date().toISOString()};
    // Actualizar el registro en memoria para que saveRec lo use
    if(r) r.fotos=[..._fotosTemp];
    // Re-renderizar solo el grid de fotos
    renderFotosGrid();
  };
  reader.readAsDataURL(file);
}

function quitarFoto(idx){
  if(!confirm('¿Eliminar esta foto?')) return;
  const r=editId?records.find(x=>x.id===editId):null;
  if(!_fotosTemp && r&&r.fotos) _fotosTemp=[...r.fotos];
  if(_fotosTemp) { _fotosTemp[idx]=null; if(r) r.fotos=[..._fotosTemp]; }
  renderFotosGrid();
}

function renderFotosGrid(){
  const fotos=_fotosTemp||[];
  const grid=document.getElementById('fotos-grid');
  if(!grid) return;
  let html='';
  for(let i=0;i<6;i++){
    const f=fotos[i];
    if(f){
      html+=`<div style="position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--border)">
        <img src="${f.data}" alt="${esc(f.nombre||'Foto '+(i+1))}" style="width:100%;height:100%;object-fit:cover">
        <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.5);color:#fff;font-size:10px;padding:3px 6px">${esc(f.nombre||'')}</div>
        <button onclick="quitarFoto(${i})" style="position:absolute;top:4px;right:4px;background:rgba(220,38,38,.85);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer">✕</button>
      </div>`;
    } else {
      html+=`<label style="aspect-ratio:1;border:2px dashed var(--border);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--text3);font-size:12px;gap:4px" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
        <span style="font-size:24px">📷</span>Agregar foto
        <input type="file" accept="image/*" style="display:none" onchange="agregarFoto(this,${i})">
      </label>`;
    }
  }
  grid.innerHTML=html;
}

// Limpiar fotos temporales al abrir/cerrar form
function _initFotosTemp(){
  const r=editId?records.find(x=>x.id===editId):null;
  _fotosTemp=(r&&r.fotos)?[...r.fotos]:[];
}

function abrirFotoCompleta(recId, idx){
  const r=records.find(x=>x.id===recId);
  if(!r||!r.fotos) return;
  const fotos=r.fotos.filter(Boolean);
  if(!fotos[idx]) return;
  const f=fotos[idx];
  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer';

    <div style="color:#fff;font-size:13px;margin-top:10px;opacity:.7">${f.nombre||'Foto '+(idx+1)} · Click para cerrar</div>`;

// ── EXPORT CSV FILTRADO ───────────────────────────────────────────────────────
function exportarCSVFiltrado(){
  if(!filtered||filtered.length===0){ alert('No hay resultados para exportar.'); return; }
  const COLS=[
    ['padron','N° Padrón'],['ctaTasa','Cuenta Tasa'],['cuim','CUIM'],['titular','Titular'],
    ['dni','DNI'],['telefono','Teléfono'],['manzana','Manzana'],['lote','Lote'],
    ['seccion','Sección'],['partida','Partida'],['superficie','Superficie m²'],
    ['tipoInmueble','Tipo Inmueble'],['estadoTerreno','Estado Terreno'],
    ['calle','Calle'],['numero','Número'],['entreCalles','Entre Calles'],
    ['tieneCloaca','Tiene Cloaca'],['nroCloaca','N° Cloaca'],['estadoCloaca','Estado Cloaca'],
    ['fechaCloaca','Fecha Cloaca'],['diametroCloaca','Diámetro'],['profundidadCloaca','Profundidad m'],
    ['vinculado','Vinculado al plano']
  ];
  const csvEsc=v=>{
    const s=String(v??'').replace(/"/g,'""');
    return /[,"\n]/.test(s)?'"'+s+'"':s;
  };
  const header=COLS.map(c=>c[1]).join(',');
  const rows=filtered.map(r=>{
    return COLS.map(([k,_])=>{
      if(k==='tieneCloaca') return csvEsc(r.tieneCloaca?'Sí':'No');
      if(k==='vinculado') return csvEsc(geoLinks[String(r.padron)]?'Sí':'No');
      return csvEsc(r[k]);
    }).join(',');
  });
  const csv='\uFEFF'+header+'\n'+rows.join('\n'); // BOM para Excel
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  // Nombre descriptivo con filtros aplicados
  const partes=['catastro_alcorta'];
  if(fmanzana) partes.push('mz'+fmanzana);
  if(fcloaca!=='todos') partes.push(fcloaca==='con'?'con_cloaca':'sin_cloaca');
  if(fvinculado!=='todos') partes.push(fvinculado==='si'?'vinculados':'sin_vincular');
  if(sq) partes.push('busq');
  partes.push(new Date().toISOString().slice(0,10));
  a.download=partes.join('_')+'.csv';
  a.click();
  URL.revokeObjectURL(url);
  // Toast de confirmación
  const toast=document.createElement('div');
  toast.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;z-index:99999;box-shadow:0 4px 20px rgba(0,0,0,.3)';
  toast.textContent='📊 '+filtered.length.toLocaleString('es')+' parcelas exportadas a CSV';
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(),3000);
}

          </tbody>
        </table>

    </div>`;
  } else if(!ql&&sinCalleRecs.length>0&&isAdmin){
    html+=`<div id="sec-sin-calle" style="margin-top:20px;background:var(--surface);border:1px solid #f8717144;border-radius:var(--radius);padding:12px 16px">

      <div style="font-size:12px;color:var(--text3);margin-top:2px">Buscá por titular, padrón o manzana para asignar dirección</div>
    </div>`;
  }

  if(!html) html=`<div style="text-align:center;color:var(--text3);padding:24px">Sin resultados para "${esc(q)}"</div>`;
  return html;
}

function renderNumeracion(q){
  const datos=records
    .filter(r=>r.calle&&r.numero&&String(r.numero).trim())
    .map(r=>({id:r.id,calle:(r.calle||'').trim(),numero:String(r.numero).trim(),titular:(r.titular||''),padron:(r.padron||''),manzana:(r.manzana||''),lote:(r.lote||'')}));
  const porCalle={};
  datos.forEach(d=>{if(!porCalle[d.calle])porCalle[d.calle]=[];porCalle[d.calle].push(d);});
  Object.values(porCalle).forEach(arr=>arr.sort((a,b)=>parseInt(a.numero)-parseInt(b.numero)||a.numero.localeCompare(b.numero)));
  const callesCon=[...new Set(datos.map(d=>d.calle))].sort((a,b)=>a.localeCompare(b,'es'));
  const callesUnicas=[...new Set(records.filter(r=>r.calle&&r.calle.trim()).map(r=>r.calle.trim()))].sort((a,b)=>a.localeCompare(b,'es'));
  const wrap=document.getElementById('num-results');
  if(wrap) wrap.innerHTML=renderNumeracionContenido(porCalle,callesCon,callesUnicas,q||'');
}

let _importPreview=[];

function procesarExcelNumeracion(file){
  if(!file) return;
  const log=document.getElementById('import-log');
  if(!log) return;
  log.style.display='block';
  log.innerHTML='⏳ Leyendo archivo...';
  _importPreview=[];

  const ext=file.name.split('.').pop().toLowerCase();

  if(ext==='csv'){
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const lines=e.target.result.replace(/\r/g,'').split('\n').filter(l=>l.trim());
        const rows=lines.map(l=>l.split(',').map(c=>c.replace(/^"|"$/g,'').trim()));
        _procesarFilas(rows,log);
      }catch(err){log.innerHTML='❌ Error al leer CSV: '+err.message;}
    };
    reader.readAsText(file,'utf-8');
    return;
  }

  // xlsx/xls: usar SheetJS desde CDN
  const script=document.getElementById('sheetjs-cdn');
  const doRead=()=>{
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        _procesarFilas(rows,log);
      }catch(err){log.innerHTML='❌ Error al leer Excel: '+err.message;}
    };
    reader.readAsArrayBuffer(file);
  };

  if(typeof XLSX!=='undefined'){doRead();return;}
  if(script){script.onload=doRead;return;}
  const s=document.createElement('script');
  s.id='sheetjs-cdn';
  s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
  s.onload=doRead;
  s.onerror=()=>{log.innerHTML='❌ No se pudo cargar la librería para leer Excel. Revisá la conexión.';};
  document.head.appendChild(s);
}

function _procesarFilas(rows,log){
  if(!rows||rows.length<2){log.innerHTML='❌ El archivo está vacío o tiene solo encabezados.';return;}

  // Detectar columnas de forma flexible (header en fila 0)
  const header=rows[0].map(h=>String(h).toLowerCase().trim());
  const iCont=header.findIndex(h=>h.includes('contribuy')||h.includes('titular')||h.includes('nombre'));
  const iCalle=header.findIndex(h=>h.includes('calle'));
  const iNumero=header.findIndex(h=>h.includes('n') && (h.includes('mero')||h.includes('nro')||h.includes('num')||h==='número domiciliario'||h==='numero domiciliario'));
  const iPadron=header.findIndex(h=>h.includes('catastro')||h.includes('padr'));

  if(iCalle<0||iNumero<0||iPadron<0){
    log.innerHTML='❌ No se encontraron las columnas necesarias.<br>Se esperaba: <b>Contribuyente, Calle, Número domiciliario, Nº Catastro</b><br>Se encontró: '+rows[0].join(' | ');
    return;
  }

  const dataRows=rows.slice(1).filter(r=>r[iPadron]&&String(r[iPadron]).trim());
  let actualizados=0,noEncontrados=[],sinCambio=0;
  _importPreview=[];

  dataRows.forEach(row=>{
    const padron=String(row[iPadron]).trim();
    const calle=String(row[iCalle]||'').trim();
    const numero=String(row[iNumero]||'').trim();
    const contribuyente=iCont>=0?String(row[iCont]||'').trim():'';
    const idx=records.findIndex(r=>String(r.padron||'').trim()===padron);
    if(idx<0){noEncontrados.push(padron);return;}
    const r=records[idx];
    if(r.calle===calle&&String(r.numero||'').trim()===numero){sinCambio++;return;}
    _importPreview.push({idx,padron,calle,numero,contribuyente,calleAnterior:r.calle||'',numeroAnterior:r.numero||''});
    actualizados++;
  });

  let html=`<b>📋 Resumen de la importación:</b><br>
    ✅ ${actualizados} registro${actualizados===1?'':'s'} a actualizar<br>
    ⬜ ${sinCambio} sin cambios (ya tenían esos datos)<br>
    ${noEncontrados.length?`❓ ${noEncontrados.length} padrón${noEncontrados.length===1?'':'es'} no encontrado${noEncontrados.length===1?'':'s'} en el sistema`:''}`;

  if(_importPreview.length>0){
    html+=`<br><br><b>Vista previa (primeros ${Math.min(_importPreview.length,10)}):</b><br>`;
    _importPreview.slice(0,10).forEach(p=>{
      html+=`• Padrón <b>${p.padron}</b>: ${p.calleAnterior||'(sin calle)'} ${p.numeroAnterior||''} → <b>${p.calle} ${p.numero}</b><br>`;
    });
    if(_importPreview.length>10) html+=`...y ${_importPreview.length-10} más<br>`;
    const btn=document.getElementById('import-confirmar-btn');
    if(btn) btn.style.display='';
  } else {
    html+='<br><br>ℹ️ No hay cambios para aplicar.';
  }

  log.innerHTML=html;
  if(noEncontrados.length>0&&noEncontrados.length<=20){
    log.innerHTML+=`<br><span style="color:#f59e0b">Padrón${noEncontrados.length===1?'':'es'} no encontrado${noEncontrados.length===1?'':'s'}: ${noEncontrados.join(', ')}</span>`;
  }
}

function confirmarImportExcel(){
  if(!_importPreview.length) return;
  const btn=document.getElementById('import-confirmar-btn');
  if(btn){btn.disabled=true;btn.textContent='⏳ Guardando...';}
  let ok=0;
  _importPreview.forEach(p=>{
    records[p.idx].calle=p.calle;
    records[p.idx].numero=p.numero;
    ok++;
  });
  saveData();
  _importPreview.forEach(p=>{
    pushParcelaToDrive(records[p.idx]);
    if(!historial[records[p.idx].id]) historial[records[p.idx].id]=[];
    historial[records[p.idx].id].push({fecha:new Date().toISOString(),tipo:'edicion',resumen:'Dirección actualizada por importación Excel: '+p.calle+' '+p.numero,usuario:currentUser?currentUser.nombre:'?'});
  });
  _importPreview=[];
  const log=document.getElementById('import-log');
  if(log) log.innerHTML=`✅ <b>${ok} registro${ok===1?'':'s'} actualizado${ok===1?'':'s'} exitosamente.</b> El mapa y la plancheta reflejan los nuevos números.`;
  if(btn){btn.style.display='none';}
  setTimeout(()=>{
    document.getElementById('modal-import-excel')?.remove();
    renderNumeracion(document.getElementById('num-search')?.value||'');
    // Refrescar capa de numeración en el mapa: limpiar la anterior y redibujar

      }
      if(dashLayerVisible&&dashLayerVisible.numeracion){
        dashRenderNumeracion();
      }
    }
  },1800);
}

function _getDatosCert(){
  return{
    titular:(document.getElementById('cert-titular')||{}).value||'',
    lote:(document.getElementById('cert-lote')||{}).value||'',
    plano:(document.getElementById('cert-plano')||{}).value||'',
    calle:(document.getElementById('cert-calle')||{}).value||'',
    numero:(document.getElementById('cert-numero')||{}).value||'',
    aclaracion:(document.getElementById('cert-acl')||{}).value||'',
    caracter:(document.getElementById('cert-caracter')||{}).value||'provisorio',
    fecha:(document.getElementById('cert-fecha')||{}).value||new Date().toISOString().slice(0,10)
  };
}

let _certModoManual=false;

function toggleEditCert(){
  const prev=document.getElementById('cert-preview');
  const ta=document.getElementById('cert-textarea');
  const btn=document.getElementById('cert-edit-btn');
  if(!prev||!ta||!btn) return;
  _certModoManual=!_certModoManual;
  if(_certModoManual){
    // Pasar HTML del preview a texto plano en el textarea
    ta.value=prev.innerHTML.replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'');
    prev.style.display='none';
    ta.style.display='block';
    btn.textContent='👁️ Ver preview';
    btn.style.background='rgba(99,102,241,.15)';
    btn.style.borderColor='rgba(99,102,241,.5)';
    btn.style.color='#a5b4fc';
    setTimeout(()=>ta.focus(),50);
  } else {
    // Volver al preview generado automáticamente
    prev.style.display='';
    ta.style.display='none';
    btn.textContent='✏️ Editar texto';
    btn.style.background='';
    btn.style.borderColor='';
    btn.style.color='';
    actualizarPrevCert();
  }
}

function syncCertTextarea(){
  // El textarea ya tiene el texto; nada que sincronizar en tiempo real
  // Se usa en imprimirCertificadoNum directamente
}

function _getCuerpoFinalCert(){
  if(_certModoManual){
    const ta=document.getElementById('cert-textarea');
    if(ta) return ta.value.replace(/\n/g,'<br>');
  }
  const prev=document.getElementById('cert-preview');
  return prev?prev.innerHTML:'';
}

function actualizarPrevCert(){
  if(_certModoManual) return; // en modo manual no sobreescribir
  const d=_getDatosCert();
  const prev=document.getElementById('cert-preview');
  if(!prev) return;
  const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const DIAS=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiún','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve','treinta','treinta y uno'];
  function fL(iso){const[y,m,di]=iso.split('-').map(Number);return`${DIAS[di]||di} (${di}) días del mes de ${MESES[m-1]} del año ${y}`;}
  const aclTxt=d.aclaracion?` (${d.aclaracion})`:'';
  const carTxt=d.caracter==='provisorio'?' (determinado en forma provisoria)':'';
  const pt='...........................................................................';
  prev.innerHTML=`La Autoridad Comunal que suscribe <strong>CERTIFICA:</strong> Que previa inspección realizada se determina que la numeración oficial correspondiente al Lote N° <b>${d.lote||'___'}</b> del Plano de Mensura N° <b>${d.plano||'___'}</b> ubicado sobre ${d.calle||'___'} propiedad de <strong>${d.titular||'___'}</strong> es: <strong>${(d.calle||'').toUpperCase()} ${d.numero||'___'}</strong>${aclTxt}${carTxt}${pt}<br><br>A solicitud de las Autoridades que lo exijan y para ser presentado ante quién corresponda, se expide el presente en <strong>Alcorta</strong>, Departamento Constitución, Provincia de Santa Fe, a los ${fL(d.fecha)}${pt}`;
}

// ── RESTAURAR BACKUP DESDE ARCHIVO ───────────────────────────────────────────
async function restaurarBackupDesdeArchivo(){
  const file=document.getElementById('restore-backup-file');
  const st=document.getElementById('restore-backup-status');
  if(!file||!file.files.length){if(st)st.textContent='❌ Seleccioná el archivo de backup primero.';return;}
  if(st)st.textContent='⏳ Leyendo archivo...';
  try{
    const text=await file.files[0].text();
    const data=JSON.parse(text);
    // Detectar formato: backup completo o array directo
    const recs=data.records||( Array.isArray(data)?data:null );
    if(!recs||!Array.isArray(recs)||recs.length<10){
      if(st)st.textContent='❌ Archivo inválido o con muy pocos registros ('+( recs?recs.length:'?' )+').';
      return;
    }
    if(!confirm(`¿Restaurar ${recs.length} registros desde el archivo?\n\nEsto reemplaza los datos actuales en esta PC (${records.length} registros).\nLos datos en Drive no cambian hasta que guardes manualmente.`))return;

    // Aplicar datos
    records=recs;
    if(data.geoLinks&&Object.keys(data.geoLinks).length>0) geoLinks=data.geoLinks;
    if(data.mzLinks&&Object.keys(data.mzLinks).length>0) mzLinks=data.mzLinks;
    if(data.mzData&&Array.isArray(data.mzData)&&data.mzData.length>0) mzData=data.mzData;
    if(data.ruralRecords&&Array.isArray(data.ruralRecords)&&data.ruralRecords.length>0) ruralRecords=data.ruralRecords;
    if(data.ruralLinks&&Object.keys(data.ruralLinks).length>0) ruralLinks=data.ruralLinks;
    if(data.cloacaLinks&&typeof data.cloacaLinks==='object') cloacaLinks=data.cloacaLinks;
    if(data.cloacaGeoLinks&&typeof data.cloacaGeoLinks==='object') cloacaGeoLinks=data.cloacaGeoLinks;
    if(data.calles&&Array.isArray(data.calles)) callesData=data.calles;
    if(data.driRecords&&Array.isArray(data.driRecords)) driRecords=data.driRecords;
    if(data.historial) historial=data.historial;

    // Guardar en localStorage
    saveData();
    try{localStorage.setItem(GEO_LINKS_KEY,JSON.stringify(geoLinks));}catch(e){}
    try{localStorage.setItem(MZ_LINKS_KEY,JSON.stringify(mzLinks));}catch(e){}
    try{localStorage.setItem('catastro_snapshot_count',String(records.length));}catch(e){}

    if(st)st.innerHTML=`✅ <b>${recs.length} registros restaurados</b> desde el archivo <i>${file.files[0].name}</i>.<br>
      <span style="color:#16a34a">Los datos ya están disponibles. </span>
      <button class="btn btn-sm" style="margin-top:6px;background:#2d5fa8;color:#fff;border-color:#1e4080" onclick="filter();render();goList();alert('Datos cargados correctamente.')">✅ Ir al padrón</button>
      ${DRIVE_API_URL?`<button class="btn btn-sm" style="margin-top:6px;margin-left:6px;background:#1a6b3a;color:#fff;border-color:#15803d" onclick="pushToDrive(false).then(()=>alert('✅ Datos subidos a Drive correctamente.'))">☁️ Subir a Drive ahora</button>`:''}`;
    filter();
  }catch(e){
    if(st)st.textContent='❌ Error al leer el archivo: '+e.message;
  }
}

let _ldModoManual=false;

function _getDatosLD(){
  return{
    titular:(document.getElementById('ld-titular')||{}).value||'',

    catastro:(document.getElementById('ld-catastro')||{}).value||'',

    fechacert:(document.getElementById('ld-fechacert')||{}).value||new Date().toISOString().slice(0,10)
  };
}

function _ldTexto(d){
  const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const DIAS=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiún','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve','treinta','treinta y uno'];
  function fL(iso){const[y,m,di]=iso.split('-').map(Number);return`${DIAS[di]||di} de ${MESES[m-1]} de ${y}`;}
  function fLetras(iso){const[y,m,di]=iso.split('-').map(Number);return`${DIAS[di]||di} (${di}) días del mes de ${MESES[m-1]} del año ${y}`;}
  const pt='-----------------------';
  const pt2='-------------------------------------------------------------------------------------------------------';
  return{
    p1:`La Autoridad Comunal que suscribe <strong>CERTIFICA:</strong> Que el inmueble situado en la manzana "<strong>${d.manzana||'___'}</strong>", catastro N° <strong>${d.catastro||'___'}</strong>, de titularidad: <strong>${d.titular||'___'}</strong> ubicado sobre calle <strong>${(d.calle||'').toUpperCase()||'___'}</strong>, <strong>NO REGISTRA DEUDAS</strong>, por ningún concepto en esta Comuna hasta el día <strong>${fL(d.fecha)}</strong> inclusive. ${pt}`,
    p2:`A solicitud de la parte interesada y a los efectos de ser presentado ante las Autoridades que lo exijan, se expide el presente, en Alcorta, Departamento Constitución, Provincia de Santa Fe, siendo el día <strong>${fLetras(d.fechacert)}</strong>. ${pt2}`
  };
}

function actualizarPrevLD(){
  if(_ldModoManual) return;
  const d=_getDatosLD();
  const prev=document.getElementById('ld-preview');
  if(!prev) return;
  const t=_ldTexto(d);
  prev.innerHTML=`${t.p1}<br><br>${t.p2}`;
}

function toggleEditLD(){
  const prev=document.getElementById('ld-preview');

}

function _getCuerpoFinalLD(){

// ── BÚSQUEDA POR POLÍGONO EN EL MAPA ─────────────────────────────────────────
let polySearchActive=false, polySearchPts=[], polySearchLayer=null, polySearchMarkers=[];
let _polyIgnoreNextClick=false; // flag para ignorar el click extra del dblclick

function activarBusquedaPoligono(){
  if(!leafMap||!geoData){ alert('El mapa no está disponible.'); return; }
  polySearchActive=true; polySearchPts=[]; polySearchMarkers=[];
  _polyIgnoreNextClick=false;
  if(polySearchLayer){ try{leafMap.removeLayer(polySearchLayer);}catch(e){} polySearchLayer=null; }
  const st=document.getElementById('map-status');
  if(st) st.textContent='🔍 Modo búsqueda: hacé click para trazar el polígono. Doble click para cerrar y buscar.';
  leafMap.getContainer().style.cursor='crosshair';
  leafMap.on('click', _polySearchClick);
  leafMap.on('dblclick', _polySearchClose);
}

function _polySearchClick(e){
  if(!polySearchActive) return;
  if(_polyIgnoreNextClick){ _polyIgnoreNextClick=false; return; } // ignorar click extra del dblclick
  polySearchPts.push([e.latlng.lat, e.latlng.lng]);
  const m=L.circleMarker([e.latlng.lat, e.latlng.lng],{radius:5,color:'#f59e0b',fillColor:'#f59e0b',fillOpacity:1,weight:2}).addTo(leafMap);
  polySearchMarkers.push(m);
  if(polySearchLayer) try{leafMap.removeLayer(polySearchLayer);}catch(e){}
  if(polySearchPts.length>=2){
    polySearchLayer=L.polyline(polySearchPts,{color:'#f59e0b',weight:2,dashArray:'6,4'}).addTo(leafMap);
  }
  const st=document.getElementById('map-status');
  if(st) st.textContent='🔍 '+polySearchPts.length+' punto'+(polySearchPts.length===1?'':'s')+' — Seguí haciendo click. Doble click para cerrar el polígono.';
}

function _polySearchClose(e){
  if(!polySearchActive||polySearchPts.length<3) return;
  _polyIgnoreNextClick=true; // el dblclick ya disparó un click — ignoramos el siguiente
  leafMap.off('click',_polySearchClick);
  leafMap.off('dblclick',_polySearchClose);
  polySearchActive=false;
  leafMap.getContainer().style.cursor='';
  if(polySearchLayer) try{leafMap.removeLayer(polySearchLayer);}catch(e){}
  polySearchLayer=L.polygon(polySearchPts,{color:'#f59e0b',fillColor:'#fde047',fillOpacity:0.25,weight:2}).addTo(leafMap);
  polySearchMarkers.forEach(m=>{ try{leafMap.removeLayer(m);}catch(e){} });
  polySearchMarkers=[];
  const st=document.getElementById('map-status');
  if(st) st.textContent='🔍 Buscando parcelas en el área...';
  _buscarParcelasEnPoligono(polySearchPts);
}

function _buscarParcelasEnPoligono(pts){
  if(!geoData||!geoData.features) return;
  // pts = [[lat,lon],...] desde Leaflet
  // GeoJSON = [[lon,lat],...] → convertir pts a lon/lat para comparar
  const ptsLL=pts.map(([lat,lon])=>[lon,lat]);

  function pip(px,py,poly){
    let inside=false;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
      const [xi,yi]=poly[i],[xj,yj]=poly[j];
      if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside;
    }
    return inside;
  }

  function centroidGeo(coords){
    let sx=0,sy=0,n=0;
    coords.forEach(([x,y])=>{sx+=x;sy+=y;n++;});
    return [sx/n,sy/n]; // [lon,lat]
  }

  const encontradas=[];
  geoData.features.forEach(f=>{
    if(!f.geometry||f.geometry.type!=='Polygon') return;
    const [cx,cy]=centroidGeo(f.geometry.coordinates[0]);
    if(pip(cx,cy,ptsLL)){
      const handle=f.properties.handle;
      const padronEntry=Object.entries(geoLinks).find(([p,h])=>h===handle);
      if(padronEntry){
        const rec=records.find(r=>String(r.padron)===padronEntry[0]);
        if(rec) encontradas.push({rec,handle,feature:f});
      } else {
        encontradas.push({rec:null,handle,feature:f});
      }
    }
  });
  _mostrarResultadosPoligono(encontradas);
}

function _mostrarResultadosPoligono(encontradas){
  const old=document.getElementById('poly-search-results');
  if(old) old.remove();
  const panel=document.createElement('div');
  panel.id='poly-search-results';
  panel.style.cssText='position:absolute;top:10px;right:10px;z-index:1000;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0;max-width:300px;width:88%;max-height:55vh;display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.35)';
  const conVinculo=encontradas.filter(e=>e.rec);
  const sinVinculo=encontradas.filter(e=>!e.rec);
  panel.innerHTML=`
    <div style="padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:center">
      <span style="font-weight:700;font-size:13px">🔍 ${encontradas.length} parcela${encontradas.length===1?'':' s'} en el área</span>
      <button onclick="cerrarPolySearch()" style="background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer;line-height:1;padding:0 2px">✕</button>
    </div>
    <div style="overflow-y:auto;flex:1;padding:8px">
      ${conVinculo.length>0?`<div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Con titular (${conVinculo.length})</div>
      ${conVinculo.map(e=>`<div style="padding:7px 10px;border-radius:6px;cursor:pointer;margin-bottom:4px;background:var(--surface2);border:1px solid var(--border)" onclick="cerrarPolySearch();viewRec('${e.rec.id}')">
        <div style="font-size:13px;font-weight:600">${esc(e.rec.titular||'Sin titular')}</div>
        <div style="font-size:11px;color:var(--text3)">Padrón ${esc(e.rec.padron||'—')} · Mz ${esc(e.rec.manzana||'—')} · Lote ${esc(e.rec.lote||'—')}${e.rec.calle?' · '+esc(e.rec.calle)+(e.rec.numero?' '+esc(e.rec.numero):'')+'':'' }</div>
      </div>`).join('')}`:''  }
      ${sinVinculo.length>0?`<div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:8px 0 6px">Sin vincular al padrón (${sinVinculo.length})</div>
      ${sinVinculo.map(e=>`<div style="padding:7px 10px;border-radius:6px;margin-bottom:4px;background:var(--surface2);border:1px solid var(--border);opacity:.7">
        <div style="font-size:12px;color:var(--text2)">Handle: <code style="font-size:11px">${esc(e.handle)}</code></div>
      </div>`).join('')}`:''  }
      ${encontradas.length===0?'<div style="text-align:center;color:var(--text3);padding:16px;font-size:13px">Ninguna parcela encontrada.<br><span style="font-size:11px">Verificá que haya parcelas vinculadas en esa zona.</span></div>':''  }
    </div>
    <div style="padding:8px 14px;border-top:1px solid var(--border)">
      <button onclick="cancelarPolySearch()" style="width:100%;padding:7px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:12px;cursor:pointer">↺ Nuevo polígono</button>
    </div>`;
  // Insertar dentro de .map-wrap (contenedor del mapa de detalle)
  const mapWrap=document.querySelector('.map-wrap');
  if(mapWrap){ mapWrap.style.position='relative'; mapWrap.appendChild(panel); }
  else {
    const parcelMap=document.getElementById('parcel-map');
    if(parcelMap){ parcelMap.style.position='relative'; parcelMap.appendChild(panel); }
    else document.body.appendChild(panel);
  }
  const st=document.getElementById('map-status');
  if(st) st.textContent='🔍 '+encontradas.length+' parcela'+(encontradas.length===1?'':' s')+' encontrada'+(encontradas.length===1?'':' s')+' en el área';
}

function cerrarPolySearch(){
  const p=document.getElementById('poly-search-results'); if(p) p.remove();
  if(polySearchLayer){ try{leafMap.removeLayer(polySearchLayer);}catch(e){} polySearchLayer=null; }
}

function cancelarPolySearch(){
  cerrarPolySearch();
  polySearchPts=[]; polySearchActive=false;
  activarBusquedaPoligono();
}

function saveDRI(){
  if(DRIVE_API_URL&&DRIVE_TOKEN){try{localStorage.setItem('catastro_last_modified',new Date().toISOString());}catch(e){}return;}
  if(!DRIVE_API_URL||!DRIVE_TOKEN){try{localStorage.setItem(DRI_KEY,JSON.stringify(driRecords));}catch(e){}}
}

function loadDRI(){
  // Con Drive configurado, los driRecords vienen de Drive al hacer login
  if(DRIVE_API_URL&&DRIVE_TOKEN) return;
  try{const d=localStorage.getItem(DRI_KEY);if(d){driRecords=JSON.parse(d);return;}}catch(e){}
  // Si no hay datos en localStorage, usar los embebidos
  if(DRI_EMBEBIDO&&DRI_EMBEBIDO.length>0){
    driRecords=[...DRI_EMBEBIDO];
    saveDRI();

        console.log('[DRI] Datos cargados:',driRecords.length);

function driCard(r){

  const venc=r.vencimiento?new Date(r.vencimiento):null;
  const diasVenc=venc?Math.round((venc-hoy)/(1000*60*60*24)):null;
  const alertaVenc=r.estado==='habilitado'&&diasVenc!==null&&diasVenc<=30;
  const parcela=r.padronVinculado?records.find(p=>String(p.padron)===String(r.padronVinculado)):null;

  return `<div class="vi" onclick="${isAdmin?`goDRIDetalle('${esc(r.id)}')`:'void(0)'}" style="border-left:3px solid ${est.color};${isAdmin?'cursor:pointer;':''}">

let _driFormMap=null, _driFormMarker=null;
function initDRIFormMap(r){
  if(typeof L==='undefined') return;
  const el=document.getElementById('dri-form-map');
  if(!el) return;
  if(_driFormMap){try{_driFormMap.remove();}catch(e){} _driFormMap=null;}
  const lat=r&&r.lat?parseFloat(r.lat):-33.5403;
  const lon=r&&r.lon?parseFloat(r.lon):-61.1221;
  _driFormMap=L.map(el).setView([lat,lon],r&&r.lat?18:16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM',maxZoom:20}).addTo(_driFormMap);
  if(geoData) L.geoJSON(geoData,{style:{color:'#1d4ed8',weight:1,fillColor:'#bfdbfe',fillOpacity:0.3}}).addTo(_driFormMap);
  if(r&&r.lat&&r.lon){
    _driFormMarker=L.marker([lat,lon],{draggable:true}).addTo(_driFormMap);
    _driFormMarker.on('dragend',e=>{
      const pos=e.target.getLatLng();
      const fl=document.getElementById('df-lat'); if(fl) fl.value=pos.lat.toFixed(6);
      const fn=document.getElementById('df-lon'); if(fn) fn.value=pos.lng.toFixed(6);
    });
  }
  _driFormMap.on('click',e=>{
    const {lat,lng}=e.latlng;
    if(_driFormMarker){_driFormMap.removeLayer(_driFormMarker);}
    _driFormMarker=L.marker([lat,lng],{draggable:true}).addTo(_driFormMap);
    _driFormMarker.on('dragend',ev=>{
      const pos=ev.target.getLatLng();
      const fl=document.getElementById('df-lat'); if(fl) fl.value=pos.lat.toFixed(6);
      const fn=document.getElementById('df-lon'); if(fn) fn.value=pos.lng.toFixed(6);
    });
    const fl=document.getElementById('df-lat'); if(fl) fl.value=lat.toFixed(6);
    const fn=document.getElementById('df-lon'); if(fn) fn.value=lng.toFixed(6);
  });
  setTimeout(()=>_driFormMap.invalidateSize(),100);
}

function saveDRIForm(){
  const g=id=>{const el=document.getElementById(id);return el?el.value.trim():'';}
  const razon=g('df-razon');
  if(!razon){alert('La razón social es obligatoria.');return;}
  const id=window._driEditId||null;
  const data={
    id:id||'dri'+Date.now(),
    razonSocial:razon,
    fantasia:g('df-fantasia'),
    rubro:g('df-rubro'),
    estado:g('df-estado')||'habilitado',
    titular:g('df-titular'),
    dni:g('df-dni'),
    telefono:g('df-tel'),
    calle:g('df-calle'),
    numero:g('df-numero'),
    padronVinculado:g('df-padron'),
    lat:g('df-lat')||null,
    lon:g('df-lon')||null,
    nroExpediente:g('df-expte'),
    fechaHabilitacion:g('df-fechahab')||null,
    vencimiento:g('df-venc')||null,
    montoDRI:g('df-monto')?parseFloat(g('df-monto')):null,
    deudaDRI:document.getElementById('df-deuda')&&document.getElementById('df-deuda').value==='1',
    montoDeuda:g('df-mdeuda')?parseFloat(g('df-mdeuda')):null,
    obsDRI:g('df-obs'),
    fechaMod:new Date().toISOString(),
    usuario:currentUser?currentUser.nombre:'?'
  };
  if(id){
    const idx=driRecords.findIndex(x=>x.id===id);
    if(idx>=0) driRecords[idx]=data; else driRecords.push(data);
  } else {
    driRecords.push(data);
  }
  saveDRI();
  pushToDrive(true);
  window._driEditId=null;
  if(_driFormMap){try{_driFormMap.remove();}catch(e){} _driFormMap=null;}
  const toast=document.createElement('div');
  toast.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;z-index:99999';
  toast.textContent='✅ Comercio guardado correctamente';
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(),3000);
  goDRI();
}

function eliminarDRI(id){
  if(!confirm('¿Eliminar este comercio del registro DRI?')) return;
  driRecords=driRecords.filter(x=>x.id!==id);
  saveDRI();
  pushToDrive(true);
  goDRI();
}

function rAlertas(a){

  const en7=new Date(hoy); en7.setDate(en7.getDate()+7);

  // DRI alertas
  const driVencidos=driRecords.filter(r=>r.estado==='habilitado'&&r.vencimiento&&new Date(r.vencimiento)<hoy);
  const driProx7=driRecords.filter(r=>r.estado==='habilitado'&&r.vencimiento&&new Date(r.vencimiento)>=hoy&&new Date(r.vencimiento)<=en7);
  const driProx30=driRecords.filter(r=>r.estado==='habilitado'&&r.vencimiento&&new Date(r.vencimiento)>en7&&new Date(r.vencimiento)<=en30);
  const driConDeuda=driRecords.filter(r=>r.deudaDRI);

  // Parcelas sin vincular
  const sinVincular=records.filter(r=>!geoLinks[String(r.padron)]);
  // Deudas por tipo
  const morosos=records.filter(r=>r.deudaTasa&&parseFloat(r.deudaTasa)>0);
  const morososCloaca=records.filter(r=>r.deudaCloaca&&parseFloat(r.deudaCloaca)>0);
  const morososRural=ruralRecords.filter(r=>r.deudaRural&&parseFloat(r.deudaRural)>0);

  const total=driVencidos.length+driProx7.length+driProx30.length+driConDeuda.length+morosos.length+morososCloaca.length+morososRural.length;

  a.innerHTML=hdr()+topnav('alertas')+`<div class="content">
  <div style="padding:12px 0 8px;display:flex;justify-content:space-between;align-items:center">
    <div style="font-size:18px;font-weight:700">🔔 Panel de alertas</div>
    <div style="font-size:12px;color:var(--text3)">${total} alerta${total===1?'':'s'} activa${total===1?'':'s'}</div>
  </div>

  ${driVencidos.length>0?`<div class="card" style="border-left:3px solid #dc2626;margin-bottom:12px">
    <div style="font-size:13px;font-weight:700;color:#dc2626;margin-bottom:10px">⛔ Habilitaciones DRI vencidas (${driVencidos.length})</div>
    ${driVencidos.map(r=>{
      const dias=Math.round((hoy-new Date(r.vencimiento))/(1000*60*60*24));
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="goDRIDetalle('${r.id}')">
        <div><b>${esc(r.razonSocial)}</b> <span style="font-size:11px;color:var(--text3)">${esc(r.rubro||'')}</span></div>
        <span style="font-size:11px;color:#dc2626;font-weight:600">Venció hace ${dias} día${dias===1?'':'s'}</span>
      </div>`;

  const tab=window._deudaTab||'tasa';

  const morososCloaca=records.filter(r=>r.deudaCloaca&&parseFloat(r.deudaCloaca)>0).sort((a,b)=>parseFloat(b.deudaCloaca)-parseFloat(a.deudaCloaca));
  const morososRural=ruralRecords.filter(r=>r.deudaRural&&parseFloat(r.deudaRural)>0).sort((a,b)=>parseFloat(b.deudaRural)-parseFloat(a.deudaRural));
  const morososDRI=driRecords.filter(r=>r.deudaDRI&&r.montoDeuda&&parseFloat(r.montoDeuda)>0).sort((a,b)=>parseFloat(b.montoDeuda||0)-parseFloat(a.montoDeuda||0));
  const totTasa=morososTasa.reduce((s,r)=>s+parseFloat(r.deudaTasa||0),0);
  const totCloaca=morososCloaca.reduce((s,r)=>s+parseFloat(r.deudaCloaca||0),0);
  const totRural=morososRural.reduce((s,r)=>s+parseFloat(r.deudaRural||0),0);

  const morososVarias=records.filter(r=>r.deudaTasasVarias&&parseFloat(r.deudaTasasVarias)>0).sort((a,b)=>parseFloat(b.deudaTasasVarias)-parseFloat(a.deudaTasasVarias));

    const hoy=new Date();
    const diasDiff=Math.floor((hoy-fecha)/(1000*60*60*24));
    const diasStr=diasDiff===0?'hoy':diasDiff===1?'ayer':`hace ${diasDiff} días`;
    const alertaViejo=diasDiff>35;
    const color=alertaViejo?'var(--warn-bg)':'var(--green-bg)';
    const borderColor=alertaViejo?'#fde68a':'var(--green-light)';
    const textColor=alertaViejo?'var(--warn)':'var(--green)';
    const icon=alertaViejo?'⚠️':'✅';
    const fechaStr=fecha.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    return `<div style="padding:6px 14px;background:${color};border-bottom:1px solid ${borderColor};font-size:11px;color:${textColor};display:flex;align-items:center;gap:6px;flex-wrap:wrap">
      ${icon} <span>Última importación: <b>${fechaStr}</b> (${diasStr})${upd.usuario?' · por <b>'+upd.usuario+'</b>':''} · ${upd.ok} registros actualizados${alertaViejo?' · <b>Considerá actualizar los montos</b>':''}</span>
    </div>`;
  })()}
  <div id="deuda-list" style="padding:0">${tabContent}</div>
  </div>`;
}
function renderDeudaListActiva(q){
  const tab=window._deudaTab||'tasa';
  let lista;
  if(tab==='tasa') lista=records.filter(r=>r.deudaTasa&&parseFloat(r.deudaTasa)>0).sort((a,b)=>parseFloat(b.deudaTasa)-parseFloat(a.deudaTasa));
  else if(tab==='cloaca') lista=records.filter(r=>r.deudaCloaca&&parseFloat(r.deudaCloaca)>0).sort((a,b)=>parseFloat(b.deudaCloaca)-parseFloat(a.deudaCloaca));
  else if(tab==='rural') lista=ruralRecords.filter(r=>r.deudaRural&&parseFloat(r.deudaRural)>0).sort((a,b)=>parseFloat(b.deudaRural)-parseFloat(a.deudaRural));
  else if(tab==='mejoras') lista=records.filter(r=>r.deudaMejoras&&parseFloat(r.deudaMejoras)>0).sort((a,b)=>parseFloat(b.deudaMejoras)-parseFloat(a.deudaMejoras));
  else if(tab==='vivienda') lista=records.filter(r=>r.deudaVivienda&&parseFloat(r.deudaVivienda)>0).sort((a,b)=>parseFloat(b.deudaVivienda)-parseFloat(a.deudaVivienda));
  else if(tab==='varias') lista=records.filter(r=>r.deudaTasasVarias&&parseFloat(r.deudaTasasVarias)>0).sort((a,b)=>parseFloat(b.deudaTasasVarias)-parseFloat(a.deudaTasasVarias));
  else lista=driRecords.filter(r=>r.deudaDRI&&r.montoDeuda&&parseFloat(r.montoDeuda)>0).sort((a,b)=>parseFloat(b.montoDeuda||0)-parseFloat(a.montoDeuda||0));
  const ql=(q||'').toLowerCase().trim();
  const fil=ql?lista.filter(r=>(r.titular||'').toLowerCase().includes(ql)||(r.razonSocial||'').toLowerCase().includes(ql)||(r.fantasia||'').toLowerCase().includes(ql)||(r.padron||r.partida||r.nroCuenta||r.cuenta||'').toString().includes(ql)||(r.manzana||'').includes(ql)||(r.calle||'').toLowerCase().includes(ql)):lista;
  const wrap=document.getElementById('deuda-list');
  if(!wrap) return;
  const campoMap={tasa:'deudaTasa',cloaca:'deudaCloaca',mejoras:'deudaMejoras',vivienda:'deudaVivienda',varias:'deudaTasasVarias'};
  if(tab==='rural') wrap.innerHTML=renderDeudaSeccionRural(fil);
  else if(tab==='dri') wrap.innerHTML=renderDeudaSeccionDRI(fil);
  else wrap.innerHTML=renderDeudaSeccion(fil,campoMap[tab]||'deudaTasa');
}

async function procesarImportDeudaActiva(tab){
  const campoMap={tasa:'deudaTasa',cloaca:'deudaCloaca',rural:'deudaRural',mejoras:'deudaMejoras',vivienda:'deudaVivienda',varias:'deudaTasasVarias'};
  const campo=campoMap[tab]||'deudaTasa';
  const f=document.getElementById('deuda-import-file');
  const st=document.getElementById('deuda-import-status');
  if(!f||!f.files.length){st.textContent='❌ Seleccioná un archivo CSV.';return;}
  const text=await f.files[0].text();
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  const header=lines[0].toLowerCase().split(',').map(h=>h.trim().replace(/"/g,''));
  // Detectar columna identificadora según tipo
  let iId=-1;
  if(tab==='rural'){
    iId=Math.max(header.findIndex(h=>h.includes('partida')),header.findIndex(h=>h.includes('cuenta')),header.findIndex(h=>h.includes('nrocuenta')));
  } else if(tab==='cloaca'){
    // Cloacas: acepta padron, ctatasa, cuenta, nrocloaca
    iId=Math.max(
      header.findIndex(h=>h.includes('padron')),
      header.findIndex(h=>h.includes('ctatasa')),
      header.findIndex(h=>h.includes('cuenta')),
      header.findIndex(h=>h.includes('nrocloaca'))
    );
  } else {
    iId=Math.max(header.findIndex(h=>h.includes('padron')),header.findIndex(h=>h.includes('ctatasa')));
  }
  const iDeuda=header.findIndex(h=>h.includes('deuda'));
  if(iId<0||iDeuda<0){st.textContent='❌ No se encontraron las columnas necesarias.';return;}

  const dataset=tab==='rural'?ruralRecords:records;
  let ok=0,miss=0;
  lines.slice(1).forEach(line=>{
    const cols=line.split(',').map(c=>c.trim().replace(/^"|"$/g,''));
    const idVal=cols[iId]||'';
    // Parsear monto con formato argentino: quitar puntos de miles, reemplazar coma decimal por punto
    const montoRaw=(cols[iDeuda]||'').trim().replace(/[$ ]/g,'');
    // Detectar formato: si tiene coma (1.234.567,89) → coma es decimal; si solo puntos (1.234.567) → puntos son miles
    let montoStr;
    if(montoRaw.includes(',')){ montoStr=montoRaw.replace(/\./g,'').replace(',','.'); }
    else { montoStr=montoRaw.replace(/\./g,''); } // puntos de miles sin decimal
    const monto=parseFloat(montoStr)||0;
    if(!idVal) return;
    let idx=-1;
    if(tab==='rural'){
      // Buscar por nroCuenta (número de cuenta rural, ej: "000015") o partida
      idx=dataset.findIndex(r=>
        String(r.nroCuenta||'')===idVal||
        String(r.nroCuenta||'').replace(/^0+/,'')===idVal.replace(/^0+/,'')||
        String(r.partida||'')===idVal
      );
    } else if(tab==='cloaca'){
      // Cloacas: buscar por nroCloaca (número de cuenta cloacal) o padron
      idx=dataset.findIndex(r=>
        String(r.nroCloaca||'')===idVal||
        String(r.nroCloaca||'').replace(/^0+/,'')===idVal.replace(/^0+/,'')||
        String(r.padron||'')===idVal||
        String(r.ctaTasa||'')===idVal
      );
    } else {
      idx=dataset.findIndex(r=>String(r.padron||'')===idVal||String(r.ctaTasa||'')===idVal);
    }
    if(idx>=0){
      dataset[idx][campo]=monto>0?monto:null;
      // Actualizar fechaMod para que el merge de Drive sepa que este registro cambió
      dataset[idx].fechaMod=new Date().toISOString();
      ok++;
    }else miss++;
  });

  // Guardar — para rural usar try/catch más robusto
  if(tab==='rural'){
    try{
      // Guardar en chunks si es necesario
      // No guardar en localStorage con Drive — datos en memoria
      if(!DRIVE_API_URL||!DRIVE_TOKEN){try{localStorage.setItem(RURAL_KEY,JSON.stringify(ruralRecords));}catch(e){}}
    }catch(e_unused){
      // Si falla localStorage (quota exceeded), continuar de todas formas — está en memoria
      console.warn('localStorage lleno para rural, datos en memoria. Subiendo a Drive...');
    }
  } else {
    saveData();
  }
  // Guardar fecha y usuario de la última actualización de deudas
  const ahora=new Date().toISOString();
  const usuarioActual=(()=>{try{const s=localStorage.getItem('catastro_session');if(s){const u=JSON.parse(s);return u.nombre||u.usuario||'';}}catch(e){}return '';})();
  const claveDeudaUpd='catastro_deuda_upd_'+tab;
  const infoUpd={fecha:ahora,usuario:usuarioActual,ok,miss};
  try{localStorage.setItem(claveDeudaUpd,JSON.stringify(infoUpd));}catch(e){}
  // Subir a Drive inmediatamente para que otras PCs vean los datos actualizados
  pushToDrive(true);
  // Segundo push con delay por si el primero es muy rápido
  setTimeout(()=>pushToDrive(true),3000);
  const pct=ok>0?` (${Math.round(ok/(ok+miss)*100)}% match)`:'';
  st.textContent=`✅ ${ok} actualizados · ${miss} no encontrados${pct} — Subiendo a Drive...`;
  if(['mejoras','vivienda','varias'].includes(tab)) window._deudaTab='tasa';
  setTimeout(()=>{document.getElementById('modal-import-deuda')?.remove();rDeuda(document.getElementById('app'));},2500);
}

function exportarDeudaCSVActiva(){
  const tab=window._deudaTab||'tasa';
  const campoMap={tasa:'deudaTasa',cloaca:'deudaCloaca',rural:'deudaRural',mejoras:'deudaMejoras',vivienda:'deudaVivienda',varias:'deudaTasasVarias'};
  const campo=campoMap[tab]||'deudaTasa';
  const fname={tasa:'tasa_tgiu',cloaca:'cloacas',rural:'rural',dri:'dri',mejoras:'mejoras',vivienda:'vivienda',varias:'tasas_varias'};
  const cev=v=>{const s=String(v??'').replace(/"/g,'""');return /[,"\n]/.test(s)?'"'+s+'"':s;};
  let csv='\uFEFF';
  if(tab==='dri'){
    const l=driRecords.filter(r=>r.deudaDRI&&r.montoDeuda&&parseFloat(r.montoDeuda)>0).sort((a,b)=>parseFloat(b.montoDeuda||0)-parseFloat(a.montoDeuda||0));
    csv+='Cuenta,Razón Social,Titular,Rubro,Estado,Deuda\n'+l.map(r=>[cev(r.cuenta),cev(r.razonSocial),cev(r.titular),cev(r.rubro),cev(r.estado),cev(r.montoDeuda)].join(',')).join('\n');
  } else if(tab==='rural'){
    const l=ruralRecords.filter(r=>r[campo]&&parseFloat(r[campo])>0).sort((a,b)=>parseFloat(b[campo])-parseFloat(a[campo]));
    csv+='Titular,Partida,N°Cuenta,Hectáreas,Deuda\n'+l.map(r=>[cev(r.titular),cev(r.partida),cev(r.nroCuenta),cev(r.hectareas),cev(r[campo])].join(',')).join('\n');
  } else {
    const l=records.filter(r=>r[campo]&&parseFloat(r[campo])>0).sort((a,b)=>parseFloat(b[campo])-parseFloat(a[campo]));
    csv+='Padrón,Titular,Manzana,Lote,Calle,Número,Deuda\n'+l.map(r=>[cev(r.padron),cev(r.titular),cev(r.manzana),cev(r.lote),cev(r.calle),cev(r.numero),cev(r[campo])].join(',')).join('\n');
  }
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const el=document.createElement('a');
  el.href=url; el.download=`deudas_${fname[tab]||tab}_alcorta_${new Date().toISOString().slice(0,10)}.csv`; el.click();
  URL.revokeObjectURL(url);
}

async function procesarImportDRI(){
  const f=document.getElementById('dri-import-file');
  const st=document.getElementById('dri-import-status');
  if(!f||!f.files.length){st.textContent='❌ Seleccioná un archivo CSV.';return;}
  st.textContent='Procesando...';
  const text=await f.files[0].text();
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  const header=lines[0].toLowerCase().split(',').map(h=>h.trim().replace(/"/g,''));
  const iCuenta=header.findIndex(h=>h.includes('cuenta'));
  const iContrib=header.findIndex(h=>h.includes('contribuyente'));
  const iCuim=header.findIndex(h=>h.includes('cuim'));
  const iComercio=header.findIndex(h=>h.includes('comercio'));
  const iCuit=header.findIndex(h=>h.includes('cuit')||h.includes('c.u.i.t'));
  const iAlta=header.findIndex(h=>h.includes('alta'));
  const iBaja=header.findIndex(h=>h.includes('baja'));
  const iEstado=header.findIndex(h=>h.includes('estado'));
  if(iCuenta<0||iContrib<0){st.textContent='❌ No se encontraron columnas Cuenta y Contribuyente.';return;}
  let nuevos=0,actualizados=0;
  const ahora=new Date().toISOString();
  lines.slice(1).forEach((line,i)=>{
    const cols=line.split(',').map(c=>c.trim().replace(/^"|"$/g,''));
    const cuenta=cols[iCuenta]||'';
    if(!cuenta) return;
    const estadoRaw=(iEstado>=0?cols[iEstado]:'NORMAL').toUpperCase();
    const baja=iBaja>=0&&cols[iBaja]?cols[iBaja]:null;
    const estado=estadoRaw==='NORMAL'&&!baja?'habilitado':baja?'clausurado':'vencido';
    const rec={
      id:'dri_imp_'+cuenta,
      cuenta, titular:cols[iContrib]||'', razonSocial:cols[iContrib]||'',
      cuim:iCuim>=0?cols[iCuim]:'', fantasia:iComercio>=0?cols[iComercio]:'',
      cuit:iCuit>=0?cols[iCuit]:'', dni:iCuit>=0?cols[iCuit]:'',
      fechaHabilitacion:iAlta>=0&&cols[iAlta]?cols[iAlta]:null,
      fechaBaja:baja, estado, rubro:'', montoDRI:null, deudaDRI:false,
      lat:null, lon:null, padronVinculado:'', obsDRI:'',
      fechaMod:ahora, usuario:'Importación CSV', importado:true
    };
    const idx=driRecords.findIndex(x=>x.cuenta===cuenta||x.id==='dri_imp_'+cuenta);
    if(idx>=0){
      driRecords[idx]={...driRecords[idx],...rec,lat:driRecords[idx].lat,lon:driRecords[idx].lon,rubro:driRecords[idx].rubro||''};
      actualizados++;
    } else {
      driRecords.push(rec);
      nuevos++;
    }
  });
  saveDRI();
  pushToDrive(true);
  st.textContent=`✅ ${nuevos} nuevos · ${actualizados} actualizados`;
  setTimeout(()=>{document.getElementById('modal-import-dri')?.remove();goDRI();},2000);
}

// ── CROQUIS DE MANZANA PARA PDF ───────────────────────────────────────────────
function generarCroquisManzana(r){
  if(!geoData) return null;

  // Encontrar la parcela vinculada
  const handle=r.padron?geoLinks[String(r.padron)]:null;
  if(!handle) return null;
  const featParcela=geoData.features.find(f=>f.properties.handle===handle);
  if(!featParcela) return null;

  // Encontrar la manzana que contiene esta parcela
  const mzHandle=Object.keys(mzLinks).find(mh=>{
    const mz=mzData.find(m=>m.handle===mh);
    return mz&&mz.lotes&&mz.lotes.includes(handle);
  });
  const mzNum=mzHandle?mzLinks[mzHandle]:null;

  // Obtener todas las parcelas de la misma manzana
  let vecinas=[];
  if(mzHandle){
    const mz=mzData.find(m=>m.handle===mzHandle);
    if(mz&&mz.lotes){
      vecinas=geoData.features.filter(f=>mz.lotes.includes(f.properties.handle)&&f.properties.handle!==handle);
    }
  }

  // Calcular bounding box de toda la manzana (parcela + vecinas)
  const todasFeats=[featParcela,...vecinas];
  const allCoords=todasFeats.flatMap(f=>f.geometry.coordinates[0]);
  const lons=allCoords.map(c=>c[0]); const lats=allCoords.map(c=>c[1]);
  // Margen mínimo alrededor de la manzana (solo 5% del tamaño)
  const pad=0.000008;
  const minLon=Math.min(...lons)-pad, maxLon=Math.max(...lons)+pad;
  const minLat=Math.min(...lats)-pad, maxLat=Math.max(...lats)+pad;
  const dLon=maxLon-minLon; const dLat=maxLat-minLat;

  // Canvas
  const CW=1200, CH=1000, M=28;
  const W=CW-M*2, H=CH-M*2;
  const latMid=(minLat+maxLat)/2;
  const latRad=Math.cos(Math.PI*latMid/180);
  const aspGeo=(dLon*latRad)/dLat;
  const aspCv=W/H;
  let scaleX,scaleY,offX=M,offY=M;
  if(aspGeo>aspCv){ scaleX=W/dLon; scaleY=(W/aspGeo)/dLat; offY=M+(H-dLat*scaleY)/2; }
  else { scaleY=H/dLat; scaleX=(H*aspGeo)/dLon; offX=M+(W-dLon*scaleX)/2; }

  const toXY=([lon,lat])=>([
    offX+(lon-minLon)*scaleX,
    offY+(maxLat-lat)*scaleY
  ]);

  // Crear canvas
  const cv=document.createElement('canvas');
  cv.width=CW; cv.height=CH;
  const ctx=cv.getContext('2d');

  // Fondo
  ctx.fillStyle='#f5f7fa';
  ctx.fillRect(0,0,CW,CH);

  // Dibujar calles (área exterior)
  ctx.fillStyle='#e8e0d0';
  ctx.fillRect(0,0,CW,CH);
  // Fondo de manzana
  ctx.fillStyle='#f5f7fa';
  const mzCoords=todasFeats.flatMap(f=>f.geometry.coordinates[0]);
  ctx.beginPath();
  todasFeats.forEach(f=>{
    const coords=f.geometry.coordinates[0];
    const [x0,y0]=toXY(coords[0]);
    ctx.moveTo(x0,y0);
    coords.slice(1).forEach(c=>{const [x,y]=toXY(c);ctx.lineTo(x,y);});
    ctx.closePath();
  });
  ctx.fill();

  // Dibujar parcelas vecinas
  vecinas.forEach(f=>{
    const coords=f.geometry.coordinates[0];
    const [x0,y0]=toXY(coords[0]);
    ctx.beginPath(); ctx.moveTo(x0,y0);
    coords.slice(1).forEach(c=>{const [x,y]=toXY(c);ctx.lineTo(x,y);});
    ctx.closePath();
    ctx.fillStyle='#dde4f0';
    ctx.fill();
    ctx.strokeStyle='#9aaac8'; ctx.lineWidth=1; ctx.stroke();
    // Número de padrón vecino
    const cx=coords.reduce((s,c)=>s+c[0],0)/coords.length;
    const cy=coords.reduce((s,c)=>s+c[1],0)/coords.length;
    const [tx,ty]=toXY([cx,cy]);
    // Buscar padrón por handle
    const padVec=Object.keys(geoLinks).find(p=>geoLinks[p]===f.properties.handle);
    if(padVec){
      ctx.fillStyle='#7a8faa'; ctx.font='bold 9px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(padVec,tx,ty);
    }
  });

  // Dibujar LA PARCELA SELECCIONADA (destacada en naranja/amarillo)
  const coords=featParcela.geometry.coordinates[0];
  const [x0,y0]=toXY(coords[0]);
  ctx.beginPath(); ctx.moveTo(x0,y0);
  coords.slice(1).forEach(c=>{const [x,y]=toXY(c);ctx.lineTo(x,y);});
  ctx.closePath();
  ctx.fillStyle='#ffd166'; ctx.fill();
  ctx.strokeStyle='#e05c00'; ctx.lineWidth=2.5; ctx.stroke();

  // Medidas de cada lado de la parcela
  const mPerLat=111000; const mPerLon=111000*Math.cos(Math.PI*latMid/180);
  const pts=coords.slice(0,-1); // sin el punto de cierre
  for(let i=0;i<pts.length;i++){
    const a=pts[i], b=pts[(i+1)%pts.length];
    const [ax,ay]=toXY(a); const [bx,by]=toXY(b);
    const mx=(ax+bx)/2, my=(ay+by)/2;
    const lenPx=Math.hypot(bx-ax,by-ay);
    if(lenPx<18) continue;
    const dx=(b[0]-a[0])*mPerLon, dy=(b[1]-a[1])*mPerLat;
    const metros=Math.round(Math.sqrt(dx*dx+dy*dy)*100)/100;
    const ang=Math.atan2(by-ay,bx-ax);
    const nx=Math.sin(ang)*-16, ny=Math.cos(ang)*16;
    ctx.save();
    ctx.translate(mx+nx,my-ny);
    ctx.rotate(ang>Math.PI/2||ang<-Math.PI/2?ang+Math.PI:ang);
    const label=metros.toFixed(2)+' m';
    const tw=ctx.measureText(label).width+8;
    ctx.fillStyle='rgba(255,255,255,0.92)'; ctx.fillRect(-tw/2,-9,tw,18);
    ctx.fillStyle='#c04000'; ctx.font='bold 11px Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(label,0,0);
    ctx.restore();
  }

  // Etiqueta central de la parcela
  const cx2=pts.reduce((s,c)=>s+c[0],0)/pts.length;
  const cy2=pts.reduce((s,c)=>s+c[1],0)/pts.length;
  const [tx2,ty2]=toXY([cx2,cy2]);
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.fillRect(tx2-38,tx2-38,76,32);
  ctx.fillRect(tx2-38,ty2-16,76,32);
  ctx.fillStyle='#8b3a00'; ctx.font='bold 12px Arial';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('Padrón '+r.padron,tx2,ty2-4);
  if(r.manzana){ ctx.font='10px Arial'; ctx.fillStyle='#555'; ctx.fillText('Mz '+r.manzana+' L '+r.lote,tx2,ty2+10); }

  // Etiquetas de calles en los bordes del canvas
  ctx.font='bold 11px Arial'; ctx.fillStyle='#333';
  const calles={N:r.calle||'',S:'',E:'',O:''};
  if(r.entreCalles){
    const p=r.entreCalles.split(/\s+[yY&/]\s+/);
    calles.S=p[0]||''; calles.N=calles.N||p[1]||'';
  }
  if(r.croquis&&r.croquis.calles){
    if(r.croquis.calles.N) calles.N=r.croquis.calles.N;
    if(r.croquis.calles.S) calles.S=r.croquis.calles.S;
    if(r.croquis.calles.E) calles.E=r.croquis.calles.E;
    if(r.croquis.calles.O) calles.O=r.croquis.calles.O;
  }

  const drawCalle=(texto,x,y,rotacion)=>{
    if(!texto) return;
    ctx.save();
    ctx.translate(x,y); ctx.rotate(rotacion);
    const tw=ctx.measureText(texto).width+14;
    ctx.fillStyle='#e8e0d0'; ctx.fillRect(-tw/2,-12,tw,24);
    ctx.fillStyle='#333'; ctx.font='bold 12px Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(texto.toUpperCase(),0,0);
    ctx.restore();
  };

  drawCalle(calles.N,  CW/2,    14,     0);
  drawCalle(calles.S,  CW/2,    CH-14,  0);
  drawCalle(calles.E,  CW-14,   CH/2,   -Math.PI/2);
  drawCalle(calles.O,  14,      CH/2,   Math.PI/2);
  drawCalle(calles.NE, CW-14,   14,     -Math.PI/4);
  drawCalle(calles.NO, 14,      14,     Math.PI/4);
  drawCalle(calles.SE, CW-14,   CH-14,  -Math.PI*3/4);
  drawCalle(calles.SO, 14,      CH-14,  Math.PI*3/4);

  // Flecha Norte
  ctx.fillStyle='#333'; ctx.font='bold 14px Arial'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('N↑', CW-40, 6);

  // Manzana
  if(mzNum){
    ctx.font='bold 13px Arial'; ctx.fillStyle='#2d5fa8'; ctx.textAlign='right';
    ctx.fillText('Mz '+mzNum, CW-8, CH-18);
  }

  return cv.toDataURL('image/png');
}

async function doLogin(){
  const u=document.getElementById('login-user').value.trim();
  const p=document.getElementById('login-pass').value;
  const err=document.getElementById('login-error');
  const btn=document.querySelector('#login-form button, button[onclick*="doLogin"]');
  if(!u||!p){err.style.display='block';err.textContent='Completá usuario y contraseña.';return;}
  // Indicador de "verificando..."
  err.style.display='block';
  err.style.color='var(--text3)';
  err.textContent='Verificando...';
  if(btn) btn.disabled=true;
  const res = await login(u,p);
  if(btn) btn.disabled=false;
  if(res.ok){
    err.style.color='var(--text3)';
    err.textContent='✅ Bajando datos del sistema...';
    // Bajar datos del backend DESPUÉS del login (no antes, porque antes no había sesión)
    if(DRIVE_API_URL&&DRIVE_TOKEN){
      // Limpiar localStorage de datos pesados — siempre venimos de Drive
      [DB_KEY, RURAL_KEY, DRI_KEY, 'catastro_historial', 'catastro_backup_historial'].forEach(k=>{
        try{localStorage.removeItem(k);}catch(e){}
      });
      try{
        await pullFromDrive(false);
      }catch(e){
        console.warn('Error bajando datos post-login:', e);
      }
      // Bajar GeoJSON también (mapas, cloacas, rural)
      try{
        const esNuevaPc = !localStorage.getItem('catastro_last_sync');
        sincronizarGeoJSON(esNuevaPc, ()=>{ filter(); render(); });
      }catch(e){
        console.warn('Error bajando GeoJSON post-login:', e);
      }
    }
    err.style.display='none';
    err.style.color='';
    filter();
    view='list';render();
  } else {
    err.style.display='block';
    err.style.color='';
    err.textContent = res.error || 'Usuario o contraseña incorrectos.';
    document.getElementById('login-pass').value='';
    document.getElementById('login-pass').focus();
  }
}

  const nivelLabel=['No ver','Ver','Editar','Import/Export'];

  const modal=document.createElement('div');
  modal.id='modal-permisos';
  modal.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:99999;display:flex;align-items:center;justify-content:center;font-family:Inter,sans-serif';

  const filas=MODULOS.map(m=>{
    const niv=p[m.id]||0;
    const radios=nivelLabel.map((lbl,ni)=>`
      <label style="display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:6px;cursor:${esAdmin?'not-allowed':'pointer'};background:${niv===ni?nivelColor[ni]+'22':'transparent'};border:1px solid ${niv===ni?nivelColor[ni]:'transparent'}">

        <span style="color:${nivelColor[ni]};font-size:11px;font-weight:600">${lbl}</span>
      </label>`).join('');
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);flex-wrap:wrap">
      <div style="min-width:130px">
        <div style="font-size:13px;font-weight:600">${m.label}</div>
        <div style="font-size:10px;color:var(--text3)">${m.desc}</div>
      </div>
      <div style="display:flex;gap:4px;flex-wrap:wrap">${radios}</div>
    </div>`;
  }).join('');

  modal.innerHTML=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px 28px;max-width:640px;width:95%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)">

    </p>
    ${filas}
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button onclick="document.getElementById('modal-permisos').remove()"
        style="padding:8px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:13px;cursor:pointer">Cancelar</button>
      ${esAdmin?'':`<button onclick="guardarPermisosUsuario('${esc(usuarioTarget)}')"
        style="padding:8px 20px;background:#7c3aed;border:1px solid #6d28d9;border-radius:8px;color:#fff;font-size:13px;font-weight:600;cursor:pointer">💾 Guardar permisos</button>`}

function actualizarPermisoBadge(modId, nivel, radioEl){
  // Actualizar colores de los labels al cambiar selección
  const container=radioEl.closest('div[style*="display:flex;align-items:center;gap:4px"]');
  if(!container) return;
  const nivelColor=['#6b7280','#3b82f6','#16a34a','#7c3aed'];
  container.querySelectorAll('label').forEach((lbl,i)=>{
    const isSelected=(i===nivel);
    lbl.style.background=isSelected?nivelColor[i]+'22':'transparent';
    lbl.style.border='1px solid '+(isSelected?nivelColor[i]:'transparent');
  });
}

function guardarPermisosUsuario(usuarioTarget){
  const usuarios=getUsuarios();
  const idx=usuarios.findIndex(u=>u.usuario===usuarioTarget);
  if(idx<0) return;
  const nuevosPermisos={};
  MODULOS.forEach(m=>{
    const radios=document.querySelectorAll('input[name="perm_'+m.id+'"]');
    radios.forEach(r=>{if(r.checked) nuevosPermisos[m.id]=parseInt(r.value);});
    if(nuevosPermisos[m.id]===undefined) nuevosPermisos[m.id]=0;
  });
  usuarios[idx].permisos=nuevosPermisos;
  saveUsuariosMeta(usuarios);
  // Los permisos viven solo en localStorage (no son contraseñas). No se sincronizan
  // al backend porque cada PC puede tener su propia config de permisos por usuario.
  document.getElementById('modal-permisos').remove();
  // Si el usuario modificado es el actual, actualizar currentUser en sesión
  if(usuarioTarget===currentUser.usuario){
    currentUser.permisos=nuevosPermisos;
    saveSession(currentUser);
  }
  const toast=document.createElement('div');
  toast.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#7c3aed;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;z-index:99999;box-shadow:0 4px 20px rgba(0,0,0,.3)';
  toast.textContent='✅ Permisos de '+usuarios[idx].nombre+' guardados';
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(),3000);
  render();
}
