    <!-- LEYENDA + MAPA -->
    <div style="display:flex;flex:1;overflow:hidden;position:relative">
      <!-- MAPA -->
      <div id="dash-map" style="flex:1;z-index:0"></div>

      <!-- PANEL LATERAL LEYENDA (colapsable) -->
      <div id="dash-leyenda" style="width:180px;background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;padding:10px;flex-shrink:0;font-size:11px">
        <div style="font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Leyenda</div>
        <div id="leyenda-content"></div>
      </div>
    </div>
  </div>`;

  setTimeout(initDashMap, 100);
}

// ── Colores y estilos por capa ─────────────────────────────────────────────
const DASH_COLORS = {
  parcela:    {fill:'#3b82f6', stroke:'#1d4ed8', opacity:0.25},
  cloaca_con: {fill:'#22c55e', stroke:'#15803d', opacity:0.4},
  cloaca_sin: {fill:'#f87171', stroke:'#dc2626', opacity:0.2},
  deudor:     {fill:'#f97316', stroke:'#c2410c', opacity:0.5},
  rural:      {fill:'#84cc16', stroke:'#4d7c0f', opacity:0.3},
};

function initDashMap(){
  if(typeof L==='undefined'){
    if(!document.getElementById('leaflet-js')){
      const s=document.createElement('script');
      s.id='leaflet-js';
      s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      s.onload=()=>setTimeout(initDashMap,300);
      document.head.appendChild(s);
    } else {
      setTimeout(initDashMap,300);
    }
    return;
  }
  const el = document.getElementById('dash-map');
  if(!el) return;
  if(dashMap){try{dashMap.remove();}catch(e){} dashMap=null;}

  const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OSM',maxZoom:20,
    errorTileUrl:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='
  });
  const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
    attribution:'© Esri',maxZoom:20,
    errorTileUrl:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='
  });

  dashMap = L.map(el, {layers:[streets], zoomControl:true});
  dashMap._dashStreets = streets;
  dashMap._dashSat = sat;
  dashMap._usingSat = false;

  // Centro en Alcorta
  dashMap.setView([-33.543, -61.120], 14);

  // Si hay GeoData, centrar en las parcelas
  if(geoData && geoData.features && geoData.features.length > 0){
    try{
      const tmp = L.geoJSON(geoData);
      dashMap.fitBounds(tmp.getBounds(), {padding:[20,20]});
    }catch(e){}
  }

  dashLayers = {};
  // Renderizar capa inicial: parcelas activadas
  dashLayerVisible = {parcelas:true,cloacas:false,dri:false,rural:false,calles:false,deudores:false,numeracion:false};
  dashRenderCapas();
  dashActualizarBotones();
  dashActualizarLeyenda();
}

// ── Toggle de capa ────────────────────────────────────────────────────────────
function dashToggle(capa){
  dashLayerVisible[capa] = !dashLayerVisible[capa];
  // Deudores y Parcelas son mutuamente excluyentes para claridad visual
  if(capa==='deudores' && dashLayerVisible.deudores){
    // deudores ya incluye las parcelas coloreadas
  }
  dashRenderCapas();
  dashActualizarBotones();
  dashActualizarLeyenda();
}

function dashToggleSat(){
  if(!dashMap) return;
  dashMap._usingSat = !dashMap._usingSat;
  if(dashMap._usingSat){
    dashMap.removeLayer(dashMap._dashStreets);
    dashMap.addLayer(dashMap._dashSat);
    document.getElementById('btn-dash-sat').style.background='#3b82f622';
    document.getElementById('btn-dash-sat').style.color='#60a5fa';
  } else {
    dashMap.removeLayer(dashMap._dashSat);
    dashMap.addLayer(dashMap._dashStreets);
    document.getElementById('btn-dash-sat').style.background='var(--surface2)';
    document.getElementById('btn-dash-sat').style.color='var(--text2)';
  }
}

function dashCentrar(){
  if(!dashMap) return;
  if(geoData && geoData.features && geoData.features.length > 0){
    try{
      const tmp = L.geoJSON(geoData);
      dashMap.fitBounds(tmp.getBounds(), {padding:[20,20]});
    }catch(e){ dashMap.setView([-33.543,-61.120],14); }
  } else {
    dashMap.setView([-33.543,-61.120],14);
  }
}

// ── Renderizar todas las capas activas ────────────────────────────────────────
function dashRenderCapas(){
  if(!dashMap) return;
  // Limpiar capas anteriores
  Object.values(dashLayers).forEach(l=>{if(l){try{dashMap.removeLayer(l);}catch(e){}}});
  dashLayers = {};

  // Orden de rendering: calles abajo, luego parcelas/rural, luego cloacas, luego DRI encima
  if(dashLayerVisible.calles) dashRenderCalles();
  if(dashLayerVisible.rural)  dashRenderRural();
  if(dashLayerVisible.parcelas && !dashLayerVisible.deudores) dashRenderParcelas();
  if(dashLayerVisible.deudores) dashRenderDeudores();
  if(dashLayerVisible.cloacas)  dashRenderCloacas();
  if(dashLayerVisible.numeracion) dashRenderNumeracion();
  if(dashLayerVisible.dri)    dashRenderDRI();
}

// ── Capa: Parcelas catastrales ───────────────────────────────────────────────
function dashRenderParcelas(){
  if(!geoData||!geoData.features||!geoData.features.length) return;
  // Mapa: handle → record (para popup)
  const handleToRec = {};
  records.forEach(r=>{ if(r.padron && geoLinks[r.padron]) handleToRec[geoLinks[r.padron]] = r; });

  dashLayers.parcelas = L.geoJSON(geoData, {
    style: f => {
      const r = handleToRec[f.properties.handle];
      const tieneCloaca = r && r.tieneCloaca;
      return {
        fillColor: tieneCloaca ? '#22c55e' : '#3b82f6',
        color: tieneCloaca ? '#15803d' : '#1d4ed8',
        weight: 0.8,
        fillOpacity: 0.22,
        opacity: 0.7
      };
    },
    onEachFeature: (f, layer) => {
      const r = handleToRec[f.properties.handle];
      layer.on('click', e => {
        L.DomEvent.stopPropagation(e);
        dashMiniCard(r, e.latlng);
      });
      if(r) layer.bindTooltip(r.titular||r.padron||'', {sticky:true, className:'leaflet-tooltip', direction:'top'});
    }
  }).addTo(dashMap);
}

// ── Capa: Deudores (parcelas con deuda) ───────────────────────────────────────
function dashRenderDeudores(){
  if(!geoData||!geoData.features||!geoData.features.length) return;
  const handleToRec = {};
  records.forEach(r=>{ if(r.padron && geoLinks[r.padron]) handleToRec[geoLinks[r.padron]] = r; });
  const esDeudor = r => r && (parseFloat(r.deudaTasa||0)>0 || parseFloat(r.deudaCloaca||0)>0);

  dashLayers.deudores = L.geoJSON(geoData, {
    style: f => {
      const r = handleToRec[f.properties.handle];
      const deuda = esDeudor(r);
      return {
        fillColor: deuda ? '#f97316' : '#3b82f6',
        color: deuda ? '#c2410c' : '#1d4ed8',
        weight: deuda ? 1.5 : 0.5,
        fillOpacity: deuda ? 0.55 : 0.1,
        opacity: deuda ? 1 : 0.4
      };
    },
    onEachFeature: (f, layer) => {
      const r = handleToRec[f.properties.handle];
      if(!r) return;
      layer.on('click', e => { L.DomEvent.stopPropagation(e); dashMiniCard(r, e.latlng); });
      const deuda = parseFloat(r.deudaTasa||0)+parseFloat(r.deudaCloaca||0);
      if(deuda>0) layer.bindTooltip((r.titular||r.padron||'')+' — $'+Math.round(deuda).toLocaleString('es-AR'), {sticky:true, direction:'top'});
    }
  }).addTo(dashMap);

  // También marcadores para deudores rurales con coordenadas
  const mkGroup = L.layerGroup().addTo(dashMap);
  ruralRecords.filter(r=>parseFloat(r.deudaRural||0)>0).forEach(r=>{
    if(!r.lat||!r.lon) return;
    L.circleMarker([r.lat,r.lon],{radius:7,color:'#c2410c',fillColor:'#f97316',fillOpacity:0.8,weight:2})
      .bindTooltip((r.titular||'')+' — $'+Math.round(r.deudaRural||0).toLocaleString('es-AR'),{direction:'top'})
      .addTo(mkGroup);
  });
  dashLayers.deudores_rural = mkGroup;
}

// ── Capa: Red de cloacas ─────────────────────────────────────────────────────
function dashRenderCloacas(){
  if(!geoCloacas||!geoCloacas.features||!geoCloacas.features.length){
    // Intentar descargar de Drive automáticamente
    if(DRIVE_API_URL&&DRIVE_TOKEN){
      const btn = document.getElementById('toggle-cloacas');
      if(btn){ btn.textContent='🚿 Descargando...'; btn.style.opacity='0.6'; }
      bajarGeoJSON('catastro_cloacas.geojson','catastro_geo_cloacas',(ok,data)=>{
        if(ok&&data){
          geoCloacas=data;
          try{localStorage.setItem('catastro_geo_version_catastro_geo_cloacas',new Date().toISOString());}catch(e){}
          // Re-renderizar ahora que tenemos el GeoJSON
          dashRenderCapas();
          dashActualizarBotones();
          dashActualizarLeyenda();
        } else {
          const b = document.getElementById('toggle-cloacas');
          if(b){ b.textContent='🚿 Cloacas ⚠️ (no encontrado en Drive)'; b.style.opacity='1'; }
          dashLayerVisible.cloacas = false;
          dashActualizarBotones();
        }
      });
      return; // esperar callback
    }
    const el = document.getElementById('toggle-cloacas');
    if(el){ el.title='Sin plano de cloacas. Importá desde Ajustes → Sección 4.'; el.textContent='🚿 Cloacas ⚠️'; }
    dashLayerVisible.cloacas = false;
    dashActualizarBotones();
    return;
  }
  dashLayers.cloacas = L.geoJSON(geoCloacas, {
    style: f => {
      const t = f.properties&&(f.properties.tipo||f.properties.type||'');
      const esConexion = t.includes('conexion') || t.includes('domicil');
      return {
        color: esConexion ? '#22c55e' : '#06b6d4',
        weight: esConexion ? 2 : 3,
        opacity: 0.85,
        dashArray: esConexion ? '4,3' : null
      };
    },
    pointToLayer: (f,latlng) => L.circleMarker(latlng,{radius:4,color:'#0891b2',fillColor:'#22d3ee',fillOpacity:0.8,weight:1.5}),
    onEachFeature: (f, layer) => {
      const p = f.properties||{};
      const label = p.nro||p.label||p.nombre||p.handle||p.tipo||'Cloacas';
      if(label) layer.bindTooltip(String(label),{sticky:true,direction:'top'});
    }
  }).addTo(dashMap);
}

// ── Capa: DRI (comercios con ubicación) ──────────────────────────────────────
function dashRenderDRI(){
  const conUbic = driRecords.filter(r=>r.lat&&r.lon);
  if(!conUbic.length) return;
  const mkGroup = L.layerGroup();
  conUbic.forEach(r=>{
    const color = r.estado==='clausurado'?'#dc2626':r.estado==='vencido'?'#f59e0b':'#7c3aed';
    const marker = L.circleMarker([r.lat,r.lon],{
      radius: 7, color: color, fillColor: color,
      fillOpacity: 0.75, weight: 2
    });
    marker.bindTooltip(`<b>${r.razonSocial||r.titular||''}</b><br>${r.rubro||''}<br><span style="color:${color}">${r.estado||''}</span>`,
      {direction:'top', sticky:true});
    marker.on('click', ()=>{
      if(dashMap) dashMap.setView([r.lat,r.lon],18);
      goDRIDetalle(r.id);
    });
    marker.addTo(mkGroup);
  });
  dashLayers.dri = mkGroup.addTo(dashMap);
}

// ── Capa: Rural (GeoJSON de parcelas rurales) ─────────────────────────────────
function dashRenderRural(){
  if(ruralGeo&&ruralGeo.features&&ruralGeo.features.length){
    // Índice correcto: handle GeoJSON → ruralRecord
    // ruralLinks mapea: ruralRecord.id → handle
    // Entonces invertimos: handle → record
    const handleToRec = {};
    ruralRecords.forEach(r=>{
      const h = ruralLinks[r.id];
      if(h) handleToRec[String(h)] = r;
    });

    dashLayers.rural = L.geoJSON(ruralGeo, {
      style: f => {
        const r = handleToRec[String(f.properties&&f.properties.handle||'')];
        const tieneDeuda = r && parseFloat(r.deudaRural||0)>0;
        return {
          fillColor: tieneDeuda ? '#f97316' : '#84cc16',
          color: tieneDeuda ? '#c2410c' : '#4d7c0f',
          weight: 1.2,
          fillOpacity: 0.3,
          opacity: 0.8
        };
      },
      onEachFeature: (f, layer) => {
        const handle = String(f.properties&&f.properties.handle||'');
        const r = handleToRec[handle];
        if(r){
          const deuda = parseFloat(r.deudaRural||0);
          const tooltipHtml =
            `<div style="font-family:Inter,sans-serif;font-size:12px;line-height:1.6">` +
            `<b>${r.titular||'Sin titular'}</b><br>` +
            (r.nroCuenta ? `Cuenta: ${r.nroCuenta}<br>` : '') +
            (r.partida   ? `Partida: ${r.partida}<br>`   : '') +
            (r.hectareas ? `🌾 ${r.hectareas} ha<br>`    : '') +
            (deuda>0 ? `<span style="color:#f97316;font-weight:700">💰 $${Math.round(deuda).toLocaleString('es-AR')}</span>` : '') +
            `</div>`;
          layer.bindTooltip(tooltipHtml, {sticky:true, direction:'top', opacity:0.95});
          layer.on('click', e=>{
            L.DomEvent.stopPropagation(e);
            dashMiniCardRural(r, e.latlng);
          });
        } else {
          // Polígono sin vincular: mostrar lo que haya en properties
          const p = f.properties||{};
          const label = p.partida||p.nroCuenta||p.cuenta||p.handle||'Parcela rural';
          layer.bindTooltip(`<i style="color:#9ca3af">Sin vincular — ${label}</i>`, {sticky:true, direction:'top'});
        }
      }
    }).addTo(dashMap);
  } else if(DRIVE_API_URL&&DRIVE_TOKEN){
    // Intentar descargar de Drive
    const btn = document.getElementById('toggle-rural');
    if(btn){ btn.textContent='🌾 Descargando...'; btn.style.opacity='0.6'; }
    bajarGeoJSON('catastro_rural.geojson','catastro_rural_geo',(ok,data)=>{
      if(ok&&data){
        ruralGeo=data;
        dashRenderCapas();
        dashActualizarBotones();
        dashActualizarLeyenda();
      } else {
        // Sin GeoJSON rural: mostrar puntos si tienen coordenadas
        const mkGroup = L.layerGroup();
        ruralRecords.filter(r=>r.lat&&r.lon).forEach(r=>{
          L.circleMarker([r.lat,r.lon],{radius:6,color:'#4d7c0f',fillColor:'#84cc16',fillOpacity:0.7,weight:2})
            .bindTooltip(r.titular||'',{direction:'top'}).addTo(mkGroup);
        });
        dashLayers.rural = mkGroup.addTo(dashMap);
        dashActualizarBotones();
      }
    });
  } else {
    // Sin Drive ni GeoJSON: mostrar puntos si tienen coordenadas
    const mkGroup = L.layerGroup();
    ruralRecords.filter(r=>r.lat&&r.lon).forEach(r=>{
      L.circleMarker([r.lat,r.lon],{radius:6,color:'#4d7c0f',fillColor:'#84cc16',fillOpacity:0.7,weight:2})
        .bindTooltip(r.titular||'',{direction:'top'}).addTo(mkGroup);
    });
    dashLayers.rural = mkGroup.addTo(dashMap);
  }
}

// ── Capa: Calles (polylines coloreadas por estado) ────────────────────────────
function dashRenderCalles(){
  if(!callesData||!callesData.length) return;
  const mkGroup = L.layerGroup();
  callesData.forEach(c=>{
    if(!c.latlngs||!c.latlngs.length) return;
    const estadoColor = c.estado==='malo'?'#dc2626':c.estado==='regular'?'#f59e0b':'#16a34a';
    const weight = c.estado==='malo'?6:c.estado==='regular'?4:3;
    const poly = L.polyline(c.latlngs, {color:estadoColor, weight, opacity:0.85});
    poly.bindTooltip(`<b>${c.nombre||'Calle'}</b><br>${CALLES_TIPOS[c.tipo]?.label||c.tipo} — ${CALLES_ESTADOS[c.estado]?.label||c.estado}`,
      {sticky:true, direction:'top'});
    poly.addTo(mkGroup);
  });
  dashLayers.calles = mkGroup.addTo(dashMap);
}

// ── Capa: Numeración domiciliaria ─────────────────────────────────────────────
function dashRenderNumeracion(){
  if(dashLayers&&dashLayers.numeracion){
    try{dashMap.removeLayer(dashLayers.numeracion);}catch(e){}
    dashLayers.numeracion=null;
  }
  const conNum = records.filter(r=>r.calle&&r.numero&&String(r.numero).trim()&&geoLinks[r.padron]);
  if(!conNum.length || !geoData||!geoData.features) return;
  const handleToRec = {};
  conNum.forEach(r=>{ if(geoLinks[r.padron]) handleToRec[geoLinks[r.padron]]=r; });
  const mkGroup = L.layerGroup();
  geoData.features.forEach(f=>{
    const r = handleToRec[f.properties.handle];
    if(!r) return;
    try{
      const bounds = L.geoJSON(f).getBounds();
      const center = bounds.getCenter();
      L.marker(center,{
        icon: L.divIcon({
          html:`<div style="background:#1d4ed8;color:#fff;padding:1px 5px;border-radius:4px;font-size:10px;font-weight:700;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.4)">${r.numero}</div>`,
          className:'',
          iconAnchor:[15,10]
        })
      }).bindTooltip(`${r.calle} ${r.numero} — ${r.titular||''}`,{direction:'top'}).addTo(mkGroup);
    }catch(e){}
  });
  dashLayers.numeracion = mkGroup.addTo(dashMap);
}

// ── Mini-card al hacer click en una parcela ───────────────────────────────────
function dashMiniCard(r, latlng){
  if(!r||!dashMap) return;
  const deudaTasa = parseFloat(r.deudaTasa||0);
  const deudaCloaca = parseFloat(r.deudaCloaca||0);
  const deudaTotal = deudaTasa + deudaCloaca;
  const popup = L.popup({maxWidth:280, className:'dash-popup'})
    .setLatLng(latlng)
    .setContent(`
      <div style="font-family:Inter,sans-serif;padding:4px">
        <div style="font-size:13px;font-weight:700;margin-bottom:4px;color:#1e293b">${r.titular||'Sin titular'}</div>
        <div style="font-size:11px;color:#64748b;margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap">
          ${r.padron?`<span>📋 Padrón <b>${r.padron}</b></span>`:''}
          ${r.manzana?`<span>🗾 Mz <b>${r.manzana}</b></span>`:''}
          ${r.lote?`<span>Lote <b>${r.lote}</b></span>`:''}
        </div>
        ${(r.calle||r.numero)?`<div style="font-size:11px;color:#64748b;margin-bottom:4px">📍 ${[r.calle,r.numero].filter(Boolean).join(' ')}</div>`:''}
        <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px">
          <span style="padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;background:${r.tieneCloaca?'#dcfce7':'#fee2e2'};color:${r.tieneCloaca?'#16a34a':'#dc2626'}">
            ${r.tieneCloaca?'✓ Con cloaca':'✗ Sin cloaca'}
          </span>
          ${deudaTotal>0?`<span style="padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;background:#ffedd5;color:#c2410c">💰 $${Math.round(deudaTotal).toLocaleString('es-AR')}</span>`:''}
        </div>
        <button onclick="dashMap.closePopup();viewRec('${r.id}')"
          style="width:100%;padding:6px;background:#2d5fa8;color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer">
          Ver ficha completa →
        </button>
      </div>`)
    .openOn(dashMap);
}

// ── Actualizar estado visual de los botones de capa ───────────────────────────
function dashActualizarBotones(){
  const CAPA_CONFIG = {
    parcelas:   {color:'#3b82f6', label:'🏠 Parcelas'},
    cloacas:    {color:'#06b6d4', label:'🚿 Cloacas'},
    dri:        {color:'#7c3aed', label:'🏪 DRI'},
    rural:      {color:'#84cc16', label:'🌾 Rural'},
    calles:     {color:'#f59e0b', label:'🛣️ Calles'},
    deudores:   {color:'#f97316', label:'💰 Deudores'},
    numeracion: {color:'#6366f1', label:'🔢 Numeración'},
  };
  Object.entries(CAPA_CONFIG).forEach(([capa, cfg])=>{
    const btn = document.getElementById('toggle-'+capa);
    if(!btn) return;
    const activa = dashLayerVisible[capa];
    btn.style.border = `2px solid ${activa?cfg.color:'#444'}`;

// ── SINCRONIZACIÓN DE GEOJSON ─────────────────────────────────────────────────
const GEO_FILES = [
  {key:'catastro_geo',        archivo:'catastro_parcelas.geojson',   label:'Plano catastral',    storage:'catastro_geo'},
  // cloacas se baja aparte al abrir (bajada explícita con guardia por cantidad)
  {key:'catastro_mz_data',    archivo:'catastro_manzanas.json',      label:'Datos de manzanas',  storage:MZ_DATA_KEY},
  {key:'catastro_rural_geo',  archivo:'catastro_rural.geojson',      label:'Plano rural',        storage:'catastro_rural_geo'},
];

async function subirGeoJSON(key, data, archivo){
  if(!DRIVE_API_URL||!DRIVE_TOKEN) return false;
  const json = typeof data === 'string' ? data : JSON.stringify(data);
  const version = new Date().toISOString();
  // Envío CONFIABLE: fetch no-cors + text/plain (lo parsea doPost por e.postData).
  // accion 'guardarArchivo' NO coincide con 'guardarTodo', así el backend cae en el
  // branch de escritura de archivo arbitrario (p.archivo + p.data) y NUNCA toca el backup.
  const body = JSON.stringify({token:DRIVE_TOKEN, accion:'guardarArchivo', archivo:archivo, data:json});
  try{
    await fetch(DRIVE_API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body});
    await new Promise(r=>setTimeout(r,900));
    localStorage.setItem('catastro_geo_version_'+key, version);
    console.log('[subirGeoJSON] enviado: '+archivo+' ('+Math.round(json.length/1024)+'KB)');
    return true;
  }catch(e){
    console.warn('[subirGeoJSON] error enviando '+archivo+':', e);
    return false;
  }
}

// checkGeoVersion y bajarGeoJSON usan JSONP (igual que pullFromDrive) para evitar
// problemas de CORS con el Apps Script de Google Drive.
function checkGeoVersion(archivo, callback){
  if(!DRIVE_API_URL||!DRIVE_TOKEN){callback(null);return;}
  const cbName='_geoVer_'+Math.random().toString(36).slice(2);
  const to=setTimeout(()=>{delete window[cbName];try{document.head.removeChild(s);}catch(e){}callback(null);},8000);
  window[cbName]=function(data){
    clearTimeout(to);delete window[cbName];try{document.head.removeChild(s);}catch(e){}
    if(!data||data==='vacio'){callback(null);return;}
    if(typeof data==='string'){try{callback(JSON.parse(data));}catch(e){callback(null);}}
    else{callback(data);}
  };
  const s=document.createElement('script');
  s.src=DRIVE_API_URL+'?token='+encodeURIComponent(DRIVE_TOKEN)+'&archivo='+encodeURIComponent(archivo+'.version')+'&callback='+cbName+'&t='+Date.now();
  s.onerror=()=>{clearTimeout(to);delete window[cbName];try{document.head.removeChild(s);}catch(e){}callback(null);};
  document.head.appendChild(s);
}

function bajarGeoJSON(archivo, storageKey, onSuccess){
  if(!DRIVE_API_URL||!DRIVE_TOKEN){ onSuccess(false); return; }
  const cbName='_geoDown_'+Math.random().toString(36).slice(2);
  // Timeout generoso para archivos grandes (GeoJSON de cloacas puede ser pesado)
  const to=setTimeout(()=>{delete window[cbName];try{document.head.removeChild(s);}catch(e){}onSuccess(false);},30000);
  window[cbName]=function(data){
    clearTimeout(to);delete window[cbName];try{document.head.removeChild(s);}catch(e){}
    if(!data||data==='vacio'){onSuccess(false);return;}
    try{
      // El Apps Script puede devolver el JSON como string o como objeto
      const parsed=(typeof data==='string')?JSON.parse(data):data;
      if(!parsed){onSuccess(false);return;}
      // GeoJSON: necesita features. Arrays (mzData): necesita length.
      const esGeoJSON=parsed.features&&parsed.features.length>0;
      const esArray=Array.isArray(parsed)&&parsed.length>0;
      if(!esGeoJSON&&!esArray){onSuccess(false);return;}
      // catastro_geo ya está embebido en el HTML — no duplicar en localStorage (ocupa 3.5MB)
      if(storageKey!=='catastro_geo'){
        try{localStorage.setItem(storageKey,JSON.stringify(parsed));}
        catch(storageErr){
          console.warn('[GeoJSON] No cabe en localStorage: '+storageKey+'. Solo en memoria esta sesión.');
        }
      } else {
        localStorage.removeItem('catastro_geo'); // limpiar versión vieja si existía
      }
      onSuccess(true,parsed);
    }catch(e){onSuccess(false);}
  };
  const s=document.createElement('script');
  s.src=DRIVE_API_URL+'?token='+encodeURIComponent(DRIVE_TOKEN)+'&archivo='+encodeURIComponent(archivo)+'&callback='+cbName+'&t='+Date.now();
  s.onerror=()=>{clearTimeout(to);delete window[cbName];try{document.head.removeChild(s);}catch(e){}onSuccess(false);};
  document.head.appendChild(s);
}

// Guardia: nunca reemplazar las cloacas locales por una versión de Drive con muchas menos (protege lo cargado)
function _setGeoCloacasGuarded(data){
  const driveN=(data&&data.features)?data.features.length:0;
  const localN=(geoCloacas&&geoCloacas.features)?geoCloacas.features.length:0;
  if(localN>0 && driveN < localN*0.9){
    console.warn('[Cloacas] Drive='+driveN+' < local='+localN+' → NO se pisa lo local; se re-sube a Drive.');
    try{subirGeoJSON('catastro_geo_cloacas',geoCloacas,'catastro_cloacas.geojson');}catch(e){}
    return;
  }
  if(data) geoCloacas=data;
}

function sincronizarGeoJSON(forzar=false, onDone=null){
  if(!DRIVE_API_URL||!DRIVE_TOKEN){ if(onDone)onDone(0); return; }
  let pendientes = GEO_FILES.length;
  let actualizados = 0;

  GEO_FILES.forEach(gf=>{
    const localVersion = localStorage.getItem('catastro_geo_version_'+gf.key)||'';
    // Verificar que hay datos válidos localmente (no solo la clave, sino features reales)
    const localRaw = localStorage.getItem(gf.storage);
    const tieneLocal = (()=>{
      if(!localRaw) return false;
      try{
        const d=JSON.parse(localRaw);
        if(Array.isArray(d)) return d.length>0;        // mzData
        return d&&d.features&&d.features.length>0;     // GeoJSON
      }catch(e){return false;}
    })();

    // Si no hay datos locales, intentar bajar directamente sin esperar checkGeoVersion
    // (evita el caso donde el archivo .version no existe en Drive y nunca se baja el GeoJSON)
    if(!tieneLocal || forzar){
      bajarGeoJSON(gf.archivo, gf.storage, (ok, data)=>{
        if(ok){
          actualizados++;
          // Actualizar variable en memoria
          if(gf.key==='catastro_geo'&&data&&data.features&&data.features.length>0) geoData=data;
          else if(gf.key==='catastro_geo_cloacas'&&data) _setGeoCloacasGuarded(data);
          else if(gf.key==='catastro_mz_data'&&data&&data.length>0) mzData=data;
          else if(gf.key==='catastro_rural_geo'&&data&&data.features&&data.features.length>0) ruralGeo=data;
        }
        pendientes--;
        if(pendientes===0&&onDone)onDone(actualizados);
      });
      return;
    }

    // Hay datos locales → verificar versión para saber si hay actualización
    checkGeoVersion(gf.archivo, (meta)=>{
      if(!meta){
        // No se pudo verificar la versión (archivo .version inexistente o error de red)
        // Si no hay versión local guardada, intentar bajar de todas formas
        if(!localVersion){
          bajarGeoJSON(gf.archivo, gf.storage, (ok, data)=>{
            if(ok){
              actualizados++;
              if(gf.key==='catastro_geo'&&data&&data.features&&data.features.length>0) geoData=data;
              else if(gf.key==='catastro_geo_cloacas'&&data) _setGeoCloacasGuarded(data);
              else if(gf.key==='catastro_mz_data'&&data&&data.length>0) mzData=data;
              else if(gf.key==='catastro_rural_geo'&&data&&data.features&&data.features.length>0) ruralGeo=data;
            }
            pendientes--; if(pendientes===0&&onDone)onDone(actualizados);
          });
        } else {
          pendientes--; if(pendientes===0&&onDone)onDone(actualizados);
        }
        return;
      }
      const driveVersion = meta.version||'';
      if(localVersion && localVersion >= driveVersion){
        pendientes--; if(pendientes===0&&onDone)onDone(actualizados); return;
      }
      // Versión Drive más nueva → bajar
      bajarGeoJSON(gf.archivo, gf.storage, (ok, data)=>{
        if(ok){
          actualizados++;
          localStorage.setItem('catastro_geo_version_'+gf.key, driveVersion);
          if(gf.key==='catastro_geo'&&data&&data.features&&data.features.length>0) geoData=data;
          else if(gf.key==='catastro_geo_cloacas'&&data) _setGeoCloacasGuarded(data);
          else if(gf.key==='catastro_mz_data'&&data&&data.length>0) mzData=data;
          else if(gf.key==='catastro_rural_geo'&&data&&data.features&&data.features.length>0) ruralGeo=data;
        }
        pendientes--;
        if(pendientes===0&&onDone)onDone(actualizados);
      });
    });
  });
}

let callesSatLayer=null, callesStreetsLayer=null, callesSatMode=false;

function initCallesMap(){
  if(typeof L==='undefined'){
    // Intentar cargar Leaflet dinámicamente
    if(!document.getElementById('leaflet-js')){
      const s=document.createElement('script');
      s.id='leaflet-js';
      s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      s.onload=()=>setTimeout(initCallesMap,300);
      document.head.appendChild(s);
    } else {
      setTimeout(initCallesMap,200);
    }
    return;
  }
  const el=document.getElementById('calles-map');
  if(!el)return;
  if(callesMap){try{callesMap.remove();}catch(e){}callesMap=null;}

  callesStreetsLayer=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap',
    maxZoom:20,
    errorTileUrl:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='
  });
  callesSatLayer=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:20});
  callesMap=L.map(el,{layers:[callesStreetsLayer]});
  setTimeout(()=>{if(callesMap)callesMap.invalidateSize();},100);
  callesMap.setView([-33.5403,-61.1221],15);

  // Dibujar tramos existentes
  callesLayers={};
  callesData.forEach(c=>drawCalleLayer(c));

  callesMap.on('click', onCallesMapClick);
  callesMap.on('dblclick', onCallesMapDblClick);
}

function getCalleStyle(c){
  const color = CALLES_TIPOS[c.tipo]?.color || '#666';
  const dash = c.tipo==='tierra'?'8,5':c.tipo==='ripio'?'4,3':null;
  const weight = c.estado==='malo'?5:c.estado==='regular'?3.5:2.5;
  return {color, weight, opacity:0.9, dashArray:dash};
}

function drawCalleLayer(c){
  if(!callesMap||!c.latlngs||c.latlngs.length<2) return;
  if(callesLayers[c.id]) try{callesMap.removeLayer(callesLayers[c.id]);}catch(e){}
  const style=getCalleStyle(c);
  const layer=L.polyline(c.latlngs, style);
  // Si tiene cordón cuneta, agregar línea paralela azul
  if(c.cordonCuneta){
    const cordon=L.polyline(c.latlngs,{color:'#0369a1',weight:1.5,opacity:0.7,dashArray:'3,3'});
    callesLayers[c.id+'_cordon']=cordon;
    cordon.addTo(callesMap);
  }
  const info=`<b>${esc(c.nombre||'Sin nombre')}</b><br>
    ${CALLES_TIPOS[c.tipo]?.label||c.tipo} · ${CALLES_ESTADOS[c.estado]?.label||c.estado}
    ${c.cordonCuneta?'<br>🔵 Cordón cuneta':''}
    ${c.obs?'<br><small>'+esc(c.obs)+'</small>':''}
    <br><button onclick="eliminarCalle('${c.id}')" style="font-size:11px;margin-top:4px">🗑 Eliminar</button>`;
  layer.bindPopup(info);
  layer.addTo(callesMap);
  callesLayers[c.id]=layer;
}

function toggleCallesSat(){
  if(!callesMap)return;
  callesSatMode=!callesSatMode;
  if(callesSatMode){callesMap.removeLayer(callesStreetsLayer);callesMap.addLayer(callesSatLayer);}
  else{callesMap.removeLayer(callesSatLayer);callesMap.addLayer(callesStreetsLayer);}
  const btn=document.getElementById('btn-calles-sat');
  if(btn)btn.textContent=callesSatMode?'🗺 Calles':'🛰 Satelital';
}

function centrarCallesMap(){if(callesMap)callesMap.setView([-33.5403,-61.1221],15);}

function centrarCalle(id){
  if(!callesMap)return;
  const c=callesData.find(x=>x.id===id);
  if(c&&c.latlngs&&c.latlngs.length>0){
    const layer=callesLayers[id];
    if(layer)callesMap.fitBounds(layer.getBounds(),{padding:[40,40]});
  }
}

function iniciarCallesDraw(){
  if(!callesMap){alert('El mapa no cargó todavía.');return;}
  const nombre=document.getElementById('calle-nombre')?.value.trim()||'';
  if(!nombre){alert('Escribí primero el nombre de la calle.');return;}
  callesDrawing=true;
  callesPuntos=[];
  callesPolyTemp=null;
  callesMarkers=[];
  const hint=document.getElementById('calles-draw-hint');if(hint)hint.style.display='block';
  const hintTxt=document.getElementById('calles-draw-hint-txt');
  if(hintTxt)hintTxt.textContent='Click en el PRIMER punto de la calle';
  const btn=document.getElementById('btn-draw-calle');
  if(btn){btn.textContent='⏹ Cancelar dibujo';btn.onclick=cancelarCallesDraw;}
  const btnFin=document.getElementById('btn-finalizar-tramo');
  if(btnFin)btnFin.style.display='none';
  callesMap.getContainer().style.cursor='crosshair';
  const st=document.getElementById('calles-form-status');
  if(st)st.textContent='';
}

function cancelarCallesDraw(){
  callesDrawing=false;
  callesPuntos=[];
  if(callesPolyTemp){try{callesMap.removeLayer(callesPolyTemp);}catch(e){}callesPolyTemp=null;}
  callesMarkers.forEach(m=>{try{callesMap.removeLayer(m);}catch(e){}});
  callesMarkers=[];
  if(callesMap)callesMap.getContainer().style.cursor='';
  const hint=document.getElementById('calles-draw-hint');if(hint)hint.style.display='none';
  const btn=document.getElementById('btn-draw-calle');
  if(btn){btn.textContent='✏️ Trazar en mapa';btn.onclick=iniciarCallesDraw;}
}

function finalizarCallesDraw(){
  if(callesPuntos.length<2){alert('Necesitás al menos 2 puntos.');return;}
  guardarCalleConPuntos(callesPuntos);
  cancelarCallesDraw();
}

function onCallesMapClick(e){
  if(!callesDrawing)return;
  L.DomEvent.stopPropagation(e);
  callesPuntos.push([e.latlng.lat,e.latlng.lng]);
  const tipo=document.getElementById('calle-tipo')?.value||'tierra';
  const color=CALLES_TIPOS[tipo]?.color||'#666';

  // Marcador en el punto
  const mk=L.circleMarker(e.latlng,{radius:5,color:color,fillColor:'#fff',fillOpacity:1,weight:2}).addTo(callesMap);
  callesMarkers.push(mk);

  // Dibujar línea entre puntos
  if(callesPolyTemp)try{callesMap.removeLayer(callesPolyTemp);}catch(e){}
  if(callesPuntos.length>=2){
    callesPolyTemp=L.polyline(callesPuntos,{color,weight:4,opacity:0.85}).addTo(callesMap);
  }

  // Actualizar hint
  const hintTxt=document.getElementById('calles-draw-hint-txt');
  const btnFin=document.getElementById('btn-finalizar-tramo');
  if(callesPuntos.length===1){
    if(hintTxt)hintTxt.textContent='Ahora click en el SEGUNDO punto (o más puntos para seguir trazando)';
  } else {
    if(hintTxt)hintTxt.textContent=callesPuntos.length+' puntos — podés seguir agregando o guardar el tramo';
    if(btnFin){btnFin.style.display='';btnFin.textContent='✅ Guardar tramo ('+callesPuntos.length+' pts)';}
  }

  const st=document.getElementById('calles-form-status');
  if(st)st.textContent='';
}

function onCallesMapDblClick(e){
  if(!callesDrawing)return;
  L.DomEvent.stopPropagation(e);
  if(callesPuntos.length>=2) finalizarCallesDraw();
}

function guardarCalleConPuntos(latlngs){
  const nombre=document.getElementById('calle-nombre')?.value.trim()||'';
  const tipo=document.getElementById('calle-tipo')?.value||'tierra';
  const estado=document.getElementById('calle-estado')?.value||'bueno';
  const cordon=document.getElementById('calle-cordon')?.checked||false;
  const obs=document.getElementById('calle-obs')?.value.trim()||'';
  if(!nombre){alert('Escribí el nombre de la calle primero.');return;}
  const c={id:'calle_'+Date.now(),nombre,tipo,estado,cordonCuneta:cordon,obs,latlngs,fecha:new Date().toISOString()};
  callesData.push(c);
  saveCalles();
  pushCalleToDrive(c);
  drawCalleLayer(c);
  const st=document.getElementById('calles-form-status');
  if(st)st.innerHTML='✅ <b>'+esc(nombre)+'</b> guardada correctamente.';
  // Limpiar form
  ['calle-nombre','calle-obs'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  const cb=document.getElementById('calle-cordon');if(cb)cb.checked=false;
  goCalles();
}

function guardarCalleManual(){
  const nombre=document.getElementById('calle-nombre')?.value.trim()||'';
  if(!nombre){alert('Escribí el nombre de la calle.');return;}
  const tipo=document.getElementById('calle-tipo')?.value||'tierra';
  const estado=document.getElementById('calle-estado')?.value||'bueno';
  const cordon=document.getElementById('calle-cordon')?.checked||false;
  const obs=document.getElementById('calle-obs')?.value.trim()||'';
  const c={id:'calle_'+Date.now(),nombre,tipo,estado,cordonCuneta:cordon,obs,latlngs:[],fecha:new Date().toISOString()};
  callesData.push(c);
  saveCalles();
  pushCalleToDrive(c);
  const st=document.getElementById('calles-form-status');
  if(st)st.innerHTML='✅ <b>'+esc(nombre)+'</b> guardada (sin tramo en mapa).';
  ['calle-nombre','calle-obs'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  const cb=document.getElementById('calle-cordon');if(cb)cb.checked=false;
  goCalles();
}

function eliminarCalle(id){
  if(!confirm('¿Eliminar este tramo?'))return;
  callesData=callesData.filter(c=>c.id!==id);
  saveCalles();
  deleteCalleFromDrive(id);
  if(callesLayers[id]){try{callesMap.removeLayer(callesLayers[id]);}catch(e){}delete callesLayers[id];}
  if(callesLayers[id+'_cordon']){try{callesMap.removeLayer(callesLayers[id+'_cordon']);}catch(e){}delete callesLayers[id+'_cordon'];}
  goCalles();
}

function subirGeoADrive(key){
  const gf = GEO_FILES.find(g=>g.key===key);
  if(!gf){alert('No encontré el archivo.');return;}
  let raw = localStorage.getItem(gf.storage);
  if(!raw && key==='catastro_geo' && typeof geoData!=='undefined' && geoData && geoData.features){
    raw = JSON.stringify(geoData);
  }
  if(!raw){alert('No hay datos locales para subir.');return;}
  const st = document.getElementById('geo-sync-status');
  if(st) st.textContent = '⬆️ Subiendo '+gf.label+'...';
  subirGeoJSON(key, raw, gf.archivo).then(ok=>{
    if(ok){
      localStorage.setItem('catastro_geo_version_'+key, new Date().toISOString());
      if(st) st.textContent = '✅ '+gf.label+' subido correctamente a Drive.';
    } else {
      if(st) st.textContent = '❌ Error al subir. Revisá la conexión.';
    }
    render();
  });
}

function exportarCalles(){
  if(!callesData.length){alert('No hay calles cargadas.');return;}
  const features=callesData.filter(c=>c.latlngs&&c.latlngs.length>=2).map(c=>({
    type:'Feature',
    properties:{id:c.id,nombre:c.nombre,tipo:c.tipo,estado:c.estado,cordonCuneta:c.cordonCuneta,obs:c.obs,fecha:c.fecha},
    geometry:{type:'LineString',coordinates:c.latlngs.map(ll=>[ll[1],ll[0]])}
  }));
  const geojson={type:'FeatureCollection',features};
  const blob=new Blob([JSON.stringify(geojson,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='calles_alcorta.geojson';a.click();
}

function cerrarEditorCalle(){
  callesSelId = null;
  const panel = document.getElementById('calles-form-panel');
  if(panel) panel.innerHTML = getFormNuevoCalle();
}

function guardarEdicionCalle(id){
  const c = callesData.find(x=>x.id===id);
  if(!c) return;
  const nombre = document.getElementById('edit-calle-nombre')?.value.trim()||'';
  const tipo   = document.getElementById('edit-calle-tipo')?.value||c.tipo;
  const estado = document.getElementById('edit-calle-estado')?.value||c.estado;
  const cordon = document.getElementById('edit-calle-cordon')?.checked||false;
  const obs    = document.getElementById('edit-calle-obs')?.value.trim()||'';
  if(!nombre){alert('El nombre no puede estar vacío.');return;}

  // Actualizar datos
  c.nombre = nombre;
  c.tipo   = tipo;
  c.estado = estado;
  c.cordonCuneta = cordon;
  c.obs    = obs;
  c.fechaModif = new Date().toISOString();

  saveCalles();
  pushCalleToDrive(c);
  // Redibujar en el mapa con el nuevo estilo
  drawCalleLayer(c);

  const st = document.getElementById('edit-calle-status');
  if(st) st.innerHTML = '✅ <b>'+esc(nombre)+'</b> actualizada correctamente.';
  setTimeout(()=>goCalles(), 800);
}

function redibujarCalle(id){
  const c = callesData.find(x=>x.id===id);
  if(!c) return;
  // Primero guardar los cambios del formulario de edición
  guardarEdicionCalle(id);
  // Limpiar puntos viejos del mapa
  if(callesLayers[id]){try{callesMap.removeLayer(callesLayers[id]);}catch(e){}delete callesLayers[id];}
  if(callesLayers[id+'_cordon']){try{callesMap.removeLayer(callesLayers[id+'_cordon']);}catch(e){}delete callesLayers[id+'_cordon'];}
  c.latlngs = [];
  // Activar modo dibujo
  callesDrawing = true;
  callesPuntos = [];
  callesPolyTemp = null;
  callesMarkers = [];
  const hint = document.getElementById('calles-draw-hint');
  if(hint) hint.style.display = 'block';
  if(callesMap) callesMap.getContainer().style.cursor = 'crosshair';
  const st = document.getElementById('edit-calle-status');
  if(st) st.textContent = '✏️ Trazá el nuevo recorrido en el mapa. Doble click para terminar.';
  // Override del dblclick para guardar en el tramo existente
  callesMap.off('dblclick', onCallesMapDblClick);
  callesMap.once('dblclick', function(e){
    L.DomEvent.stopPropagation(e);
    if(callesPuntos.length<2){alert('Necesitás al menos 2 puntos.');return;}
    c.latlngs = [...callesPuntos];
    saveCalles();
    drawCalleLayer(c);
    cancelarCallesDraw();
    callesMap.on('dblclick', onCallesMapDblClick);
    goCalles();
  });
}

let _ruralDetailUseSat=false;

function initRuralDetailMap(rec, handle){
  if(typeof L==='undefined'){setTimeout(()=>initRuralDetailMap(rec,handle),200);return;}
  if(ruralDetailMap){try{ruralDetailMap.off();ruralDetailMap.remove();}catch(e){} ruralDetailMap=null;ruralDetailParcelLayer=null;}
  const el=document.getElementById('rural-detail-map');
  if(!el) return;

  // Encontrar la feature vinculada para centrar
  let lat=-33.540298, lon=-61.122064, zoom=14;
  let featVinc=null;

  // handle puede ser un id de registro (ruralLinks[id] = handle GeoJSON)
  if(ruralGeo&&ruralGeo.features){
    featVinc=ruralGeo.features.find(f=>{
      const fh=String(f.properties&&f.properties.handle||f.properties&&f.properties.partida||'');
      return fh===String(handle);
    });
    if(!featVinc){
      // Buscar también por id de feature como fallback
      featVinc=ruralGeo.features.find(f=>String(f.id||'')===String(handle));
    }
    if(featVinc&&featVinc.geometry){
      const geom=featVinc.geometry;
      // Puede ser Point, Polygon, MultiPolygon, etc.
      let coords=[];
      if(geom.type==='Point'){coords=[[geom.coordinates[1],geom.coordinates[0]]];zoom=15;}
      else if(geom.type==='Polygon'){coords=geom.coordinates[0].map(c=>[c[1],c[0]]);}
      else if(geom.type==='MultiPolygon'){coords=geom.coordinates[0][0].map(c=>[c[1],c[0]]);}
      else if(geom.type==='LineString'){coords=geom.coordinates.map(c=>[c[1],c[0]]);}
      if(coords.length){
        const lats=coords.map(c=>c[0]),lngs=coords.map(c=>c[1]);
        lat=(Math.min(...lats)+Math.max(...lats))/2;
        lon=(Math.min(...lngs)+Math.max(...lngs))/2;
        zoom=geom.type==='Point'?15:14;
      }
    }
  }

  const streets=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:20});
  const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:20});
  ruralDetailMap=L.map(el,{center:[lat,lon],zoom:zoom,layers:[_ruralDetailUseSat?sat:streets],preferCanvas:true,fadeAnimation:false,zoomAnimation:false});
  ruralDetailMap._ruralStreets=streets;
  ruralDetailMap._ruralSat=sat;

  // Dibujar todo el plano rural en gris/azul claro
  if(ruralGeo&&ruralGeo.features&&ruralGeo.features.length>0){
    L.geoJSON(ruralGeo,{
      style:()=>({color:'#1d4ed8',weight:1,fillColor:'#bfdbfe',fillOpacity:0.2,opacity:0.6}),
      pointToLayer:(feat,latlng)=>L.circleMarker(latlng,{radius:4,color:'#1d4ed8',fillColor:'#bfdbfe',fillOpacity:0.5,weight:1})
    }).addTo(ruralDetailMap);
  }

  // Pintar la parcela vinculada en amarillo/naranja bien visible
  if(featVinc){
    if(featVinc.geometry.type==='Point'){
      const ll=L.latLng(featVinc.geometry.coordinates[1],featVinc.geometry.coordinates[0]);
      ruralDetailParcelLayer=L.circleMarker(ll,{radius:12,color:'#ea580c',weight:3,fillColor:'#fde047',fillOpacity:0.95})
        .bindPopup(`<b>${rec.titular||'Sin titular'}</b><br>Cuenta: ${rec.nroCuenta||'—'}<br>Partida: ${rec.partida||'—'}<br>Hectáreas: ${rec.hectareas||'—'} ha`)
        .addTo(ruralDetailMap);
      ruralDetailParcelLayer.openPopup();
    } else {
      ruralDetailParcelLayer=L.geoJSON(featVinc,{
        style:{color:'#ea580c',weight:3,fillColor:'#fde047',fillOpacity:0.85}
      }).bindPopup(`<b>${rec.titular||'Sin titular'}</b><br>Cuenta: ${rec.nroCuenta||'—'}<br>Partida: ${rec.partida||'—'}<br>Hectáreas: ${rec.hectareas||'—'} ha`)
        .addTo(ruralDetailMap);
      try{ruralDetailMap.fitBounds(ruralDetailParcelLayer.getBounds(),{padding:[30,30],maxZoom:16,animate:false});}catch(e){}
    }
  }
}

function toggleRuralDetailSat(){
  if(!ruralDetailMap) return;

    ruralDetailMap.addLayer(ruralDetailMap._ruralSat);

async function doImportRuralPadron(){
  const f=document.getElementById('rural-padron-file');
  if(!f||!f.files.length){alert('Seleccioná un archivo JSON primero.');return;}
  const text=await f.files[0].text();
  let data;
  try{data=JSON.parse(text);}catch(e){alert('Archivo JSON inválido.');return;}
  if(!Array.isArray(data)){alert('El archivo debe ser un array de parcelas.');return;}
  // Normalizar campos esperados
  const mapped=data.map((d,i)=>({
    id:'rural_'+(d.nroCuenta||d.cuenta||d.id||Date.now()+'_'+i),
    nroCuenta:String(d.nroCuenta||d.cuenta||d.Cuenta||''),
    partida:String(d.partida||d.Partida||d.partida_inmobiliaria||''),
    nomenclatura:String(d.nomenclatura||d.Nomenclatura||''),
    titular:String(d.titular||d.Titular||d.contribuyente||d.Contribuyente||''),
    hectareas:d.hectareas||d.Hectareas||d.has||d.superficie||'',
    dni:String(d.dni||d.DNI||''),
    telefono:String(d.telefono||''),
    estado:String(d.estado||'NORMAL'),
    tieneCloaca:!!(d.tieneCloaca||d.cloaca),
    nroCloaca:String(d.nroCloaca||''),
    fechaCloaca:String(d.fechaCloaca||''),
    diametroCloaca:String(d.diametroCloaca||''),
    obsCloaca:String(d.obsCloaca||''),
    obs:String(d.obs||d.observaciones||''),
    fechaMod:new Date().toISOString()
  }));
  if(confirm(`Se importarán ${mapped.length} parcelas rurales. ¿Continuar?`)){
    ruralRecords=mapped;
    saveRuralData();

    // Si ya hay GeoJSON cargado, intentar vincular automáticamente por partida
    let autoMsg='';
    if(ruralGeo&&ruralGeo.features){
      let autoVinc=0;
      // Buscar en TODOS los tipos de geometría (Point, Polygon, LineString, etc.)
      const allFeats=ruralGeo.features.filter(f=>f.geometry&&f.properties);
      allFeats.forEach(feat=>{
        const props=feat.properties||{};
        // Intentar obtener la partida desde diversas propiedades comunes del GeoJSON/DXF
        const partida=(props.partida||props.PARTIDA||props.Partida||
                        props.nomenclatura||props.NOMENCLATURA||
                        props.nroCuenta||props.NROCUENTA||props.cuenta||'').toString().trim();
        const handle=props.handle||props.HANDLE||props.id||feat.id||partida;
        if(!handle) return;
        const fp=partida.replace(/\D/g,'');
        const fpCirc=fp.slice(0,12);
        // Evitar doble vincular
        const yaVinculado=Object.values(ruralLinks).includes(String(handle));
        if(yaVinculado) return;
        const match=mapped.find(r=>{
          const rp=(r.partida||'').toString().replace(/\D/g,'');
          return fp&&rp===fp;
        })||( fpCirc&&fpCirc.length>=4 ? mapped.find(r=>{
          const rp=(r.partida||'').toString().replace(/\D/g,'');
          return rp.slice(0,12)===fpCirc&&!ruralLinks[r.id];
        }) : null);
        if(match&&!ruralLinks[match.id]){ruralLinks[match.id]=String(handle);autoVinc++;}
      });
      if(autoVinc>0){saveRuralLinks();autoMsg=`\n🔗 ${autoVinc} parcelas vinculadas automáticamente al plano.`;}
    }

    filterRural();
    render();
    alert(`✅ ${mapped.length} parcelas rurales importadas correctamente.${autoMsg}`);
  }
}

let ruralVincMap=null, ruralVincLayer=null, ruralVincSelHandle=null;

function initRuralVincMap(){
  if(typeof L==='undefined'){setTimeout(initRuralVincMap,200);return;}
  if(ruralVincMap){try{ruralVincMap.remove();}catch(e){}ruralVincMap=null;}
  const el=document.getElementById('rural-vinc-map');
  if(!el||!ruralGeo)return;
  const streets=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:20});
  ruralVincMap=L.map(el,{layers:[streets]});
  setTimeout(()=>{if(ruralVincMap)ruralVincMap.invalidateSize();},100);
  ruralVincLayer=L.layerGroup().addTo(ruralVincMap);
  renderRuralVincLayer();
  // Centrar en los datos
  try{
    const bounds=L.geoJSON(ruralGeo).getBounds();
    if(bounds.isValid())ruralVincMap.fitBounds(bounds,{padding:[20,20]});
  }catch(e){ruralVincMap.setView([-33.54,-61.12],13);}
}

function renderRuralVincLayer(){
  if(!ruralVincLayer||!ruralGeo)return;
  ruralVincLayer.clearLayers();
  // Buscar todos los handles ya vinculados
  const vincHandles=new Set(Object.values(ruralLinks));
  L.geoJSON(ruralGeo,{
    style:f=>{
      const h=f.properties&&(f.properties.handle||f.properties.HANDLE||f.properties.id||'');
      const isVinc=vincHandles.has(h);
      const isSel=h===ruralVincSelHandle;
      return {
        color: isSel?'#e05c00':isVinc?'#16a34a':'#8e44ad',
        weight: isSel?3:1.5,
        fillColor: isSel?'#fdf3e3':isVinc?'#dcfce7':'#f5f3ff',
        fillOpacity: isSel?0.7:isVinc?0.5:0.3
      };
    },
    onEachFeature:(f,layer)=>{
      const h=f.properties&&(f.properties.handle||f.properties.HANDLE||f.properties.id||'');
      layer.on('click',()=>selRuralParcel(f,h));
    }
  }).addTo(ruralVincLayer);
}

function selRuralParcel(feat,handle){
  ruralVincSelHandle=handle;
  renderRuralVincLayer();
  const panel=document.getElementById('rural-vinc-panel');
  if(!panel)return;
  // Ya vinculado?
  const yaVinc=Object.entries(ruralLinks).find(([rid,h])=>h===handle);
  const rec=yaVinc?ruralRecords.find(r=>r.id===yaVinc[0]):null;
  const props=feat.properties||{};
  const area=props.area||props.AREA||props.superficie||'';

  panel.innerHTML=`
    <div style="font-size:12px;font-weight:700;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)">
      📍 Parcela seleccionada
    </div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:10px;font-family:monospace">${esc(handle)}</div>
    ${area?`<div style="font-size:12px;margin-bottom:8px">Área: <b>${area}</b></div>`:''}
    ${rec?`<div style="background:var(--green-bg);border:1px solid var(--green-light);border-radius:6px;padding:8px;margin-bottom:10px;font-size:12px">
      ✅ Vinculada a: <b>${esc(rec.titular||rec.nroCuenta||'?')}</b>
      <button class="btn btn-sm btn-danger" style="margin-left:8px;padding:2px 8px;font-size:11px" onclick="desvincularRural('${esc(yaVinc[0])}')">Desvincular</button>
    </div>`:`<div style="font-size:12px;margin-bottom:8px;color:var(--text2)">Sin vincular</div>`}
    <div style="font-size:11px;font-weight:600;margin-bottom:6px;color:var(--text3)">BUSCAR PARCELA RURAL</div>
    <input id="rural-vinc-search" placeholder="Titular, N° cuenta, partida..." 
      style="margin-bottom:6px" oninput="renderRuralVincResults(this.value,'${esc(handle)}')">
    <div id="rural-vinc-results" style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;font-size:12px"></div>`;
  renderRuralVincResults('',handle);
}

function renderRuralVincResults(q,handle){
  const el=document.getElementById('rural-vinc-results');
  if(!el)return;
  const qq=q.toLowerCase();
  const matches=ruralRecords.filter(r=>{
    if(!qq)return true;
    return (r.titular||'').toLowerCase().includes(qq)||(r.nroCuenta||'').includes(qq)||(r.partida||'').includes(qq);
  }).slice(0,20);
  if(!matches.length){el.innerHTML='<div style="padding:8px;color:var(--text3)">Sin resultados</div>';return;}
  el.innerHTML=matches.map(r=>{
    const isLinked=ruralLinks[r.id]===handle;
    return `<div style="padding:7px 10px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center;${isLinked?'background:var(--green-bg)':''}" 
      onclick="vincularRural('${esc(r.id)}','${esc(handle)}')">
      <div>
        <div style="font-weight:600">${esc(r.titular||'Sin titular')}</div>
        <div style="font-size:10px;color:var(--text3)">Cta. ${esc(r.nroCuenta||'—')} · ${r.hectareas?r.hectareas+' ha':''}</div>
      </div>
      ${isLinked?'<span style="color:var(--green);font-size:11px">✓ Vinculada</span>':'<span style="font-size:11px;color:var(--accent)">Vincular →</span>'}
    </div>`;
  }).join('');
}

function vincularRural(rid,handle){
  ruralLinks[rid]=handle;
  saveRuralLinks();
  renderRuralVincLayer();
  const panel=document.getElementById('rural-vinc-panel');
  if(panel){
    const rec=ruralRecords.find(r=>r.id===rid);
    panel.innerHTML=`<div style="padding:16px;text-align:center">
      <div style="font-size:28px;margin-bottom:8px">✅</div>
      <div style="font-weight:700;margin-bottom:4px">${esc(rec?rec.titular:'?')}</div>
      <div style="font-size:12px;color:var(--text2)">Vinculada al plano correctamente.</div>
      <button class="btn btn-sm btn-primary" style="margin-top:12px" onclick="rRuralVinc(document.getElementById('app'))">Actualizar panel</button>
    </div>`;
  }
}

let ruralOperStreetLayer=null, ruralOperSatLayer=null;
// Mapa de rid → leaflet layer para poder hacer setStyle sin recrear
let ruralOperLayerByRid={};

// ── Mapa rural operaciones ─────────────────────────────────────────────────
function ruralOperInitMap(){
  if(typeof L==='undefined'){setTimeout(ruralOperInitMap,300);return;}
  const el=document.getElementById('rural-oper-map');
  if(!el){return;}
  // Si el mapa ya existe Y el elemento es el mismo, solo redibujar el layer
  if(ruralOperMap){
    try{ruralOperMap.remove();}catch(e){}
    ruralOperMap=null;ruralOperGeoLayer=null;ruralOperLayerByRid={};
  }
  ruralOperStreetLayer=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:20});
  ruralOperSatLayer=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:20});
  ruralOperMap=L.map(el,{layers:[ruralOperSatMode?ruralOperSatLayer:ruralOperStreetLayer]});
  setTimeout(()=>{if(ruralOperMap)ruralOperMap.invalidateSize();},120);
  // Centrar
  try{
    const b=L.geoJSON(ruralGeo).getBounds();
    if(b.isValid()) ruralOperMap.fitBounds(b,{padding:[10,10]});
    else ruralOperMap.setView([-33.54,-61.12],13);
  }catch(e){ruralOperMap.setView([-33.54,-61.12],13);}
  ruralOperRenderLayer();
}

function ruralOperRenderLayer(){
  if(!ruralOperMap||!ruralGeo) return;
  const handleToRid={};
  Object.entries(ruralLinks).forEach(([rid,h])=>{handleToRid[String(h)]=rid;});
  const selIds=new Set(ruralOperSelParcelas.map(p=>p.id));

  // Si el layer ya existe, solo actualizamos estilos con setStyle (sin recrear)
  if(ruralOperGeoLayer){
    ruralOperGeoLayer.eachLayer(l=>{
      if(!l.feature) return;
      const h=ruralOperFeatHandle(l.feature);
      const rid=handleToRid[h]||null;
      const selected=rid&&selIds.has(rid);
      if(selected)  l.setStyle({color:'#e05c00',weight:3,fillColor:'#ffd166',fillOpacity:0.8});
      else if(rid)  l.setStyle({color:'#8e44ad',weight:1.5,fillColor:'#f0ebff',fillOpacity:0.45});
      else          l.setStyle({color:'#2d7a3a',weight:0.8,fillColor:'#dcfce7',fillOpacity:0.3});
    });
    return;
  }

  // Primera vez: crear el layer completo y guardar referencia por rid
  ruralOperLayerByRid={};
  ruralOperGeoLayer=L.geoJSON(ruralGeo,{
    style:feat=>{
      const h=ruralOperFeatHandle(feat);
      const rid=handleToRid[h]||null;
      const selected=rid&&selIds.has(rid);
      if(selected) return {color:'#e05c00',weight:3,fillColor:'#ffd166',fillOpacity:0.8};
      if(rid)      return {color:'#8e44ad',weight:1.5,fillColor:'#f0ebff',fillOpacity:0.45};
      return             {color:'#2d7a3a',weight:0.8,fillColor:'#dcfce7',fillOpacity:0.3};
    },
    onEachFeature:(feat,layer)=>{
      const h=ruralOperFeatHandle(feat);
      const rid=handleToRid[h]||null;
      const rec=rid?ruralRecords.find(r=>r.id===rid):null;
      if(rid) ruralOperLayerByRid[rid]=layer;
      if(rec){
        layer.bindTooltip(
          `<b>${esc(rec.titular||'—')}</b><br>Cta. ${esc(rec.nroCuenta||'—')}${rec.hectareas?'<br>'+rec.hectareas+' ha':''}`,
          {sticky:true,direction:'top'}
        );
      } else {
        const props=feat.properties||{};
        const label=props.label||props.partida||props.PARTIDA||props.handle||h||'Sin vincular';
        layer.bindTooltip(`<span style="color:#888">Sin vincular<br>${esc(String(label))}</span>`,{sticky:true,direction:'top'});
      }
      layer.on('click',()=>{
        if(!rec){ layer.openTooltip(); return; }
        const idx=ruralOperSelParcelas.findIndex(p=>p.id===rec.id);
        if(idx>=0) ruralOperSelParcelas.splice(idx,1);
        else ruralOperSelParcelas.push(rec);
        ruralOperRenderLayer();   // solo setStyle, muy rápido
        ruralOperActualizarPanel();
      });
    }
  }).addTo(ruralOperMap);
}

function ruralOperFeatHandle(feat){
  const p=feat.properties||{};
  return String(p.handle||p.HANDLE||p.id||feat.id||'');
}

// Actualiza el panel derecho y el status sin destruir el mapa

  // Status text
  const status=document.getElementById('rural-oper-status');

      ?'👆 Hacé click en una parcela del mapa o buscala en el panel derecho'
      :'✅ '+selCount+' parcela'+(selCount===1?'':'s')+' seleccionada'+(selCount===1?'':'s')+': '+ruralOperSelParcelas.map(p=>p.nroCuenta||p.titular||p.id).join(', ');

  const listaEl=document.getElementById('rural-oper-lista');
  if(listaEl){
    listaEl.innerHTML=selCount===0
      ?'<div style="font-size:12px;color:var(--text3);text-align:center;padding:12px">Sin parcelas seleccionadas</div>'
      :ruralOperSelParcelas.map(p=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">
          <div><b>Cta. ${p.nroCuenta||'—'}</b><div style="font-size:11px;color:var(--text3)">${esc(p.titular||'')} · ${p.hectareas?p.hectareas+' ha':''}</div></div>
          <button class="btn btn-sm btn-danger" style="padding:2px 6px;font-size:10px" onclick="ruralOperQuitar('${p.id}')">✕</button>
        </div>`).join('');

  // Panel de operaciones
  const opEl=document.getElementById('rural-oper-operacion');

  const cntEl=document.getElementById('rural-oper-count');

  if(limpBtn){limpBtn.style.display=selCount>0?'':'none';limpBtn.textContent='✕ Limpiar ('+selCount+')';}
  if(selCount===1) setTimeout(initRuralDivisionItems,50);
}

function ruralOperQuitar(id){
  ruralOperSelParcelas=ruralOperSelParcelas.filter(p=>p.id!==id);
  ruralOperRenderLayer();
  ruralOperActualizarPanel();
}
function limpiarSeleccionRural(){ruralOperSelParcelas=[];ruralOperRenderLayer();ruralOperActualizarPanel();}

function toggleRuralOperSat(){
  if(!ruralOperMap)return;
  ruralOperSatMode=!ruralOperSatMode;
  if(ruralOperSatMode){ruralOperMap.removeLayer(ruralOperStreetLayer);ruralOperMap.addLayer(ruralOperSatLayer);}
  else{ruralOperMap.removeLayer(ruralOperSatLayer);ruralOperMap.addLayer(ruralOperStreetLayer);}
  const btn=document.getElementById('btn-rural-oper-sat');
  if(btn)btn.textContent=ruralOperSatMode?'🗺 Calles':'🛰 Satelital';
}
function centrarRuralOperMap(){
  if(!ruralOperMap||!ruralGeo)return;
  try{const b=L.geoJSON(ruralGeo).getBounds();if(b.isValid())ruralOperMap.fitBounds(b,{padding:[10,10]});}catch(e){}
}

let ruralOperBuscarTimeout=null;
function ruralOperBuscar(q){
  const res=document.getElementById('rural-oper-buscar-results');
  if(!res)return;
  clearTimeout(ruralOperBuscarTimeout);
  if(!q||q.length<2){res.style.display='none';return;}
  ruralOperBuscarTimeout=setTimeout(()=>{
    const qn=q.toLowerCase();
    const hits=ruralRecords.filter(r=>
      (r.nroCuenta||'').includes(qn)||(r.titular||'').toLowerCase().includes(qn)||
      (r.partida||'').includes(qn)||(r.nomenclatura||'').toLowerCase().includes(qn)
    ).slice(0,8);
    if(!hits.length){res.style.display='none';return;}
    res.style.display='block';
    res.innerHTML=hits.map(r=>{
      const ya=ruralOperSelParcelas.find(p=>p.id===r.id);
      return `<div onclick="ruralOperAgregar('${r.id}')"
        style="padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--border);${ya?'background:var(--surface2)':''}"
        onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background='${ya?'var(--surface2)':''}'">
        <div style="display:flex;justify-content:space-between">
          <b>Cta. ${r.nroCuenta||'—'}</b>
          ${ya?'<span style="color:#16a34a;font-size:11px">✓ Agregada</span>':''}
        </div>
        <div style="font-size:11px;color:var(--text3)">${esc(r.titular||'Sin titular')} · ${r.hectareas?r.hectareas+' ha':''} · ${esc(r.partida||'')}</div>
      </div>`;
    }).join('');
  },250);
}
function ruralOperAgregar(id){
  const rec=ruralRecords.find(r=>r.id===id);
  if(!rec)return;
  if(!ruralOperSelParcelas.find(p=>p.id===id)) ruralOperSelParcelas.push(rec);
  const inp=document.getElementById('rural-oper-buscar');
  if(inp)inp.value='';
  document.getElementById('rural-oper-buscar-results').style.display='none';
  ruralOperRenderLayer();
  ruralOperActualizarPanel();
}

function ejecutarUnificacionRural(){
  const nuevaCuenta=(document.getElementById('runif-cuenta')?.value||'').trim();
  const nuevaPartida=(document.getElementById('runif-partida')?.value||'').trim();
  const nuevoTitular=(document.getElementById('runif-titular')?.value||'').trim();
  const nuevaHas=(document.getElementById('runif-has')?.value||'').trim();
  const accion=document.getElementById('runif-accion')?.value||'marcar';
  if(!nuevaCuenta){alert('Ingresá el nuevo N° de cuenta.');return;}
  if(!confirm('¿Unificar '+ruralOperSelParcelas.length+' parcelas rurales en la cuenta '+nuevaCuenta+'?'))return;
  const base={...ruralOperSelParcelas[0]};
  const nuevo={
    ...base,
    id:'rural_'+Date.now(),
    nroCuenta:nuevaCuenta,
    partida:nuevaPartida||base.partida,
    titular:nuevoTitular||base.titular,
    hectareas:nuevaHas||String(ruralOperSelParcelas.reduce((s,p)=>s+(parseFloat(p.hectareas)||0),0)),
    estado:'NORMAL',
    obs:'Unificación de cuentas: '+ruralOperSelParcelas.map(p=>p.nroCuenta).join(', '),
    fechaMod:new Date().toISOString()
  };
  ruralRecords.push(nuevo);
  ruralOperSelParcelas.forEach(p=>{
    if(accion==='eliminar'){
      ruralRecords=ruralRecords.filter(r=>r.id!==p.id);
      delete ruralLinks[p.id];
    } else {
      const idx=ruralRecords.findIndex(r=>r.id===p.id);
      if(idx>=0) ruralRecords[idx].estado='Unificada en '+nuevaCuenta;
    }
  });
  saveRuralData(); saveRuralLinks();
  ruralOperSelParcelas=[];
  alert('✅ Unificación rural completada. Nueva cuenta: '+nuevaCuenta);
  goRuralOperaciones();
}

function ejecutarDivisionRural(){
  const original=ruralOperSelParcelas[0];
  if(!original)return;
  const accion=document.getElementById('rdiv-accion')?.value||'marcar';
  const cont=document.getElementById('rural-division-items');
  const items=cont?cont.querySelectorAll('.rural-div-item'):[];
  const subdivs=[];
  items.forEach((item,i)=>{
    const g=id=>(document.getElementById(id)?.value||'').trim();
    const cuenta=g('rdiv-cuenta-'+i);
    if(cuenta) subdivs.push({nroCuenta:cuenta,partida:g('rdiv-partida-'+i),nomenclatura:g('rdiv-nomenclatura-'+i),hectareas:g('rdiv-has-'+i),titular:g('rdiv-titular-'+i),obs:g('rdiv-obs-'+i)});
  });
  if(subdivs.length<2){alert('Necesitás al menos 2 subdivisiones.');return;}
  if(subdivs.some(s=>!s.nroCuenta)){alert('Completá todos los N° de cuenta.');return;}
  if(!confirm('¿Dividir cuenta '+original.nroCuenta+' en '+subdivs.length+' parcelas?'))return;
  const fecha=new Date().toISOString();
  const nuevasCuentas=[];
  subdivs.forEach((s,idx)=>{
    const nuevo={...original,id:'rural_'+Date.now()+idx,nroCuenta:s.nroCuenta,partida:s.partida||original.partida,nomenclatura:s.nomenclatura||original.nomenclatura,hectareas:s.hectareas||'',titular:s.titular||original.titular,obs:s.obs||(original.obs+' | División de '+original.nroCuenta),estado:'División de '+original.nroCuenta,fechaMod:fecha};
    ruralRecords.push(nuevo);
    nuevasCuentas.push(s.nroCuenta);
  });
  if(accion==='eliminar'){
    ruralRecords=ruralRecords.filter(r=>r.id!==original.id);
    delete ruralLinks[original.id];
  } else {
    const idx=ruralRecords.findIndex(r=>r.id===original.id);
    if(idx>=0) ruralRecords[idx].estado='Dividida en '+nuevasCuentas.join(', ');
  }
  saveRuralData(); saveRuralLinks();
  ruralOperSelParcelas=[];
  alert('✅ División rural completada.\nNuevas cuentas: '+nuevasCuentas.join(', ')+'\n\nVinculá las nuevas parcelas desde "🗺 Vincular al plano".');
  goRuralOperaciones();
}

function guardarCloacaLink(rid){
  const g=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
  const gn=id=>{const v=g(id);return v!==''?parseFloat(v):null;};
  const link={
    nroCloaca:g('cm-nroCloaca'),
    fechaCloaca:g('cm-fechaCloaca'),
    diametro:g('cm-diametro'),
    profundidad:gn('cm-profundidad'),
    distancia:gn('cm-distancia'),
    lado:g('cm-lado'),
    cotaTerreno:gn('cm-cotaTer'),
    cotaColectora:gn('cm-cotaCol'),
    cotaExtremo:gn('cm-cotaExt'),
    cotaVereda:gn('cm-cotaVer'),
    obs:g('cm-obs'),
    fechaMod:new Date().toISOString()
  };
  cloacaLinks[rid]=link;
  saveCloacaLinks();
  // También actualizar la parcela en records para mantener consistencia
  const idx=records.findIndex(x=>x.id===rid);
  if(idx>=0){
    if(link.nroCloaca)records[idx].nroCloaca=link.nroCloaca;
    if(link.fechaCloaca)records[idx].fechaCloaca=link.fechaCloaca;
    if(link.diametro)records[idx].diametroCloaca=link.diametro;
    if(link.profundidad!=null)records[idx].profundidadCloaca=link.profundidad;
    if(link.distancia!=null)records[idx].distanciaEsquina=link.distancia;
    if(link.lado)records[idx].ladoCloaca=link.lado;
    if(link.cotaTerreno!=null)records[idx].cotaTerreno=link.cotaTerreno;
    if(link.cotaColectora!=null)records[idx].cotaColectora=link.cotaColectora;
    if(link.cotaExtremo!=null)records[idx].cotaExtremo=link.cotaExtremo;
    if(link.cotaVereda!=null)records[idx].cotaVereda=link.cotaVereda;
    if(link.obs)records[idx].obsCloaca=link.obs;
    records[idx].tieneCloaca=true;
    saveData();
    pushParcelaToDrive(records[idx],null);
  }
  document.getElementById('cloaca-modal')?.remove();
  // Feedback visual
  const toast=document.createElement('div');
  toast.style.cssText='position:fixed;bottom:24px;right:24px;background:#1a6b3a;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2)';
  toast.textContent='✅ Conexión de cloaca guardada';
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(),2500);
  // Refrescar capa de parcelas en el mapa para que el polígono cambie a verde
  if(dashMap){
    if(dashLayers&&dashLayers.parcelas){
      try{dashMap.removeLayer(dashLayers.parcelas);}catch(e){}
      dashLayers.parcelas=null;
    }
    if(dashLayerVisible&&dashLayerVisible.parcelas) dashRenderParcelas();
  }
  if(view==='detail')render();
}

// Importar plano rural DXF (GeoJSON convertido)
async function doImportRuralGeo(){
  const f=document.getElementById('rural-geo-file');
  const st=document.getElementById('imp-status-rural-geo');
  if(!f||!f.files.length){alert('Seleccioná el archivo GeoJSON del plano rural.');return;}
  st.textContent='Leyendo archivo...';
  const text=await f.files[0].text();
  let data;
  try{data=JSON.parse(text);}catch(e){alert('Archivo GeoJSON inválido.');st.textContent='';return;}
  if(!data.features||!data.features.length){alert('El GeoJSON no tiene features.');st.textContent='';return;}

  // Asegurar handle en cada feature
  data.features=data.features.map((feat,i)=>({
    ...feat,
    properties:{...feat.properties, handle: feat.properties.handle||feat.properties.partida||feat.properties.id||('rural_'+i)}
  }));
  ruralGeo=data;
  try{localStorage.setItem(RURAL_GEO_KEY,JSON.stringify(ruralGeo));}catch(e){
    alert('El archivo es muy grande para el almacenamiento local. Se usará solo en esta sesión.');
  }

  st.textContent='Vinculando automáticamente con el padrón...';
  await new Promise(r=>setTimeout(r,30));

  // ── VINCULACIÓN AUTOMÁTICA POR PARTIDA ──────────────────────────────────────
  let autoVinc=0, sinMatch=0;
  const nuevosLinks={...ruralLinks};
  const ptFeats=data.features.filter(f=>f.geometry&&f.geometry.type==='Point');

  ptFeats.forEach(feat=>{
    const partida=(feat.properties.partida||'').toString().trim();
    if(!partida) return;
    const handle=feat.properties.handle;
    const fp=partida.replace(/\D/g,'');
    const fpCirc=fp.slice(0,12);
    // Primero match exacto, luego por circunscripción (mismo campo, distintos sublotes)
    const match=ruralRecords.find(r=>{
      const rp=(r.partida||'').toString().replace(/\D/g,'');
      return rp===fp;
    })||ruralRecords.find(r=>{
      const rp=(r.partida||'').toString().replace(/\D/g,'');
      return rp.slice(0,12)===fpCirc&&!nuevosLinks[r.id];
    });
    if(match&&!nuevosLinks[match.id]){nuevosLinks[match.id]=handle;autoVinc++;}
    else{sinMatch++;}
  });

  ruralLinks=nuevosLinks;
  saveRuralLinks();

  const pts=ptFeats.length;
  const lineas=data.features.filter(f=>f.geometry&&f.geometry.type==='LineString').length;
  let msg=`✅ Plano cargado — ${pts} puntos de parcela, ${lineas} segmentos de límite.`;
  if(autoVinc>0) msg+=` <b style="color:var(--green)">🔗 ${autoVinc} parcelas vinculadas automáticamente al padrón.</b>`;
  if(sinMatch>0) msg+=` ${sinMatch} sin coincidencia (podés vincularlas manualmente).`;
  if(ruralRecords.length===0&&pts>0) msg+=` ⚠️ No hay padrón rural cargado — importá el padrón primero para el cruce automático.`;
  st.innerHTML=msg+' Subiendo a Drive...';
  render();
  // Subir a Drive automáticamente usando el sistema unificado de GeoFiles
  subirGeoJSON('catastro_rural_geo', ruralGeo, 'catastro_rural.geojson').then(ok=>{
    st.innerHTML=msg+(ok?' ☁️ Guardado en Drive.':" ⚠️ No se pudo subir a Drive — usá el botón ☁️ Subir en Ajustes.");
  });
}

// ── RURAL GEO — Drive & descarga ─────────────────────────────────────────────
async function pushRuralGeoToDrive(){
  const st=document.getElementById('imp-status-rural-geo');
  if(!ruralGeo){if(st)st.textContent='⚠️ No hay plano rural cargado.';return;}
  if(!DRIVE_API_URL||!DRIVE_TOKEN){if(st)st.textContent='⚠️ Drive no configurado.';return;}
  if(st)st.textContent='Subiendo plano rural a Drive...';
  try{
    const geoStr=JSON.stringify(ruralGeo);
    await new Promise((resolve)=>{
      const cbName='__ruralGeo_'+Date.now();
      const iframeName=cbName+'_f';
      const iframe=document.createElement('iframe');
      iframe.name=iframeName; iframe.style.display='none';
      const form=document.createElement('form');
      form.method='POST'; form.action=DRIVE_API_URL;
      form.target=iframeName; form.style.display='none';
      [['token',DRIVE_TOKEN],['accion','guardarRuralGeo'],['data',geoStr]].forEach(([k,v])=>{
        const i=document.createElement('input');
        i.type='hidden';i.name=k;i.value=v;form.appendChild(i);
      });
      document.body.appendChild(iframe);
      document.body.appendChild(form);
      iframe.onload=()=>{try{document.body.removeChild(form);document.body.removeChild(iframe);}catch(_){}resolve();};
      form.submit();
      setTimeout(resolve,10000);
    });
    if(st)st.innerHTML='<span style="color:var(--green)">☁️ Plano rural subido a Drive correctamente.</span>';
  }catch(e){
    if(st)st.textContent='Error al subir: '+e.message;
  }
}

function pullRuralGeoFromDrive(){
  const st=document.getElementById('imp-status-rural-geo');
  if(!DRIVE_API_URL||!DRIVE_TOKEN){if(st)st.textContent='⚠️ Drive no configurado.';return;}
  if(st)st.textContent='Bajando plano rural de Drive...';
  const cbName='rg_'+Date.now();
  const to=setTimeout(()=>{
    delete window[cbName];
    if(st)st.textContent='⏱ Timeout — no se pudo conectar con Drive.';
  },20000);
  window[cbName]=function(data){
    clearTimeout(to);delete window[cbName];
    if(!data||data==='vacio'||data.error){
      if(st)st.textContent='⚠️ '+(data&&data.error?data.error:'No hay plano rural guardado en Drive.');
      return;
    }
    try{
      const geo=typeof data==='string'?JSON.parse(data):data;
      if(!geo.features){if(st)st.textContent='⚠️ Datos inválidos recibidos de Drive.';return;}
      ruralGeo=geo;
      try{localStorage.setItem(RURAL_GEO_KEY,JSON.stringify(ruralGeo));}catch(e){}
      if(st)st.innerHTML='<span style="color:var(--green)">✅ Plano rural bajado de Drive — '+ruralGeo.features.length.toLocaleString('es')+' geometrías.</span>';
      render();
    }catch(e){if(st)st.textContent='Error al procesar datos: '+e.message;}
  };
  const s=document.createElement('script');
  s.src=DRIVE_API_URL+'?token='+encodeURIComponent(DRIVE_TOKEN)+'&archivo=rural_geo.json&callback='+cbName+'&t='+Date.now();
  s.onerror=()=>{clearTimeout(to);delete window[cbName];if(st)st.textContent='Error de red al conectar con Drive.';};
  document.head.appendChild(s);
}

function descargarRuralGeo(){
  if(!ruralGeo){alert('No hay plano rural cargado.');return;}
  const blob=new Blob([JSON.stringify(ruralGeo)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='rural_alcorta_plano.geojson';
  a.click();
}

function doWipeRuralGeo(){
  if(!confirm('¿Borrar el plano rural?'))return;
  ruralGeo=null;
  localStorage.removeItem(RURAL_GEO_KEY);
  render();
}
