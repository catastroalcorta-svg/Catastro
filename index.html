<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catastro Municipal — Alcorta v45</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    --bg: #f0f4f8;
    --surface: #ffffff;
    --surface2: #f7f9fc;
    --surface3: #eef2f7;
    --border: #dde3ec;
    --border2: #c8d0dc;
    --text: #0f1923;
    --text2: #4a5568;
    --text3: #8896aa;
    --accent: #1a56db;
    --accent-light: #eff4ff;
    --accent-dark: #1240a8;
    --accent-text: #1240a8;
    --green: #0e7a3f;
    --green-bg: #ecfdf5;
    --green-light: #d1fae5;
    --red: #b91c1c;
    --red-bg: #fef2f2;
    --warn: #92400e;
    --warn-bg: #fffbeb;
    --purple: #6d28d9;
    --purple-bg: #f5f3ff;
    --radius: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
    --shadow: 0 4px 6px rgba(0,0,0,.06), 0 2px 4px rgba(0,0,0,.04);
    --shadow-lg: 0 10px 25px rgba(0,0,0,.08), 0 4px 10px rgba(0,0,0,.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; font-size: 14px; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* INPUTS */
  input, select, textarea {
    width: 100%; padding: 8px 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius); font-size: 13px;
    font-family: inherit; background: var(--surface);
    color: var(--text); margin-bottom: 6px;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(26,86,219,.12);
  }
  textarea { resize: vertical; min-height: 60px; }
  label {
    font-size: 11px; font-weight: 600; color: var(--text3);
    display: block; margin-bottom: 3px; margin-top: 10px;
    text-transform: uppercase; letter-spacing: .06em;
  }

  /* BUTTONS */
  .btn {
    padding: 8px 16px; border: 1.5px solid var(--border);
    border-radius: var(--radius); cursor: pointer; font-size: 13px;
    font-family: inherit; background: var(--surface); color: var(--text);
    transition: all .15s; font-weight: 500;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .btn:hover { background: var(--surface3); border-color: var(--border2); box-shadow: var(--shadow-sm); }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 2px 4px rgba(26,86,219,.25); }
  .btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); box-shadow: 0 4px 8px rgba(26,86,219,.3); }
  .btn-danger { color: var(--red); border-color: #fca5a5; }
  .btn-danger:hover { background: var(--red-bg); }
  .btn-sm { padding: 5px 11px; font-size: 12px; }
  .btn-success { background: var(--green-bg); color: var(--green); border-color: var(--green-light); }
  .btn-success:hover { background: var(--green-light); }

  /* GRIDS */
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .g4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }

  /* HEADER */
  .hdr {
    background: linear-gradient(135deg, #0f1923 0%, #1a2d45 100%);
    color: #fff; padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between;
    height: 56px; box-shadow: 0 2px 8px rgba(0,0,0,.2);
    position: sticky; top: 0; z-index: 1000;
  }
  .hdr-left { display: flex; align-items: center; gap: 14px; }
  .hdr-logo {
    font-family: 'Inter', sans-serif; font-size: 15px;
    font-weight: 700; letter-spacing: -.01em;
    background: linear-gradient(90deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .hdr-sep { width: 1px; height: 22px; background: rgba(255,255,255,.15); }
  .hdr-title { font-size: 12px; opacity: .6; font-weight: 400; }
  .badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
  .badge-admin { background: rgba(16,185,129,.2); color: #6ee7b7; border: 1px solid rgba(16,185,129,.3); }
  .badge-consulta { background: rgba(99,102,241,.2); color: #a5b4fc; border: 1px solid rgba(99,102,241,.3); }
  .badge-editor { background: rgba(245,158,11,.2); color: #fcd34d; border: 1px solid rgba(245,158,11,.3); }

  /* TOPNAV */
  .topnav {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 12px; display: flex; gap: 2px; align-items: center;
    min-height: 44px; height: auto; box-shadow: var(--shadow-sm);
    flex-wrap: wrap; overflow: visible;
  }
  .tn-btn {
    padding: 6px 10px; border: none; background: none;
    cursor: pointer; font-size: 13px; font-family: inherit;
    color: var(--text2); border-radius: 6px; font-weight: 500;
    transition: all .15s; white-space: nowrap;
  }
  .tn-btn:hover { background: var(--surface3); color: var(--text); }
  .tn-btn.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }

  /* CONTENT */
  .content { max-width: 900px; margin: 0 auto; padding: 20px 16px; }

  /* STATS */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 10px; margin-bottom: 16px; }
  .stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 14px 16px;
    box-shadow: var(--shadow-sm); transition: box-shadow .15s;
  }
  .stat:hover { box-shadow: var(--shadow); }
  .stat-num { font-size: 24px; font-weight: 700; color: var(--accent); letter-spacing: -.02em; }
  .stat-label { font-size: 11px; color: var(--text3); margin-top: 3px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }

  /* SEARCHBAR */
  .searchbar {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 10px 14px;
    margin-bottom: 10px; box-shadow: var(--shadow-sm);
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .searchbar input { margin: 0; border-radius: var(--radius); }

  /* LIST */
  .vlist { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; background: var(--surface); box-shadow: var(--shadow-sm); }
  .vlist-scroll { overflow-y: auto; }
  .vi {
    padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--border);
    transition: background .1s; display: flex; justify-content: space-between;
    align-items: center; gap: 10px;
  }
  .vi:last-child { border-bottom: none; }
  .vi:hover { background: var(--surface2); }
  .vi-l { flex: 1; min-width: 0; }
  .vi-t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vi-s { font-size: 12px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vi-r { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

  /* TAGS */
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; display: inline-block; }
  .tag-green { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-light); }
  .tag-gray { background: var(--surface3); color: var(--text2); border: 1px solid var(--border); }
  .tag-blue { background: var(--accent-light); color: var(--accent); border: 1px solid #bfdbfe; }
  .tag-orange { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }

  /* CARDS */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 20px;
    margin-bottom: 14px; box-shadow: var(--shadow-sm);
  }

  /* DETAIL */
  .detail-wrap { display: grid; gap: 14px; }
  .detail-hero {
    background: linear-gradient(135deg, #1a2d45 0%, #0f1923 100%);
    color: #fff; padding: 20px 24px; border-radius: var(--radius-lg);
    display: flex; justify-content: space-between; align-items: flex-start;
    box-shadow: var(--shadow);
  }
  .detail-name { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
  .detail-sub { font-size: 13px; opacity: .7; margin-top: 4px; }
  .dsec { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow-sm); }
  .dsec-title { font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .dg { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; }
  .dg-k { font-size: 12px; font-weight: 600; color: var(--text3); white-space: nowrap; padding: 3px 0; }
  .dg-v { font-size: 13px; color: var(--text); padding: 3px 0; }

  /* FORM */
  .form-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow); }
  .form-hdr { background: var(--surface2); padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .form-hdr h2 { font-size: 16px; font-weight: 700; }
  .tabs { display: flex; gap: 2px; padding: 10px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .tab-btn { padding: 6px 14px; border: none; background: none; cursor: pointer; font-size: 13px; font-family: inherit; color: var(--text2); border-radius: 6px; font-weight: 500; transition: all .15s; }
  .tab-btn:hover { background: var(--surface3); color: var(--text); }
  .tab-btn.active { background: var(--accent); color: #fff; font-weight: 600; }
  .form-section { display: none; padding: 20px; }
  .form-section.active { display: block; }
  .sec-title { font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 14px; margin-top: 4px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .actions { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .form-actions { padding: 14px 20px; background: var(--surface2); border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

  /* PROGRESS */
  .progress-bar { background: var(--surface3); border-radius: 99px; height: 4px; margin-top: 8px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #60a5fa); border-radius: 99px; transition: width .4s ease; }

  /* MAP */
  .map-wrap { border-radius: var(--radius); border: 1px solid var(--border); margin-top: 8px; position: relative; }
  #parcel-map { height: 360px !important; width: 100% !important; display: block !important; background: #e8e0d8; }
  .map-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .map-hint { font-size: 12px; background: var(--warn-bg); border: 1px solid #fcd34d; border-radius: var(--radius); padding: 8px 12px; margin-bottom: 8px; display: none; }
  .map-infobar { font-size: 12px; background: var(--surface2); border-radius: var(--radius); padding: 8px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; border: 1px solid var(--border); }

  /* CROQUIS */
  .croquis-wrap { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
  .croquis-canvas-wrap { position: relative; flex-shrink: 0; }
  #cv { border: 1.5px solid var(--border); border-radius: var(--radius); background: #fff; cursor: crosshair; display: block; touch-action: none; }
  #cv.mode-move { cursor: grab; }
  #cv.mode-move:active { cursor: grabbing; }
  .croquis-ctrl { flex: 1; min-width: 180px; }
  .croquis-toolbar { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .tool-btn { padding: 5px 10px; border: 1.5px solid var(--border); border-radius: var(--radius); cursor: pointer; font-size: 12px; font-family: inherit; background: var(--surface); color: var(--text); transition: all .15s; }
  .tool-btn:hover { background: var(--surface3); }
  .tool-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tool-btn.danger { color: var(--red); border-color: #fca5a5; }
  .tool-btn.danger:hover { background: var(--red-bg); }
  .pt-list { max-height: 120px; overflow-y: auto; margin-top: 8px; border: 1px solid var(--border); border-radius: var(--radius); }
  .pt-item { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; font-size: 11px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid var(--border); }
  .pt-item:last-child { border-bottom: none; }
  .pt-item.selected { background: var(--accent-light); }
  .pt-del { border: none; background: none; color: var(--red); cursor: pointer; font-size: 14px; padding: 0 2px; }

  /* TABLE */
  .prop-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .prop-table th { background: var(--surface2); padding: 8px 10px; text-align: left; font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--border); }
  .prop-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .prop-table tr:last-child td { border-bottom: none; }
  .prop-table tr:hover td { background: var(--surface2); }

  /* EMPTY */
  .empty { text-align: center; padding: 48px 20px; color: var(--text2); }
  .empty strong { display: block; font-size: 16px; color: var(--text); margin-bottom: 6px; }

  /* MORE */
  .more-wrap { padding: 12px; text-align: center; border-top: 1px solid var(--border); }

  /* SYNC BADGE */
  #sync-badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 500; cursor: pointer; transition: all .2s; }

  /* FILTROS */
  #filtros-panel { background: var(--surface2); border-bottom: 1px solid var(--border); padding: 8px 14px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  #filtros-panel select { margin: 0; font-size: 12px; padding: 5px 8px; }

  /* AJUSTES */
  .ajustes-grid { display: grid; gap: 14px; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

  /* ANIMATIONS */
  @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
  .content { animation: fadeIn .2s ease; }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    .hdr { padding: 0 12px; height: 50px; }
    .content { padding: 12px 10px; }
    .g2, .g3, .g4 { grid-template-columns: 1fr 1fr; }
    .detail-hero { flex-direction: column; gap: 10px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const DB_KEY='catastro_alcorta_v1';
const USUARIOS_KEY='catastro_usuarios';
const SESSION_KEY='catastro_session';

// Usuario actual en sesión
let currentUser=null; // {nombre, usuario, rol:'admin'|'editor'|'consulta'}
let isAdmin=false;
// ── SISTEMA DE PERMISOS POR USUARIO ──────────────────────────────────────────
// Módulos disponibles y sus labels
const MODULOS = [
  {id:'parcelas',    label:'🏠 Parcelas',     desc:'Padrón urbano TGIU'},
  {id:'stats',       label:'📊 Stats',         desc:'Dashboard estadísticas'},
  {id:'vinculacion', label:'🔗 Vinculación',   desc:'Vincular parcelas al plano'},
  {id:'numeracion',  label:'🔢 Numeración',    desc:'Numeración domiciliaria'},
  {id:'dri',         label:'🏪 DRI',           desc:'Comercios e industrias'},
  {id:'deudas',      label:'💰 Deudas',        desc:'Módulo de deudas municipales'},
  {id:'alertas',     label:'🔔 Alertas',       desc:'Alertas y vencimientos'},
  {id:'manzanas',    label:'🗺 Manzanas',      desc:'Gestión de manzanas'},
  {id:'calles',      label:'🛣️ Calles',        desc:'Estado de calles'},
  {id:'rural',       label:'🌾 Rural',          desc:'Padrón rural'},
  {id:'operaciones', label:'✂️ Unif/Div',      desc:'Unificación y división'},
  {id:'ajustes',     label:'⚙️ Ajustes',       desc:'Configuración del sistema'},
];
// Niveles: 0=No ver, 1=Ver, 2=Editar, 3=Importar/Exportar
const PERM_NIVELES = ['No ver','Ver','Editar','Importar/Exportar'];
const PERM_COLOR   = ['#6b7280','#3b82f6','#16a34a','#7c3aed'];

// Permisos por defecto según rol (para usuarios existentes sin permisos)
const PERM_DEFAULT = {
  admin:   {parcelas:3,stats:3,vinculacion:3,numeracion:3,dri:3,deudas:3,alertas:3,manzanas:3,calles:3,rural:3,operaciones:3,ajustes:3},
  editor:  {parcelas:2,stats:1,vinculacion:2,numeracion:2,dri:2,deudas:1,alertas:1,manzanas:1,calles:2,rural:2,operaciones:1,ajustes:0},
  consulta:{parcelas:1,stats:1,vinculacion:0,numeracion:1,dri:1,deudas:1,alertas:1,manzanas:0,calles:1,rural:1,operaciones:0,ajustes:0},
};

// Obtener permisos del usuario actual
function getPermisos(usuario){
  if(!usuario) return PERM_DEFAULT.consulta;
  if(usuario.permisos) return usuario.permisos;
  return PERM_DEFAULT[usuario.rol] || PERM_DEFAULT.consulta;
}

// Verificar si el usuario actual puede hacer algo en un módulo
// nivel: 1=ver, 2=editar, 3=importar/exportar
function puedoVer(modulo){ return getPermisos(currentUser)[modulo]>=1; }
function puedoEditar(modulo){ return getPermisos(currentUser)[modulo]>=2; }
function puedoImportar(modulo){ return getPermisos(currentUser)[modulo]>=3; }

let records=[],filtered=[],view='list',curRec=null,editId=null;
let cPts=[],cCalles={N:'',S:'',E:'',O:'',NE:'',NO:'',SE:'',SO:''},cLados=[],cArea=null,props=[],tits={};
let ftab='catastro',sq='',fcloaca='todos',ftipo='todos',fmanzana='',festado='todos',fvinculado='todos',fterr='todos',page=0;
let dashMap=null,dashLayers={},dashLayerVisible={parcelas:true,cloacas:false,dri:false,rural:false,calles:false,deudores:false,numeracion:false};
let historial={},callesData=[],operMap=null,operSelParcelas=[],operMode='',operLayer=null,operSatMode=false,callesMap=null,callesDrawing=false,callesPuntos=[],callesPolyTemp=null,callesMarkers=[],callesLayers={},callesSelId=null,mzLinks={},mzData=[],geoData=null,geoLinks={},parcelasNuevas=[],drawControl=null,drawnItems=null,geoCloacas=null,leafMap=null,satelliteLayer=null,streetsLayer=null,parcelLayer=null,curParcelLayer=null,cloacasLayer=null,showCloacas=false,useSat=false,vincModo=false;
const GEO_LINKS_KEY='catastro_geo_links';
const MZ_LINKS_KEY='catastro_mz_links';
const MZ_DATA_KEY='catastro_mz_data';
let cvEl=null,cvCtx=null,drag=-1;
// Datos de manzanas embebidos en el HTML
let MANZANAS_EMBEBIDO = null; // catastro_manzanas.json

// GeoJSON embebido directamente en el HTML
let GEOJSON_EMBEBIDO = null; // datos cargados via fetch

const PG=60;

// ── GOOGLE DRIVE SYNC ─────────────────────────────────────────────────────────
let DRIVE_API_URL='https://script.google.com/macros/s/AKfycbyflBPllDTTaQ6rmu8dlNUj2FwtzyHsrMAgmk73QTXnv2ZnYQlABxsC0y6393I_MzWJ8w/exec';
localStorage.setItem('catastro_drive_url',DRIVE_API_URL); // Actualiza URL en localStorage
let DRIVE_TOKEN='alcorta2024'; // Token fijo — siempre usa este valor
localStorage.setItem('catastro_drive_token','alcorta2024'); // Limpia cualquier token viejo guardado
let syncStatus=''; // 'syncing','ok','error',''
let lastSyncTime=localStorage.getItem('catastro_last_sync')||'';

// ── STORAGE (localStorage para app standalone) ─────────────────────────────
// ── USUARIOS ─────────────────────────────────────────────────────────────────
var vacio=null; // Previene error cuando Apps Script devuelve 'vacio' sin comillas
// ── SISTEMA DE USUARIOS — Versión v36 (Backend con hash SHA-256) ─────────────
// Los usuarios viven en usuarios.json en Drive (separado de catastro_backup.json).
// El login y los cambios de contraseña se hacen contra el backend.
// localStorage solo guarda metadatos públicos (nombre, rol, permisos) para
// renderizar la UI sin requerir conexión constante. NO guarda contraseñas.

const USUARIOS_META_KEY='catastro_usuarios_meta_v2';

function getUsuarios(){
  // Devuelve los usuarios desde localStorage (metadatos sin pass).
  // Para actualizar la lista desde el backend, llamar refreshUsuariosFromDrive().
  try{
    const u=localStorage.getItem(USUARIOS_META_KEY);
    if(u){
      const parsed=JSON.parse(u);
      if(Array.isArray(parsed)&&parsed.length>0) return parsed;
    }
  }catch(e){}
  // Fallback mínimo si nunca se cargó la lista — solo para no romper la UI.
  return [
    {nombre:'Administrador',usuario:'admin',rol:'admin'},
    {nombre:'Consulta',usuario:'consulta',rol:'consulta'}
  ];
}

function saveUsuariosMeta(usuarios){
  // Guarda solo metadatos públicos en localStorage (NO contraseñas).
  try{
    const limpio=usuarios.map(u=>({
      nombre:u.nombre, usuario:u.usuario, rol:u.rol,

// Bajar la lista de usuarios del backend (al iniciar sesión o refrescar Ajustes).
async function refreshUsuariosFromDrive(){
  if(!DRIVE_API_URL||!DRIVE_TOKEN) return null;
  try{
    const resp = await _driveCall({ accion:'obtenerUsuarios' });
    if(resp && resp.ok && Array.isArray(resp.usuarios)){
      // El backend devuelve solo { usuario, nombre, rol } — sin permisos ni hash.
      // Hay que mergear con permisos que ya teníamos en localStorage.
      const previo=getUsuarios();
      const merged=resp.usuarios.map(u=>{
        const old=previo.find(p=>p.usuario===u.usuario);
        return {
          nombre:u.nombre, usuario:u.usuario, rol:u.rol,
          permisos: (old&&old.permisos) || null
        };
      });
      saveUsuariosMeta(merged);
      return merged;
    }
  }catch(e){
    console.warn('refreshUsuariosFromDrive falló:', e);
  }
  return null;
}

// Login: ahora pregunta al backend mediante verificarLogin (vía JSONP).
// Devuelve una Promise<{ok, error?}>.
async function login(usuario,pass){
  if(!DRIVE_API_URL||!DRIVE_TOKEN){
    return { ok:false, error:'Sistema sin Drive configurado. Andá a Ajustes para configurar la URL.' };
  }
  try{
    const resp = await _driveCall({
      accion:'verificarLogin',
      usuario: usuario,
      pass: pass
    });
    if(resp && resp.ok){
      const previos = getUsuarios();
      const meta = previos.find(u=>u.usuario===resp.usuario);
      currentUser = {
        nombre: resp.nombre,
        usuario: resp.usuario,
        rol: resp.rol,
        permisos: (meta && meta.permisos) || null
      };
      isAdmin = (resp.rol==='admin'||resp.rol==='editor');
      saveSession(currentUser);
      refreshUsuariosFromDrive().catch(()=>{});
      return { ok:true };
    }
    return { ok:false, error:(resp&&resp.error)||'Usuario o contraseña incorrectos.' };
  }catch(e){
    return { ok:false, error:'No se pudo conectar al servidor. Intentá de nuevo.' };
  }
}

  currentUser=null;isAdmin=false;
  clearSession();view='login';render();
}

  });
  try{

  }
}

// Al cargar un registro, restaurar fotos desde su clave separada si las tiene
function restaurarFotosDeLS(r){
  if(!r||!r.id) return r;
  // Si las fotos son referencias (ref:true) y hay datos guardados aparte, restaurarlos
  const tieneSoloRefs=r.fotos&&r.fotos.length>0&&r.fotos.every(f=>f&&f.ref);

    try{

  }
  return r;
}

// ── DRIVE SYNC v2 — operaciones granulares ──────────────────────────────────
// Helper interno: envía datos a Drive via form POST (evita bloqueo file://)
function _driveFetch(params){
  if(!DRIVE_API_URL||!DRIVE_TOKEN) return Promise.resolve(null);
  return new Promise((resolve)=>{
    const cbName='__df_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const iframeName=cbName+'_f';
    const iframe=document.createElement('iframe');
    iframe.name=iframeName; iframe.style.display='none';
    const form=document.createElement('form');
    form.method='POST'; form.action=DRIVE_API_URL;
    form.target=iframeName; form.style.display='none';
    const allParams=Object.assign({token:DRIVE_TOKEN},params);
    Object.keys(allParams).forEach(k=>{
      const inp=document.createElement('input');
      inp.type='hidden'; inp.name=k; inp.value=allParams[k];
      form.appendChild(inp);
    });
    document.body.appendChild(iframe);
    document.body.appendChild(form);
    iframe.onload=()=>{
      try{document.body.removeChild(form);}catch(_){}
      try{document.body.removeChild(iframe);}catch(_){}
      resolve({ok:true});
    };
    iframe.onerror=()=>{ resolve({ok:false}); };
    form.submit();
    setTimeout(()=>resolve({ok:true,via:'timeout'}),12000);
  });
}

// _driveCall: como _driveFetch pero usa JSONP para PODER LEER la respuesta del backend.
// Necesario para acciones como verificarLogin, obtenerUsuarios, resetPassword, etc.
// que requieren saber qué respondió el servidor (no solo dispararlo).
let __jsonpCounter = 0;
function _driveCall(params, opts){
  return new Promise((resolve, reject)=>{
    if(!DRIVE_API_URL||!DRIVE_TOKEN){ resolve(null); return; }
    const cbName = '__catCb_' + (++__jsonpCounter) + '_' + Date.now();
    const allParams = Object.assign({ token: DRIVE_TOKEN, callback: cbName }, params || {});
    const qs = Object.keys(allParams).map(k=>k+'='+encodeURIComponent(allParams[k])).join('&');
    const url = DRIVE_API_URL + '?' + qs;

    const script = document.createElement('script');
    let done = false;
    const timeout = setTimeout(()=>{
      if(done) return;
      done = true;
      try{ delete window[cbName]; }catch(_){}
      try{ script.remove(); }catch(_){}
      reject(new Error('timeout'));
    }, (opts && opts.timeout) || 25000);

    window[cbName] = function(data){
      if(done) return;
      done = true;
      clearTimeout(timeout);
      try{ delete window[cbName]; }catch(_){}
      try{ script.remove(); }catch(_){}
      resolve(data);
    };

    script.onerror = function(){
      if(done) return;
      done = true;
      clearTimeout(timeout);
      try{ delete window[cbName]; }catch(_){}
      try{ script.remove(); }catch(_){}
      reject(new Error('network error'));
    };

    script.src = url;
    document.head.appendChild(script);
  });
}

      const body=JSON.stringify({token:DRIVE_TOKEN, accion:'guardarTodo', data:JSON.stringify(obj)});
      try{
        await fetch(DRIVE_API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body});
      }catch(e){ console.warn('[Push] fetch error (se reintenta en verificación):',e); }
      // Respuesta opaca (no-cors): pausa para que el server termine de escribir y suelte el lock.
      await new Promise(r=>setTimeout(r,700));
    }

    // ── Lectura SOLO de conteo (JSONP), sin tocar los datos locales ──
    function _contarEnDrive(){
      return new Promise(resolve=>{
        const cb='cnt_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
        const limpiar=()=>{try{delete window[cb];}catch(_){}try{const s=document.getElementById(cb);if(s)s.remove();}catch(_){}};
        const to=setTimeout(()=>{limpiar();resolve(null);},15000);
        window[cb]=function(data){
          clearTimeout(to); limpiar();
          if(data&&Array.isArray(data.records)) resolve(data.records.length);
          else resolve(null);
        };
        const s=document.createElement('script');
        s.id=cb;
        s.onerror=()=>{clearTimeout(to);limpiar();resolve(null);};
        s.src=DRIVE_API_URL+'?token='+encodeURIComponent(DRIVE_TOKEN)+'&callback='+cb+'&_t='+Date.now();
        document.head.appendChild(s);
      });
    }

    // Dividir records en chunks de 500 para no superar 2MB por POST
    const CHUNK=500;
    const chunks=[];
    for(let i=0;i<backup.records.length;i+=CHUNK){
      chunks.push(backup.records.slice(i,i+CHUNK));
    }
    if(chunks.length===0) chunks.push([]); // caso borde: 0 records → un replace vacío igual escribe metadatos

    function _payload(idx){
      return idx===0 ? {
        version:backup.version, savedBy:backup.savedBy, lastSync:backup.lastSync,
        records:chunks[idx],
        historial:backup.historial, geoLinks:backup.geoLinks,
        mzLinks:backup.mzLinks, mzData:backup.mzData,
        calles:backup.calles, usuarios:backup.usuarios,
        cloacaLinks:backup.cloacaLinks, cloacaGeoLinks:backup.cloacaGeoLinks,
        driRecords:backup.driRecords, parcelasNuevas:backup.parcelasNuevas,
        deudaUpdTasa:backup.deudaUpdTasa, deudaUpdCloaca:backup.deudaUpdCloaca, deudaUpdRural:backup.deudaUpdRural,
        _chunkIdx:idx, _chunkTotal:chunks.length, _chunkMode:'replace'
      } : {
        version:backup.version, savedBy:backup.savedBy, lastSync:backup.lastSync,
        records:chunks[idx],
        _chunkIdx:idx, _chunkTotal:chunks.length, _chunkMode:'append'
      };
    }

    const esperado=backup.records.length;

    // 1) Enviar SECUENCIALMENTE (uno por vez, sin reentradas ni duplicados)
    for(let i=0;i<chunks.length;i++){
      console.log('[Push] Chunk '+(i+1)+'/'+chunks.length+' ('+chunks[i].length+' regs)');
      await _postDrive(_payload(i));
    }

    // 2) VERIFICAR el total real en Drive; si falta, reenviar los append y reverificar (hasta 3 veces)
    let enDrive=await _contarEnDrive();
    console.log('[Push] Verificación: Drive='+enDrive+' / esperado='+esperado);
    let intentos=0;
    while(enDrive!==null && enDrive<esperado && intentos<3){
      intentos++;
      console.warn('[Push] Incompleto ('+enDrive+'/'+esperado+'). Reintento '+intentos+'…');
      for(let i=1;i<chunks.length;i++){ await _postDrive(_payload(i)); }
      enDrive=await _contarEnDrive();
      console.log('[Push] Reverificación: Drive='+enDrive+' / esperado='+esperado);
    }

    // 3) Rural (después de tener los urbanos completos)
    if(backup.ruralRecords&&backup.ruralRecords.length>0){
      console.log('[Push] Rural: '+backup.ruralRecords.length+' regs');
      await _postDrive({
        version:backup.version, savedBy:backup.savedBy, lastSync:backup.lastSync,
        ruralRecords:backup.ruralRecords, ruralLinks:backup.ruralLinks,
        _chunkMode:'rural'
      });
    }

    // 4) Resultado HONESTO — nunca decir "guardado" si quedó corto
    if(enDrive!==null && enDrive<esperado){
      syncStatus='error'; updateSyncBadge();
      const msg='⚠️ La subida a Drive quedó INCOMPLETA: Drive tiene '+enDrive+' de '+esperado+' parcelas.\n\nTus datos locales están intactos. Probá subir de nuevo; si sigue fallando, avisá antes de trabajar en otra PC.';
      console.error('[Push] '+msg);
      if(!silent) alert(msg);
      return;
    }
    lastSyncTime=backup.lastSync;
    localStorage.setItem('catastro_last_sync', lastSyncTime);
    if(enDrive===null){
      syncStatus='ok';
      console.warn('[Push] Chunks enviados, pero no se pudo verificar el conteo (Drive no respondió). Revisá al reconectar.');
    } else {
      syncStatus='ok';
      console.log('[Push] ✅ Completo y verificado: '+enDrive+' parcelas en Drive.');
    }
    if(!silent){
      const b=document.getElementById('sync-badge');
      if(b) b.title='✅ Guardado y verificado en Drive: '+new Date(lastSyncTime).toLocaleTimeString('es-AR');
    }
  }catch(e){
    syncStatus='error';
    if(!silent) alert('Error al guardar en Drive: '+e.message);
  }
  updateSyncBadge();
}

// ── AUTO-BACKUP A DRIVE CADA 10 MINUTOS ──────────────────────────────────────
let _autoBackupInterval=null;
let _lastModifiedAtLastBackup='';

function iniciarAutoBackupDrive(){
  if(_autoBackupInterval) clearInterval(_autoBackupInterval);
  if(!DRIVE_API_URL||!DRIVE_TOKEN) return;

  _autoBackupInterval=setInterval(async()=>{
    if(!DRIVE_API_URL||!DRIVE_TOKEN||!currentUser) return;
    // Solo subir si hubo cambios desde el último backup
    const lastMod=localStorage.getItem('catastro_last_modified')||'';
    if(lastMod && lastMod===_lastModifiedAtLastBackup) return; // sin cambios
    _lastModifiedAtLastBackup=lastMod;

    console.log('[AutoBackup] Subiendo backup completo a Drive...');
    await pushToDrive(true); // silent=true → sin alertas

    // Mostrar feedback breve en el badge
    const b=document.getElementById('sync-badge');
    if(b){
      const t=new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
      b.innerHTML='☁️ Guardado '+t;
      b.style.background='rgba(26,107,58,.3)';
      b.style.color='#6ddb9a';
    }
  }, 10*60*1000); // cada 10 minutos

  console.log('[AutoBackup] Activado — sube a Drive cada 10 minutos si hay cambios');
}

// ── BACKUP HISTÓRICO LOCAL ────────────────────────────────────────────────────
const BACKUP_HIST_KEY = 'catastro_backup_historial';
const MAX_BACKUPS = 10;

// Snapshots LIVIANOS: solo guardan los vínculos (geoLinks + mzLinks), no los 4260
// registros. Ocupan pocos KB, así que no llenan el localStorage. Sirven de red de
// seguridad para no volver a perder vinculaciones.
const SNAP_KEY = 'catastro_vinc_snapshots';

function obtenerSnapshots(){
  try{ const s=localStorage.getItem(SNAP_KEY); return s?JSON.parse(s):[]; }catch(e){ return []; }
}

function guardarSnapshotLocal(motivo){
  try{
    const nLinks=Object.keys(geoLinks||{}).length;
    if(nLinks===0) return true; // no guardar estados vacíos
    const snaps=obtenerSnapshots();
    const last=snaps.length?snaps[snaps.length-1]:null;
    // Evitar duplicados consecutivos idénticos
    if(last && last.n===nLinks && JSON.stringify(last.geoLinks)===JSON.stringify(geoLinks)){
      guardarSnapshotLocal._last=String(nLinks);
      return true;
    }
    snaps.push({
      fecha:new Date().toISOString(),
      motivo:motivo||'',
      n:nLinks,
      nmz:Object.keys(mzLinks||{}).length,
      geoLinks:geoLinks,
      mzLinks:mzLinks||{}
    });
    while(snaps.length>MAX_BACKUPS) snaps.shift();
    localStorage.setItem(SNAP_KEY, JSON.stringify(snaps));
    guardarSnapshotLocal._last=String(nLinks);
  }catch(e){ /* si el almacenamiento está lleno, ignorar en silencio */ }
  return true;
}

function restaurarSnapshot(idx){
  const snaps=obtenerSnapshots();
  const s=snaps[idx];
  if(!s){ alert('Snapshot no encontrado.'); return; }
  if(!confirm('¿Restaurar '+s.n+' vínculos del '+new Date(s.fecha).toLocaleString('es-AR')+'?\n\nReemplaza los vínculos actuales y los sube a Drive.')) return;
  guardarSnapshotLocal('antes de restaurar snapshot');
  geoLinks=s.geoLinks||{};
  try{localStorage.setItem(GEO_LINKS_KEY,JSON.stringify(geoLinks));}catch(e){}
  if(s.mzLinks&&Object.keys(s.mzLinks).length>0){
    mzLinks=s.mzLinks;
    try{localStorage.setItem(MZ_LINKS_KEY,JSON.stringify(mzLinks));}catch(e){}
  }
  if(typeof pushToDrive==='function') pushToDrive(true);
  alert('✅ Restaurados '+s.n+' vínculos. Se están subiendo a Drive.');
  try{ filter(); render(); }catch(e){}
}

function descargarSnapshot(idx){
  const snaps=obtenerSnapshots();
  const s=snaps[idx];
  if(!s) return;
  const blob=new Blob([JSON.stringify(s.geoLinks,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);

}

  return html;
}

// Importar vínculos desde un archivo (formato {padron:handle} o {geoLinks:{...}}).
// Combina con lo actual (gana lo que ya tenés cargado) y sube a Drive.
async function importarVinculosArchivo(){
  const f=document.getElementById('vinc-restore-file');
  if(!f||!f.files.length){ alert('Elegí primero el archivo de vínculos (vinculos_mapa_*.json).'); return; }
  let data;
  try{ data=JSON.parse(await f.files[0].text()); }catch(e){ alert('El archivo no es un JSON válido.'); return; }
  let links=(data && data.geoLinks && typeof data.geoLinks==='object') ? data.geoLinks : data;
  if(!links || typeof links!=='object' || Array.isArray(links)){ alert('Formato no reconocido. Se esperaba un objeto padrón→handle.'); return; }
  const nuevos=Object.keys(links).length;
  if(nuevos===0){ alert('El archivo no contiene vínculos.'); return; }
  const actuales=Object.keys(geoLinks||{}).length;
  if(!confirm('El archivo tiene '+nuevos+' vínculos. Ahora tenés '+actuales+'.\n\nSe combinarán (conservando los que ya tenés) y se subirán a Drive. ¿Continuar?')) return;
  guardarSnapshotLocal('antes de importar vínculos desde archivo');
  geoLinks=Object.assign({}, links, geoLinks); // base: archivo; encima: lo local (conserva lo nuevo)
  try{localStorage.setItem(GEO_LINKS_KEY,JSON.stringify(geoLinks));}catch(e){}
  const total=Object.keys(geoLinks).length;
  guardarSnapshotLocal('importación desde archivo ('+total+' vínculos)');
  if(typeof pushToDrive==='function') pushToDrive(true);
  alert('✅ Listo: ahora hay '+total+' vínculos y se están subiendo a Drive.');
  try{ filter(); render(); }catch(e){}
}


function pullFromDrive(showAlert=false){
  if(!DRIVE_API_URL||!DRIVE_TOKEN) return Promise.resolve(false);
  return new Promise(resolve=>{
    syncStatus='syncing'; updateSyncBadge();
    const cbName='ds_'+Date.now();
    const to=setTimeout(()=>{
      delete window[cbName];
      try{const s=document.getElementById(cbName);if(s)document.head.removeChild(s);}catch(e){}
      syncStatus='error'; updateSyncBadge();
      if(showAlert) alert('No se pudo conectar con Drive.\nVerificá la conexión a internet y que el script esté publicado como \"Cualquier usuario\".');
      resolve(false);
    },15000);
    window[cbName]=function(data){
      clearTimeout(to);
      delete window[cbName];
      try{const s=document.getElementById(cbName);if(s)document.head.removeChild(s);}catch(e){}
      if(!data){syncStatus='error';updateSyncBadge();if(showAlert)alert('Drive devolvió respuesta vacía.');resolve(false);return;}
      if(typeof data==='object'&&data.error){syncStatus='error';updateSyncBadge();if(showAlert)alert('Error Drive: '+data.error);resolve(false);return;}
      if(!data||data==='vacio'||data==='ok'||typeof data==='string'&&data.includes('vacio')){
        if(records.length>0&&data==='vacio') pushToDrive(true);
        syncStatus='ok';updateSyncBadge();
        if(showAlert) alert('Drive estaba vacío. Subiendo datos locales...');
        resolve(false);return;
      }
      // REGLA SIMPLE: con Drive configurado, SIEMPRE bajar y aplicar datos de Drive.
      // Drive es la fuente de verdad. No comparar fechas — eso causaba que PC nueva
      // o PC con datos viejos no bajara los datos más recientes.
      const driveDate=new Date(data.lastSync||0).getTime();
      // Solo bloquear si Drive tiene MENOS registros que local (protección anti-corrupción)
      // En ese caso subir local a Drive y resolver sin aplicar
      // Guardar snapshot local ANTES de aplicar datos de Drive
      if(records.length>0) guardarSnapshotLocal('antes de sync Drive');
      // PROTECCIÓN: nunca aplicar si Drive trae muchos menos registros que los locales
      if(data.records&&Array.isArray(data.records)&&records.length>0){
        const driveCount = data.records.length;
        const localCount = records.length;
        if(driveCount < localCount * 0.8){
          syncStatus='error'; updateSyncBadge();
          console.warn('[Sync] BLOQUEADO: Drive tiene '+driveCount+' registros pero local tiene '+localCount+'. No se aplica.');
          if(showAlert) alert('⚠️ Sincronización bloqueada por seguridad:\nDrive tiene '+driveCount+' registros pero vos tenés '+localCount+'.\n\nSe subieron tus datos a Drive para no perder nada.');
          pushToDrive(true);
          resolve(false); return;
        }
      }
      // PROTECCIÓN ABSOLUTA: si Drive trae menos de 50 registros y el backup dice
      // que antes había muchos más, bloquear siempre (evita restaurar 1 registro accidental)
      if(data.records&&Array.isArray(data.records)&&data.records.length<50&&records.length===0){
        // Verificar si hay snapshot local que tenga más datos
        const snap=guardarSnapshotLocal._last||localStorage.getItem('catastro_snapshot_count');
        const snapCount=snap?parseInt(snap):0;
        if(snapCount>100||data.records.length<10){
          syncStatus='error'; updateSyncBadge();
          console.warn('[Sync] BLOQUEADO ABSOLUTO: Drive solo tiene '+data.records.length+' registros. Sospechoso.');
          if(showAlert) alert('⚠️ Sincronización bloqueada:\nDrive solo tiene '+data.records.length+' registro(s).\n\nEsto parece un error. No se aplicaron los datos.\nUsá Ajustes → Importar backup para restaurar manualmente.');
          resolve(false); return;
        }
      }
      // Aplicar datos — merge inteligente por registro: gana el más reciente
      if(data.records&&Array.isArray(data.records)){
        if(records.length===0){
          records=data.records; // sin datos locales → aceptar todo de Drive
        } else {
          const localMap={};
          records.forEach(r=>{localMap[r.id]=r;});
          data.records.forEach(dr=>{
            const loc=localMap[dr.id];
            if(!loc||(dr.fecha&&loc.fecha&&dr.fecha>loc.fecha)){
              localMap[dr.id]=dr; // Drive más reciente → usar Drive
            }
            // local más reciente → conservar local (ya está en localMap)
          });
          records=Object.values(localMap);
        }
      }
      if(data.historial) historial=data.historial;
      // geoLinks: Drive es fuente de verdad, PERO con candado anti-borrado (igual que el padrón).
      if(data.geoLinks&&typeof data.geoLinks==='object'){
        const driveLinks=Object.keys(data.geoLinks).length;
        const localLinks=Object.keys(geoLinks).length;
        if(driveLinks===0){
          console.warn('[Sync] geoLinks: Drive tiene 0 vínculos — se conservan los '+localLinks+' locales');
        } else if(localLinks>10 && driveLinks < localLinks*0.8){
          // Drive trae MUCHOS menos que local → sospechoso. No pisar; subir lo local para corregir Drive.
          console.warn('[Sync] geoLinks BLOQUEADO: Drive tiene '+driveLinks+' pero local tiene '+localLinks+'. No se aplica. Subiendo local a Drive.');
          if(typeof pushToDrive==='function') pushToDrive(true);
        } else {
          geoLinks=data.geoLinks;
          try{localStorage.setItem(GEO_LINKS_KEY,JSON.stringify(geoLinks));}catch(e){}
          console.log('[Sync] geoLinks actualizados: '+Object.keys(geoLinks).length+' vínculos');
        }
      }
      // v36: los usuarios viven en usuarios.json (separado). Ya NO leemos data.usuarios
      // del catastro_backup.json — esa lista quedó obsoleta y sin contraseñas hasheadas.
      // La lista real se trae con refreshUsuariosFromDrive() después del login.
      if(data.calles&&Array.isArray(data.calles)) callesData=data.calles;
      // mzLinks: FUSIÓN (unión) para no perder vínculos de ninguna PC ni por sincronización
      // a destiempo. Local gana en conflictos. Si local aporta vínculos que Drive no tenía,
      // se sube la unión para que Drive quede completo.
      if(data.mzLinks&&typeof data.mzLinks==='object'){
        const driveMz=Object.keys(data.mzLinks).length;
        const antes=Object.keys(mzLinks).length;
        mzLinks=Object.assign({}, data.mzLinks, mzLinks);
        try{localStorage.setItem(MZ_LINKS_KEY,JSON.stringify(mzLinks));}catch(e){}
        const despues=Object.keys(mzLinks).length;
        console.log('[Sync] mzLinks combinados: '+despues+' (Drive '+driveMz+' + local '+antes+')');
        if(despues>driveMz && typeof pushToDrive==='function') pushToDrive(true);
      }
      // mzData: Drive es la fuente de verdad
      if(data.mzData&&Array.isArray(data.mzData)&&data.mzData.length>0){
        mzData=data.mzData;
        try{localStorage.setItem(MZ_DATA_KEY,JSON.stringify(mzData));}catch(e){}
        console.log('[Sync] mzData actualizado: '+mzData.length+' manzanas');
      }
      // Rural — merge inteligente: gana el registro más reciente por id
      if(data.ruralRecords&&Array.isArray(data.ruralRecords)&&data.ruralRecords.length>0){
        const localMap={};
        ruralRecords.forEach(r=>{localMap[r.id]=r;});
        data.ruralRecords.forEach(dr=>{
          const loc=localMap[dr.id];
          // Si no existe localmente, o Drive es más reciente → usar Drive
          if(!loc||(dr.fechaMod&&loc.fechaMod&&dr.fechaMod>loc.fechaMod)){
            localMap[dr.id]=dr;
          }
          // Si local es más reciente → conservar local (ya está en localMap)
        });
        ruralRecords=Object.values(localMap);
        // No guardar rural en localStorage — Drive es fuente de verdad
      }
      if(data.ruralLinks&&typeof data.ruralLinks==='object'&&Object.keys(data.ruralLinks).length>0){
        // Sanear vínculos de Drive: solo aceptar clave=id de registro válido
        const _rIds=new Set(ruralRecords.map(r=>r.id));
        const _clean={};
        Object.entries(data.ruralLinks).forEach(([k,v])=>{if(_rIds.has(k))_clean[k]=v;});
        ruralLinks=_clean;
        try{localStorage.setItem(RURAL_LINKS_KEY,JSON.stringify(ruralLinks));}catch(e){}
        // Si limpiamos algo, subir versión saneada a Drive
        if(Object.keys(_clean).length!==Object.keys(data.ruralLinks).length){
          console.log('[Sync] ruralLinks saneados: '+Object.keys(data.ruralLinks).length+' -> '+Object.keys(_clean).length);
          setTimeout(()=>pushToDrive(true),2000);
        }
      }
      if(data.ruralGeo&&data.ruralGeo.features){
        ruralGeo=data.ruralGeo;
        try{localStorage.setItem(RURAL_GEO_KEY,JSON.stringify(ruralGeo));}catch(e){}
      }
      // cloacaLinks y cloacaGeoLinks: Drive es la fuente de verdad
      if(data.cloacaLinks&&typeof data.cloacaLinks==='object'){
        cloacaLinks=data.cloacaLinks;
        try{localStorage.setItem(CLOACA_LINKS_KEY,JSON.stringify(cloacaLinks));}catch(e){}
        console.log('[Sync] cloacaLinks: '+Object.keys(cloacaLinks).length+' vínculos');
      }
      if(data.cloacaGeoLinks&&typeof data.cloacaGeoLinks==='object'){
        cloacaGeoLinks=data.cloacaGeoLinks;
        try{localStorage.setItem(CLOACA_LINKS_KEY2,JSON.stringify(cloacaGeoLinks));}catch(e){}
        console.log('[Sync] cloacaGeoLinks: '+Object.keys(cloacaGeoLinks).length+' vínculos plano');
      }
      if(data.driRecords&&Array.isArray(data.driRecords)&&data.driRecords.length>0){
        // Merge: gana el más reciente por id
        const localMap={};
        driRecords.forEach(r=>{localMap[r.id]=r;});
        data.driRecords.forEach(dr=>{
          const loc=localMap[dr.id];
          if(!loc||(dr.fechaMod&&loc.fechaMod&&dr.fechaMod>loc.fechaMod)) localMap[dr.id]=dr;
        });
        driRecords=Object.values(localMap);
        saveDRI();
        console.log('[Sync] driRecords: '+driRecords.length+' comercios');
      }
      // No guardar en localStorage — Drive es la fuente de verdad
      try{localStorage.setItem('catastro_last_modified',new Date().toISOString());}catch(e){}
      if(!DRIVE_API_URL||!DRIVE_TOKEN){try{localStorage.setItem('catastro_historial',JSON.stringify(historial));}catch(e){}}
      try{localStorage.setItem('catastro_calles',JSON.stringify(callesData));}catch(e){}
      // Restaurar fechas de actualización de deudas — tomar la más reciente entre Drive y local
      ['tasa','cloaca','rural'].forEach(tab=>{
        const k='catastro_deuda_fecha_'+tab;
        const driveF=data['deudaFecha'+tab.charAt(0).toUpperCase()+tab.slice(1)]||null;
        const localF=localStorage.getItem(k)||null;
        if(driveF&&(!localF||driveF>localF)) localStorage.setItem(k,driveF);
        // Restaurar info completa de deuda_upd
        const ku='catastro_deuda_upd_'+tab;
        const driveUpd=data['deudaUpd'+tab.charAt(0).toUpperCase()+tab.slice(1)]||null;
        if(driveUpd){
          const localUpd=(()=>{try{return JSON.parse(localStorage.getItem(ku)||'null');}catch(e){return null;}})();
          if(!localUpd||(driveUpd.fecha&&(!localUpd.fecha||driveUpd.fecha>localUpd.fecha))){
            try{localStorage.setItem(ku,JSON.stringify(driveUpd));}catch(e){}
          }
        }
      });
      // Restaurar metadatos completos de última importación de deudas (nuevo formato v34)
      ['tasa','cloaca','rural','dri'].forEach(tab=>{
        const kUpd='catastro_deuda_upd_'+tab;
        const driveUpd=data['deudaUpd'+tab.charAt(0).toUpperCase()+tab.slice(1)]||null;
        if(driveUpd){
          const localUpdStr=localStorage.getItem(kUpd)||null;
          const localUpd=localUpdStr?JSON.parse(localUpdStr):null;
          // Usar el más reciente entre Drive y local
          if(!localUpd||(driveUpd.fecha&&driveUpd.fecha>(localUpd.fecha||''))){
            try{localStorage.setItem(kUpd,JSON.stringify(driveUpd));}catch(e){}
          }
        }
      });
      // Restaurar parcelas nuevas
      if(data.parcelasNuevas&&Array.isArray(data.parcelasNuevas)&&data.parcelasNuevas.length>0){
        parcelasNuevas=data.parcelasNuevas;
        try{localStorage.setItem('catastro_parcelas_nuevas',JSON.stringify(parcelasNuevas));}catch(e){}
        console.log('[Sync] parcelasNuevas: '+parcelasNuevas.length);
      }
      if(data.lastSync){lastSyncTime=data.lastSync;localStorage.setItem('catastro_last_sync',data.lastSync);}
      syncStatus='ok';updateSyncBadge();
      filter();if(view!=='detail')render();
      if(showAlert) alert('✅ '+records.length+' registros bajados de Drive (guardado por '+(data.savedBy||'?')+' el '+new Date(data.lastSync||0).toLocaleString('es-AR')+')');
      resolve(true);
    };
    const s=document.createElement('script');
    s.id=cbName;
    s.src=DRIVE_API_URL+'?token='+encodeURIComponent(DRIVE_TOKEN)+'&archivo=catastro_backup.json&callback='+cbName+'&t='+Date.now();
    s.onerror=()=>{
      clearTimeout(to);delete window[cbName];
      try{document.head.removeChild(s);}catch(e){}
      syncStatus='error';updateSyncBadge();
      if(showAlert) alert('Error al cargar el script de Drive. Verificá que el Apps Script esté publicado correctamente.');
      resolve(false);
    };
    document.head.appendChild(s);
    setTimeout(()=>{try{if(document.head.contains(s))document.head.removeChild(s);}catch(e){}},20000);
  });
}

function updateSyncBadge(){
  const el=document.getElementById('sync-badge');
  if(!el)return;
  // Mostrar aviso si localStorage está casi lleno (>4MB)
  const lsKB=getLocalStorageUsage?getLocalStorageUsage():0;
  const lsBadge=document.getElementById('ls-warning-badge');
  if(lsBadge){
    if(lsKB>7000){
      lsBadge.style.display='inline-flex';
      lsBadge.title=`⚠️ Almacenamiento local casi lleno (${lsKB.toLocaleString('es')} KB). Ir a Ajustes → Liberar espacio.`;
    } else {
      lsBadge.style.display='none';
    }
  }
  if(!DRIVE_API_URL){el.style.display='none';return;}
  el.style.display='inline-flex';
  if(syncStatus==='syncing'){
    el.innerHTML='🔄 Guardando...';
    el.style.background='rgba(255,200,0,.2)';
    el.style.color='#f0d080';
    el.title='Guardando en Drive...';
  } else if(syncStatus==='ok'){
    const t=lastSyncTime?new Date(lastSyncTime).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):'';
    el.innerHTML='☁️ '+t;
    el.style.background='rgba(26,107,58,.3)';
    el.style.color='#6ddb9a';
    el.title='✅ Último guardado en Drive: '+t+'\nAuto-backup cada 10 min si hay cambios\nClic para guardar ahora';
  } else if(syncStatus==='error'){
    el.innerHTML='⚠️ Drive';
    el.style.background='rgba(155,38,38,.3)';
    el.style.color='#e88';
    el.title='Error al conectar con Drive. Clic para reintentar.';
  } else {
    el.innerHTML='☁️ Drive';
    el.style.background='rgba(255,255,255,.1)';
    el.style.color='#aaa';
    el.title='Auto-backup activo — guarda en Drive cada 10 min si hay cambios\nClic para sincronizar ahora';
  }
}
function saveDriveConfig(){
  const url=(document.getElementById('drive-url-input')||{}).value||'';
  const token=(document.getElementById('drive-token-input')||{}).value||'';
  if(!url.trim()){alert('Ingresa la URL del Script.');return;}
  DRIVE_API_URL=url.trim();DRIVE_TOKEN=token.trim();
  localStorage.setItem('catastro_drive_url',DRIVE_API_URL);
  localStorage.setItem('catastro_drive_token',DRIVE_TOKEN);
  // Arrancar auto-backup ahora que Drive está configurado
  iniciarAutoBackupDrive();
  pullFromDrive(true).then(ok=>{if(ok){filter();render();alert('✅ Conexion exitosa! Datos sincronizados desde Drive.');}else{alert('No se pudo conectar. Revisa la URL y el token.');}});
}
function clearDriveConfig(){
  if(!confirm('Desconectar Drive? La app seguira funcionando solo con datos locales.'))return;
  DRIVE_API_URL='';DRIVE_TOKEN='';
  localStorage.removeItem('catastro_drive_url');localStorage.removeItem('catastro_drive_token');
  render();
}

// ── FILTER ────────────────────────────────────────────────────────────────
function filter(){
  filtered=records.filter(r=>{
    const q=sq.toLowerCase();
    const mq=!q||(r.titular||'').toLowerCase().includes(q)||(r.padron||'').toString().includes(q)||
      (r.ctaTasa||'').includes(q)||(r.manzana||'').toLowerCase().includes(q)||
      (r.lote||'').toLowerCase().includes(q)||(r.calle||'').toLowerCase().includes(q)||
      (r.nroCloaca||'').includes(q)||(r.cuim||'').includes(q)||(r.partida||'').includes(q)||
      (r.ubicado||'').toLowerCase().includes(q)||(r.entreCalles||'').toLowerCase().includes(q);
    const mc=fcloaca==='todos'||(fcloaca==='con'&&r.tieneCloaca)||(fcloaca==='sin'&&!r.tieneCloaca);
    const mt=ftipo==='todos'||(r.tipoInmueble||'').toLowerCase()===ftipo;
    const mm=!fmanzana||(r.manzana||'').toString()===fmanzana;
    const me=festado==='todos'||(r.estadoCloaca||'NORMAL')===festado||
              (festado==='NORMAL'&&!r.estadoCloaca&&r.tieneCloaca);
    const mterr=fterr==='todos'||(r.estadoTerreno||'')=== fterr;
    const mv=fvinculado==='todos'||
             (fvinculado==='si'&&geoLinks[String(r.padron)])||
             (fvinculado==='no'&&!geoLinks[String(r.padron)]);
    return mq&&mc&&mt&&mm&&me&&mv&&mterr;
  });
  page=0;
}

function getLocalStorageUsage(){
  try{
    let total=0;
    for(let k in localStorage){ if(localStorage.hasOwnProperty(k)) total+=((localStorage[k]||'').length+(k||'').length)*2; }
    return Math.round(total/1024); // KB
  }catch(e){return 0;}
}
function limpiarLocalStorage(){
  if(!confirm('¿Liberar espacio en el almacenamiento local?\n\nSe eliminarán:\n• Historial completo (los datos del padrón no se tocan)\n• Fotos guardadas localmente (quedan en Drive y en memoria)\n• Caches temporales\n\nEsto NO borra ningún registro ni deuda.')) return;
  try{
    let liberado=0;
    const antesDe=getLocalStorageUsage();

    // 1. Borrar TODO el historial (ocupa mucho espacio)
    historial={};
    try{localStorage.setItem('catastro_historial','{}');}catch(e){}

    // 2. Extraer fotos de los records y guardarlas en claves separadas (o descartarlas del localStorage)
    let fotosMovidas=0;
    records.forEach(r=>{
      if(r.fotos&&r.fotos.length>0){
        const fotosValidas=r.fotos.filter(Boolean);
        if(fotosValidas.length>0){
          // Guardar fotos en clave separada por parcela
          const clFoto='catastro_fotos_'+r.id;
          try{
            localStorage.setItem(clFoto, JSON.stringify(fotosValidas));
            fotosMovidas+=fotosValidas.length;
          }catch(e){
            // Si no entran las fotos, al menos el padrón sí
          }
          // Reemplazar fotos en el record por referencia (solo flag)
          r.fotos=fotosValidas.map(f=>f?{ref:true,nombre:f.nombre||'',fecha:f.fecha||''}:null).filter(Boolean);
        }
      }
    });

    // 3. Borrar caches GeoJSON version (se re-descargan al abrir)
    Object.keys(localStorage).filter(k=>k.startsWith('catastro_geo_version_')).forEach(k=>localStorage.removeItem(k));

    // 4. Intentar guardar el padrón limpio
    let guardado=false;
    try{
      // Con Drive: no guardar padrón en localStorage
      if(!DRIVE_API_URL||!DRIVE_TOKEN) localStorage.setItem(DB_KEY,JSON.stringify(records));
      guardado=true;
    }catch(e){
      guardado=false;
    }

    const despuesDe=getLocalStorageUsage();
    liberado=antesDe-despuesDe;
    pushToDrive(true); // Subir a Drive por las dudas
    alert('✅ Espacio liberado: '+(liberado>0?liberado.toLocaleString('es')+' KB':antesDe.toLocaleString('es')+' KB procesados')+'\nAlmacenamiento ahora: '+despuesDe.toLocaleString('es')+' KB'+(!guardado?' (aún hay problemas, pero Drive tiene el backup)':''));
    rAjustes(document.getElementById('app'));
  }catch(e){alert('Error: '+e.message);}
}

async function doImport(){
  const f=document.getElementById('json-file');
  if(!f||!f.files.length){alert('Seleccioná un archivo JSON primero.');return;}
  const bar=document.getElementById('imp-bar'),fill=document.getElementById('imp-fill'),st=document.getElementById('imp-status');
  bar.style.display='block';st.textContent='Leyendo archivo...';fill.style.width='15%';
  const text=await f.files[0].text();
  fill.style.width='40%';st.textContent='Procesando...';
  let data;
  try{data=JSON.parse(text);}catch(e){alert('Archivo JSON inválido.');bar.style.display='none';return;}

  // Detectar si es backup v2.0 (objeto con records, historial, geoLinks)
  // o el formato anterior (array de records)
  let recs, hist, links;
  if(Array.isArray(data)){
    // Formato viejo — solo records
    recs=data; hist=null; links=null;
  } else if(data.version&&data.records&&Array.isArray(data.records)){
    // Formato v2.0
    recs=data.records;
    hist=data.historial||null;
    links=data.geoLinks||null;
  } else {
    alert('Formato de archivo no reconocido.');bar.style.display='none';return;
  }

  fill.style.width='70%';st.textContent=`Guardando ${recs.length.toLocaleString('es')} registros...`;
  await new Promise(r=>setTimeout(r,50));
  records=recs;
  saveData();
  // Importación masiva → sí subimos TODO de una sola vez (es la única vez que tiene sentido)
  pushToDrive(true);

  // Restaurar historial si existe
  if(hist){
    historial=hist;
    if(!DRIVE_API_URL||!DRIVE_TOKEN){try{localStorage.setItem('catastro_historial',JSON.stringify(historial));}catch(e){}}
  }
  // Restaurar vínculos si existe
  if(links&&Object.keys(links).length>0){
    geoLinks=links;
    try{localStorage.setItem(GEO_LINKS_KEY,JSON.stringify(geoLinks));}catch(e){}
  }
  // v36: los usuarios viven en usuarios.json separado. No restauramos data.usuarios
  // del backup viejo porque no tienen contraseñas hasheadas y serían usuarios fantasma.
  // Restaurar vínculos de manzanas si existe
  if(data.mzLinks&&Object.keys(data.mzLinks).length>0){
    mzLinks=data.mzLinks;
    try{localStorage.setItem(MZ_LINKS_KEY,JSON.stringify(mzLinks));}catch(e){}
  }
  // Restaurar datos de manzanas si existe
  if(data.mzData&&Array.isArray(data.mzData)&&data.mzData.length>0){
    mzData=data.mzData;
    try{localStorage.setItem(MZ_DATA_KEY,JSON.stringify(mzData));}catch(e){}
  }
  // Restaurar padrón rural y vínculos
  if(data.ruralRecords&&Array.isArray(data.ruralRecords)&&data.ruralRecords.length>0){
    ruralRecords=data.ruralRecords;
    if(!DRIVE_API_URL||!DRIVE_TOKEN){try{localStorage.setItem(RURAL_KEY,JSON.stringify(ruralRecords));}catch(e){}}
  }
  if(data.ruralLinks&&Object.keys(data.ruralLinks).length>0){
    ruralLinks=data.ruralLinks;
    try{localStorage.setItem(RURAL_LINKS_KEY,JSON.stringify(ruralLinks));}catch(e){}
  }
  // Restaurar vínculos de cloacas al plano
  if(data.cloacaGeoLinks&&Object.keys(data.cloacaGeoLinks).length>0){
    cloacaGeoLinks=data.cloacaGeoLinks;
    try{localStorage.setItem(CLOACA_LINKS_KEY2,JSON.stringify(cloacaGeoLinks));}catch(e){}
  }
  if(data.ruralRecords&&Array.isArray(data.ruralRecords)&&data.ruralRecords.length>0){
    ruralRecords=data.ruralRecords;
    if(!DRIVE_API_URL||!DRIVE_TOKEN){try{localStorage.setItem(RURAL_KEY,JSON.stringify(ruralRecords));}catch(e){}}
  }
  if(data.ruralLinks&&Object.keys(data.ruralLinks).length>0){
    ruralLinks=data.ruralLinks;
    try{localStorage.setItem(RURAL_LINKS_KEY,JSON.stringify(ruralLinks));}catch(e){}
  }
  if(data.cloacaLinks&&Object.keys(data.cloacaLinks).length>0){
    cloacaLinks=data.cloacaLinks;
    try{localStorage.setItem(CLOACA_LINKS_KEY,JSON.stringify(cloacaLinks));}catch(e){}
  }

  fill.style.width='100%';
  let msg=`✓ ${recs.length.toLocaleString('es')} registros importados correctamente.`;
  if(hist) msg+=` Historial restaurado.`;
  if(links&&Object.keys(links).length>0) msg+=` ${Object.keys(links).length} vínculos del mapa restaurados.`;
  if(data.mzLinks&&Object.keys(data.mzLinks).length>0) msg+=` ${Object.keys(data.mzLinks).length} manzanas vinculadas restauradas.`;
  // v36: no informamos restauración de usuarios — ya no se importan del backup.
  st.textContent=msg;
  filter();
  setTimeout(()=>{bar.style.display='none';fill.style.width='0%';},4000);
}

async function doImportCloacas(){
  const f=document.getElementById('cloaca-file');
  if(!f||!f.files.length){alert('Seleccioná el archivo JSON de cloacas primero.');return;}
  const bar=document.getElementById('imp-bar-c'),fill=document.getElementById('imp-fill-c'),st=document.getElementById('imp-status-c');
  bar.style.display='block';st.textContent='Leyendo archivo...';fill.style.width='15%';
  const text=await f.files[0].text();
  fill.style.width='35%';st.textContent='Procesando conexiones...';
  let data;
  try{data=JSON.parse(text);}catch(e){alert('Archivo JSON inválido.');bar.style.display='none';return;}
  if(!Array.isArray(data)){alert('El JSON debe ser un array.');bar.style.display='none';return;}
  fill.style.width='55%';st.textContent='Cruzando con el padrón...';
  await new Promise(r=>setTimeout(r,50));
  let encontrados=0,noEncontrados=0,sinCuenta=0;
  const noMatch=[];
  data.forEach(c=>{
    const ctaStr=String(c.ctaTasa||'').trim();
    const padStr=String(c.padron||'').trim();
    const cuimStr=String(c.cuim||'').trim();
    if(!ctaStr&&!padStr&&!cuimStr){sinCuenta++;return;}
    let idx=-1;
    // Cruzar por ctaTasa TGIU → padrón catastral → CUIM
    if(ctaStr) idx=records.findIndex(r=>String(r.ctaTasa||'').trim()===ctaStr);
    if(idx<0&&padStr) idx=records.findIndex(r=>String(r.padron||'').trim()===padStr);
    if(idx<0&&cuimStr) idx=records.findIndex(r=>String(r.cuim||'').trim()===cuimStr);
    if(idx>=0){
      records[idx].tieneCloaca=true;
      if(c.nroCloaca) records[idx].nroCloaca=String(c.nroCloaca);
      if(c.estado) records[idx].estadoCloaca=c.estado;
      if(c.obsCloaca) records[idx].obsCloaca=c.obsCloaca;
      if(c.diametro) records[idx].diametroCloaca=c.diametro;
      if(c.profundidad!=null&&c.profundidad!=='') records[idx].profundidadCloaca=String(c.profundidad);
      if(c.distanciaEsquina!=null&&c.distanciaEsquina!=='') records[idx].distanciaEsquina=String(c.distanciaEsquina);
      if(c.lado) records[idx].ladoCloaca=c.lado;
      if(c.calle&&!records[idx].calle) records[idx].calle=c.calle;
      if(c.fuente) records[idx].fuenteCloaca=c.fuente;
      // Cotas
      if(c.cota_terreno!=null) records[idx].cotaTerreno=c.cota_terreno;
      if(c.cota_colectora!=null) records[idx].cotaColectora=c.cota_colectora;
      if(c.cota_extremo!=null) records[idx].cotaExtremo=c.cota_extremo;
      if(c.cota_vereda!=null) records[idx].cotaVereda=c.cota_vereda;
      encontrados++;
    } else {
      noMatch.push((c.titular||c.apellido||'')+' [cta:'+ctaStr+' pad:'+padStr+']');
      noEncontrados++;
    }
  });
  fill.style.width='85%';st.textContent='Guardando...';
  saveData();
  // Importación masiva → subir todo
  pushToDrive(true);
  fill.style.width='100%';
  let msg='✓ '+encontrados+' parcelas marcadas con cloaca.';
  if(noEncontrados>0) msg+=' '+noEncontrados+' no encontradas en el padrón.';
  if(sinCuenta>0) msg+=' '+sinCuenta+' sin identificador.';
  st.textContent=msg;
  if(noMatch.length>0){console.log('No encontradas ('+noMatch.length+'):',noMatch);if(noMatch.length<=30)st.textContent+=' (Ver consola F12)';}
  filter();
  setTimeout(()=>{bar.style.display='none';fill.style.width='0%';goAjustes();},3000);
}

function doExport(){
  const backup={
    version:'2.0',
    fecha:new Date().toISOString(),
    records,
    historial,
    geoLinks,
    usuarios:getUsuarios()
  };
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a2=document.createElement('a');
  a2.href=url;
  a2.download=`catastro_alcorta_backup_${new Date().toISOString().slice(0,10)}.json`;
  a2.click();
  URL.revokeObjectURL(url);
}

function subirHTMLaDrive(){
  if(!DRIVE_API_URL||!DRIVE_TOKEN){alert('Drive no configurado.');return;}
  const btn=document.getElementById('btn-subir-html');
  if(btn){btn.disabled=true;btn.textContent='⏳ Subiendo...';}
  // Obtener el HTML actual de la página
  const htmlCompleto='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  const ARCHIVO_HTML='catastro_alcorta_latest.html';
  // Subir via form POST
  const cbName='__htmlUp_'+Date.now();
  const iframeName=cbName+'_f';
  const iframe=document.createElement('iframe');
  iframe.name=iframeName; iframe.style.display='none';
  const form=document.createElement('form');
  form.method='POST'; form.action=DRIVE_API_URL;
  form.target=iframeName; form.style.display='none';
  [['token',DRIVE_TOKEN],['archivo',ARCHIVO_HTML],['data',htmlCompleto]].forEach(([k,v])=>{
    const inp=document.createElement('input');
    inp.type='hidden'; inp.name=k; inp.value=v;
    form.appendChild(inp);
  });
  document.body.appendChild(iframe);
  document.body.appendChild(form);
  const cleanup=()=>{
    try{document.body.removeChild(form);}catch(_){}
    try{document.body.removeChild(iframe);}catch(_){}
  };
  const onDone=()=>{
    cleanup();
    localStorage.setItem('catastro_html_drive_upload', new Date().toISOString());
    if(btn){btn.disabled=false;btn.textContent='✅ Subido a Drive';}
    setTimeout(()=>{if(btn)btn.textContent='☁️ Subir HTML a Drive';},3000);
    // Mostrar link para compartir
    const st=document.getElementById('geo-sync-status')||document.getElementById('restore-backup-status');
    if(st) st.innerHTML='✅ HTML subido a Drive como <b>'+ARCHIVO_HTML+'</b>. Para compartir con otra PC: Drive → descargarlo → abrirlo.';
    render();
  };
  iframe.onload=()=>{ onDone(); };
  iframe.onerror=()=>{ cleanup(); if(btn){btn.disabled=false;btn.textContent='❌ Error al subir';} };
  form.submit();
  setTimeout(onDone, 20000);
}

let operStreetLayer=null, operSatLayerMap=null;

function initOperMap(){
  if(typeof L==='undefined'){setTimeout(initOperMap,500);return;}
  const el=document.getElementById('oper-map');
  if(!el)return;
  if(operMap){try{operMap.remove();}catch(e){}operMap=null;}
  operStreetLayer=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap',
    maxZoom:20,
    errorTileUrl:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='
  });
  operSatLayerMap=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:20});
  operMap=L.map(el,{layers:[operStreetLayer]});
  setTimeout(()=>{if(operMap)operMap.invalidateSize();},100);
  operMap.setView([-33.5403,-61.1221],15);
  // Dibujar todas las parcelas
  operLayer=L.geoJSON(geoData,{
    style:feat=>{
      const padron=Object.keys(geoLinks).find(p=>geoLinks[p]===feat.properties.handle);
      const selIdx=operSelParcelas.findIndex(p=>String(p.padron)===String(padron));
      if(selIdx>=0) return {color:'#e05c00',weight:3,fillColor:'#ffd166',fillOpacity:0.7};
      return {color:'#2d5fa8',weight:0.8,fillColor:'#dde8f8',fillOpacity:0.4};
    },
    onEachFeature:(feat,layer)=>{
      layer.on('click',()=>{
        const padron=Object.keys(geoLinks).find(p=>geoLinks[p]===feat.properties.handle);
        if(!padron) return;
        const rec=records.find(r=>String(r.padron)===String(padron));
        if(!rec) return;
        const idx=operSelParcelas.findIndex(p=>p.id===rec.id);
        if(idx>=0){ operSelParcelas.splice(idx,1); }
        else { operSelParcelas.push(rec); }
        goOperaciones();
      });
    }
  }).addTo(operMap);
}

function toggleOperSat(){
  if(!operMap)return;
  operSatMode=!operSatMode;
  if(operSatMode){operMap.removeLayer(operStreetLayer);operMap.addLayer(operSatLayerMap);}
  else{operMap.removeLayer(operSatLayerMap);operMap.addLayer(operStreetLayer);}
  const btn=document.getElementById('btn-oper-sat');
  if(btn)btn.textContent=operSatMode?'🗺 Calles':'🛰 Satelital';
}
function centrarOperMap(){if(operMap)operMap.setView([-33.5403,-61.1221],15);}

function quitarSeleccion(id){operSelParcelas=operSelParcelas.filter(p=>p.id!==id);goOperaciones();}

let operBuscarTimeout=null;
function operBuscar(q){
  const res=document.getElementById('oper-buscar-results');
  if(!res)return;
  clearTimeout(operBuscarTimeout);
  if(!q||q.length<2){res.style.display='none';return;}
  operBuscarTimeout=setTimeout(()=>{
    const qn=q.toLowerCase();
    const hits=records.filter(r=>
      (r.padron||'').includes(qn)||(r.titular||'').toLowerCase().includes(qn)||
      (r.calle||'').toLowerCase().includes(qn)||(r.manzana||'').includes(qn)
    ).slice(0,6);
    if(!hits.length){res.style.display='none';return;}
    res.style.display='block';
    res.innerHTML=hits.map(r=>`<div onclick="agregarASeleccion('${r.id}')"
      style="padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--border)"

      <div style="font-size:10px;color:var(--text3)">Mz ${r.manzana||'—'} · Lote ${r.lote||'—'}</div>

  },300);

  const inp=document.getElementById('oper-buscar');
  if(inp)inp.value='';
  const res=document.getElementById('oper-buscar-results');
  if(res)res.style.display='none';
  goOperaciones();
}

function getProximoPadron(offset=0){
  const nums = records
    .map(r=>parseInt(r.padron||'0'))
    .filter(n=>!isNaN(n)&&n>0);
  const max = nums.length>0 ? Math.max(...nums) : 0;
  return String(max+1+offset);
}

function ejecutarUnificacion(){
  const nuevoPadron=document.getElementById('unif-padron')?.value.trim();
  const nuevoTitular=document.getElementById('unif-titular')?.value.trim();
  const accion=document.getElementById('unif-accion')?.value;
  if(!nuevoPadron){alert('Ingresá el nuevo número de padrón.');return;}
  if(records.find(r=>String(r.padron)===nuevoPadron)){
    if(!confirm('El padrón '+nuevoPadron+' ya existe. ¿Continuar de todas formas?'))return;
  }
  if(!confirm('¿Unificar '+operSelParcelas.length+' parcelas en el nuevo padrón '+nuevoPadron+'?'))return;

  // Crear nuevo registro combinando los originales
  const base={...operSelParcelas[0]};
  const nuevo={
    ...base,
    id:'r'+Date.now(),
    padron:nuevoPadron,
    titular:nuevoTitular||base.titular,
    manzana:base.manzana,
    lote:operSelParcelas.map(p=>p.lote||'').join('+'),
    superficie:operSelParcelas.reduce((s,p)=>s+(parseFloat(p.superficie)||0),0)||'',
    estadoParcela:'Unificada',
    parcelaOrigen:operSelParcelas.map(p=>p.padron).join('+'),
    fecha:new Date().toISOString()
  };
  records.push(nuevo);

  // Registrar historial
  if(!historial[nuevo.id]) historial[nuevo.id]=[];
  historial[nuevo.id].push({fecha:nuevo.fecha,tipo:'alta',resumen:'Parcela creada por unificación de padrones: '+operSelParcelas.map(p=>p.padron).join(', '),usuario:currentUser?.nombre||'?'});

  // Procesar originales
  operSelParcelas.forEach(p=>{
    if(accion==='eliminar'){
      records=records.filter(r=>r.id!==p.id);
    } else {
      const idx=records.findIndex(r=>r.id===p.id);
      if(idx>=0){
        records[idx].estadoParcela='Unificada en '+nuevoPadron;
        records[idx].padronUnificado=nuevoPadron;
        if(!historial[p.id]) historial[p.id]=[];
        historial[p.id].push({fecha:nuevo.fecha,tipo:'edicion',resumen:'Unificada en padrón '+nuevoPadron,usuario:currentUser?.nombre||'?'});
      }
    }
  });

  saveData();
  if(!DRIVE_API_URL||!DRIVE_TOKEN){try{localStorage.setItem('catastro_historial',JSON.stringify(historial));}catch(e){}}
  // SINCRONIZACIÓN GRANULAR para operación masiva: subir el nuevo y los modificados
  pushParcelaToDrive(nuevo);
  if(accion==='eliminar'){
    operSelParcelas.forEach(p=>{ deleteParcelaFromDrive(p.id); });
  } else {
    operSelParcelas.forEach(p=>{
      const r2=records.find(x=>x.id===p.id);
      if(r2) pushParcelaToDrive(r2);
    });
  }
  operSelParcelas=[];
  divCount=2;
  alert('✅ Unificación completada. Nuevo padrón: '+nuevoPadron);
  goOperaciones();
}

function ejecutarDivision(){
  const original=operSelParcelas[0];
  if(!original)return;
  const accion=document.getElementById('div-accion')?.value;

  // Recopilar subdivisiones con todos los campos
  const cont=document.getElementById('division-items');
  const items=cont?cont.querySelectorAll('.div-item'):[];
  const subdivs=[];
  items.forEach((item,i)=>{
    const g=id=>document.getElementById(id)?.value?.trim()||'';
    const p=g(`div-padron-${i}`);
    if(p) subdivs.push({
      padron:p,
      titular:g(`div-titular-${i}`),
      manzana:g(`div-manzana-${i}`),
      lote:g(`div-lote-${i}`),
      superficie:g(`div-sup-${i}`),
      calle:g(`div-calle-${i}`),
      numero:g(`div-numero-${i}`),
      entreCalles:g(`div-entre-${i}`),
      medNorte:g(`div-norte-${i}`),medSur:g(`div-sur-${i}`),medEste:g(`div-este-${i}`),medOeste:g(`div-oeste-${i}`),
      calleN:g(`div-callN-${i}`),calleS:g(`div-callS-${i}`),calleE:g(`div-callE-${i}`),calleO:g(`div-callO-${i}`),
      estadoTerreno:g(`div-estado-${i}`),
      tipoInmueble:g(`div-tipo-${i}`)||'Urbano',
    });
  });

  // ── VALIDACIÓN ANTICIPADA — no crea NADA si algo está mal ──
  if(subdivs.length<2){alert('Necesitás al menos 2 parcelas resultantes.');return;}
  if(subdivs.some(s=>!s.padron)){alert('Completá el N° de padrón de cada parcela resultante.');return;}
  // Padrones repetidos entre las subdivisiones
  const vistos={};
  for(const s of subdivs){
    const k=String(s.padron);
    if(vistos[k]){alert('Repetiste el padrón "'+k+'" en dos parcelas. Cada una necesita un número distinto.');return;}
    vistos[k]=true;
  }
  // Choque con OTRA parcela existente (se PERMITE reutilizar el padrón de la parcela que estás dividiendo)
  for(const s of subdivs){
    const otra=records.find(r=>String(r.padron)===String(s.padron)&&r.id!==original.id);
    if(otra){
      alert('El padrón '+s.padron+' ya pertenece a otra parcela (titular: '+(otra.titular||'—')+').\n\nUsá un número libre, o el mismo padrón de la parcela que estás dividiendo ('+original.padron+').');
      return;
    }
  }

  const reutilizaOriginal=subdivs.some(s=>String(s.padron)===String(original.padron));
  if(!confirm('¿Dividir padrón '+original.padron+' en '+subdivs.length+' parcelas?\n\n'+subdivs.map((s,i)=>String.fromCharCode(65+i)+': Padrón '+s.padron+(s.titular?' — '+s.titular:'')).join('\n')))return;

  const fecha=new Date().toISOString();
  const nuevosPatrones=[];

  subdivs.forEach((s,idx)=>{
    const datos={
      padron:s.padron,
      titular:s.titular||original.titular,
      manzana:s.manzana||original.manzana,
      lote:s.lote||(original.lote+String.fromCharCode(65+idx)),
      superficie:s.superficie||'',
      calle:s.calle||original.calle,
      numero:s.numero||original.numero,
      entreCalles:s.entreCalles||original.entreCalles,
      medNorte:s.medNorte,medSur:s.medSur,medEste:s.medEste,medOeste:s.medOeste,
      estadoTerreno:s.estadoTerreno,
      tipoInmueble:s.tipoInmueble,
      estadoParcela:'División de '+original.padron,
      padronOrigen:original.padron,
      croquis:{ points:[], calles:{N:s.calleN,S:s.calleS,E:s.calleE,O:s.calleO}, lados:[], area:s.superficie?parseFloat(s.superficie):null },
      fecha
    };
    if(String(s.padron)===String(original.padron)){
      // Reutiliza el padrón original → actualiza el registro original EN SU LUGAR (conserva id, historial y vínculo al mapa)
      const io=records.findIndex(r=>r.id===original.id);
      if(io>=0) records[io]={...records[io], ...datos};
      if(!historial[original.id]) historial[original.id]=[];
      historial[original.id].push({fecha, tipo:'edicion', resumen:'Dividida — conserva el padrón '+s.padron, usuario:currentUser?.nombre||'?'});
    } else {
      // Parcela nueva
      const nuevo={...original, id:'r'+Date.now()+idx, ...datos};
      records.push(nuevo);
      if(!historial[nuevo.id]) historial[nuevo.id]=[];
      historial[nuevo.id].push({fecha, tipo:'alta', resumen:'Creada por división del padrón '+original.padron, usuario:currentUser?.nombre||'?'});
    }
    nuevosPatrones.push(s.padron);
  });

  // ── Qué hacer con la parcela original (solo si NO se reutilizó su padrón) ──
  if(!reutilizaOriginal){
    if(accion==='eliminar'){
      records=records.filter(r=>r.id!==original.id);
      deleteParcelaFromDrive(original.id);
    } else {
      const io=records.findIndex(r=>r.id===original.id);
      if(io>=0){
        records[io].estadoParcela='Dividida en '+nuevosPatrones.join(', ');
        if(!historial[original.id]) historial[original.id]=[];
        historial[original.id].push({fecha, tipo:'edicion', resumen:'Dividida en padrones: '+nuevosPatrones.join(', '), usuario:currentUser?.nombre||'?'});
        const r2=records[io]; if(r2) pushParcelaToDrive(r2);
      }
    }
    // Despintar la geometría de la original para poder reasignarla (si se reutilizó el padrón, NO se toca)
    if(geoLinks[String(original.padron)]){
      delete geoLinks[String(original.padron)];
      try{localStorage.setItem(GEO_LINKS_KEY,JSON.stringify(geoLinks));}catch(e){}
      if(DRIVE_API_URL&&DRIVE_TOKEN) pushGeoLinkToDrive(original.padron, '');
    }
  }

  saveData();
  if(!DRIVE_API_URL||!DRIVE_TOKEN){try{localStorage.setItem('catastro_historial',JSON.stringify(historial));}catch(e){}}
  // Subir a Drive las parcelas nuevas/actualizadas
  records.filter(r=>nuevosPatrones.includes(String(r.padron))).forEach(r=>pushParcelaToDrive(r));

  operSelParcelas=[];
  divCount=2;
  alert('✅ División completada.\nPadrones resultantes: '+nuevosPatrones.join(', '));
  goOperaciones();
}

// ── IMPORTAR MANZANAS ────────────────────────────────────────────────────────
async function doImportManzanas(){
  const f=document.getElementById('mz-file');
  const st=document.getElementById('imp-status-mz');
  if(!f||!f.files.length){alert('Seleccioná el archivo manzanas_dxf.json.');return;}
  st.textContent='Leyendo...';
  const text=await f.files[0].text();
  let data;
  try{data=JSON.parse(text);}catch(e){alert('Archivo JSON inválido.');st.textContent='';return;}
  if(!Array.isArray(data)){alert('Formato inválido.');st.textContent='';return;}
  try{
    localStorage.setItem(MZ_DATA_KEY,JSON.stringify(data));
    mzData=data;
    st.textContent='✅ '+data.length+' manzanas cargadas.';
    render();
  }catch(e){st.textContent='❌ Error al guardar.';}
}
function doWipeManzanas(){
  if(!confirm('¿Borrar datos de manzanas y vínculos?'))return;
  localStorage.removeItem(MZ_DATA_KEY);
  localStorage.removeItem(MZ_LINKS_KEY);
  mzData=[];mzLinks={};render();
}
function saveMzLinks(){
